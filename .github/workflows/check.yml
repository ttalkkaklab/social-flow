# Contract tests + style-gate self-test. Nothing here calls an external API —
# the suite verifies the tool surface (schemas, routing, enums, path safety) and
# the Korean style checker's own fixtures, so it runs green with zero keys set.
name: check

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Media contract tests encode a small deterministic clip and inspect it with ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Build and contract tests
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server

      # committed dist must match a fresh build — catches "edited src, forgot dist"
      - run: git diff --exit-code server/dist && test -z "$(git status --porcelain server/dist)"
      - run: git diff --exit-code skills/storyboard/references/mesh-runtime.js
      - run: git diff --exit-code skills/produce/references/animation-review-runtime.js

      # the Korean copy gate verifies its own rules against built-in fixtures
      - run: python3 skills/platform-guide/references/check-style.py --selftest

      # the pipeline manifest: parsers pinned, then the SKILL.md mirrors checked against it
      - run: node skills/platform-guide/references/pipeline-lint.js --selftest
      - run: node skills/autoproduce/references/episode-state.js --selftest

      # the slide contract: kind vocabulary, motion, acts, determinism — rules pinned by message
      - run: node skills/storyboard/references/check-slide.js --selftest

      # the scene contract, the clip-prompt grammar the assemblers share, cost forecasting and copy meta
      - run: node skills/storyboard/references/check-scenes.js --selftest
      - run: node skills/storyboard/references/assemble-bg-prompt.js --selftest
      - run: node skills/autoproduce/references/cost-preview.js --selftest
      - run: node skills/platform-guide/references/check-meta.js --selftest

      # the research parser's table rules, and the channel browser's API shape and path guard
      - run: node skills/storyboard/references/check-research.js --selftest
      - run: node skills/channel/references/serve.js --selftest
      # inline format mirrors, and the seek runtime the three authored-screen templates share
      - run: node skills/platform-guide/references/format-lint.js

      # the skill surface: routing descriptions, tool lanes, reference links, manifest parity
      - run: node skills/platform-guide/references/skill-lint.js --selftest
