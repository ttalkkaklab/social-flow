<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>seek bench card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:#0b1020;color:#fff;font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;position:relative}
  .stage{position:absolute;left:96px;right:96px;top:300px;bottom:400px;display:flex;flex-direction:column;gap:60px}
  .kicker{font-size:44px;color:rgba(255,255,255,.66)}
  .num{font-size:260px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .unit{font-size:64px;font-weight:700;color:#5b8cff;margin-left:16px}
  .bars{display:flex;flex-direction:column;gap:36px;margin-top:40px}
  .bar{height:110px;border-radius:18px;background:#5b8cff;transform-origin:left center;
       animation:grow 1000ms cubic-bezier(.16,1,.3,1) both}
  .bar.b2{background:#a05bff;animation-delay:1200ms}
  .bar.b3{background:#ffb74d;animation-delay:2400ms}
  .label{font-size:40px;margin-top:10px;opacity:0;animation:fadein 300ms ease-out both}
  .label.l2{animation-delay:1200ms}.label.l3{animation-delay:2400ms}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes fadein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">톱니바퀴 개수</div>
  <div><span class="num" id="num">0</span><span class="unit">개</span></div>
  <div class="bars">
    <div class="bar b1" style="width:100%"></div><div class="label l1">큰 조각 하나 27개</div>
    <div class="bar b2" style="width:62%"></div><div class="label l2">남은 조각 전부</div>
    <div class="bar b3" style="width:38%"></div><div class="label l3">사라진 것으로 추정</div>
  </div>
</div>
<script>
  // 카운트업은 JS 구동 — seek 가 값을 정한다 (0 → 30, 2.5초, ease-out)
  const TARGET = 30, COUNT_MS = 2500;
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  window.__seek = function (tMs) {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = tMs; }
    const p = Math.min(1, Math.max(0, tMs / COUNT_MS));
    document.getElementById('num').textContent = Math.round(TARGET * easeOut(p));
    return document.getAnimations().length;
  };
  // 재생 상태로 열리지 않게 — 첫 seek 전에는 t=0 에 고정
  window.__seek(0);
</script>
</body>
</html>
