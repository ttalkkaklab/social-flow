<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>social-flow video frame</title>
<!--
  social-flow 쇼트폼 프레임 렌더러 — 1080×1920 캔버스, scenes.js 데이터 구동.

  ■ 데이터 계약 (같은 디렉토리의 scenes.js 를 <script src> 로 주입):
      window.THEME  = { accent, accent2, ink, brand }   // 채널 profile.md 의 테마
      window.SCENES = [ {type:"cover"|"points"|"quote"|"outro", ...}, ... ]
      필드:
        cover : kicker, title(16자 이내·**강조** 지원), stat, statLabel(18자 이내)
        points: title(60px 상단 고정), bullets:[{t,d}] — 캡션. 화면에는 **한 번에
                하나만** 보인다(스왑), footnote(출처 — 제목과 함께 상시)
        quote : speaker, role("… AI" 등 역할 표기), text
        outro : title, sub
  ■ 사진이 주인공 (produce 절대 규칙 14): 씬 텍스트는 상·하단 밴드 안에만 산다 —
      points 는 상단 블록(제목+캡션 1개), cover 는 하단 블록. 화면 중앙을 덮는
      박스·슬래브·풀스크린 딤을 만들지 않는다. 배경 사진이 그대로 보여야 한다.
  ■ URL 파라미터 (capture-frames.sh / capture-reveals.sh 계약):
      ?i=<n>        씬 인덱스 (0부터)
      &reveal=<k>   누적 요소(제목·출처·커버)는 그룹 k 이하만 불투명. points 캡션은
                    **활성 그룹(=min(k, 마지막 캡션))만** 불투명 — 과거 캡션도 숨는다
                    (스왑). 숨김은 언제나 opacity:0 뿐이고 캡션은 grid 스택으로 같은
                    자리에 겹쳐 있어 레이아웃 불변 — display:none 금지, xfade 오염 방지
      &alpha=1      배경·글로우 제거 + body 투명 (영상 위 오버레이 PNG 용)
      &scrim=1      밴드 스크림 레이어 표시 (alpha 모드에서도 유지 — PNG 에 굽는다)
      &dim=0|1|2    스크림 강도 (0 감상 우선 / 1 기본 / 2 밝은 배경 전용).
                    모양은 씬 타입이 정한다 — cover=하단 밴드, points=상단 밴드
      &bg=<url>     정지 배경 이미지 (불투명 캡처용)
  ■ 세이프존 (톨폰 실측 — 줄이지 말 것):
      텍스트 존 x 176~904 (폭 728) · y 190~1350. 하단 570px 은 자막 밴드+플랫폼 UI.
      배경 비주얼만 1080×1920 전체를 쓴다.
  ■ 오버플로 가드: 렌더 후 실측 → tight1~3 자동 적용, 잔여를 window.__overflow 로 노출.
      히어로 스탯은 폭 640px 초과 시 자동 축소 (켄번즈 3.5% + 크롭 편차 여유).
-->
<style>
  :root{
    --accent:#5b8cff; --accent2:#a05bff; --ink:#0b1020;
    --w:1080px; --h:1920px;
    --zone-x:176px; --zone-top:190px; --zone-bottom:570px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:var(--w);height:var(--h);overflow:hidden}
  body{
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--ink); color:#fff; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body.alpha{background:transparent}
  body.alpha .bg{display:none}

  /* ── 배경 레이어 (배경만 풀블리드) ─────────────────────────── */
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  /* 주의: body 토글 클래스는 scrim-on — .scrim 을 body 에 그대로 붙이면
     display:none 이 body 자신에 걸려 페이지 전체가 사라진다 (실측 사고) */
  .scrim{position:absolute;inset:0;display:none}
  body.scrim-on .scrim{display:block}
  /* 밴드 스크림 — 풀스크린 딤이 아니라 텍스트 밴드만 어둡게 한다(절대 규칙 14).
     기본형(cover 등 하단 블록): 위는 맑게 두고 하단 1/3 로 갈수록 어두워진다. */
  .scrim.d0{background:linear-gradient(180deg,rgba(5,8,20,.10) 0%,rgba(5,8,20,0) 34%,rgba(5,8,20,.30) 62%,rgba(5,8,20,.86) 100%)}
  .scrim.d1{background:linear-gradient(180deg,rgba(5,8,20,.16) 0%,rgba(5,8,20,0) 34%,rgba(5,8,20,.42) 62%,rgba(5,8,20,.90) 100%)}
  .scrim.d2{background:linear-gradient(180deg,rgba(5,8,20,.28) 0%,rgba(5,8,20,.08) 34%,rgba(5,8,20,.55) 62%,rgba(5,8,20,.94) 100%)}
  /* quote 정지 인용 카드만 예외 — 인용문이 화면 중앙(zone.center)에 앉는 씬이라
     구 풀워시를 유지한다(절대 규칙 14 의 문서화된 예외). */
  body.scene-quote .scrim.d0{background:linear-gradient(180deg,rgba(5,8,20,.38) 0%,rgba(5,8,20,.12) 35%,rgba(5,8,20,.30) 62%,rgba(5,8,20,.86) 100%)}
  body.scene-quote .scrim.d1{background:linear-gradient(180deg,rgba(5,8,20,.55) 0%,rgba(5,8,20,.38) 35%,rgba(5,8,20,.52) 62%,rgba(5,8,20,.92) 100%)}
  body.scene-quote .scrim.d2{background:linear-gradient(180deg,rgba(5,8,20,.74) 0%,rgba(5,8,20,.62) 40%,rgba(5,8,20,.70) 62%,rgba(5,8,20,.95) 100%)}
  /* points(상단 블록): 상단 밴드 + 자막 대비 보험용 얕은 하단. 중앙은 항상 맑다.
     밴드는 블록 끝(출처 줄, ~y560)까지 끌고 y≈920 전에 완전히 걷는다. */
  body.scene-points .scrim.d0{background:linear-gradient(180deg,rgba(5,8,20,.50) 0%,rgba(5,8,20,.36) 26%,rgba(5,8,20,0) 46%,rgba(5,8,20,0) 70%,rgba(5,8,20,.42) 100%)}
  body.scene-points .scrim.d1{background:linear-gradient(180deg,rgba(5,8,20,.64) 0%,rgba(5,8,20,.48) 28%,rgba(5,8,20,0) 48%,rgba(5,8,20,0) 68%,rgba(5,8,20,.52) 100%)}
  body.scene-points .scrim.d2{background:linear-gradient(180deg,rgba(5,8,20,.80) 0%,rgba(5,8,20,.62) 30%,rgba(5,8,20,.14) 48%,rgba(5,8,20,0) 66%,rgba(5,8,20,.62) 100%)}

  /* ── 라이트(삽화) 모드 — &light=1: 흰 배경 라인아트 삽화 위 텍스트 ────────
     다크 스크림은 흰 그림을 회색으로 죽인다(실측) — 대신 텍스트를 잉크색으로
     뒤집고 밴드는 화이트 워시로만 부드럽게 한다. 커버 텍스트는 상단 앵커로
     옮긴다(삽화 계약: 상단 1/4 타이틀 여백·중단 주인공·하단 1/3 자막 여백).
     이 블록은 씬별 스크림보다 뒤에 있어야 한다 — 동률 특이도는 뒤가 이긴다. */
  body.light .scrim.d0{background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 68%,rgba(255,255,255,.50) 100%)}
  body.light .scrim.d1{background:linear-gradient(180deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 64%,rgba(255,255,255,.66) 100%)}
  body.light .scrim.d2{background:linear-gradient(180deg,rgba(255,255,255,.86) 0%,rgba(255,255,255,.28) 36%,rgba(255,255,255,0) 60%,rgba(255,255,255,.82) 100%)}
  body.light .cover-title{color:var(--ink);text-shadow:0 3px 26px rgba(255,255,255,.7)}
  /* .em 은 글자색이 투명(background-clip:text)이라 text-shadow 가 글자 뒤로 비쳐 씻겨 보인다(실측)
     — 칩에서는 text-shadow 를 끄고 흰 drop-shadow 필터로 분리한다. 그라데이션도 흰 배경에서는
     연한 끝색(accent2)이 묻혀 진한 쪽으로 재정의한다. */
  body.light .cover-title .em, body.light .points-title .em{text-shadow:none;
    background:linear-gradient(105deg,var(--accent),color-mix(in srgb, var(--accent) 55%, var(--ink)));
    -webkit-background-clip:text;background-clip:text}
  body.light .cover-title .em{filter:drop-shadow(0 0 8px rgba(255,255,255,.9)) drop-shadow(0 3px 16px color-mix(in srgb, var(--ink) 22%, transparent))}
  body.light .stat{filter:drop-shadow(0 5px 26px color-mix(in srgb, var(--ink) 22%, transparent))}
  body.light .stat-label{color:color-mix(in srgb, var(--ink) 80%, transparent)}
  /* 흰 헤일로 — 삽화 선이 텍스트 뒤를 지나도 글자가 분리된다 (워시로는 못 잡는 겹침) */
  body.light .points-title{color:var(--ink);text-shadow:0 0 14px #fff,0 0 7px #fff}
  body.light .points-title .em{filter:drop-shadow(0 0 7px rgba(255,255,255,.9)) drop-shadow(0 3px 14px color-mix(in srgb, var(--ink) 20%, transparent))}
  body.light .cap .t{color:var(--ink);text-shadow:0 0 12px #fff,0 0 6px #fff}
  body.light .cap .d{color:color-mix(in srgb, var(--ink) 72%, transparent);text-shadow:0 0 10px #fff,0 0 5px #fff}
  /* 각주 알파 55%→80% (2026-08-13 실측) — 셀 채색 삽화의 검은 머리·짙은 문이 텍스트 밴드
     아래로 들어오면 55% 는 1.60~1.96:1 까지 떨어져 안 읽힌다(10개 상태 중 6개가 3:1 미만).
     같은 배경에서 캡션 설명줄(72%)이 3.35:1 을 내므로 80% 면 큰 글자 기준 3:1 을 넘긴다.
     흰 배경 라인아트에서는 글자가 진해질 뿐이라 이전 회차 룩에 손해가 없다. */
  body.light .footnote{color:color-mix(in srgb, var(--ink) 80%, transparent);text-shadow:0 0 12px #fff,0 0 6px #fff,0 0 6px #fff}
  body.light .kicker{background:color-mix(in srgb, var(--ink) 86%, transparent);border-color:rgba(255,255,255,.25)}

  /* ── 텍스트 존 ─────────────────────────────────────────────── */
  .zone{
    position:absolute; left:var(--zone-x); right:var(--zone-x);
    top:var(--zone-top); height:calc(var(--h) - var(--zone-top) - var(--zone-bottom));
    display:flex; flex-direction:column; justify-content:flex-end;
    text-align:center; overflow:hidden;
  }
  .zone.center{justify-content:center}
  .zone.top{justify-content:flex-start}

  /* reveal — 미래 요소는 투명하게만 (레이아웃 불변) */
  .rv{opacity:1}
  .rv.hide{opacity:0}

  /* kicker 는 방송 칩 — 밝은 배경 위에서도 읽히는 유일한 장치. 12자 남짓의 작은
     필이라 절대 규칙 14(슬래브 금지)의 예외가 아니라 하단 밴드 텍스트의 일부다. */
  .kicker{display:inline-block;font-size:34px;font-weight:700;letter-spacing:.12em;
    color:rgba(255,255,255,.92);text-transform:uppercase;margin-bottom:30px;
    background:rgba(5,8,20,.38);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:12px 34px;backdrop-filter:blur(4px)}
  .kicker .dot{color:var(--accent)}

  /* 커버 — 썸네일 겸용이라 글자는 크게 유지하되, 블록이 하단 1/3 에 앉도록 조인다 */
  .cover-title{font-size:100px;line-height:1.14;font-weight:800;letter-spacing:-0.02em;
    text-shadow:0 6px 40px rgba(0,0,0,.55);word-break:keep-all;margin-bottom:44px}
  .cover-title .em{
    background:linear-gradient(105deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 26px rgba(0,0,0,.5));
  }
  .stat-wrap{margin-bottom:48px}
  .stat{font-size:205px;line-height:1;font-weight:800;letter-spacing:-0.03em;display:inline-block;
    background:linear-gradient(120deg,var(--accent) 10%,var(--accent2) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 44px rgba(0,0,0,.6));white-space:nowrap}
  .stat-label{font-size:40px;font-weight:600;color:rgba(255,255,255,.88);margin-top:22px;word-break:keep-all}

  /* 포인트(캡션) 씬 — 사진이 주인공(절대 규칙 14). 박스·슬래브 없이 상단 블록에
     제목 + 활성 캡션 1개 + 출처만 얹는다. 캡션은 grid 스택으로 같은 자리에 겹쳐
     있고(레이아웃 불변) 활성 것만 불투명하다 — reveal 전환이 캡션 교체가 된다. */
  .points-title{font-size:60px;line-height:1.2;font-weight:800;letter-spacing:-0.015em;
    text-shadow:0 3px 26px rgba(0,0,0,.6);word-break:keep-all;margin-bottom:34px}
  .points-title .em{background:linear-gradient(105deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 20px rgba(0,0,0,.65))}
  .cap-stack{display:grid;margin-bottom:26px}
  .cap-stack > .rv{grid-area:1/1}
  .cap::before{content:"";display:block;width:56px;height:6px;border-radius:3px;
    margin:0 auto 20px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .cap .t{font-size:50px;line-height:1.25;font-weight:750;word-break:keep-all;
    text-shadow:0 3px 22px rgba(0,0,0,.65)}
  .cap .d{font-size:35px;line-height:1.4;font-weight:500;color:rgba(255,255,255,.85);
    margin-top:12px;word-break:keep-all;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  .footnote{font-size:26px;color:rgba(255,255,255,.60);text-align:center;
    text-shadow:0 2px 12px rgba(0,0,0,.6)}

  /* 인용(발화) 씬 — alpha 오버레이는 상단 서명만, 정지 카드는 인용문 포함 */
  .quote-sign{position:absolute;left:var(--zone-x);right:var(--zone-x);top:230px;text-align:center}
  .quote-sign .name{font-size:52px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.6)}
  .quote-sign .role{font-size:32px;font-weight:600;color:rgba(255,255,255,.85);margin-top:12px}
  .quote-sign .role .ai{color:var(--accent);font-weight:800}
  /* 발화 오버레이 전용 상/하단 스크림 — PNG 에 굽는다 (서명 대비 + 자막 대비) */
  .quote-scrim-top{position:absolute;left:0;right:0;top:0;height:430px;display:none;
    background:linear-gradient(180deg,rgba(5,8,20,.78),rgba(5,8,20,0))}
  .quote-scrim-bot{position:absolute;left:0;right:0;bottom:0;height:640px;display:none;
    background:linear-gradient(0deg,rgba(5,8,20,.85),rgba(5,8,20,0))}
  body.alpha.scene-quote .quote-scrim-top, body.alpha.scene-quote .quote-scrim-bot{display:block}
  .quote-card{font-size:56px;line-height:1.45;font-weight:650;word-break:keep-all}
  .quote-card::before{content:"“";display:block;font-size:150px;line-height:.6;
    color:var(--accent);margin-bottom:30px}

  /* 아웃트로 */
  .outro-brand{font-size:64px;font-weight:800;letter-spacing:.03em;margin-bottom:40px;
    background:linear-gradient(105deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .outro-title{font-size:84px;line-height:1.25;font-weight:800;word-break:keep-all;margin-bottom:36px}
  .outro-sub{font-size:42px;line-height:1.4;color:rgba(255,255,255,.85);word-break:keep-all}

  /* 오버플로 가드 — 실측 후 자동 적용 */
  .tight1 .cover-title{font-size:92px}  .tight1 .points-title{font-size:55px}
  .tight1 .cap .t{font-size:46px}       .tight1 .cap .d{font-size:32px}
  .tight2 .cover-title{font-size:85px}  .tight2 .points-title{font-size:51px}
  .tight2 .cap .t{font-size:43px}       .tight2 .cap .d{font-size:30px}
  .tight2 .stat{font-size:180px}
  .tight3 .cover-title{font-size:78px}  .tight3 .points-title{font-size:47px}
  .tight3 .cap .t{font-size:40px}       .tight3 .cap .d{font-size:28px}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="scrim d1" id="scrim"></div>
<div class="quote-scrim-top"></div>
<div class="quote-scrim-bot"></div>
<div class="zone" id="zone"></div>
<script>
// scenes.js 는 body 닫는 태그 직전에 주입된다(produce §2) — 이 스크립트보다 뒤에
// 실행되므로 DOMContentLoaded 까지 렌더를 지연해 SCENES/THEME 로드를 보장한다.
// 주의: 이 파일 어디에도 body 닫는 태그 리터럴을 추가로 쓰면 안 된다 — sed 주입이
// 그 지점을 치환해 스크립트가 중간에 닫힌다 (실측 사고).
function __boot() {
  const qs = new URLSearchParams(location.search);
  const i = parseInt(qs.get('i') || '0', 10);
  const reveal = qs.has('reveal') ? parseInt(qs.get('reveal'), 10) : Infinity;
  const alpha = qs.get('alpha') === '1';
  const scrim = qs.get('scrim') === '1';
  const dim = qs.get('dim') || '1';
  const bg = qs.get('bg');
  const light = qs.get('light') === '1';   // 삽화(라이트) 모드 — 위 CSS 블록 참조

  const THEME = window.THEME || {};
  const root = document.documentElement;
  if (THEME.accent) root.style.setProperty('--accent', THEME.accent);
  if (THEME.accent2) root.style.setProperty('--accent2', THEME.accent2);
  if (THEME.ink) root.style.setProperty('--ink', THEME.ink);

  const scenes = window.SCENES || [];
  const scene = scenes[i];
  const zone = document.getElementById('zone');
  if (!scene) { zone.textContent = 'scenes.js 미주입 또는 인덱스 초과: i=' + i; return; }

  document.body.classList.add('scene-' + scene.type);
  if (light) document.body.classList.add('light');
  if (alpha) document.body.classList.add('alpha');
  if (scrim) { document.body.classList.add('scrim-on');
    document.getElementById('scrim').className = 'scrim d' + dim; }
  if (bg && !alpha) document.getElementById('bg').style.backgroundImage = 'url(' + bg + ')';

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  /** **강조** → 그라데이션 칩 */
  const em = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="em">$1</span>');
  /** reveal 그룹 부여 — rg ≤ reveal 만 불투명 (숨김은 opacity 만, 레이아웃 불변) */
  const rv = (rg, html) =>
    '<div class="rv' + (rg > reveal ? ' hide' : '') + '" data-rg="' + rg + '">' + html + '</div>';

  let maxRg = 0;
  const R = (rg, html) => { if (rg > maxRg) maxRg = rg; return rv(rg, html); };

  if (scene.type === 'cover') {
    // 라이트(삽화) 모드: 커버 텍스트를 상단 앵커로 — 하단 앵커는 중단의 삽화
    // 주인공(캐릭터)을 덮는다(실측). 삽화 계약이 상단 1/4 을 타이틀 여백으로 비워 둔다.
    if (light) zone.classList.add('top');
    zone.innerHTML =
      (scene.kicker ? R(0, '<div class="kicker">' + esc(scene.kicker).replace(/·/g, '<span class="dot">·</span>') + '</div>') : '') +
      R(1, '<div class="cover-title">' + em(scene.title) + '</div>') +
      (scene.stat ? R(2, '<div class="stat-wrap"><div class="stat" id="stat">' + esc(scene.stat) + '</div>' +
        (scene.statLabel ? '<div class="stat-label">' + esc(scene.statLabel) + '</div>' : '') + '</div>') : '');
  } else if (scene.type === 'points') {
    // 캡션 스왑 — 활성 캡션(rg === capShow)만 불투명. reveal 이 마지막 캡션을
    // 넘으면 마지막에 캡을 걸어(capShow) 그림이 더 변하지 않는다 —
    // capture-reveals.sh 의 바이트 동일성 열거가 여기서 멈춘다.
    zone.classList.add('top');
    // 제목·출처가 없는 씬이 있다 — 화면 텍스트는 필요할 때만 쓴다(scenes-schema, 2026-08-14).
    // 헤더가 비면 그 rg 를 **차지하지 않는다**: 안 그러면 r0 와 r1 이 똑같은 빈 화면이라
    // capture-reveals.sh 의 바이트 동일성 열거가 첫 칸에서 멈추고 캡션을 한 장도 못 찍는다(실측).
    // 빈 문자열을 넣은 title 은 요소 자체를 만들지 않는다 — 빈 div 도 여백을 차지한다.
    const caps = scene.bullets ? scene.bullets.filter(b => b && b.t) : [];
    const hasHead = !!(scene.title || scene.footnote);
    const capBase = hasHead ? 2 : 1;                   // 캡션 rg 시작 — 헤더가 없으면 1 부터
    // 삽화 모드에서는 **대사 하나가 화면 하나**다. 캡션이 대사보다 적어도 상태 수는 세그 수만큼
    // 있어야 그 대사의 삽화가 화면에 나온다 — 안 그러면 캡처가 일찍 멈춰 삽화가 통째로 빠진다
    // (실측: 대사 3 · 캡션 1 인 씬에서 상태 2 만 잡혀 세 번째 삽화가 영상에 없었다).
    // 캡션 없는 뒤쪽 대사 자리는 '캡션 0개' 상태로 열거된다 — 화면에는 그림만 보인다.
    const segN = (scene.narration || []).length;
    const lastRg = Math.max(capBase - 1 + caps.length, segN - (hasHead ? 0 : 1));
    const capShow = Math.min(reveal, lastRg);
    const capHtml = caps.map((b, k) => {
      const rg = capBase + k;
      if (rg > maxRg) maxRg = rg;
      return '<div class="rv cap' + (rg === capShow ? '' : ' hide') + '" data-rg="' + rg + '">' +
        '<div class="t">' + em(b.t) + '</div>' +
        (b.d ? '<div class="d">' + esc(b.d) + '</div>' : '') + '</div>';
    }).join('');
    zone.innerHTML =
      (scene.title ? R(1, '<div class="points-title">' + em(scene.title) + '</div>') : '') +
      '<div class="cap-stack">' + capHtml + '</div>' +
      (scene.footnote ? R(1, '<div class="footnote">' + esc(scene.footnote) + '</div>') : '');
  } else if (scene.type === 'quote') {
    // alpha(발화 영상 위): 상단 서명만. 불투명(정지 카드): 서명 + 인용문.
    document.body.insertAdjacentHTML('beforeend',
      '<div class="quote-sign">' + rv(0,
        '<div class="name">' + esc(scene.speaker) + '</div>' +
        '<div class="role">' + esc(scene.role || '').replace(/AI/g, '<span class="ai">AI</span>') + '</div>') + '</div>');
    if (!alpha) { zone.classList.add('center');
      zone.innerHTML = R(1, '<div class="quote-card">' + em(scene.text) + '</div>'); }
  } else if (scene.type === 'outro') {
    zone.classList.add('center');
    zone.innerHTML =
      R(0, '<div class="outro-brand">' + esc(THEME.brand || '') + '</div>') +
      R(0, '<div class="outro-title">' + em(scene.title) + '</div>') +
      (scene.sub ? R(0, '<div class="outro-sub">' + esc(scene.sub) + '</div>') : '');
  }

  // ── 오버플로 가드: 실측 → tight1~3 → 잔여를 __overflow 로 노출 ──
  let tier = 0;
  while (zone.scrollHeight > zone.clientHeight + 1 && tier < 3) {
    tier += 1; root.classList.add('tight' + tier);
  }
  window.__overflow = Math.max(0, zone.scrollHeight - zone.clientHeight);

  // 히어로 스탯 폭 가드 — scrollWidth 는 못 쓴다(center flex 에서 clientWidth 와 같아짐).
  // getBoundingClientRect 로 실측해 640px 이하로 축소 (켄번즈 3.5% + 기기 크롭 편차 여유).
  const stat = document.getElementById('stat');
  if (stat) {
    let size = parseFloat(getComputedStyle(stat).fontSize);
    let guard = 0;
    while (stat.getBoundingClientRect().width > 640 && size > 80 && guard < 40) {
      size -= 6; stat.style.fontSize = size + 'px'; guard += 1;
    }
  }

  document.title = 'scene=' + i + ' type=' + scene.type + ' rev=' + maxRg + ' ovf=' + window.__overflow;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __boot);
else __boot();
</script>
</body>
</html>
