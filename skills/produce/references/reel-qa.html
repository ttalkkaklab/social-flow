<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reel phone-mode QA</title>
<!--
  make-reels QA harness — check the reel on a real phone screen with the platform UI on top.
  ?v=<video path> default ./reel.mp4 — **for subtitle QA, name ./reel-sub.mp4 explicitly**
                 (reel.mp4 is the clean master with no subtitles, so clipping and
                 intrusions don't show)
  ?ui=ig|yt|none platform UI mockup (default ig)
  ?fit=crop|full crop=what a tall phone really shows (fills vertically, crops the sides) /
                 full=show all of it (default crop)
  ?t=<seconds>   start point
  ?zone=1        draw the safe zone boundaries
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#15161a; display:flex; align-items:center; justify-content:center;
         min-height:100vh; font-family:-apple-system,"Pretendard",sans-serif; }
  /* By default the viewport is the phone screen (it rides straight on Chrome's device
     emulation). With ?frame=1, a 390×844 mockup frame for looking at it on a desktop. */
  #phone { position:relative; width:100vw; height:100vh; overflow:hidden; background:#000; }
  body.framed { padding:24px; }
  body.framed #phone { width:390px; height:844px; border-radius:44px;
           box-shadow:0 0 0 10px #2a2c33, 0 24px 70px rgba(0,0,0,.7); }
  video { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  body.fit-crop video { height:100%; width:auto; }    /* fill vertically → crop the sides (what a tall phone does) */
  body.fit-full video { width:100%; height:auto; }    /* show all of it */
  .ui { position:absolute; inset:0; pointer-events:none; }
  /* ── Instagram reels UI ── */
  .ig-top { position:absolute; top:14px; left:0; right:0; display:flex; align-items:center;
            justify-content:space-between; padding:0 16px; color:#fff; }
  .ig-top .t { font-size:20px; font-weight:700; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .ig-top .c { font-size:19px; }
  .ig-bar { position:absolute; right:8px; bottom:112px; display:flex; flex-direction:column;
            align-items:center; gap:19px; color:#fff; }
  .ig-bar .it { display:flex; flex-direction:column; align-items:center; gap:3px;
                filter:drop-shadow(0 1px 4px rgba(0,0,0,.7)); }
  .ig-bar .ic { font-size:26px; line-height:1; }
  .ig-bar .n { font-size:11px; font-weight:600; }
  .ig-cap { position:absolute; left:14px; right:74px; bottom:26px; color:#fff;
            text-shadow:0 1px 5px rgba(0,0,0,.75); }
  .ig-cap .u { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:7px; }
  .ig-cap .u .av { width:26px; height:26px; border-radius:50%; background:#5b6; border:1px solid #fff; }
  .ig-cap .u .f { border:1px solid #fff; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:600; }
  .ig-cap .x { font-size:12.5px; line-height:1.35; max-height:34px; overflow:hidden; }
  .ig-au { display:flex; align-items:center; gap:6px; font-size:11.5px; margin-top:7px; opacity:.95; }
  /* ── YouTube shorts UI ── */
  .yt-top { position:absolute; top:14px; left:16px; right:16px; display:flex; justify-content:space-between;
            color:#fff; font-size:19px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .yt-bar { position:absolute; right:6px; bottom:96px; display:flex; flex-direction:column;
            align-items:center; gap:22px; color:#fff; }
  .yt-meta { position:absolute; left:14px; right:70px; bottom:30px; color:#fff;
             text-shadow:0 1px 5px rgba(0,0,0,.75); }
  .yt-meta .ttl { font-size:13.5px; font-weight:600; line-height:1.3; max-height:36px; overflow:hidden; }
  .yt-meta .ch { display:flex; align-items:center; gap:7px; margin-top:9px; font-size:12.5px; font-weight:600; }
  .yt-meta .ch .av { width:24px; height:24px; border-radius:50%; background:#c33; }
  .yt-meta .ch .sub { border:1px solid #fff; border-radius:12px; padding:2px 9px; font-size:11px; }
  .yt-prog { position:absolute; left:0; right:0; bottom:9px; height:2px; background:rgba(255,255,255,.3); }
  .yt-prog i { display:block; height:100%; width:34%; background:#f00; }
  /* ── Safe zone guides (video coordinates of 1080×1920, converted to display scale) ── */
  .zones { position:absolute; inset:0; display:none; }
  body.zone .zones { display:block; }
  .zones div { position:absolute; border:1px dashed rgba(255,60,60,.85);
               background:rgba(255,60,60,.10); font:10px/1.2 monospace; color:#ff8080; padding:1px 3px; }
  #hud { position:fixed; left:16px; top:16px; color:#8f97a8; font:12px/1.5 monospace; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="phone">
  <video id="v" muted playsinline></video>
  <div class="zones" id="zones"></div>
  <div class="ui" id="ui"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const src = q.get("v") || "./reel.mp4";
const ui = q.get("ui") || "ig";
const fit = q.get("fit") || "crop";
document.body.className = "fit-" + fit + (q.get("zone") === "1" ? " zone" : "")
  + (q.get("frame") === "1" ? " framed" : "");
const v = document.getElementById("v");
v.src = src;

const IG = `
 <div class="ig-top"><div class="t">Reels</div><div class="c">📷</div></div>
 <div class="ig-bar">
   <div class="it"><div class="ic">♡</div><div class="n">1.2K</div></div>
   <div class="it"><div class="ic">💬</div><div class="n">84</div></div>
   <div class="it"><div class="ic">➤</div><div class="n">312</div></div>
   <div class="it"><div class="ic">⋯</div></div>
   <div class="it"><div class="ic">🎵</div></div>
 </div>
 <div class="ig-cap">
   <div class="u"><div class="av"></div>yourbrand<div class="f">Follow</div></div>
   <div class="x">Don't register on the day you arrive and it's a fine. The temporary residence report changed on July 24 — who files it, the landlord or me…</div>
   <div class="ig-au">🎵 Original audio · Your Brand</div>
 </div>`;
const YT = `
 <div class="yt-top"><div>Shorts</div><div>🔍 ⋯</div></div>
 <div class="yt-bar">
   <div>👍<div style="font-size:11px;text-align:center">1.2K</div></div>
   <div>👎<div style="font-size:11px;text-align:center">Dislike</div></div>
   <div>💬<div style="font-size:11px;text-align:center">84</div></div>
   <div>↗<div style="font-size:11px;text-align:center">Share</div></div>
   <div>🎬</div>
 </div>
 <div class="yt-meta">
   <div class="ttl">Vietnam temporary residence report moves to 'immediately on arrival' — in force July 24, 2026</div>
   <div class="ch"><div class="av"></div>@YourBrand<div class="sub">Subscribe</div></div>
 </div>
 <div class="yt-prog"><i></i></div>`;
document.getElementById("ui").innerHTML = ui === "ig" ? IG : ui === "yt" ? YT : "";

// Safe zones: video coordinates (1080×1920) → screen coordinates. crop mode fills vertically, so the scale is 844/1920.
function drawZones() {
  const P = document.getElementById("phone").getBoundingClientRect();
  const s = fit === "crop" ? P.height / 1920 : P.width / 1080;
  // The video is centered — crop loses the sides, full clips or pads top and bottom. Correct for both offsets.
  const vw = 1080 * s, off = (P.width - vw) / 2;
  const vh = 1920 * s, voff = (P.height - vh) / 2;
  const box = (x, y, w, h, label) => {
    const d = document.createElement("div");
    d.style.left = (off + x * s) + "px"; d.style.top = (voff + y * s) + "px";
    d.style.width = (w * s) + "px"; d.style.height = (h * s) + "px";
    d.textContent = label; return d;
  };
  const z = document.getElementById("zones"); z.innerHTML = "";
  z.append(box(0, 0, 1080, 190, "top 190"));
  z.append(box(904, 190, 176, 1730, "right 176"));       // text zone boundary
  z.append(box(890, 1100, 190, 570, "action bar (measured)"));  // where the icons actually land in a tall-phone crop
  z.append(box(0, 1350, 904, 570, "bottom 570"));
  z.append(box(176, 1380, 728, 180, "subtitle band"));
}
drawZones();

const hud = document.getElementById("hud");
const upd = () => { hud.textContent = `${src.split("/").pop()}  ui=${ui} fit=${fit}\nt=${v.currentTime.toFixed(2)}s / ${(v.duration||0).toFixed(2)}s`; };
v.addEventListener("timeupdate", upd);
v.addEventListener("loadedmetadata", () => { if (q.get("t")) v.currentTime = parseFloat(q.get("t")); upd(); });
window.seek = (t) => new Promise(r => { v.onseeked = () => { upd(); r(v.currentTime); }; v.currentTime = t; });
</script>
</body>
</html>
