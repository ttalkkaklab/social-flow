<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>social-flow screencast overlay</title>
<!--
  Scene title overlay for screencast (recording) editing — renders only the top block of
  the 1080×1920 transparent canvas.
  The middle of the screen belongs to the recording band (build-screencast.sh places it at
  y≥460), so this renderer draws only the y 190~460 top block (kicker + title, plus the
  stat on a cover).

  ■ Data contract: inject scenes.js from the same directory with <script src> (the same sed
    injection as video-template — never write another literal body closing tag anywhere in
    this file).
      window.THEME  = { accent, accent2, ink, brand }
      window.SCENES = [ {type, kicker, title(**emphasis** supported), stat?, statLabel?, ...}, ... ]
    A recording-mode scene uses kicker+title only, whatever its type. cover adds
    stat/statLabel as a one-line chip under the title (bullets and quotes aren't drawn in
    the overlay — the recorded screen and the subtitles do that job).
  ■ URL parameters (the capture-frames.sh contract):
      ?i=<n>     scene index (from 0 — one off from edit.json's idx, which starts at 1;
                 the capture loop converts)
      &alpha=1   transparent body (always capture in this mode — opaque is for preview)
  ■ The y=460 block floor contract: on overflow, shrink through tight1~3 and expose the
      remainder as window.__overflow.
      Paired with build-screencast.sh's BAND_MIN_Y default — change one side only and the
      title ends up buried under the band.
-->
<style>
  :root{ --accent:#5b8cff; --accent2:#a05bff; --ink:#0b1020; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--ink); color:#fff; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body.alpha{background:transparent}

  /* Safe zone x 176~904 (pipeline.md — dodges the IG crop and the action bar) */
  .top{position:absolute;left:176px;right:176px;top:190px;text-align:center}
  .kicker{font-size:32px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.82);
    text-transform:uppercase;margin-bottom:26px}
  .kicker .dot{color:var(--accent)}
  .title{font-size:72px;line-height:1.18;font-weight:800;letter-spacing:-0.02em;
    text-shadow:0 5px 34px rgba(0,0,0,.6);word-break:keep-all}
  .title .em{background:linear-gradient(105deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(0,0,0,.5))}
  body.scene-cover .title{font-size:84px}
  .stat-row{margin-top:26px;display:flex;align-items:baseline;justify-content:center;gap:20px}
  .stat{font-size:76px;line-height:1;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;
    background:linear-gradient(120deg,var(--accent) 10%,var(--accent2) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 5px 26px rgba(0,0,0,.6))}
  .stat-label{font-size:32px;font-weight:600;color:rgba(255,255,255,.88);word-break:keep-all}

  /* Overflow guard — step the size down when the block bottom passes y=460 */
  .tight1 .title{font-size:64px}  .tight1 body.scene-cover .title{font-size:74px}
  .tight1 .stat{font-size:66px}
  .tight2 .title{font-size:56px}  .tight2 .stat{font-size:58px}
  .tight2 .kicker{margin-bottom:18px}
  .tight3 .title{font-size:50px}  .tight3 .stat-row{margin-top:16px}
</style>
</head>
<body>
<div class="top" id="top"></div>
<script>
function __boot() {
  const qs = new URLSearchParams(location.search);
  const i = parseInt(qs.get('i') || '0', 10);
  const alpha = qs.get('alpha') === '1';

  const THEME = window.THEME || {};
  const root = document.documentElement;
  if (THEME.accent) root.style.setProperty('--accent', THEME.accent);
  if (THEME.accent2) root.style.setProperty('--accent2', THEME.accent2);
  if (THEME.ink) root.style.setProperty('--ink', THEME.ink);

  const scenes = window.SCENES || [];
  const scene = scenes[i];
  const top = document.getElementById('top');
  if (!scene) { top.textContent = 'scenes.js not injected, or index out of range: i=' + i; return; }

  document.body.classList.add('scene-' + scene.type);
  if (alpha) document.body.classList.add('alpha');

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const em = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="em">$1</span>');

  top.innerHTML =
    (scene.kicker ? '<div class="kicker">' + esc(scene.kicker).replace(/·/g, '<span class="dot">·</span>') + '</div>' : '') +
    '<div class="title">' + em(scene.title || '') + '</div>' +
    (scene.type === 'cover' && scene.stat
      ? '<div class="stat-row"><div class="stat">' + esc(scene.stat) + '</div>' +
        (scene.statLabel ? '<div class="stat-label">' + esc(scene.statLabel) + '</div>' : '') + '</div>'
      : '');

  // Overflow guard — the y=460 block bottom contract (paired with BAND_MIN_Y)
  const LIMIT = 460;
  let tier = 0;
  while (top.getBoundingClientRect().bottom > LIMIT && tier < 3) {
    tier += 1; root.classList.add('tight' + tier);
  }
  window.__overflow = Math.max(0, Math.round(top.getBoundingClientRect().bottom - LIMIT));
  document.title = 'scene=' + i + ' type=' + scene.type + ' ovf=' + window.__overflow;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __boot);
else __boot();
</script>
</body>
</html>
