<!doctype html>
<!-- 브랜드 락업 카드 — 1080×1920 헤드리스 캡처용 (capture-frames.sh)
     sed 토큰: {{INK}} {{ACCENT}} {{ACCENT2}} {{CHANNEL_NAME}} {{TAGLINE}} {{LOGO_SRC}}
     URL 파라미터 mode:
       full — 배경+캐릭터+채널명+태그라인 (최종 락업, 기본)
       char — 배경+캐릭터만 (veo lastImagePath 용 — 텍스트 없는 최종 포즈 카드)
       text — 채널명+태그라인만, 투명 배경 (텍스트 플레이트 — alpha=1 로 캡처)
     세 모드의 요소 좌표는 동일하다 — 플레이트 오버레이가 락업과 픽셀 일치해야 한다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: {{INK}}; --accent: {{ACCENT}}; --accent2: {{ACCENT2}}; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative; background: transparent;
    font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  /* 배경 — 딥 잉크 라디얼 + 액센트 글로우 + 비네트 */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 60% at 50% 38%, color-mix(in srgb, var(--accent) 16%, var(--ink)) 0%, var(--ink) 62%),
      var(--ink);
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 140% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  /* 캐릭터 — 원형 아바타 (플랫폼 노출 형태) + 액센트 그라데이션 링 + 글로우 */
  .avatar {
    position: absolute; left: 50%; top: 820px; transform: translate(-50%, -50%);
    width: 600px; height: 600px; border-radius: 50%; padding: 7px;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    box-shadow: 0 0 140px color-mix(in srgb, var(--accent) 55%, transparent),
                0 30px 80px rgba(0,0,0,0.5);
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
  }
  /* 텍스트 스크림 — 밝은 영상 위에서도 텍스트 대비 보장 (full·text 모드 공통 → 픽셀 일치 유지) */
  .text-scrim {
    position: absolute; left: 50%; top: 1430px; transform: translate(-50%, -50%);
    width: 980px; height: 520px; border-radius: 50%;
    background: radial-gradient(closest-side,
      color-mix(in srgb, var(--ink) 82%, transparent) 0%,
      color-mix(in srgb, var(--ink) 55%, transparent) 55%, transparent 100%);
  }
  /* 채널명·태그라인 — 세 모드에서 좌표 고정 */
  .name {
    position: absolute; left: 50%; top: 1280px; transform: translateX(-50%);
    width: 900px; text-align: center;
    font-size: 96px; font-weight: 900; letter-spacing: -0.02em; color: #ffffff;
    text-shadow: 0 4px 28px rgba(0,0,0,0.6);
  }
  .tagline {
    position: absolute; left: 50%; top: 1442px; transform: translateX(-50%);
    width: 860px; text-align: center;
    font-size: 40px; font-weight: 600; line-height: 1.45;
    color: color-mix(in srgb, var(--accent2) 72%, #ffffff);
    text-shadow: 0 2px 18px rgba(0,0,0,0.55);
  }
  body.mode-char .name, body.mode-char .tagline, body.mode-char .text-scrim { display: none; }
  body.mode-text .bg, body.mode-text .avatar { display: none; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="avatar"><img src="{{LOGO_SRC}}" alt=""></div>
  <div class="text-scrim"></div>
  <div class="name">{{CHANNEL_NAME}}</div>
  <div class="tagline">{{TAGLINE}}</div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'full';
  document.body.className = 'mode-' + mode;
</script>
</body>
</html>
