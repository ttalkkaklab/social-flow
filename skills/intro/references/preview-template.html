<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{CHANNEL}} — {{TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1020; color: #e8ecf4;
    font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    padding: 32px; min-height: 100vh;
  }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 800; }
  header p { color: #8b93a7; font-size: 13px; margin-top: 6px; }
  .grid {
    display: grid; grid-template-columns: repeat(2, minmax(260px, 380px));
    gap: 24px; justify-content: center;
  }
  .card {
    background: #131a2e; border: 1px solid #232c46; border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .card .tag {
    align-self: flex-start; font-size: 13px; font-weight: 800;
    background: #22304f; color: #9db8ff; border-radius: 8px; padding: 4px 10px;
  }
  .card video {
    width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; display: block;
    background: #000; object-fit: cover;
  }
  .desc { color: #c3cadb; font-size: 13px; line-height: 1.6; }
  .hint { color: #8b93a7; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>{{CHANNEL}} — {{TITLE}}</h1>
  <p>자동재생은 음소거 상태입니다 — 사운드(소닉 로고)까지 반드시 켜서 확인하세요. 터미널에서 선택/승인을 입력합니다.</p>
</header>
<div class="grid">
  <div class="card">
    <span class="tag">A · {{LABEL_A}}</span>
    <video src="{{VID_A}}" autoplay muted loop playsinline controls></video>
    <p class="desc">{{DESC_A}}</p>
    <p class="hint">반복 재생 중 — 컨트롤에서 음소거를 해제하면 사운드가 들립니다.</p>
  </div>
  <div class="card">
    <span class="tag">B · {{LABEL_B}}</span>
    <video src="{{VID_B}}" autoplay muted loop playsinline controls></video>
    <p class="desc">{{DESC_B}}</p>
    <p class="hint">반복 재생 중 — 컨트롤에서 음소거를 해제하면 사운드가 들립니다.</p>
  </div>
</div>
</body>
</html>
