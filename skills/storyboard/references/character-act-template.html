<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 연기 씬</title>
<!--
  social-flow 캐릭터 연기 렌더러 — 숏폼 1080×1920 · 롱폼 1920×1080 (window.FORMAT 이 고른다).
  scenes-schema §캐릭터 연기 · storyboard SKILL §5.6 · slide-design.md §8 이 이 파일의 사용 계약이다.

  ■ 이 레인이 맡는 자리
      말하는 사람이 화면에 있어야 하는 컷 — 문장마다 반응하고, 가리키고, 끄덕인다.
      **캐릭터가 사실을 혼자 지지 않는다.** 값과 문장은 글자가 말하고 캐릭터는 거기에 반응한다.
      배경 그림으로 될 자리(분위기·장소·사람)는 생성 이미지이고, 숫자가 움직이는 자리는
      모션 슬라이드다. 여기는 "누가 반응하는가"가 필요한 자리뿐이다.

  ■ 동작은 고르는 것이지 만드는 것이 아니다
      움직임은 scenes.js 의 visual.slide.acts 가 정한다 — 그룹(=나레이션 세그먼트)마다 하나씩,
      아래 동작 어휘 중에서만.

        enter  왼쪽에서 들어와 선다 (첫 그룹의 기본)
        point  한 팔을 들어 가리켰다 내린다
        nod    고개를 두 번 끄덕인다
        shrug  두 팔을 살짝 벌리고 어깨를 올렸다 내린다
        think  손을 턱에 대고 고개를 기울였다 돌아온다
        wave   손을 들어 두 번 흔든다
        cheer  두 팔을 올리고 두 번 뛴다
        conceal · signal · inspect · gather · surround · bind · escort · release
               사건 배우와 소품이 쓰는 연기다. cast와 함께 action 객체로 적는다.

      이름 밖의 동작을 CSS 로 새로 짜지 않는다. 손으로 맞춘 움직임은 다음 회차에서 재현되지 않고,
      키프레임을 늘리는 순간 이 레인은 결정성을 잃는다. 필요한 동작이 목록에 없으면 목록을
      늘리는 일(템플릿 + check-slide.js + slide-design.md 를 같이)이지 슬라이드에서 처리할 일이 아니다.

  ■ 모든 동작은 제자리로 돌아온다
      enter 를 뺀 여섯은 끝나면 처음 자세다. 그래서 그룹 k 의 끝 프레임이 그룹 k+1 클립의
      첫 프레임과 같고, 자세가 컷을 넘어 쌓이지 않는다. 이게 클립을 이어 붙일 수 있게 하는 조건이다.

  ■ 사용법 (storyboard §5.6 — 승인 전에)
      1. storyboard/slides/s<샷번호>-<slug>.html 로 복사하고 SLIDE_SHOT 을 그 샷번호로 바꾼다.
      2. renderCharacter() 하나만 그 씬의 글자로 다시 쓴다 — 동작은 scenes.js 가 들고 있다.
      3. 글자는 전부 scenes.js 에서 온다(S.title·S.bullets·S.visual.slide.labels).

  ■ 상태 규칙·결정성 계약·존은 모션 슬라이드와 한 글자도 다르지 않다.
      세 템플릿이 같은 seek 런타임 블록을 갖고 format-lint.js 가 세 벌을 대조한다.
      디자인 계약은 slide-design.md 가 정본이다 — 바탕 플레이트 PNG 오버레이, 종이색 글자 +
      액센트 한 점, 각진 플레이트, 폰에서 보이는 선 굵기. 말(said)은 마스크 라이즈로 앉는다.
      그레인은 render-motion-slide.mjs 가 인코딩 때 얹는다(--grain).
-->

  .stage{
    position:absolute; left:var(--zone-x); right:var(--zone-x);
    top:var(--zone-top); bottom:var(--zone-bottom); z-index:1;
    display:flex; flex-direction:column; gap:30px; justify-content:center;
  }
  /* 롱폼은 캐릭터가 왼쪽, 말이 오른쪽이다. flex-row 로 두면 키커까지 세 번째 칸이 돼서
     캐릭터 왼쪽에 따로 선다(1라운드 실측) — 키커가 두 칸을 걸치도록 그리드로 짠다. */
  html.wide .stage{display:grid; grid-template-columns:40% 1fr; grid-template-rows:auto 1fr;
                   column-gap:48px; row-gap:16px; align-items:center}
  html.wide .stage > .rv{grid-column:1 / -1; grid-row:1}
  html.wide .stage > .words{grid-column:2; grid-row:2}

  .fig{width:100%; height:var(--fig-h); flex:none; overflow:visible}
  /* 높이는 --fig-h 로 못박는다 — height:100% 는 그리드 행 안에서 내용 비율로 풀려
     세로 1209px 짜리 상자가 되고 overflow:visible 이라 다리가 캔버스 밖으로 나간다(1라운드 실측). */
  html.wide .fig{width:100%; height:var(--fig-h); grid-column:1; grid-row:2}
  .ink{fill:none; stroke:var(--paper); stroke-width:var(--stroke); stroke-linecap:round; stroke-linejoin:round}
  .ground{stroke:var(--line); stroke-width:var(--hair)}
  /* 동작 레이어 — 그룹마다 한 겹. 애니메이션이 붙은 겹만 실제로 움직인다. */
  .ly{animation-duration:var(--act,700ms); animation-timing-function:var(--ease);
      animation-fill-mode:both; animation-play-state:paused;
      transform-box:view-box; transform-origin:200px 350px}
  .ly.on-head{transform-origin:200px 150px}
  .ly.on-armR,.ly.on-armL{transform-origin:200px 214px}

  /* 입장은 걸어 들어오는 게 보여야 한다 — 페이드를 겹치면 이동이 가려진다. */
  .a-enter-body{--act:700ms; animation-name:aEnterBody;
                animation-duration:var(--act); animation-timing-function:var(--ease)}
  .a-point-armR{--act:520ms; animation-name:aPointArmR}
  .a-nod-head{--act:900ms; animation-name:aNodHead}
  .a-shrug-armR{--act:800ms; animation-name:aShrugArmR}
  .a-shrug-armL{--act:800ms; animation-name:aShrugArmL}
  .a-shrug-body{--act:800ms; animation-name:aShrugBody}
  .a-think-armR{--act:700ms; animation-name:aThinkArmR}
  .a-think-head{--act:700ms; animation-name:aThinkHead}
  .a-wave-armR{--act:1300ms; animation-name:aWaveArmR}
  .a-cheer-armR{--act:1100ms; animation-name:aCheerArmR}
  .a-cheer-armL{--act:1100ms; animation-name:aCheerArmL}
  .a-cheer-body{--act:1100ms; animation-name:aCheerBody}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes aEnterBody{from{transform:translateX(-72px)}to{transform:none}}
  @keyframes aPointArmR{0%,100%{transform:rotate(0)}30%,72%{transform:rotate(-62deg)}}
  @keyframes aNodHead{0%,50%,100%{transform:rotate(0)}25%,75%{transform:rotate(11deg)}}
  @keyframes aShrugArmR{0%,100%{transform:rotate(0)}38%,70%{transform:rotate(-26deg)}}
  @keyframes aShrugArmL{0%,100%{transform:rotate(0)}38%,70%{transform:rotate(26deg)}}
  @keyframes aShrugBody{0%,100%{transform:translateY(0)}38%,70%{transform:translateY(-14px)}}
  @keyframes aThinkArmR{0%,100%{transform:rotate(0)}35%,80%{transform:rotate(-105deg)}}
  @keyframes aThinkHead{0%,100%{transform:rotate(0)}35%,80%{transform:rotate(-9deg)}}
  @keyframes aWaveArmR{0%,100%{transform:rotate(0)}18%,86%{transform:rotate(-74deg)}
                       36%,68%{transform:rotate(-52deg)}52%{transform:rotate(-74deg)}}
  @keyframes aCheerArmR{0%,100%{transform:rotate(0)}28%,76%{transform:rotate(-100deg)}}
  @keyframes aCheerArmL{0%,100%{transform:rotate(0)}28%,76%{transform:rotate(100deg)}}
  @keyframes aCheerBody{0%,40%,80%,100%{transform:translateY(0)}20%{transform:translateY(-30px)}60%{transform:translateY(-18px)}}

  .rv{animation:appear 1ms linear both paused;
      animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms))}
  .rv.fx-fade{animation-name:fade; animation-duration:var(--fade); animation-timing-function:linear}
  .rv.fx-rise{animation-name:fade, lift; animation-duration:var(--fade), var(--rise);
              animation-timing-function:linear, var(--ease)}
  .rv.fx-in{animation-name:reveal; animation-duration:var(--rise); animation-timing-function:var(--ease-mask)}
  .rv.fx-grow{animation-name:grow; animation-duration:var(--grow); animation-timing-function:var(--ease-mask); transform-origin:left center}
  .rv.fx-draw{animation-name:draw; animation-duration:var(--draw); animation-timing-function:var(--ease-mask)}
  /* 마스크 라이즈 — 말(said)의 기본 등장. 글자가 자기 줄 상자 밑에서 올라온다. */
  .rv.fx-mask{clip-path:inset(-.06em 0 -.1em 0)}
  .rv.fx-mask > .mk, .rv.fx-mask > .dw > .mk, .rv.fx-mask > .dw > .svw > .mk, .rv.fx-mask > .svw > .mk{
    animation:mask-rise var(--rise) var(--ease) both paused;
    animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms))}
  .rv.fx-plate{animation-name:reveal; animation-duration:var(--plate); animation-timing-function:var(--ease-mask)}
  .rv.fx-plate .mk{display:block; clip-path:inset(-.06em 0 -.1em 0)}
  .rv.fx-plate .mk > span{display:block; animation:mask-rise var(--rise) var(--ease) both paused;
    animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms) + var(--lead))}
  .rv.fx-pop{animation-name:pop; animation-duration:var(--pop); animation-timing-function:var(--ease)}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes lift{from{transform:translateY(var(--travel))}to{transform:none}}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes mask-rise{from{transform:translateY(112%)}to{transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.94)}55%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
  /* ── 지속 층 (slide-design.md §5) — 렌더러가 --seg-d(세그먼트 길이)를 넣으면 .sv 의
        의미 운동이 문장 끝까지 늘어난다. 캐릭터의 동작은 늘리지 않는다 — 동작은 어휘가
        정한 길이대로 하고, 지속은 글 쪽(said 의 sv:"settle")이 맡는다. */
  .rv.sv.fx-grow{animation-duration:var(--seg-d,var(--grow))}
  .rv.sv.fx-draw{animation-duration:var(--seg-d,var(--draw))}
  .rv.sv.fx-in{animation-duration:var(--seg-d,var(--rise))}
  .svw{display:block; transform-origin:center;
       animation:svsettle var(--seg-d,4000ms) var(--ease) both paused}
  @keyframes svsettle{from{transform:scale(1.045)}to{transform:scale(1)}}
  .dw{display:block}                                /* 포커스 시프트 래퍼 — opacity 는 런타임이 적는다 */
  .mk{display:block}

  /* 키커 = 태그 플레이트. 액센트 면 위 잉크 글자, 각진 모서리. */
  .kicker{display:inline-flex; align-self:flex-start; align-items:center;
          font-size:var(--fs-kicker); font-weight:700; letter-spacing:.03em; line-height:1;
          color:var(--ink); background:var(--accent); padding:.42em .7em .38em}
  .kicker.plain{background:none; color:var(--muted); font-weight:500; padding:0; gap:16px}
  .kicker.plain::before{content:""; width:40px; height:var(--hair); background:var(--accent)}
  .said{font-size:var(--fs-title); font-weight:800; letter-spacing:-.03em; line-height:1.18;
        text-wrap:balance; word-break:keep-all}
  .note{font-size:var(--fs-desc); color:var(--muted); word-break:keep-all}
  strong{font-weight:800; color:var(--accent)}
  mark{background:var(--accent); color:var(--ink); padding:0 .12em; box-decoration-break:clone}
  .words{display:flex; flex-direction:column; gap:18px}
  /* 밴드 — 액센트 띠 위 잉크 글자. 평결·이름표. tone = accent|paper|panel */
  .band{display:block; padding:.34em .6em .3em; font-size:var(--fs-label); font-weight:800;
        letter-spacing:-.02em; line-height:1.18; word-break:keep-all; align-self:flex-start}
  .band.accent{background:var(--accent); color:var(--ink)}
  .band.paper{background:var(--paper); color:var(--ink)}
  .band.panel{background:var(--panel); color:var(--paper)}
  .foot{display:flex; align-items:center; gap:16px; font-size:var(--fs-foot); color:var(--muted); word-break:keep-all}
  .foot::before{content:""; width:36px; height:var(--hair); background:var(--line); flex:none}
  /* 사건 연기 표 — 이미지 플레이트가 없을 때 쓰는 코드 네이티브 폴백이다.
     큰 머리와 작은 몸으로 표정을 읽게 하되, 카드·아이콘·말풍선으로 대신하지 않는다. */
  .tableau{position:relative;width:100%;height:var(--fig-h);flex:none}
  .actor{position:absolute;bottom:34px;width:210px;height:360px}
  .actor:nth-child(1){left:10%}.actor:nth-child(2){left:40%}.actor:nth-child(3){left:69%}
  .chibi-head{position:absolute;top:0;left:25px;width:160px;height:160px;border:var(--stroke) solid var(--paper);border-radius:50%;background:var(--ink)}
  .chibi-body{position:absolute;left:50px;top:145px;width:110px;height:155px;border:var(--stroke) solid var(--paper);border-radius:0;border-bottom:0}
  .actor.masked .chibi-head::after{content:"";position:absolute;left:30px;top:68px;width:78px;height:34px;border:var(--stroke) solid var(--paper);border-radius:0;background:var(--ink)}
  .actor.police .chibi-head::after{content:"";position:absolute;left:13px;top:-34px;width:112px;height:44px;border:var(--stroke) solid var(--paper);border-bottom:0}
  .actor.document .chibi-head{border-radius:0;transform:rotate(-6deg)}
  .actor.document .chibi-body{display:none}
  .bind-line{position:absolute;left:23%;right:23%;top:290px;border-top:var(--stroke) solid var(--accent);transform:rotate(-5deg)}
  .surround-ring{position:absolute;left:27%;top:92px;width:46%;height:260px;border:var(--rule) solid var(--accent);border-radius:50%}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../scenes.js"></script>
<script>
// ✎ 이 슬라이드의 샷 번호 — SCENES 배열 순번(1부터). 파일명 s<번호> 와 같다.
const SLIDE_SHOT = 0;

(function () {
  const FORMAT = window.FORMAT || "shorts-9x16";
  const root = document.documentElement;
  if (FORMAT === "youtube-long-16x9") root.classList.add("wide");
  const THEME = window.THEME || {};
  if (THEME.accent) root.style.setProperty("--accent", THEME.accent);
  if (THEME.ink)    root.style.setProperty("--ink",    THEME.ink);

  const S = (window.SCENES || [])[SLIDE_SHOT - 1];
  const stage = document.getElementById("stage");
  if (!S) { stage.textContent = "check scenes.js / SLIDE_SHOT: " + SLIDE_SHOT; return; }

  /* 동작 이름 → 어느 부위가 움직이나. 목록 밖의 이름은 여기서 멈춘다(check-slide.js 가 먼저 잡는다). */
  const ACTS = {
    enter: ["body"], point: ["armR"], nod: ["head"], shrug: ["armR", "armL", "body"],
    think: ["armR", "head"], wave: ["armR"], cheer: ["armR", "armL", "body"],
    conceal: ["armR"], signal: ["armR"], inspect: ["armR", "head"], gather: ["body"],
    surround: ["body"], bind: ["armR"], escort: ["body"], release: ["armR"]
  };
  const slide = (S.visual && S.visual.slide) || {};
  const acts = slide.acts || [];
  const actionOf = a => typeof a === "string" ? a : a && a.action;
  const unknown = acts.map(actionOf).filter(a => !ACTS[a]);
  if (!acts.length || unknown.length) {
    stage.textContent = unknown.length
      ? "unknown act: " + unknown.join(", ") + " — see the template head for the seven names"
      : "visual.slide.acts is empty — one act per narration segment";
    return;
  }

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const em = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/==(.+?)==/g, "<mark>$1</mark>");
  const labels = slide.labels || [];

  /* 부위 하나를 그룹 수만큼 겹으로 감싼다 — 그룹 k 의 동작이 이 부위를 움직이면 그 겹에만
     애니메이션이 붙는다. 겹은 중첩되므로 변형이 곱해지고, 애니메이션의 주인은 언제나
     자기 자신(가장 가까운 [data-rg])이라 그룹 소속이 어긋나지 않는다. */
  const wrap = (part, inner) => {
    let html = inner;
    for (let k = acts.length; k >= 1; k--) {
      const moves = ACTS[actionOf(acts[k - 1])].indexOf(part) >= 0;
      html = '<g data-rg="' + k + '" class="ly on-' + part +
             (moves ? " a-" + acts[k - 1] + "-" + part : "") + '">' + html + "</g>";
    }
    return html;
  };
  const figure = () =>
    '<svg class="fig" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax meet">' +
      '<g class="ink">' +
        wrap("body",
          '<path d="M200 404 L146 596"/><path d="M200 404 L254 596"/>' +
          '<path d="M200 150 L200 408"/>' +
          wrap("armR", '<path d="M200 214 L300 320"/>') +
          wrap("armL", '<path d="M200 214 L100 320"/>') +
          wrap("head", '<circle cx="200" cy="94" r="54"/>')) +
      "</g>" +
      '<path class="ground" d="M40 620 L360 620"/>' +
    "</svg>";

  /* 리빌 래퍼 — fx = mask|plate|pop|rise|in|fade|none, lead = --lead 의 배수. sv:"settle" 은 느린 정착
     래퍼(.svw)를, dim:true 는 포커스 시프트 래퍼(.dw)를 씌운다. sv:true 는 의미 운동(grow·draw)을
     세그먼트 길이로 늘린다. */
  const rv = (rg, html, o = {}) => {
    let inner = html;
    if (o.fx === "mask") inner = '<div class="mk">' + inner + "</div>";
    if (o.sv === "settle") inner = '<div class="svw">' + inner + "</div>";
    if (o.dim) inner = '<div class="dw">' + inner + "</div>";
    const style = (o.i ? "--i:" + o.i + ";" : "") + (o.lead ? "--lead-in:calc(" + o.lead + " * var(--lead));" : "");
    return '<div class="rv' + (o.fx && o.fx !== "none" ? " fx-" + o.fx : "") +
      (o.sv === true ? " sv" : "") + (o.dim ? " dim" : "") + (o.cls ? " " + o.cls : "") +
      '" data-rg="' + rg + '"' +
      (style ? ' style="' + style + '"' : "") + ">" + inner + "</div>";
  };
  const tag = (rg, text, o = {}) =>
    rv(rg, '<span class="kicker' + (o.plain ? " plain" : "") + '">' + em(text) + "</span>",
       { fx: o.plain ? "in" : "pop", i: o.i || 0, lead: o.lead, dim: o.dim });
  /* 캐릭터가 반응하는 대상 — 문장은 여기 있고 캐릭터는 옆에서 반응만 한다. 마스크 라이즈로 앉는다.
     sv:"settle" 은 문장 내내 내려앉는 지속, dim:true 는 다음 문장이 오면 muted 로 내려앉는다 */
  const said = (rg, text, o = {}) => rv(rg, '<div class="said">' + em(text) + "</div>", { fx: o.fx || "mask", i: o.i || 0, lead: o.lead, sv: o.sv, dim: o.dim });
  const note = (rg, text, o = {}) => rv(rg, '<div class="note">' + em(text) + "</div>", { fx: o.fx || "mask", i: o.i || 0, lead: o.lead == null ? 1 : o.lead, dim: o.dim });
  const band = (rg, text, o = {}) =>
    rv(rg, '<div class="band ' + (o.tone || "accent") + '"><span class="mk"><span>' + em(text) + "</span></span></div>",
       { fx: "plate", i: o.i || 0, lead: o.lead, dim: o.dim });
  const foot = (rg, text, o = {}) => rv(rg, '<div class="foot">' + em(text) + "</div>", { fx: "fade", i: o.i || 0, lead: o.lead });
  const cast = Array.isArray(slide.cast) ? slide.cast : [];
  const tableau = () => {
    const appearedAt = id => {
      const n = acts.findIndex(a => typeof a === "object" && (a.actor === id || a.target === id));
      return n < 0 ? 1 : n + 1;
    };
    const actors = cast.slice(0, 3).map((a, i) => {
      const type = /police|officer/.test(a.archetype || "") ? "police" :
        /document|prop|book/.test(a.archetype || "") ? "document" : "masked";
      return rv(appearedAt(a.id), '<div class="actor ' + type + '" data-actor="' + esc(a.id) + '"><i class="chibi-head"></i><i class="chibi-body"></i></div>', { fx: "in", i });
    }).join("");
    const binds = acts.map((a, i) => typeof a === "object" && a.action === "bind"
      ? rv(i + 1, '<i class="bind-line"></i>', { fx: "in" }) : "").join("");
    const surrounds = acts.map((a, i) => typeof a === "object" && a.action === "surround"
      ? rv(i + 1, '<i class="surround-ring"></i>', { fx: "in" }) : "").join("");
    return '<div class="tableau cast">' + actors + surrounds + binds + '</div>';
  };
  const h = { esc, em, rv, tag, said, note, band, foot, figure, tableau, cast, acts, labels, L: i => esc(labels[i] || "") };

  /* ✎ 이 함수만 씬의 글자로 다시 쓴다 ──────────────────────────────
     기본형: 그룹 1 = 키커 태그 + 캐릭터 + 제목(마스크 라이즈), 그 뒤 불릿이 한 줄씩. 앞 줄은
     dim 으로 내려앉는다. 동작은 손대지 않는다 — scenes.js 의 visual.slide.acts 가 정본이다. */
  function renderCharacter(S, h) {
    let out = "";
    if (h.labels.length) out += h.tag(1, h.L(0));
    out += h.cast.length ? h.tableau() : h.figure();
    const n = (S.bullets || []).length;
    let words = h.said(1, S.title || "", { lead: 1, dim: n > 0, sv: n === 0 ? "settle" : undefined });
    (S.bullets || []).forEach((b, i) => {
      const last = i === n - 1;
      words += h.said(i + 2, b.t || "", { dim: !last, sv: last ? "settle" : undefined });
      if (b.d) words += h.note(i + 2, b.d, { dim: !last });
    });
    return out + '<div class="words">' + words + "</div>";
  }

  stage.innerHTML = renderCharacter(S, h);

  /* SEEK-RUNTIME-BEGIN — 아래는 건드리지 않는다. 저작 화면 템플릿 세 벌(모션 슬라이드·
     키네틱 타이포·캐릭터 연기)이 같은 블록을 갖고, format-lint.js 가 세 벌을 대조한다.
     한 벌만 고치면 린트가 잡는다 — 고칠 일이 있으면 세 벌을 같이 고친다. */
  /* 이징 — CSS 의 --ease(cubic-bezier(.05,.7,.1,1), Material emphasized-decelerate)와 같은 곡선.
     out 은 Newton–Raphson 으로 그 베지어를 샘플한다. 카운트업과 페인터가 CSS 와 같은 성질로 앉는다. */
  const bezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sampleX = t => ((ax * t + bx) * t + cx) * t;
    const sampleY = t => ((ay * t + by) * t + cy) * t;
    const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      let t = x;
      for (let i = 0; i < 8; i++) {
        const d = sampleX(t) - x;
        const dx = sampleDX(t);
        if (Math.abs(d) < 1e-6 || Math.abs(dx) < 1e-6) break;
        t = Math.min(1, Math.max(0, t - d / dx));
      }
      return sampleY(t);
    };
  };
  const EASES = {
    linear: x => x,
    out: bezier(0.05, 0.7, 0.1, 1),
    in: x => x * x * x,
    inOut: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  };
  const clamp01 = x => Math.min(Math.max(x, 0), 1);
  const easeOut = EASES.out;
  /* 카운터 전용 곡선 — 등장 곡선(0.05,0.7,0.1,1)은 앞이 너무 가팔라 마지막 정수 단이 시간의
     43% 에서 앉는다(45 는 3.1초 문장의 1.33초에 멈춰 나머지가 정지 화면이었다 — 실측).
     2차 감속은 45 를 89%, 241 을 95% 에 앉혀 문장이 끝날 때까지 숫자가 돈다. */
  const easeCount = x => 1 - (1 - x) * (1 - x);
  window.__ease = (name, x) => (EASES[name] || EASES.out)(clamp01(x));
  /* __interp(x, [in0,in1], [out0,out1], ease) — 구간을 구간으로 옮긴다. 범위 밖은 끝값으로 잘린다. */
  window.__interp = function (x, inR, outR, ease) {
    const p = inR[1] === inR[0] ? 0 : (x - inR[0]) / (inR[1] - inR[0]);
    return outR[0] + (outR[1] - outR[0]) * window.__ease(ease || "out", p);
  };
  const cssMs = name => parseFloat(getComputedStyle(root).getPropertyValue(name)) || 0;
  const HOLD = cssMs("--hold"), COUNT = cssMs("--count");
  const fmt = (v, dec) => (dec > 0 ? v.toFixed(dec) : Math.round(v).toString()).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const owner = a => a.effect && a.effect.target && a.effect.target.closest("[data-rg]");
  /* 애니메이션의 끝 시각 — iteration-count·delay 를 다 넣은 계산값 (무한이면 Infinity) */
  const endOf = a => a.effect.getComputedTiming().endTime;
  /* 카운터의 시작 시차 — 여는 사슬이면 그룹 요소의 data-lead(--lead 의 배수)만큼 뒤에 세기 시작한다.
     CSS 애니메이션의 --lead-in 과 같은 값이라 사슬의 다른 요소와 어긋나지 않는다. computed style 로
     읽지 않는 이유: var() 가 치환된 뒤라 배수를 되짚을 수 없다. */
  const LEAD = cssMs("--lead");
  const counters = [...document.querySelectorAll("[data-count]")].map(el => {
    const g = el.closest("[data-rg]");
    const c = { el, rg: +g.dataset.rg, to: +el.dataset.count, from: +el.dataset.from || 0,
      dec: +el.dataset.dec || 0, dur: +el.dataset.dur || COUNT, lead: (+g.dataset.lead || 0) * LEAD };
    /* 상자의 본은 더 긴 쪽의 최종 문자열이다 — 쉼표 자리까지 그대로 본떠야 999 → 1,000 을 넘는
       순간에도 상자 폭이 안 변한다(정폭 셀 .6em 과 쉼표 셀 .28em 이 다르기 때문) */
    const a = fmt(c.to, c.dec), b = fmt(c.from, c.dec);
    c.tpl = a.length >= b.length ? a : b;
    return c;
  });
  /* 숫자 → 고정폭 셀. 본(tpl)의 앞자리를 빈 셀로 따라 그려 상자가 첫 프레임부터 같은 크기다 */
  const cellOf = ch => /[0-9]/.test(ch) ? "<i>" + ch + "</i>" : '<i class="s">' + ch + "</i>";
  const cells = (s, tpl) => {
    const pad = Math.max(0, tpl.length - s.length);
    let out = "";
    for (let i = 0; i < pad; i++) out += /[0-9]/.test(tpl[i]) ? "<i></i>" : '<i class="s"></i>';
    for (const ch of s) out += cellOf(ch);
    return out;
  };

  /* ── 지속 층 — 렌더러가 __setSegs 로 나레이션 세그먼트 길이(ms)를 넘긴다. 그룹 요소의
     --seg-d 에 들어가 CSS 의 animation-duration:var(--seg-d,…) 가 읽고, .sv 안의 카운트업은
     dur 자체가 늘어난다(시차만큼 뺀다). 값이 (g, t) 밖에서 오지만 렌더 시작 때 한 번 정해지는
     상수라 같은 (g, t) 는 여전히 같은 그림이다. */
  window.__setSegs = function (map) {
    for (const el of document.querySelectorAll("[data-rg]")) {
      const ms = map[+el.dataset.rg];
      if (ms > 0) el.style.setProperty("--seg-d", Math.round(ms) + "ms");
    }
    for (const c of counters) {
      const ms = map[c.rg];
      if (ms > 0 && c.el.closest(".sv")) c.dur = Math.max(400, Math.round(ms) - c.lead);
    }
  };

  /* ── 포커스 시프트 — .dim 그룹은 다음 그룹이 들어오는 동안 muted 급으로 내려앉는다.
     애니메이션이 아니라 __seek 이 (g, t) 만으로 계산해 인라인 opacity 로 적는다 — 대상이
     .dw 래퍼(rv 헬퍼가 만든다)라 rv 자신의 fade 애니메이션과 부딪히지 않는다. 파라미터
     없이 연 미리보기(전체 쉬는 상태)는 마지막 그룹까지 내려앉아 보이는데, 실제 영상의
     끝 프레임(클립 N)에는 없는 상태다 — 버그가 아니다. */
  const DIM_TO = 0.55, DIM_MS = 480;
  const dimTargets = [...document.querySelectorAll(".rv.dim")].map(el => ({
    el: el.querySelector(":scope > .dw") || el, rg: +el.dataset.rg }));

  /* ── 페인터 — 캔버스·SVG 처럼 CSS 키프레임으로 그릴 수 없는 그림을 시각 t 의 함수로 그린다.
     카운트업이 이미 이 모양이고(counters 는 t 를 받아 숫자를 다시 쓴다) 페인터는 그 일반형이다.
     등록  __paint(rg, durMs, fn) — fn(tMs) 는 그룹 rg 의 로컬 시각을 받아 그 시각의 그림을 그린다.
     계약  fn 은 t 말고 아무것도 읽지 않는다. 시계·난수·이전 호출의 상태를 읽으면 같은 (g, t) 가
           다른 픽셀을 내고 결정성이 깨진다. 렌더러는 프레임을 순서대로 찍지 않는다(--sheet 는
           중간과 끝만 찍는다) — fn(500) 이 fn(0) 뒤에 온다고 가정하면 안 된다.
     쓰는 자리  회전·궤적·입자처럼 키프레임으로 못 세우는 도해. 글자·막대·카운트업은 CSS 로 둔다. */
  const painters = [];
  /* __seek 이 캡처 중에 만난 '그룹 밖 애니메이션'의 누적 수. 페인터가 [data-rg] 바깥에 노드를
     붙이거나 중간 t 에만 존재하는 노드를 만들면 __meta() 의 한 번짜리 표본에는 안 잡힌다 —
     렌더러가 캡처를 마친 뒤 __meta().stray 를 다시 읽어 이 값으로 exit 1 한다. */
  let strayHits = 0;
  window.__paint = function (rg, durMs, fn) {
    painters.push({ rg: +rg, dur: Math.max(0, +durMs || 0), fn: fn });
  };

  /* ── 비디오 — 그룹의 로컬 시각으로 currentTime 을 세우고 seeked 를 기다린다. data-rg 는 요소가
     직접 들고(조상 상속이 아니다), data-vfrom(ms, 기본 0)이 클립 안 시작점, data-vdur(ms)이 그룹
     안에서 재생할 길이다. 둘 다 밀리초다. autoplay·loop·재생 중인 영상은 벽시계로 도는 길이라
     __meta 가 stray 로 잡는다. */
  const videos = () => [...document.querySelectorAll("video")];
  const seekVideo = (v, tMs) => new Promise(res => {
    const want = ((+v.dataset.vfrom || 0) + tMs) / 1000;
    if (v.readyState >= 2 && Math.abs(v.currentTime - want) < 1e-4) return res(true);
    const done = () => { v.removeEventListener("seeked", done); res(true); };
    v.addEventListener("seeked", done);
    v.currentTime = want;
  });

  /* CSS 배경 이미지 — document.images 에 안 잡히므로 따로 훑는다. 경로가 틀리면 그 자리만 빈 채로
     렌더가 끝까지 돌던 구멍이다(리뷰 medium 8). data: URL 은 파일이 아니라 건너뛴다. */
  const bgBroken = [];
  const bgUrls = () => {
    const out = new Set();
    for (const el of document.querySelectorAll("*"))
      for (const pseudo of [null, "::before", "::after"]) {
        const bg = getComputedStyle(el, pseudo).backgroundImage;
        if (!bg || bg === "none") continue;
        /* data: URL 은 파일이 아니라 통째로 걷어낸다 — 그레인 타일 SVG 안의 url(%23g) 는 문서 안 참조다 */
        const files = bg.replace(/url\(\s*(["'])data:(?:\\.|(?!\1)[^\\])*\1\s*\)/gi, "");
        for (const m of files.matchAll(/url\(\s*["']?([^"')]+)/g)) out.add(m[1]);
      }
    return [...out];
  };

  /* 첫 프레임을 찍기 전에 렌더러가 한 번 부른다 — 폰트·이미지 디코드·비디오 첫 프레임이 다 서야
     같은 (g, t) 가 같은 픽셀이다. 이미지는 로드만으로는 부족하고 decode() 까지 끝나야 한다.
     못 읽는 소재는 여기서 기다리지 않고 통과시킨다 — 오타 난 src 하나가 렌더러를 30초 매달아
     놓는 대신, __meta().broken 이 그 파일을 이름과 함께 렌더러에 넘겨 exit 1 로 세운다. */
  window.__ready = function () {
    const imgs = [...document.images].map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
    const vids = videos().map(v => {
      if (v.readyState >= 2 || v.error) return Promise.resolve();
      if (!v.getAttribute("src") && !v.currentSrc) return Promise.resolve();
      return new Promise(res => {
        v.addEventListener("loadeddata", res, { once: true });
        v.addEventListener("error", res, { once: true });
      });
    });
    const bgs = bgUrls().map(u => new Promise(res => {
      const im = new Image();
      im.onload = () => res();
      im.onerror = () => { bgBroken.push(u); res(); };
      im.src = u;
    }));
    return Promise.all([document.fonts.ready, ...imgs, ...vids, ...bgs]).then(() => true);
  };

  window.__seek = function (tMs, g) {
    /* 카운터와 페인터가 먼저다 — 둘 다 innerHTML 로 DOM 을 다시 만들고, 새로 붙은 노드에 CSS
       애니메이션이 걸려 있으면 그 순간 벽시계로 돌기 시작한다. 애니메이션 스냅샷을 이 뒤로
       미뤄야 그것까지 pause 된다. 순서를 되돌리면 짧은 애니메이션에서 재렌더가 갈라진다
       (실측: 90ms 슬라이드인에서 81프레임 중 13프레임이 두 렌더 사이에 달랐다). */
    for (const c of counters) {
      const p = c.rg < g ? 1 : c.rg === g ? easeCount(clamp01((tMs - c.lead) / c.dur)) : 0;
      c.el.innerHTML = cells(fmt(c.from + (c.to - c.from) * p, c.dec), c.tpl);
    }
    for (const p of painters) p.fn(p.rg < g ? p.dur : p.rg === g ? Math.min(Math.max(tMs, 0), p.dur) : 0);
    for (const d of dimTargets) {
      const v = d.rg >= g ? 1 : d.rg === g - 1 ? 1 - (1 - DIM_TO) * easeOut(clamp01(tMs / DIM_MS)) : DIM_TO;
      d.el.style.opacity = v >= 1 ? "" : v.toFixed(4);
    }
    const anims = document.getAnimations();
    for (const a of anims) {
      const o = owner(a);
      /* 그룹 밖 애니메이션도 일단 세운다 — 벽시계로 두면 캡처 지연이 그대로 프레임에 새어
         같은 (g, t) 가 다른 픽셀을 낸다(실측 PSNR 22.3dB). 세워 둔 뒤 세어서 렌더러가 알린다. */
      if (!o) { strayHits++; a.pause(); a.currentTime = 0; continue; }
      const r = +o.dataset.rg, end = endOf(a);
      a.pause();
      a.currentTime = r < g ? end : r === g ? Math.min(Math.max(tMs, 0), end) : 0;
    }
    const media = videos().filter(v => v.dataset.rg !== undefined).map(v => {
      const r = +v.dataset.rg, d = +v.dataset.vdur || 0;
      return seekVideo(v, r < g ? d : r === g ? Math.min(Math.max(tMs, 0), d) : 0);
    });
    /* transform·opacity 애니메이션은 컴포지터 스레드에서 돌아 pause()·currentTime 이 비동기로
       반영된다 — ready 를 기다리지 않고 찍으면 같은 (g, t) 가 서브픽셀만큼 다른 프레임을 낸다
       (실측 PSNR 79dB 차이). 렌더러는 이 프라미스를 기다린 뒤 캡처한다. */
    return Promise.all([...anims.map(a => a.ready), ...media]).then(() => true);
  };
  window.__groups = function () {
    const dur = {};
    for (const a of document.getAnimations()) { const o = owner(a); if (!o) continue;
      const r = +o.dataset.rg; dur[r] = Math.max(dur[r] || 0, endOf(a)); }
    for (const c of counters) dur[c.rg] = Math.max(dur[c.rg] || 0, c.dur + c.lead);
    for (const p of painters) dur[p.rg] = Math.max(dur[p.rg] || 0, p.dur);
    for (const v of videos()) { if (v.dataset.rg === undefined) continue;
      const r = +v.dataset.rg; dur[r] = Math.max(dur[r] || 0, +v.dataset.vdur || 0); }
    const n = Math.max(0, ...Object.keys(dur).map(Number));
    const out = [];
    for (let r = 0; r <= n; r++) out.push({ rg: r, dur: r === 0 ? 0 : Math.round((dur[r] || 0) + HOLD) });
    return out;
  };
  /* 렌더러가 계약을 검사하는 데 쓴다 — 그룹 밖에서 도는 것(stray)은 벽시계를 타고 결정성을 깨고
     무한 반복(infinite)은 클립이 끝나지 않는다. 둘 다 렌더러가 exit 1 로 막는다. 비디오는 data-rg
     가 없거나 autoplay·loop 가 붙어 있으면 stray 다 — seek 가 아니라 재생으로 움직인다는 뜻이다. */
  window.__meta = function () {
    const all = document.getAnimations();
    const strayVideo = videos().filter(v => v.dataset.rg === undefined || v.autoplay || v.loop || !v.paused).length;
    /* 못 읽은 소재 — 오타 난 경로, 디코더가 없는 코덱(HEVC), 빈 파일. __ready() 뒤에 읽어야
       뜻이 있다. 이름을 그대로 넘겨 렌더러가 어느 파일인지 말할 수 있게 한다. */
    const broken = videos().filter(v => v.error || (v.dataset.rg !== undefined && !v.getAttribute("src") && !v.currentSrc))
      .map(v => v.getAttribute("src") || "(video[data-rg] with no src)")
      .concat([...document.images].filter(i => !i.naturalWidth).map(i => i.getAttribute("src") || "(no src)"))
      .concat(bgBroken);
    return { hold: HOLD, broken: broken,
             stray: all.filter(a => !owner(a)).length + strayVideo + strayHits,
             infinite: all.filter(a => owner(a) && !isFinite(endOf(a))).length
                     + painters.filter(p => !isFinite(p.dur)).length };
  };
  window.__size = () => ({ w: parseInt(getComputedStyle(root).getPropertyValue("--w"), 10),
                           h: parseInt(getComputedStyle(root).getPropertyValue("--h"), 10) });

  /* URL 이 가리키는 상태로 세운다. 렌더러는 이걸 거치지 않고 __seek 을 직접 부르지만, 사람이
     브라우저로 슬라이드를 열어 볼 때는 이 한 줄이 첫 화면을 정한다. 페인터를 뒤에서 등록한
     저작 코드는 등록을 마치고 __boot() 을 한 번 더 불러 첫 화면을 다시 세운다. */
  window.__boot = function () {
    const qs = new URLSearchParams(location.search);
    const N = window.__groups().length - 1;
    if (qs.has("g"))           return window.__seek(parseFloat(qs.get("t") || "0"), parseInt(qs.get("g"), 10));
    if (qs.has("reveal"))      return window.__seek(0, parseInt(qs.get("reveal"), 10) + 1);
    return window.__seek(1e9, N + 1);
  };
  window.__boot();
  /* SEEK-RUNTIME-END */
})();
</script>
</body>
</html>
