      h += '<div class="f-band">' + esc(T.recordedScreen) + '</div><div class="f-top">';
      if (s.kicker) h += '<div class="f-kicker">' + esc(s.kicker) + "</div>";
      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.type === "cover" && s.stat)
        h += '<div class="f-statrow"><div class="f-stat f-em">' + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "cover") {
      // In illustration (light) mode the cover anchors to the top — the body.light branch in video-template.html
      h += '<div class="fzone' + (light ? " top" : "") + '">';
      if (s.kicker) h += '<div class="f-kicker">' + esc(s.kicker) + "</div>";
      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.stat)
        h += '<div class="f-statwrap' + (idx < 1 ? " fhide" : "") + '"><div class="f-stat f-em"' +
             (statScale ? ' style="--stat-fs:' + statScale.toFixed(5) + '"' : "") +
             ">" + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "points") {
      // A landscape shooting scene uses the lower third (bottom left of the zone) — the same spot as .zone.l3 in video-template.
      h += '<div class="fzone ' + (recOf(s) ? "l3" : "top") + '"><div class="f-ptitle">' + femph(s.title || "") + "</div>";
      var caps = s.bullets || [];
      if (caps.length) {
        // Captions stack on the same spot and only the active one is visible (caption swap)
        h += '<div class="f-capstack">' + caps.map(function (b, k) {
          return '<div class="f-cap' + (k === st.cap ? "" : " fhide") + '"><div class="t">' + femph(b.t) + "</div>" +
                 (b.d ? '<div class="d">' + esc(b.d) + "</div>" : "") + "</div>"; }).join("") + "</div>";
      }
      if (s.footnote) h += '<div class="f-foot">' + esc(s.footnote) + "</div>";
      h += "</div>";
    } else if (s.type === "quote") {
      // When a speech clip is planned, produce captures with alpha — only the signature goes
      // on screen and the narration and subtitles say the quote (the capture table in the
      // produce SKILL · scenes-schema §quote). Without a clip it becomes a still quote card
      // (signature + quote + full wash).
      h += '<div class="f-sign"><div class="nm">' + esc(s.speaker || "") + "</div>" +
           '<div class="rl">' + esc(s.role || "").replace(/AI/g, '<span class="ai">AI</span>') + "</div></div>";
      h += hasClip
        ? '<div class="f-band f-band-clip">speech clip · signature only</div>'
        : '<div class="fzone center"><div class="f-quote' + (idx < 1 ? " fhide" : "") + '">' +
          femph(s.text || "") + "</div></div>";
    } else if (s.type === "outro") {
      h += '<div class="fzone center"><div class="f-obrand f-em">' + esc(THEME.brand || "") + "</div>" +
           '<div class="f-otitle">' + femph(s.title || "") + "</div>" +
           (s.sub ? '<div class="f-osub">' + esc(s.sub) + "</div>" : "") + "</div>";
    }

    if (seg && seg.sub) h += '<div class="f-sub">' + esc(seg.sub) + "</div>";
    h += '<div class="fsafe"></div></div>';
    return h;
  }

  /* ── Measuring frame overflow ──
     Draws on the same 1080px canvas as the produce renderer (video-template.html /
     screencast-overlay.html), measures whether text escapes the zone, and shrinks it through
     the same tight1~3 steps. If three steps still are not enough it warns with the leftover
     px — this is where clipped text gets caught before production. */
  var probe = document.createElement("div");
  probe.id = "fr-probe";
  if (WIDE) probe.style.setProperty("--fw", "1920px");
  document.body.appendChild(probe);
  var fit = {};
  SCENES.forEach(function (s, i) {
    if (s.type === "broll") return;
    revealsOf(s).forEach(function (st, k) {
      probe.innerHTML = frame(s, st, k, 0);
      var fr = probe.firstChild;
      var box = fr.querySelector(recTall(s) ? ".f-top" : ".fzone");
      // How it measures also follows produce — generated mode uses the zone's scrollHeight,
      // shooting mode whether the block's bottom crosses y=460 (BAND_MIN_Y). Using
      // scrollHeight in shooting mode shrinks a step too early because of the glyph box on a
      // line-height:1 stat, and raises a false warning.
      var REC_LIMIT = 460;
      function over() {
        if (!box) return 0;
        return recTall(s)
          ? box.getBoundingClientRect().bottom - fr.getBoundingClientRect().top - REC_LIMIT
          : box.scrollHeight - box.clientHeight;
      }
      // tight steps accumulate — replacing one sends the rules the lower step lacks back to their defaults
      var tier = 0;
      while (over() > 1 && tier < 3) { tier += 1; fr.classList.add("tight" + tier); }

      // The width guard measures on the font left after the step shrink (the execution order in video-template.html)
      var statPx = 0, statOvf = 0;
      var stat = !recOf(s) && s.type === "cover" ? fr.querySelector(".f-stat") : null;
      if (stat) {
        var size = parseFloat(getComputedStyle(stat).fontSize), guard = 0;
        while (stat.getBoundingClientRect().width > 640 && size > 80 && guard < 40) {
          size -= 6; stat.style.fontSize = size + "px"; guard += 1;
        }
        statPx = size;
        statOvf = Math.round(Math.max(0, stat.getBoundingClientRect().width - 640));
      }
      fit[i + ":" + k] = {
        tier: tier, ovf: Math.max(0, Math.round(over())),
        // Font px at 1080 → ratio of the frame width. The panel gets the same shrink.
        statScale: statPx ? statPx / 1080 : 0, statOvf: statOvf
      };
    });
  });
  probe.innerHTML = "";

  /* ── Per-scene check badges ── */
  function sceneCheck(s, no) {
    var narr = s.narration || [];
    var syl = narr.reduce(function (a, n) { return a + netLen(n.tts); }, 0);
    var rate = s.duration ? syl / s.duration : 0;
    var maxSent = narr.reduce(function (a, n) { return Math.max(a, netLen(n.tts)); }, 0);
    var chips = [badge("", T.sec(s.duration || "?"))];
    if (recOf(s)) {
      if (syl) {
        chips.push(badge("", T.chars(syl)));
        var rOk = rate >= 4.5 && rate <= 6.5;
        chips.push(badge(rOk ? "ok" : "warn", T.charsPerSec(rate.toFixed(2))));
        if (!rOk) flag("warn", T.shotCap(no), "speech rate " + rate.toFixed(2) + " chars/s — the shooting standard is 5~6 chars/s (4.5~6.5 allowed)");
      }
      // The long-form shooting lane has no scene cap (recSceneMax: null) — one continuous
      // recording arriving as one scene is the normal path, and a cap would force the user to
      // chop up a natural take.
      if (FMT.recSceneMax !== null && s.duration > FMT.recSceneMax) {
        chips.push(badge("bad", T.overSec(FMT.recSceneMax)));
        flag("bad", T.shotCap(no), "length " + s.duration + "s — the shooting-mode scene cap is " + FMT.recSceneMax + "s");
      } else if (s.duration && s.duration < 8) {
        chips.push(badge("warn", T.underEightSec));
        flag("warn", T.shotCap(no), "length " + s.duration + "s — shooting-mode scenes target 8s or more");
      }
      if (maxSent > 40) { chips.push(badge("warn", T.oneSentenceChars(maxSent))); flag("warn", T.shotCap(no), T.recSentLong(maxSent)); }

      /* Shooting-scene contract (scenes-schema §filmed scenes) — all three fields have to be
         there for the user to know what to film and for produce to find the file. Discovering
         one is empty after approval means starting the shoot over. */
      var vz = s.visual || {};
      if (!vz.clip) {
        chips.push(badge("bad", T.noClip));
        flag("bad", T.shotCap(no), "a shooting scene with no visual.clip (filename) — the user has nowhere to save it");
      } else if (!/^footage\/s\d+-[a-z0-9-]+\.(mp4|mov|m4v)$/.test(vz.clip)) {
        chips.push(badge("warn", T.clipNaming));
        flag("warn", T.shotCap(no), "clip \"" + vz.clip + "\" — the convention is footage/s<scene number>-<slug>.mp4");
      }
      if (!vz.shot) flag("bad", T.shotCap(no), "a shooting scene with no visual.shot (what is on screen)");
      if (!vz.action) flag("bad", T.shotCap(no), "a shooting scene with no visual.action (what the user does)");
      // On an all-live-voice episode (window.VOICE === "user") a filmed scene fills narration too —
      // those segments are lines to speak, not a TTS script (scenes-schema §all-live-voice episodes).
      chips.push(badge("", narr.length ? (window.VOICE === "user" ? T.linesToSpeak : T.narrationOver) : T.speaksLive));
    } else if (s.type !== "broll" && s.type !== "outro") {
      /* Slide-scene contract (scenes-schema §slide scenes) — the filename, the plan and the
         motion:true marker are what get approved; produce §3.6 builds the file after approval.
         Coexisting with bg is a contradiction (there is only one screen). */
      var sl = s.visual && s.visual.slide;
      if (sl) {
        chips.push(badge("", T.slide));
        /* 저작 화면의 갈래 (scenes-schema §the authored-screen lane). 파일이 아직 없는
           승인 시점에 볼 수 있는 것은 scenes.js 쪽 계약뿐이다 — check-slide.js 는 produce §3.6 에서
           파일을 보고 같은 것을 다시 본다. */
        var KINDS = ["diagram", "kinetic", "character"];
        var ACT_NAMES = ["enter", "point", "nod", "shrug", "think", "wave", "cheer"];
        var kind = sl.kind || "diagram";
        if (sl.motion !== true) {
          chips.push(badge("bad", T.kindMotion));
          flag("bad", T.shotCap(no), "visual.slide has no motion:true — a still slide is not allowed");
        }
        if (KINDS.indexOf(kind) === -1) {
          chips.push(badge("bad", T.kindBad));
          flag("bad", T.shotCap(no), 'slide.kind "' + kind + '" is outside ' + KINDS.join(" · "));
        } else if (kind !== "diagram") {
          chips.push(badge("", kind));
          if (kind === "character") {
            var acts = sl.acts;
            if (!Array.isArray(acts) || !acts.length) {
              chips.push(badge("bad", T.actsBad));
              flag("bad", T.shotCap(no), 'kind:"character" with no visual.slide.acts — one action per narration segment');
            } else {
              var badActs = acts.filter(function (a) { return ACT_NAMES.indexOf(a) === -1; });
              var segs = (s.narration || []).length;
              if (badActs.length) {
                chips.push(badge("bad", T.actsBad));
                flag("bad", T.shotCap(no), 'act "' + badActs.join('", "') + '" is outside ' + ACT_NAMES.join(" · "));
              } else if (segs && acts.length < segs) {
                chips.push(badge("bad", T.actsBad));
                flag("bad", T.shotCap(no), acts.length + " acts against " + segs + " narration segments — one act per segment");
              }
            }
          }
        }
        if (!sl.plan) {
          chips.push(badge("bad", T.noPlan));
          flag("bad", T.shotCap(no), "a slide scene with no slide.plan (what to draw) — approval reads this plan");
        }
        if (!sl.file) {
          chips.push(badge("bad", T.noFile));
          flag("bad", T.shotCap(no), "a slide scene with no slide.file");
        } else if (!new RegExp("^slides/s" + no + "-[a-z0-9-]+\\.html$").test(sl.file)) {
          chips.push(badge("warn", T.fileNaming));
          flag("warn", T.shotCap(no), 'slide.file "' + sl.file + '" — the convention is slides/s' + no + "-<slug>.html (shot number = array position)");
        }
        if (s.visual.bg)
          flag("warn", T.shotCap(no), "a slide scene also carrying bg — the screen is the slide alone");
      }
      var cap = s.type === "cover" ? FMT.capCover : FMT.capBody;
      if (narr.length) {
        chips.push(badge(syl <= cap ? "ok" : "bad", T.charsOfCap(syl, cap)));
        if (syl > cap) flag("bad", T.shotCap(no), "narration " + syl + " chars — cap " + cap + " (" + s.type + ")");
      } else if (s.type === "quote" && s.visual && s.visual.clip) {
        // Only a speech-clip quote is exempt — the actor speaks, so having no TTS narration is
        // normal. A still quote card with no clip has no sound at all, so it drops to the
        // violation branch below.
        chips.push(badge("", T.speechClip));
      } else if (s.type === "cover" && s.visual && s.visual.video) {
        // A video cover is exempt too — that stretch uses the audio the clip carries (the same
        // behavior as absolute rule 9). A still-background cover with empty narration drops to
        // the violation branch below.
        chips.push(badge("", T.clipAudio));
      } else {
        chips.push(badge("bad", T.noNarration));
        flag("bad", T.shotCap(no), "narration is empty — it holds " + (s.duration || "?") + " seconds with no sound");
      }
      var sentBand = T.charBand(FMT.sentMin, FMT.sentMax);
      var shortSent = narr.some(function (n) { return netLen(n.tts) < FMT.sentMin; });
      if (maxSent > FMT.sentMax || shortSent) {
        chips.push(badge("warn", T.sentence(sentBand)));
        flag("warn", T.shotCap(no), T.sentBandFlag(maxSent > FMT.sentMax, maxSent, FMT.sentMin, sentBand));
      }
      if (s.duration > FMT.sceneMax) {
        chips.push(badge("warn", T.overSec(FMT.sceneMax)));
        flag("warn", T.shotCap(no), "length " + s.duration + "s — the generated-mode scene cap is " + FMT.sceneMax + "s");
      }
      // Motion-background scene contract (scenes-schema §motion background) — the cut badge (vtag) carries the type
      if (s.visual && s.visual.video) {
        // cover is an exception that opens only when the user asks for it on that episode
        // (scenes-schema §motion background). Text still has to be a code-rendered overlay, so
        // this also watches for text handed off to the generated video.
        if (s.type !== "points" && s.type !== "cover")
          flag("bad", T.shotCap(no), "a motion background (visual.video) is points-only — it cannot be used on " + s.type);
        // One scene = one call, so the routed engine's server-validated range caps the scene
        // (scenes-schema §clip prompt). The default route 1.5 pro takes 4–12s — the old 15s
        // figure was Seedance 2.0's. Veo is fixed at 8. The real danger is a clip shorter
        // than its scene: it loops, and the loop shows its seam.
        var mbCap = engineOf(s) === "veo" ? 8 : 12;
        if (s.duration > mbCap)
          flag("warn", T.shotCap(no), "motion background " + s.duration + "s — past the " + engineOf(s) +
               " route's one-call cap (" + mbCap + "s; server-validated), so the clip loops and the seam shows. Trim the narration, split the scene, or route to a model that takes it");
        if (narr.some(function (n) { return n.img; }))
          flag("bad", T.shotCap(no), "motion background together with per-line illustrations — swapping the background per segment cannot work (scenes-schema)");
      }
    }
    if (!(s.duration > 0) && s.type !== "outro")
      flag("bad", T.shotCap(no), "duration is " + (s.duration === undefined ? "missing" : s.duration + "s") + " — write it as a positive number of seconds");
    narr.forEach(function (n, j) {
      if (!n.tts) flag("bad", T.shotCap(no), "line " + (j + 1) + " has no tts — the sentence to read out is empty");
    });
    if (s.type === "broll") {
      // b-roll uses the audio the video carries — laying TTS on top makes two sounds fight
      if (narr.length) flag("bad", T.shotCap(no), "b-roll carries narration (" + narr.length + ") — it has to be empty");
      if (s.duration > 8) flag("bad", T.shotCap(no), "b-roll used for " + s.duration + "s — generation is fixed at 8s, so anything past that is unusable");
      var af = s.after || 0;
      if (!SCENES[af] || SCENES[af].type === "broll")
        flag("bad", T.shotCap(no), "after: " + af + " points at no scene — the insert position cannot be resolved");
      // The source is the photo the previous scene showed as a still — that still is what starts moving
      var src = (s.visual || {}).src;
      var base = SCENES[af] && SCENES[af].visual ? SCENES[af].visual.bg : null;
      if (src && base && src !== base)
        flag("warn", T.shotCap(no), "the b-roll src differs from scene " + (af + 1) + "'s background (" + base + ")");
    } else {
      var worst = 0, ovf = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (!f) return;
        if (f.tier > worst) worst = f.tier;
        if (f.ovf > ovf) ovf = f.ovf;
      });
      var swide = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (f && f.statOvf > swide) swide = f.statOvf;
      });
      if (swide > 0) {
        chips.push(badge("bad", T.statTooWide));
        flag("bad", T.shotCap(no), "even at minimum size the hero stat exceeds the safe zone by " + swide + "px — switch to a shorter notation");
      }
      // Whether the screen text overlaps the sound (scenes-schema §screen text only when needed,
      // 2026-08-14). Caption k appears together with segment k+1 — if that line contains the
      // caption wording verbatim, the same words arrive twice, by eye and by ear. The subtitle
      // is already writing that sentence out.
      // To see past differences in particles and endings, only Hangul and alphanumerics are kept
      // for the comparison, and short fragments (under 4 characters) are not counted.
      // Burn-in formats only — long-form (burn:false) doesn't burn subtitles, so for a viewer who
      // never turns them on the caption is the only place that value lands. Over-detection
      // measured 2026-08-18 (captions with zero correlation).
      if (FMT.burn) (function () {
        var norm = function (t) { return String(t || "").replace(LETTERS_RE, ""); };
        var narr = s.narration || [], dup = [];
        (s.bullets || []).forEach(function (b, bi) {
          var seg = narr[bi + 1];                       // caption k ← segment k+1
          if (!seg) return;
          var said = norm(seg.sub || seg.tts);
          [b.t, b.d].forEach(function (cap) {
            var c = norm(cap);
            if (c.length >= 4 && said.indexOf(c) !== -1) dup.push(cap);
          });
        });
        if (dup.length) {
          chips.push(badge("warn", T.overlapsAudio(dup.length)));
          flag("warn", T.shotCap(no), "the caption sits in the line verbatim — " + dup.join(" · ") +
               ". The screen does not rewrite what the audio just said (empty the caption if it is not needed)");
        }
      })();
      if (ovf > 0) {
        chips.push(badge("bad", T.overflows));
        flag("bad", T.shotCap(no), "screen text still overflows by " + ovf + "px after the 3-step shrink — cut the title or the captions");
      } else if (worst) {
        chips.push(badge("warn", T.autoShrink(worst)));
        flag("warn", T.shotCap(no), "screen text escapes the zone, so the renderer shrinks it by " + worst + " step(s)");
      }
    }
    return chips.join("");
  }

  /* ══ Header ══ */
  var h = "";
  /* In the contract table the word is followed by the scenes.js key it came from. In English
     some words are the key, so printing both says it twice. */
  function withKey(word, key) {
    return word === key ? esc(word) : esc(word) + " (<code>" + esc(key) + "</code>)";
  }
  h += "<header>";
  h += '<div class="doc-kicker">' + esc(DOC.channelName || DOC.channel || THEME.brand) +
       (DOC.series ? " · " + esc(DOC.series) : "") + "</div>";
  h += '<h1 class="doc-title">' + esc(DOC.displayTitle || DOC.topic || "") + "</h1>";

  var lenCls = total >= FMT.totalMin && total <= FMT.totalMax ? "ok"
             : total <= FMT.totalHard ? "warn" : "bad";
  var lenBand = durTxt(FMT.totalMin) + "~" + durTxt(FMT.totalMax);
  if (lenCls === "bad")
    flag("bad", T.where.length, "main body " + durTxt(total) + " — past the cap of " + durTxt(FMT.totalHard));
  else if (lenCls === "warn")
    flag("warn", T.where.length, "main body " + durTxt(total) + " — outside the default " + lenBand +
         " (going over needs a design reason; cap " + durTxt(FMT.totalHard) + ")");

  // Shot count has a format band too — a long-form built on short-form shot counts stretches
  // single scenes out to minutes.
  if (main.length < FMT.sceneCountMin || main.length > FMT.sceneCountMax)
    flag("warn", T.where.shotCount, "main body " + main.length + " shots — the " + (T.fmt[FMT_KEY] || FMT.label) + " band is " +
         FMT.sceneCountMin + "~" + FMT.sceneCountMax + " shots");

  // The one-question contract and authored-frame budget. check-scenes.js is the hard gate;
  // this copy gives the person opening the file the same verdict before approval.
  var COMP = window.COMPREHENSION;
  var isShortForm = FMT_KEY !== "youtube-long-16x9";
  if (!COMP || typeof COMP !== "object") {
    flag("bad", T.where.comprehension, "window.COMPREHENSION missing — write one question, answer, takeaway, branches, and term introductions");
  } else {
    ["question", "answer", "takeaway"].forEach(function (field) {
      if (!String(COMP[field] || "").trim()) flag("bad", T.where.comprehension, field + " is empty");
    });
    var branchCap = isShortForm ? (COMP.mode === "narrative" ? 1 : 0) : 4;
    if (!Array.isArray(COMP.branches)) flag("bad", T.where.comprehension, "branches must be an array");
    else if (COMP.branches.length > branchCap)
      flag("bad", T.where.comprehension, COMP.branches.length + " cross-scene branches — cap " + branchCap);
    if (!Array.isArray(COMP.terms)) flag("bad", T.where.comprehension, "terms must be an array");
    else if (isShortForm && COMP.terms.length > 3)
      flag("bad", T.where.comprehension, COMP.terms.length + " unfamiliar terms — short-form cap 3");

    // No editorial-cut band here — check-scenes.js dropped the 1–3 count on 2026-09-03, and since
    // 2026-09-05 every timeline · statistic · principle beat is an editorial slide outside any cap.
  }

  SCENES.forEach(function (s, i) {
    var v = (s && s.visual) || {}, sl = v.slide;
    var infoType = s && s.shot && s.shot.infoType;
    var infoTypes = ["other", "timeline", "statistic", "principle"];
    var infoRole = { timeline: "timeline", statistic: "statistic", principle: "mechanism" };
    var infoPrimitives = {
      timeline: ["date-enter", "range-grow", "event-link", "object-move"],
      statistic: ["count-up", "bar-grow", "dot-fill", "axis-draw", "object-move"],
      principle: ["flow-trace", "node-enter", "state-transform", "shape-enter", "shape-draw", "shape-travel", "object-move"]
    };
    if (s.type !== "broll" && s.type !== "outro") {
      if (infoTypes.indexOf(infoType) < 0)
        flag("bad", T.shotCap(i + 1), "shot.infoType must be other, timeline, statistic, or principle");
      if (infoRole[infoType]) {
        if (!sl || (sl.kind || "diagram") !== "diagram" || sl.motion !== true || sl.treatment !== "editorial")
          flag("bad", T.shotCap(i + 1), infoType + " must be a full-frame moving editorial HTML diagram");
        else if (sl.role !== infoRole[infoType])
          flag("bad", T.shotCap(i + 1), infoType + " needs slide.role " + infoRole[infoType]);
        var beats = (sl && sl.motionBeats) || [];
        var segs = s.narration || [];
        for (var group = 1; group <= segs.length; group++) {
          var matches = beats.filter(function (b) { return b && Number(b.group) === group; });
          if (matches.length !== 1 || infoPrimitives[infoType].indexOf(matches[0] && matches[0].primitive) < 0)
            flag("bad", T.shotCap(i + 1), infoType + " needs one valid motionBeats primitive for narration group " + group);
        }
      }
    }
    if (!sl || sl.motion !== true || (sl.kind || "diagram") !== "diagram") return;
    if (sl.treatment === "footage")
      flag("bad", T.shotCap(i + 1), "treatment \"footage\" is retired (owner directive 2026-09-05) — nothing is drawn over video; an explanation cut is an editorial HTML slide on the studio stage, an event or a place is a motion background or b-roll with no marks");
    else if (sl.treatment !== "editorial" && sl.treatment !== "photo-action")
      flag("bad", T.shotCap(i + 1), "moving diagram needs slide.treatment editorial or photo-action");
    if (sl.treatment === "editorial" && (!String(sl.role || "").trim() || !String(sl.motif || "").trim()))
      flag("bad", T.shotCap(i + 1), "editorial frame needs role and episode-wide motif");
    if (sl.treatment === "editorial") {
      if (sl.quality !== "object-state-v1")
        flag("bad", T.shotCap(i + 1), "editorial slide requires quality: object-state-v1");
      var subject = sl.subject || {}, changes = subject.changes;
      var drivers = {object:["geometry","surface","articulation","spatial"], data:["value","relation"], type:["type"]};
      if (!drivers[subject.kind] || !Array.isArray(changes) || changes.length !== (s.narration || []).length)
        flag("bad", T.shotCap(i + 1), "subject needs one before/after change per narration group");
      else changes.forEach(function (change, j) {
        if (!change || change.group !== j + 1 || typeof change.before !== "string" ||
            typeof change.after !== "string" || !change.before.trim() || !change.after.trim() ||
            change.before.trim() === change.after.trim() || drivers[subject.kind].indexOf(change.driver) < 0)
          flag("bad", T.shotCap(i + 1), "invalid subject change in group " + (j + 1));
      });
      if (subject.kind === "object" && !sl.object)
        flag("bad", T.shotCap(i + 1), "physical subject requires a baked object; a moving still is insufficient");
      if (sl.object && subject.kind !== "object")
        flag("bad", T.shotCap(i + 1), "slide.object requires subject.kind object");
    }
    if (sl.treatment === "photo-action" && !String(v.action || "").trim())
      flag("bad", T.shotCap(i + 1), "photo-action frame needs a subject/evidence change in visual.action");
  });

  // Generated-video cap and true-motion coverage. The profile is copied into scenes.js so
  // this file:// review page can enforce the same contract as check-scenes.js.
  var MP = window.MOTION_POLICY || {};
  var policyVideoMax = MP.generatedVideoMax !== null && MP.generatedVideoMax !== undefined &&
                       Number.isFinite(Number(MP.generatedVideoMax))
    ? Number(MP.generatedVideoMax) : FMT.videoMax;
  // Mirrors check-scenes.js generatedVideo. `visual.video.clip` is produce's output record,
  // not a supplied file — a file the user already has is the filmed lane (visual.source).
  function generatedVideo(s) {
    var v = (s && s.visual) || {};
    // The shape decides, not the lane marker — a shot with both is malformed, not filmed.
    return !!(s && (s.type === "broll" || v.video ||
                    (s.type === "quote" && v.clip && typeof v.clip === "object")));
  }
  // Long-form counts b-roll and motion backgrounds only; a short pays for speech clips too.
  var genVid = SCENES.filter(function (s) {
    return generatedVideo(s) && (!WIDE || s.type !== "quote"); }).length;
  if (genVid > policyVideoMax)
    flag("bad", T.where.genVideo, "b-roll, motion backgrounds" + (WIDE ? "" : " and speech clips") +
         " together " + genVid + " shots — cap " + policyVideoMax +
         " (channel motion policy; format default when no override is written)");

  // Short-form body (owner directive 2026-09-05) — the hook is video, one more generated cut
  // writes why, the rest is a still under its camera move or an HTML motion slide. Mirrors
  // check-scenes.js; hook_video: off in the profile (hookVideo:false here) switches it off.
  var hookVideoOn = MP.hookVideo !== false && MP.hookVideo !== "off";
  if (!WIDE && hookVideoOn) {
    var bodyVideo = 0, bodyMax = policyVideoMax - 1;
    // The hook is the first cover shot, as check-scenes.js reads it — a second cover-typed
    // shot is body, so it does not quietly get a free generated cut here.
    var hookIndex = SCENES.findIndex(function (s) { return s && s.type === "cover"; });
    SCENES.forEach(function (s, i) {
      var v = (s && s.visual) || {};
      if (i === hookIndex) {
        var moving = !!(v.video || v.clip || v.source === "recording" ||
                        v.source === "screencast" || v.picture === "recording");
        if (!moving)
          flag("bad", T.shotCap(1), "the hook is a still — on a short the cover is video: a motion background under the code-rendered title (visual.video), or a recording (visual.source)");
      } else if (generatedVideo(s)) {
        bodyVideo++;
        if (!String(v.why || "").trim())
          flag("bad", T.shotCap(i + 1), "a generated cut after the hook with no visual.why — the body of a short is a still under its camera move or an HTML motion slide; write why this cut needs the movement itself");
      }
    });
    if (bodyVideo > bodyMax)
      flag("bad", "episode", bodyVideo + " generated cuts after the hook — a short pays for the hook and at most " + bodyMax + " more (hook_video); every other cut is a still under its camera move or an HTML motion slide");
  }

  function trueMotionKind(s) {
    var v = (s && s.visual) || {};
    if (v.source === "recording" || v.source === "screencast" || v.picture === "recording") return "recording";
    // The ground decides the kind, as in check-scenes.js motionKind: a clip under a
    // motion-slide overlay is video, not a plate.
    if (s && (s.type === "broll" || v.video || v.clip)) return "ai-video";
    if (v.slide && v.slide.motion === true) return "motion-slide";
    return null;
  }
  function motionPlayback() {
    var out = [], broll = [];
    SCENES.forEach(function (s, i) { if (s.type === "broll") broll.push({ s: s, i: i }); });
    SCENES.forEach(function (s, i) {
      if (s.type === "broll" || s.type === "outro") return;
      out.push({ s: s, i: i });
      broll.forEach(function (b) { if (Number(b.s.after) === i) out.push(b); });
    });
    return out;
  }
  function finiteMotionValue(v) {
    return v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v));
  }
  var minMotion = MP.minTrueMotion;
  var motionActive = minMotion === "majority" || (Number(minMotion) > 0 && Number(minMotion) <= 1) ||
                     finiteMotionValue(MP.maxConsecutiveStills) ||
                     finiteMotionValue(MP.maxStillSeconds) || MP.requireAction === true;
  if (motionActive) {
    var playedMotion = motionPlayback();
    var allowedMotion = Array.isArray(MP.allowedKinds) && MP.allowedKinds.length
      ? MP.allowedKinds : ["ai-video", "recording", "motion-slide"];
    function motionQualifies(x) {
      var kind = trueMotionKind(x.s), v = x.s.visual || {};
      return !!kind && allowedMotion.indexOf(kind) !== -1 &&
             (MP.requireAction !== true || !!String(v.action || "").trim());
    }
    if (MP.requireAction === true) {
      playedMotion.forEach(function (x) {
        var kind = trueMotionKind(x.s), v = x.s.visual || {};
        if (kind && allowedMotion.indexOf(kind) !== -1 && !String(v.action || "").trim())
          flag("bad", T.shotCap(x.i + 1), kind + " counts as true motion only with visual.action under this channel policy");
      });
    }
    var movingCount = playedMotion.filter(motionQualifies).length;
    if (minMotion === "majority" || (Number(minMotion) > 0 && Number(minMotion) <= 1)) {
      var requiredMotion = minMotion === "majority" ? Math.floor(playedMotion.length / 2) + 1
                         : Math.ceil(playedMotion.length * Number(minMotion));
      if (movingCount < requiredMotion)
        flag("bad", T.where.motion, movingCount + "/" + playedMotion.length +
             " true-motion shots — this channel requires at least " + requiredMotion +
             "; Ken Burns, caption swaps, and still-image changes do not count");
    }
    var stillRun = [], worstStillRun = [];
    playedMotion.forEach(function (x) {
      if (motionQualifies(x)) stillRun = [];
      else {
        stillRun.push(x);
        if (stillRun.length > worstStillRun.length) worstStillRun = stillRun.slice();
      }
    });
    var stillLabels = worstStillRun.map(function (x) { return x.i + 1; }).join("→");
    if (finiteMotionValue(MP.maxConsecutiveStills) &&
        worstStillRun.length > Number(MP.maxConsecutiveStills))
      flag("bad", T.where.motion, worstStillRun.length + " consecutive non-motion shots (" + stillLabels +
           ") — channel cap " + Number(MP.maxConsecutiveStills));
    if (finiteMotionValue(MP.maxStillSeconds) && worstStillRun.length) {
      var stillSeconds = worstStillRun.reduce(function (sum, x) {
        var n = Number(x.s.duration); return sum + (Number.isFinite(n) && n > 0 ? n : 0);
      }, 0);
      if (stillSeconds > Number(MP.maxStillSeconds))
        flag("bad", T.where.motion, stillSeconds.toFixed(2) + "s consecutive non-motion stretch (" +
             stillLabels + ") — channel cap " + Number(MP.maxStillSeconds) + "s");
    }
  }

  // Long-form chapter requirement (scenes-schema §chapter) — short-form has no notion of chapters
  if (FMT.chapterMin) {
    var chaps = SCENES.filter(function (s) { return s.chapter; });
    if (chaps.length < FMT.chapterMin)
      flag("bad", T.where.chapter, chaps.length + " — YouTube requires at least " + FMT.chapterMin +
           ". Write a chapter string on the scene (§chapter)");
    else if (chaps.length > FMT.chapterMax)
      flag("warn", T.where.chapter, chaps.length + " — the authoring target is " + FMT.chapterMin + "~" +
           FMT.chapterMax);
    if (chaps.length && SCENES.indexOf(chaps[0]) !== 0)
      flag("bad", T.where.chapter, "the first chapter is not at 0:00 — put a chapter on the cover shot (YouTube requirement)");
  }

  /* Production-layer mismatch · coverage — only shots that filled the fields are checked. Older files pass quietly. */
  SCENES.forEach(function (s, i) {
    var no = i + 1, vis = s.visual || {};
    if (vis.picture && vis.picture !== inferredPicture(s))
      flag("warn", T.shotCap(no), "picture:\"" + vis.picture + "\" but the structure says " + inferredPicture(s) +
           " — for AI video there has to be a video, clip or broll");
    if (vis.overlay && vis.overlay !== inferredOverlay(s))
      flag("warn", T.shotCap(no), "overlay:\"" + vis.overlay + "\" but the default for this type is " + inferredOverlay(s));
  });
  if (hasSceneField) {
    var byScene = {};
    SCENES.forEach(function (s, i) {
      if (s.type === "outro") return;
      var g = grammarOf(s, i);
      (byScene[g.scene] || (byScene[g.scene] = [])).push({ s: s, i: i, g: g });
    });
    Object.keys(byScene).forEach(function (sc) {
      var rows = byScene[sc], seenInfo = {};
      rows.forEach(function (row) {
        var info = String(row.g.info || "").replace(/\s+/g, "");
        if (info.length < 2) return;
        if (seenInfo[info] != null)
          flag("warn", "S#" + sc, "shot " + (seenInfo[info] + 1) + " and shot " + (row.i + 1) +
               " carry the same new information — one of them is enough");
        else seenInfo[info] = row.i;
      });
      // Establish, then close (directing-grammar §6) — a close-up opening (cu · choker · ecu) pays
      // its debt with any non-close size on the next shot: ls/ws, fs, mfs, ms, mcu, two, ots …
      var first = rows[0];
      if (first && CLOSE_SIZES[first.g.size] && rows[1] && rows[1].g.size && CLOSE_SIZES[rows[1].g.size])
        flag("warn", "S#" + sc, "opening on a close-up owes the viewer a wider next shot that says where this is (directing-grammar §6)");
    });
  }
  // b-roll slots — two slots in the same position leave the insert order undecided (scenes-schema §broll)
  var seenAfter = {};
  SCENES.filter(function (s) { return s.type === "broll"; }).forEach(function (s) {
    var af = s.after || 0;
    if (seenAfter[af]) flag("bad", "b-roll", "two slots collide on after: " + af + " — the insert order is undecided");
    seenAfter[af] = 1;
  });

  /* Playback order — format picks the skeleton (scenes-schema §playback order).
     short-form: hook → drip (1–n) → cta.
     long-form answer-first: cover → hooking → result → body;
     long-form story:        cover → hooking → body → turn → result.
     The last main shot is not stamped PAYOFF. */
  var firstBeat = {};
  order.forEach(function (o, pos) {
    if (o.s.type === "broll") return;
    var b = beatOf(o.s);
    if (b && firstBeat[b] == null) firstBeat[b] = { pos: pos, i: o.i, s: o.s };
  });
  var mainOrder = order.filter(function (o) { return o.s.type !== "broll" && o.s.type !== "outro"; });
  var lastDrip = null;
  mainOrder.forEach(function (o) { if (beatOf(o.s) === "drip") lastDrip = o; });
  var arc = cover && cover.arc ? String(cover.arc) : "answer-first";
  var storyArc = arc === "story";
  var ORDER_TXT = (!WIDE
    ? ["hook", "drip", "cta"]
    : (storyArc ? ["hook", "hooking", "body", "turn", "result"]
                : ["hook", "hooking", "result", "body"])).map(function (b) {
    return T.beat[b]; }).join(" → ");
  var processy = !!(firstBeat.result || firstBeat.body || hasRec);
  var orderOk = true, orderBad = false;
  if (WIDE && cover && cover.arc && !T.arc[arc]) {
    flag("warn", T.where.order, "arc \"" + cover.arc + "\" is outside the two — write answer-first or story on the cover (scenes-schema §playback order); read as answer-first below");
    orderOk = false;
  }
  if (order.length && order[0].s.type !== "cover") {
    flag(!WIDE ? "bad" : "warn", T.where.order, "the first shot is not the cover — a short opens on the hook");
    orderOk = false;
    if (!WIDE) orderBad = true;
  }
  if (!WIDE) {
    var LONG_BEATS = { hooking: 1, result: 1, body: 1, turn: 1 };
    mainOrder.forEach(function (o) {
      var b = beatOf(o.s);
      if (LONG_BEATS[b]) {
        flag("bad", T.where.order, "shot " + (o.i + 1) + " carries beat:\"" + b + "\" — a short walks hook → drip → cta (scenes-schema §playback order)");
        orderOk = false; orderBad = true;
      } else if (!o.s.beat && o.s.type !== "cover") {
        flag("bad", T.where.order, "shot " + (o.i + 1) + " has no beat — a short labels every shot hook · drip · cta");
        orderOk = false; orderBad = true;
      }
    });
    if (!firstBeat.drip) {
      flag("bad", T.where.order, "there is no drip shot — after the hook, 1–n shots pay curiosity in stages (beat:\"drip\") before the CTA");
      orderOk = false; orderBad = true;
    }
    if (mainOrder.length) {
      var firstB = beatOf(mainOrder[0].s);
      if (firstB && firstB !== "hook") {
        flag("bad", T.where.order, "the hook beat is not the first shot — a short opens on the cover");
        orderOk = false; orderBad = true;
      }
    }
    var lastMain = mainOrder.length ? mainOrder[mainOrder.length - 1] : null;
    if (lastMain && beatOf(lastMain.s) !== "cta") {
      flag("bad", T.where.order, "the last narrated shot is not the CTA — a short ends on beat:\"cta\" (an outro asset is not the spoken close)");
      orderOk = false; orderBad = true;
    } else if (lastMain) {
      var ctaSpoken = (lastMain.s.narration || []).map(function (seg) {
        return (seg && (seg.sub || seg.tts)) || "";
      }).join("").replace(/\s/g, "");
      if (!ctaSpoken) {
        flag("bad", T.where.order, "the last narrated shot is the CTA but has no narration — a short ends on a spoken close");
        orderOk = false; orderBad = true;
      }
    }
    mainOrder.forEach(function (o, pos) {
      var b = beatOf(o.s);
      if (b === "hook" && pos !== 0) {
        flag("bad", T.where.order, "shot " + (o.i + 1) + " carries beat:\"hook\" — the cover opens the episode");
        orderOk = false; orderBad = true;
      } else if (b === "cta" && pos !== mainOrder.length - 1) {
        flag("bad", T.where.order, "a beat comes after the cta — the cta is the very end");
        orderOk = false; orderBad = true;
      }
    });
    if (cover && cover.hookType === "spoiler") {
      flag("bad", T.where.opening, "hookType \"spoiler\" dumps the ending on a short — use fear · empathy · curiosity");
    }
    if (cover && cover.hookForm === "payoff") {
      flag("bad", T.where.hookForm, "hookForm \"payoff\" dumps the result on a short — use paradox · gap · identify · number · secret");
    }
    var COMP = window.COMPREHENSION;
    if (cover && COMP && COMP.answer) {
      var compactLetters = function (s) { return String(s || "").replace(/[\s\p{P}\p{S}]/gu, ""); };
      var ans = compactLetters(COMP.answer);
      if (ans.length >= 8) {
        var hookText = compactLetters([cover.title, cover.stat].concat(
          (cover.narration || []).map(function (seg) { return (seg && (seg.sub || seg.tts)) || ""; })
        ).join(" "));
        if (hookText.indexOf(ans) !== -1)
          flag("bad", T.where.cover, "the hook dumps COMPREHENSION.answer — on a short the cover opens a gap, and the last drip is the first place the answer is complete");
      }
    }
  } else if (!storyArc) {
    if (processy && firstBeat.body && !firstBeat.result) {
      flag("warn", T.where.order, "there is body but no result scene — put a shot after the hooking that lays out the finished thing (an informational piece has no result scene: give its first content shot beat:\"result\")");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.body.pos < firstBeat.result.pos) {
      flag("bad", T.where.order, "body comes before result — move shot " +
           (firstBeat.body.i + 1) + " after shot " + (firstBeat.result.i + 1) + " (or set arc:\"story\" on the cover if the answer is meant to wait)");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.turn) {
      flag("warn", T.where.order, firstBeat.turn.s.beat
           ? "shot " + (firstBeat.turn.i + 1) + " carries beat:\"turn\" — the turning point belongs to the story arc; drop the beat or write arc:\"story\" on the cover"
           : T.turnHeadingFlag(firstBeat.turn.i + 1));
      orderOk = false;
    }
  } else {
    if (!firstBeat.result) {
      flag("warn", T.where.order, "story arc with no result (payoff) shot — the loop the cover opened never closes; add the shot where the answer appears for the first time (beat:\"result\"), after the turn");
      orderOk = false;
    }
    if (!firstBeat.turn) {
      flag("warn", T.where.order, "story arc with no turn shot — add the moment someone saw it differently (beat:\"turn\") right before the payoff");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.result.pos < firstBeat.body.pos) {
      flag("bad", T.where.order, "result comes before body on a story arc — the payoff closes the loop before the build; move shot " +
           (firstBeat.result.i + 1) + " after the turn, or set arc:\"answer-first\" on the cover");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && firstBeat.result.pos < firstBeat.turn.pos) {
      flag("bad", T.where.order, "result comes before the turn — the answer is out before the turning point; move shot " +
           (firstBeat.result.i + 1) + " after shot " + (firstBeat.turn.i + 1));
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && !orderBad) {   // the two bads above already name this defect
      var ri = -1;
      mainOrder.forEach(function (o, k) { if (ri < 0 && beatOf(o.s) === "result") ri = k; });
      if (ri > 0 && beatOf(mainOrder[ri - 1].s) !== "turn") {
        flag("warn", T.where.order, "the shot right before the payoff (shot " + (mainOrder[ri - 1].i + 1) + ") is not the turn — the turning point is the last beat before the answer");
        orderOk = false;
      }
    }
  }
  /* Long-form: every episode has a hooking shot. Shorts walk drip instead. An opening b-roll
     (after:0) is skipped: it is not a playback role, just 4 seconds of the cover picture moving. */
  var afterCover = mainOrder.length > 1 && mainOrder[0].s.type === "cover" ? mainOrder[1] : null;
  if (WIDE) {
    if (mainOrder.length > 1 && !firstBeat.hooking) {
      flag("warn", T.where.order, "there is no hooking shot — after the cover, add the shot that hooks why to stay (beat:\"hooking\"" + (storyArc ? ", the setup on a story arc" : "") + "). Informational episodes are no exception");
      orderOk = false;
    } else if (afterCover && beatOf(afterCover.s) !== "hooking") {
      var ab = beatOf(afterCover.s);
      flag("warn", T.where.order, "the shot after the cover is not the hooking — shot " + (afterCover.i + 1) +
           (ab ? "(" + (T.beat[ab] || ab) + ")" : "(no beat)") + " comes before the hooking (shot " +
           (firstBeat.hooking.i + 1) + "). Reorder to " + ORDER_TXT);
      orderOk = false;
    }
  }

  /* Opening strategy — is the cover hookType one of the four (scenes-schema §the four opening
     strategies). Whether none of the four is actually present in the opening is what the
     reviewer's copy mode looks at — this only checks the name tag. */
  var hookWord = cover && cover.hookType ? T.hook[cover.hookType] : "";
  if (cover && !cover.hookType) {
    flag("warn", T.where.opening, !WIDE
      ? "the cover has no hookType — write fear|empathy|curiosity (a short never uses spoiler)"
      : "the cover has no hookType — write fear|empathy|curiosity|spoiler to say whether this episode opens (title, segment ①, hooking) on fear, empathy, curiosity, or showing the ending first");
  } else if (cover && !hookWord) {
    flag("warn", T.where.opening, !WIDE
      ? "hookType \"" + cover.hookType + "\" is outside the three a short uses — change it to one of fear|empathy|curiosity"
      : "hookType \"" + cover.hookType + "\" is outside the four — change it to one of fear|empathy|curiosity|spoiler");
  }
  /* Hook form — the shape of the first line (scenes-schema §the six hook forms). A name tag, like
     hookType: the check asks for it, the reviewer's copy mode judges whether the title and
     segment ① actually take that shape and whether the result pays it. */
  if (cover && !cover.hookForm) {
    flag("warn", T.where.hookForm, !WIDE
      ? "the cover has no hookForm — write paradox|gap|identify|number|secret (a short never uses payoff)"
      : "the cover has no hookForm — write paradox|gap|payoff|identify|number|secret to say how the title and segment ① are shaped (scenes-schema §the six hook forms)");
  } else if (cover && !T.hookForm[cover.hookForm]) {
    flag("warn", T.where.hookForm, !WIDE
      ? "hookForm \"" + cover.hookForm + "\" is outside the five a short uses — change it to one of paradox|gap|identify|number|secret"
      : "hookForm \"" + cover.hookForm + "\" is outside the six — change it to one of paradox|gap|payoff|identify|number|secret");
  }

  /* Camera slots — every shot that becomes generated video leaves the storyboard with all four
     filled (scenes-schema §camera). produce assembles the prompt out of them, so an empty slot
     means produce would have to invent an instruction nobody reviewed. A legacy one-string
     visual.motion still passes. */
  var camGaps = 0;
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var cam = camOf(s);
    if (!cam) {
      if (!(s.visual && s.visual.motion)) {
        camGaps++;
        flag("warn", T.shotCap(i + 1), "generated video with no visual.camera — fill movement · speed · framing · end before the call (scenes-schema §camera)");
      }
      return;
    }
    var missing = CAM_SLOTS.filter(function (slot) { return !cam[slot]; });
    if (missing.length) {
      camGaps++;
      flag("warn", T.shotCap(i + 1), "visual.camera is missing " + missing.join(", ") +
           (missing.indexOf("end") >= 0 ? " — with no end the model is not told where to stop, and the last second drifts" : ""));
    }
  });

  /* Negative directives in a generated clip's prompt (video-model-selection §positive locks).
     Write "no ~" in the body and the model tends to draw that noun — Veo takes exclusions in the
     negativePrompt argument, Seedance has no such argument and wants the scene re-described plus
     a positive-locks tail. Scanned: visual.video.prompt, visual.clip.prompt, the four camera
     slots. NOT scanned — bgPrompt (the image tools have no exclusion argument, so
     assemble-bg-prompt.js --exclude ships the noun list in the body by design) and visual.audio
     (a sound absence is a description: "no music, no speech"). Edit directives about cutting are
     allowed whichever negation word carries them — the cut line §positive locks prescribes reads
     "Sequence of cuts, no timecodes — … the camera does not cut on its own." */
  var NEG_OK = /^(cut|cuts|camera cuts|timecode|timecodes|timecode splits)\b/;
  var NEG_RE = /\b(no|not|avoid|avoids|never|don't|dont|doesn't|won't)\b[ \t]*([a-z' \t-]{0,24})/gi;
  /* On a seedance route the vendor's 2.0 guide templates directive negatives for the artifact
     classes only (subtitles·text·logo·watermark, 2.5 adds bgm) — those pass there. Same
     pattern as assemble-bg-prompt.js ARTIFACT_OK (its --selftest checks the copies). */
  var ARTIFACT_OK = /(subtitle|caption|text|logo|watermark|bgm)/;
  function negHits(text, eng) {
    var out = [], m;
    NEG_RE.lastIndex = 0;
    while ((m = NEG_RE.exec(text)) !== null) {
      var tail = (m[2] || "").trim().toLowerCase();
      if (NEG_OK.test(tail.replace(/[^a-z ].*$/, "").trim())) continue;
      if (eng && eng.indexOf("seedance") === 0 && ARTIFACT_OK.test(tail)) continue;
      out.push((m[1] + " " + tail).trim());
      if (out.length >= 3) break;
    }
    return out;
  }
  SCENES.forEach(function (s, i) {
    var v = s.visual || {}, cam = camOf(s) || {}, fields = [];
    // Prompts from both sources — the scene's own and the footage lane's per-group shots
    // (clipPrompts, below). This strip warns on a negative directive on either route, since a
    // Veo exclusion belongs in the negativePrompt argument; check-scenes.js blocks only the
    // seedance route, where there is no such argument to move it to.
    clipPrompts(s, i).forEach(function (f) {
      if (f.prompt) fields.push([f.where, f.prompt, f.eng]);
    });
    if (genVideo(s)) CAM_SLOTS.forEach(function (slot) {
      if (typeof cam[slot] === "string" && cam[slot]) fields.push(["visual.camera." + slot, cam[slot], engineOf(s)]);
    });
    var shots = (v.slide && Array.isArray(v.slide.shots)) ? v.slide.shots : [];
    shots.forEach(function (sh, j) {
      var sc = sh.camera || {}, eng = (sh.engine || v.engine) === "veo" ? "veo" : "seedance";
      CAM_SLOTS.forEach(function (slot) {
        if (typeof sc[slot] === "string" && sc[slot]) fields.push(["shots[" + j + "]'s camera." + slot, sc[slot], eng]);
      });
    });
    fields.forEach(function (f) {
      // The Audio: sentence is exempt — "no music, no speech" is a state description.
      var audioAt = f[1].search(/Audio\s*:/i);
      var hits = negHits(audioAt >= 0 ? f[1].slice(0, audioAt) : f[1], f[2]);
      if (!hits.length) return;
      flag("warn", T.shotCap(i + 1), f[0] + ' carries a negative directive ("' + hits.join('", "') +
           '") — on Veo exclusions belong in the negativePrompt argument, on Seedance re-describe the scene and close with positive locks; only the artifact classes (subtitles·text·logo·watermark·bgm) may stay negative there (video-model-selection §positive locks)');
    });
  });

  /* The stored clip prompt — one scene, one call, the prompt written here (scenes-schema
     §clip prompt). A generated shot that leaves the storyboard without its final prompt makes
     produce invent one at call time, which is exactly the sentence nobody reviewed. The timing
     regexes mirror assemble-bg-prompt.js (TIMESTAMP_RE · DIGIT_SECONDS_RE — its --selftest
     fails if the copies drift): a Seedance-routed prompt takes no timecodes (2.0 self-reports
     unstable precision timing), and digit seconds belong in `duration` on either route. */
  var TIME_RE = /\[\d{1,2}:\d{2}(?:\s*[-–~]\s*\d{1,2}:\d{2})?\]|\b0\d?:\d{2}\b/;
  var SECS_RE = /\b(\d{1,3})(?:\.\d+)?\s*(s|secs?|seconds?)\b/gi;
  var QUOTED_RE = /"[^"]*"|“[^”]*”|「[^」]*」/g;
  var HANGUL_RE = /[가-힣]+(?:[ \t]+[가-힣]+)*/;
  var LOCK_RE = /\b(stays?|remains?|keeps?|holds?|unchanged|identical|consistent)\b/i;
  /* Every prompt that becomes a paid call — the scene's own, plus the footage lane's per-group
     shots, which are the bulk of a footage episode and were invisible to this strip until
     2026-09-04. check-scenes.js walks the same two sources; a count that disagrees with the CLI
     means one of the two grew a case the other didn't. */
  function clipPrompts(s, i) {
    var out = [], v = s.visual || {};
    if (genVideo(s)) out.push({ cap: T.shotCap(i + 1), prompt: clipPromptOf(s), eng: engineOf(s), where: "the stored clip prompt" });
    var shots = (v.slide && Array.isArray(v.slide.shots)) ? v.slide.shots : [];
    shots.forEach(function (sh, j) {
      out.push({ cap: T.shotCap(i + 1), prompt: String(sh.prompt || ""),
                 eng: (sh.engine || v.engine) === "veo" ? "veo" : "seedance",
                 where: "shots[" + j + "]'s prompt" });
    });
    return out;
  }
  SCENES.forEach(function (s, i) {
    clipPrompts(s, i).forEach(function (f) {
      var p = f.prompt, eng = f.eng;
      if (!p) {
        flag("warn", f.cap, "generated video with no stored clip prompt — assemble it (assemble-bg-prompt.js --clip --engine " + eng +
             ") and store it before approval; produce sends it verbatim (scenes-schema §clip prompt)");
        return;
      }
      if (eng === "seedance" && TIME_RE.test(p))
        flag("warn", f.cap, f.where + " carries a timecode on a seedance route — 2.0 self-reports unstable precision timing; cut in the edit, or write visual.engine: \"veo\" where [mm:ss] is a workflow");
      var m; SECS_RE.lastIndex = 0;
      while ((m = SECS_RE.exec(p)) !== null) {
        if (m[2].toLowerCase() === "s" && Number(m[1]) > 19) continue;   // "80s film look" is a decade
        flag("warn", f.cap, f.where + ' carries digit seconds ("' + m[0] + '") — length lives in duration; write an in-clip state change in words ("in under half a second")');
        break;
      }
      if (eng !== "seedance") return;
      /* The seedance lane's own two rules (assemble-bg-prompt.js hangulHits · lockMissing — its
         --selftest fails if these copies drift). The body reads Chinese or English, with Korean
         only inside the quotes of a dialogue line; and the image lane closes with a consistency
         lock, which on this engine is also the only place an exclusion can go. */
      var outside = p.replace(QUOTED_RE, " ").match(HANGUL_RE);
      if (outside)
        flag("warn", f.cap, f.where + ' carries Korean ("' + outside[0] + '") — a seedance body reads Chinese or English; Korean goes inside the quotes of a dialogue line');
      if (!LOCK_RE.test(p))
        flag("warn", f.cap, f.where + " has no consistency lock — a seedance clip closes with the sentence that says what holds in every frame (“the subject stays exactly consistent with the input frame”), and that is where an exclusion goes on an engine with no negativePrompt argument (video-model-selection §positive locks)");
    });
  });

  /* Reference jurisdiction — a generated clip that hands over two or more references and scopes
     none of them is the leak case: the character brings the studio backdrop along, or the only
     face in the set gets lent to another figure. One scope clause per reference is the fix
     (video-model-selection §positive locks). One reference alone has nothing to leak into. */
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var ents = charEntries(s);
    if (ents.length < 2) return;
    if (ents.some(function (e) { return e.scope; })) return;
    flag("warn", T.shotCap(i + 1), ents.length + " references on one generated clip and no scope on any of them — give each a jurisdiction clause in visual.character ({ id, scope }) so one reference does not paint the rest of the frame");
  });

  /* Shot grammar — feel first, then the dials (directing-grammar §5–§6). A shot with no
     shot.feel was framed before anyone said what the audience should feel there; the
     rationing rules catch the close-up spent twice and the dutch used twice. Warnings — the
     reviewer's camera mode and the person at the approval step weigh them. */
  var feelGaps = 0, sizeUnknown = 0, chokerEcu = 0, dutchCount = 0, cuPerScene = {};
  SCENES.forEach(function (s, i) {
    if (s.type === "outro") return;
    var g = grammarOf(s, i);
    if (!g.feel) {
      feelGaps++;
      flag("warn", T.shotCap(i + 1), "shot.feel not written — say what the audience should feel here before choosing the size, the angle and the camera (directing-grammar §5)");
    }
    if (g.size && !T.size[g.size]) {
      sizeUnknown++;
      flag("warn", T.shotCap(i + 1), 'shot.size "' + g.size + '" is outside the vocabulary — els · ls · fs · mfs · ms · mcu · cu · choker · ecu · insert, or a composition two · three · ots · pov · back · cutaway · reaction (directing-grammar §2)');
    }
    if (g.angle && !T.angle[g.angle]) {
      flag("warn", T.shotCap(i + 1), 'shot.angle "' + g.angle + '" is outside the vocabulary — eye · high · low · overhead · dutch (directing-grammar §3)');
    }
    if (CLOSE_SIZES[g.size]) {
      var key = String(g.scene);
      cuPerScene[key] = (cuPerScene[key] || 0) + 1;
      if (cuPerScene[key] === 2)
        flag("warn", "Scene S#" + key, "a second close-up in the same scene — the close-up is a command, and a command repeated stops being heard. One cu per scene, on the line that matters (directing-grammar §6)");
    }
    if (g.size === "choker" || g.size === "ecu") {
      chokerEcu++;
      if (chokerEcu === 3)
        flag("warn", T.shotCap(i + 1), "a third choker / extreme close-up in the episode — once or twice is the ration (directing-grammar §6)");
    }
    if (g.angle === "dutch") {
      dutchCount++;
      if (dutchCount === 2)
        flag("warn", T.shotCap(i + 1), "a second dutch angle — the tilt lands once and then reads as the new horizon; one per episode, with its reason written on the shot (directing-grammar §3)");
    }
  });

  /* Frame space — the floor plan of a generated still (directing-grammar §3.5). Older files
     without shot.space still render; the strip warns so the reviewer weighs the gap. */
  SCENES.forEach(function (s, i) {
    var sp = (s.shot && s.shot.space) || {};
    var size = (s.shot && s.shot.size) || "";
    var still = genStill(s);
    var written = !!(sp.layout || sp.facing || sp.line || sp.light);
    // The 180° line is owed on a filmed two-shot as well — it is the sentence the shooting script prints.
    if ((still || recOf(s) || written) && (charsOf(s).length >= 2 || size === "two" || size === "three" || size === "ots") && !sp.line)
      flag("warn", T.shotCap(i + 1), "two people (or a person and what they look at) with no shot.space.line — lock \"A left, B right\" so the still agrees with the 180° sentence");
    // Wherever a space block is written — still, quote clip, filmed shot — its frame and its words are checked.
    if (written && !sp.frame)
      flag("warn", T.shotCap(i + 1), 'shot.space is written with no frame — add frame: "camera" (left means left of the picture)');
    if (sp.frame && sp.frame !== "camera")
      flag("warn", T.shotCap(i + 1), 'shot.space.frame is "' + sp.frame + '" — the only allowed value is camera (left means left of the picture)');
    var hits = bannedSpaceHits(spaceTextOf(sp) + " " + ((s.visual && s.visual.bgPrompt) || ""));
    if (hits.length)
      flag("warn", T.shotCap(i + 1), "spatial language the model cannot follow — " + hits.join(", ") + " (directing-grammar §3.5 · assemble-bg-prompt.js --check)");
    if (!still) return;
    if (!FILL_FRAME[size] && !sp.layout)
      flag("warn", T.shotCap(i + 1), "generated still with no shot.space.layout — name sides from the camera before the call (directing-grammar §3.5)");
    var personOn = personOnScreen(s, spaceTextOf(sp));
    if (personOn && size !== "pov" && !sp.facing)   // a pov shows hands, not a face to turn
      flag("warn", T.shotCap(i + 1), "a person is on screen with no shot.space.facing — write the visible result (\"faces camera-right\"), not \"left view of\"");
  });

  /* Cast — an id used in a shot but absent from SB_DOC.characters draws no panels, so the
     reviewer cannot see what reference set the call will get. */
  var castIds = {};
  CAST.forEach(function (c) { castIds[c.id] = 1; });
  var unknownCast = {};
  SCENES.forEach(function (s, i) {
    charsOf(s).forEach(function (id) {
      if (!castIds[id] && !unknownCast[id]) {
        unknownCast[id] = 1;
        flag("warn", T.shotCap(i + 1), 'character "' + id + '" is not in SB_DOC.characters — add it so the panels going into generation are visible here');
      }
    });
  });

  /* Music cues — a sound.cue naming nothing leaves the bed where it was, so the change the
     storyboard planned never reaches the mix. No window.MUSIC at all is a one-bed episode,
     which is a normal design and draws nothing. */
  var cueCount = 0, dropCount = 0;
  SCENES.forEach(function (s, i) {
    var sd = s.sound; if (!sd) return;
    if (sd.drop) dropCount++;
    if (sd.cue) {
      cueCount++;
      if (!MUSIC || !MUSIC[sd.cue]) {
        flag("warn", T.shotCap(i + 1), 'sound.cue "' + sd.cue + '" is not in window.MUSIC — produce has no file to fetch, so the bed stays where it was');
      }
      if (sd.drop) {
        flag("warn", T.shotCap(i + 1), "sound.cue and sound.drop on the same shot — the cue fades in muted, so the change lands on the next shot instead");
      }
    }
  });
  if (dropCount > 1 && FMT_KEY === "shorts-9x16") {
    flag("warn", T.where.sound, dropCount + " music drops in a short — spend one on the line the episode is about; past that neither reads");
  }
  /* The music goes out at the peak, and on a story arc the turn is the peak (scenario-craft
     §7). A drop that sits on the result instead swells where the answer lands and leaves the
     turn under music. Only when the episode drops at all — a one-bed episode is a design. */
  if (storyArc && firstBeat.turn && dropCount && !(firstBeat.turn.s.sound && firstBeat.turn.s.sound.drop)) {
    var dropAt = [];
    SCENES.forEach(function (s, i) { if (s.sound && s.sound.drop) dropAt.push(i + 1); });
    flag("warn", T.where.sound, "the music drop sits on shot " + dropAt.join(", ") + ", not on the turn (shot " + (firstBeat.turn.i + 1) +
         ") — the bed goes out at the peak, and on a story arc the turn is the peak; the result is where it comes back (scenario-craft §7)");
  }

  /* ── Promise ledger — SB_DOC.craft (scenario-craft §3 · §5 · §7 · §8 · §10) ──
     The loops the episode opens and the shot that pays each one, the plant → payoff pairs, and
     the story-arc devices. scenes.js has no field for any of this — a promise is editorial, not
     a shot property — so it lives in SB_DOC, and the strip checks what a machine can: every
     loop has a payer that plays after it, the cover's promise is paid where the answer first
     appears, a plant is paid in the frame it was planted in, the holds rise and the burst comes
     after them, a device carries its rule and the shots that verify it. Whether the promise is
     kept in the copy is the reviewer's and the approver's call. Warnings only. */
  var CRAFT = DOC.craft && typeof DOC.craft === "object" ? DOC.craft : null;
  var LOOPS = (CRAFT && Array.isArray(CRAFT.loops) ? CRAFT.loops : []).filter(function (l) { return l && typeof l === "object"; });
  var HOLDS = (CRAFT && Array.isArray(CRAFT.holds) ? CRAFT.holds : []).map(Number);
  var BURST = CRAFT && CRAFT.burst ? Number(CRAFT.burst) : 0;
  var SIGNATURE = CRAFT && CRAFT.signature ? Number(CRAFT.signature) : 0;
  var DEVICE = CRAFT && CRAFT.device && typeof CRAFT.device === "object" ? CRAFT.device : null;
  var DEVICE_SHOWN = DEVICE && Array.isArray(DEVICE.shown) ? DEVICE.shown.map(Number) : [];
  var CRAFT_DRAW = !!(LOOPS.length || HOLDS.length || BURST || SIGNATURE || DEVICE);
  var promiseTags = SCENES.map(function () { return []; });   // per-shot name tags for the card header
  var unpaid = 0, plantCount = 0, subLoops = 0, coverLoops = 0;
  // Playback position of shot n (numbered from 1); -1 for b-roll, the outro, or a number outside the file
  function playPos(n) {
    var k = -1;
    order.forEach(function (o, p) { if (o.i === n - 1 && o.s.type !== "broll") k = p; });
    return k;
  }
  function shotOk(n) { return Number.isInteger(n) && playPos(n) >= 0; }
  function beatWord(n) { var b = beatOf(SCENES[n - 1]); return b ? (T.beat[b] || b) : ""; }
  function frameText(n) {
    var g = grammarOf(SCENES[n - 1], n - 1);
    return [g.size ? (T.size[g.size] || g.size) : "", g.angle ? (T.angle[g.angle] || g.angle) : "", g.space.layout || ""]
      .filter(Boolean).join(" · ") || T.frameNotWritten;
  }
  if (!LOOPS.length)
    flag("warn", T.where.promise, "SB_DOC.craft.loops is empty — write at least the cover's promise and the shot that pays it (open: 1, pay: " +
         (!WIDE ? "<the last drip>" : "<the result shot>") + "), then every sub-loop and deliberate plant with its payer (scenario-craft §3 · §5). An unpaid promise shows here rather than at the approval screen");
  LOOPS.forEach(function (l, k) {
    var open = Number(l.open), pay = l.pay == null || l.pay === "" ? 0 : Number(l.pay);
    var plant = l.kind === "plant", label = plant ? "plant" : "loop";
    if (plant) plantCount++;
    if (!shotOk(open)) {
      flag("warn", T.where.promise, "entry " + (k + 1) + " opens at " + JSON.stringify(l.open) + " — not a main shot (numbers count from 1; b-roll and the outro open nothing)");
      return;
    }
    if (!l.what)
      flag("warn", T.where.promise, "entry " + (k + 1) + " (" + label + " at shot " + open + ") has no `what` — name the promise in one line");
    if (!pay) {
      unpaid++;
      promiseTags[open - 1].push({ cls: "warn", text: T.tagOpenUnpaid(plant) });
      flag("warn", T.where.promise, "the " + label + " opened at shot " + open + (l.what ? " (" + strip(l.what) + ")" : "") +
           " has no payer — an unpaid promise; write pay: <shot> or cut the " + label + " (scenario-craft §5)");
      return;
    }
    if (!shotOk(pay)) {
      unpaid++;
      flag("warn", T.where.promise, "the " + label + " opened at shot " + open + " is paid at " + JSON.stringify(l.pay) + " — not a main shot");
      return;
    }
    if (playPos(pay) <= playPos(open))
      flag("warn", T.where.promise, "the " + label + " at shot " + open + " is paid at shot " + pay + ", which plays " +
           (pay === open ? "in the same shot" : "earlier") + " — a promise is paid after it is made");
    var diff = [];
    if (!plant && cover && open === 1) {
      coverLoops++;
      var payBeat = beatOf(SCENES[pay - 1]);
      if (!WIDE) {
        var lastDripN = lastDrip ? lastDrip.i + 1 : 0;
        if (pay !== lastDripN)
          flag("warn", T.where.promise, "the cover's promise is paid at shot " + pay + (beatWord(pay) ? " (" + beatWord(pay) + ")" : "") +
               " — the last drip is where the answer first completes (scenes-schema §playback order); pay: " + (lastDripN || "<the last drip>"));
      } else if (payBeat !== "result")
        flag("warn", T.where.promise, "the cover's promise is paid at shot " + pay + (beatWord(pay) ? " (" + beatWord(pay) + ")" : "") +
             " — the result is where the answer first appears (scenes-schema §playback order); pay: " + (firstBeat.result ? firstBeat.result.i + 1 : "<the result shot>"));
    } else if (!plant) {
      subLoops++;
    } else {
      if (storyArc && firstBeat.turn && playPos(open) >= firstBeat.turn.pos)
        flag("warn", T.where.promise, "the plant at shot " + open + " sits at or after the turn — a plant goes in the setup or an early build shot, where it looks like nothing (scenario-craft §3)");
      var ga = grammarOf(SCENES[open - 1], open - 1), gb = grammarOf(SCENES[pay - 1], pay - 1);
      if (ga.size && gb.size && ga.size !== gb.size) diff.push("size " + ga.size + " → " + gb.size);
      if (ga.angle && gb.angle && ga.angle !== gb.angle) diff.push("angle " + ga.angle + " → " + gb.angle);
      if (ga.space.layout && gb.space.layout && ga.space.layout !== gb.space.layout) diff.push("a different layout");
      if (diff.length)
        flag("warn", T.shotCap(pay), "pays the plant at shot " + open + " in a different frame — " + diff.join(" · ") +
             ". The payoff copies the plant's frame — same size, angle and space — so the viewer stands where they stood and nothing has to say \"remember this\" (scenario-craft §3 · directing-grammar §6 rule 14)");
    }
    promiseTags[open - 1].push({ cls: "", text: T.tagOpen(plant, pay) });
    promiseTags[pay - 1].push({ cls: diff.length ? "warn" : "ok", text: T.tagPay(plant, open, !diff.length) });
  });
  if (LOOPS.length && cover && !coverLoops)
    flag("warn", T.where.promise, "the cover's own promise is not in the ledger — add it first (open: 1, pay: " +
         (!WIDE ? "<the last drip>" : "<the result shot>") + "); every other loop is measured against it");
  var subCap = FMT_KEY === "youtube-long-16x9" ? 4 : 1;
  if (subLoops > subCap)
    flag("warn", T.where.promise, subLoops + " sub-loops beyond the cover's — " + (subCap === 1 ? "a short carries one at most" : "long-form carries two to four") +
         "; past that the viewer stops tracking which question is open (scenario-craft §5)");
  if (SIGNATURE) {
    if (!shotOk(SIGNATURE)) {
      flag("warn", T.where.promise, "craft.signature " + JSON.stringify(CRAFT.signature) + " is not a main shot");
    } else {
      var sb = beatOf(SCENES[SIGNATURE - 1]), lastMain = mainOrder.length ? mainOrder[mainOrder.length - 1].i + 1 : 0;
      if (sb !== "turn" && sb !== "cta" && SIGNATURE !== lastMain)
        flag("warn", T.shotCap(SIGNATURE), "carries the signature line but is neither the turn nor the last beat — the one quotable line lands where the episode peaks or where it ends (scenario-craft §7)");
      promiseTags[SIGNATURE - 1].push({ cls: "", text: T.tagSignature });
    }
  }
  var holdsOk = HOLDS.length > 0 && HOLDS.every(shotOk);
  HOLDS.forEach(function (n, k) {
    if (!shotOk(n)) { flag("warn", T.where.promise, "craft.holds[" + k + "] = " + JSON.stringify(CRAFT.holds[k]) + " is not a main shot"); return; }
    var hb = beatOf(SCENES[n - 1]);
    if (hb !== "body")
      flag("warn", T.shotCap(n), "is listed as a hold but its beat is " + (hb ? (T.beat[hb] || hb) : "unwritten") + " — the holds are the body, where the antagonist provokes and the protagonist endures (scenario-craft §8)");
    if (k && shotOk(HOLDS[k - 1]) && playPos(n) <= playPos(HOLDS[k - 1]))
      flag("warn", T.where.promise, "craft.holds is not in playback order (" + HOLDS.join(", ") + ") — list the holds as they play, so the series rises");
    promiseTags[n - 1].push({ cls: "", text: T.tagHold(k + 1, HOLDS.length) });
  });
  if (holdsOk && HOLDS.length > 1) {
    var feelSeen = {};
    HOLDS.forEach(function (n) {
      var f = strip(grammarOf(SCENES[n - 1], n - 1).feel).replace(/\s+/g, " ").trim();
      if (!f) return;
      if (feelSeen[f]) flag("warn", T.shotCap(n), "holds on the same shot.feel as shot " + feelSeen[f] + " (\"" + f + "\") — the same note twice reads as a flat stretch; write each hold deeper than the last (scenario-craft §8)");
      else feelSeen[f] = n;
    });
  }
  if (BURST) {
    if (!shotOk(BURST)) {
      flag("warn", T.where.promise, "craft.burst " + JSON.stringify(CRAFT.burst) + " is not a main shot");
    } else {
      if (!HOLDS.length)
        flag("warn", T.shotCap(BURST), "is the burst with no hold listed before it — a release after nothing held is just loudness; list the holds in craft.holds (scenario-craft §8)");
      else if (holdsOk && playPos(BURST) <= playPos(HOLDS[HOLDS.length - 1]))
        flag("warn", T.shotCap(BURST), "bursts before the last hold (shot " + HOLDS[HOLDS.length - 1] + ") — the release comes after everything held");
      promiseTags[BURST - 1].push({ cls: "", text: T.tagBurst });
    }
  } else if (HOLDS.length) {
    flag("warn", T.where.promise, HOLDS.length + " hold" + (HOLDS.length > 1 ? "s" : "") + " listed and no craft.burst — say which shot the held charge comes out in, as an action rather than the emotion (scenario-craft §8)");
  }
  if (DEVICE) {
    if (!DEVICE.what || !DEVICE.rule)
      flag("warn", T.where.promise, "craft.device needs both `what` (the one device) and `rule` (what it can't do) — a device with no constraint has no bill (scenario-craft §10)");
    if (DEVICE_SHOWN.length > 3)
      flag("warn", T.where.promise, "craft.device.shown lists " + DEVICE_SHOWN.length + " shots — the rule is verified in three at most: claim, act, result (scenario-craft §10)");
    if (!DEVICE_SHOWN.length)
      flag("warn", T.where.promise, "craft.device lists no `shown` shots — the rule is verified, not explained: the claim, the act, the result, before the body leans on it (scenario-craft §10)");
    DEVICE_SHOWN.forEach(function (n, k) {
      if (!shotOk(n)) { flag("warn", T.where.promise, "craft.device.shown[" + k + "] = " + JSON.stringify(DEVICE.shown[k]) + " is not a main shot"); return; }
      if (storyArc && firstBeat.turn && playPos(n) >= firstBeat.turn.pos)
        flag("warn", T.shotCap(n), "verifies the device at or after the turn — the rule is shown working before the body leans on it (scenario-craft §10)");
      promiseTags[n - 1].push({ cls: "", text: T.tagDevice(T.deviceSteps[k] || (k + 1)) });
    });
  }
  function promiseSection() {
    var out = '<h2 class="sec" id="promises">' + esc(T.promisesHead) +
              '<span class="aside">' + esc(T.promisesAside) + "</span></h2>";

      out += '<table class="grid ledger"><thead><tr>' + T.ledgerCols.map(function (c) {

      LOOPS.forEach(function (l) {
        var open = Number(l.open), pay = l.pay == null || l.pay === "" ? 0 : Number(l.pay), plant = l.kind === "plant";
        out += "<tr><td>" + esc(plant ? T.kindPlant : (cover && open === 1 ? T.kindCoverHook : T.kindLoop)) + "</td>" +
               "<td>" + esc(T.shot(String(l.open))) + (shotOk(open) && beatWord(open) ? " · " + esc(beatWord(open)) : "") + "</td>" +
               "<td>" + (pay ? esc(T.shot(String(l.pay))) + (shotOk(pay) && beatWord(pay) ? " · " + esc(beatWord(pay)) : "") : '<span class="mark">' + esc(T.unpaid) + "</span>") + "</td>" +
               "<td>" + mark(l.what || "") + "</td>" +
               "<td>" + (plant && shotOk(open) ? esc(frameText(open)) + (shotOk(pay) ? " → " + esc(frameText(pay)) : "") : "") + "</td></tr>";
      });

    }
    var rows = "";
    if (DEVICE && (DEVICE.what || DEVICE.rule))
      rows += "<dt>" + esc(T.deviceAndRule) + "</dt><dd>" + mark(DEVICE.what || "") + (DEVICE.rule ? " — " + mark(DEVICE.rule) : "") +

    if (HOLDS.length)
      rows += "<dt>" + esc(T.holdShots) + "</dt><dd>" + HOLDS.map(function (n) {
        var f = shotOk(n) ? grammarOf(SCENES[n - 1], n - 1).feel : "";
        return esc(T.shot(n)) + (f ? " — " + esc(f) : ""); }).join("<br>") + "</dd>";
    if (BURST) rows += "<dt>" + esc(T.burstShot) + "</dt><dd>" + esc(T.shot(BURST)) + esc(T.burstNote) + "</dd>";
    if (SIGNATURE) rows += "<dt>" + esc(T.signatureShot) + "</dt><dd>" + esc(T.shot(SIGNATURE)) + esc(T.signatureNote) + "</dd>";
    if (rows) out += '<dl class="meta-grid">' + rows + "</dl>";

  }

  h += '<div class="badges">' +
       (CAST.length ? badge("", T.castN(CAST.length)) : "") +

       (feelGaps ? badge("warn", T.feelGaps(feelGaps)) : badge("ok", T.feelAll)) +
       (sizeUnknown ? badge("warn", T.sizeUnknown(sizeUnknown)) : "") +

          : "") +
       (LOOPS.length
          ? badge(unpaid ? "warn" : "ok", T.promiseBadge(LOOPS.length, plantCount, unpaid))
          : badge("warn", T.promiseEmpty)) +
       badge("mode", allRec ? T.modeRec : hasRec ? T.modeMixed(recCount)
             : isLine ? T.modeGenLine : T.modeGen) +
       (cover ? badge(hookWord ? "ok" : "warn", T.openingBadge(hookWord ||
          (cover.hookType ? T.outsideFour(cover.hookType) : T.strategyNotWritten))) : "") +
       badge((DOC.status || "draft") === "draft" ? "" : "ok", (DOC.status || "draft") === "draft" ? T.draft : DOC.status) +
       (DOC.created ? badge("", DOC.created) : "") +
       badge(lenCls, T.mainLen(total)) +

       badge("", T.shotsN(main.length)) +
       (hasSceneField ? badge("", (function () {

         SCENES.forEach(function (s, i) { seen[grammarOf(s, i).scene] = 1; });

       badge(orderOk ? "ok" : (orderBad ? "bad" : "warn"), ORDER_TXT) + "</div>";

  h += '<dl class="meta-grid">';
  if (DOC.keyMessage) h += "<dt>" + esc(T.keyMessage) + "</dt><dd>" + mark(DOC.keyMessage) + "</dd>";
  if (DOC.hook) h += "<dt>" + esc(T.coverHook) + "</dt><dd>" + mark(DOC.hook) + "</dd>";
  if (DOC.seriesNote) h += "<dt>" + esc(T.series) + "</dt><dd>" + mark(DOC.seriesNote) + "</dd>";
  h += "<dt>" + esc(T.source) + "</dt><dd><code>scenes.js</code>" + esc(T.sourceNote) + "</dd>";
  h += "</dl>";

  /* Cover contract — as a check item, not a badge */
  if (cover) {
    if (dispLen(cover.title) > 16) flag("bad", T.where.cover, "title displays " + dispLen(cover.title) + " chars — cap 16");
    // statLabel plays two roles — under a hero stat it is a short tag qualifying that number, so
    // 18 characters; used alone with no stat it is the cover subtext and has to hold a sentence,
    // so 28. One 40px line fits 28 characters across 1080 (measured: 23 chars = 728px).
    var labCap = cover.stat ? 18 : 28;
    if (cover.statLabel && dispLen(cover.statLabel) > labCap)

  }
  if (DOC.transitions && DOC.transitions.length && DOC.transitions.length !== SCENES.length)
    flag("warn", T.where.transition, "SB_DOC.transitions: " + DOC.transitions.length + " — the shot count is " + SCENES.length);

  // Stops an unfilled template placeholder from reaching the approval gate
  var blanks = (JSON.stringify(DOC).match(/\{\{/g) || []).length;
  if (blanks) flag("bad", "SB_DOC", "unfilled placeholders: " + blanks + " — clear the {{…}} and reopen the document");

  /* All-live-voice episodes — narration IS the recording script, so an empty one means that

  if (window.VOICE === "user") {
    SCENES.forEach(function (s, i) {
      if (s.type === "broll" || s.type === "outro") return;
      if (!(s.narration || []).length)
        flag("warn", T.shotCap(i + 1), "an all-live-voice episode (window.VOICE) with empty narration — the lines to speak never reach the script");
    });

  /* Scene checks are collected during the card render, so they run first */
  var sceneChips = SCENES.map(function (s, i) { return sceneCheck(s, i + 1); });

  // Reserve the slot only — the content goes in after the render (see the flag comment above)
  h += '<section class="audit" id="audit"></section>';

  /* ══ Cost — what has been billed, and what approving commits ══
     Approval is the last free moment: after it every generated-video slot becomes a call that
     bills. So the two numbers sit at the top of the document rather than in a report someone
     has to go and open. The source is SB_DOC.cost, written by cost-preview.js. */
  var COST = DOC.cost || null;
  if (COST) {
    var liveFp = costFingerprint(SCENES);

    var money = function (n) { return "$" + (Number(n) || 0).toFixed(2); };
    var slotRows = SCENES.map(function (s, i) {
