        return { n: i + 1, what: T.speechClipRow + (s.speaker ? " · " + s.speaker : ""), eng: "veo" };
      return null;
    }).filter(Boolean);

    h += '<section class="cost" id="cost"><div class="cost-head">' + esc(T.costHead) +
         '<span class="aside">' + (COST.asOf ? esc(T.costAsOf(COST.asOf)) : "") + "</span>" +
         '<span class="sum">' + esc(T.costSum) + " <b>" + money((Number(COST.spentUsd) || 0) + (Number(COST.forecastUsd) || 0)) +

    h += '<div class="cost-split">' +
         "<div><dt>" + esc(T.costSpent) + "</dt><div class='amt'>" + money(COST.spentUsd) + "</div></div>" +
         "<div><dt>" + esc(T.costForecast) + "</dt><div class='amt'>" + money(COST.forecastUsd) + "</div>" +
         "<dt>" + esc(T.costStills) + "</dt><div>" + money(COST.stillsUsd) + "</div>" +
         "<dt>" + esc(T.costSlots) + "</dt><div>" + esc(T.slotsN(Number(COST.slots) || 0)) + "</div></div></div>";
    if (slotRows.length) {
      h += '<ul class="cost-rows">' + slotRows.map(function (r) {
        return "<li><span class='who'>" + esc(T.shot(r.n)) + "</span><span>" + esc(r.what) +
               "</span><span class='amt2'>" + esc(r.eng) + "</span></li>";
      }).join("") + "</ul>";
    } else {
      h += '<div class="cost-none">' + esc(T.costNone) + "</div>";
    }
    if (stale) {
      h += '<div class="cost-stale">' + esc(T.costStale) + "</div>";
      flag("bad", T.where.cost, "SB_DOC.cost is stale — the video slots changed since the snapshot (" +
                  esc(COST.fingerprint) + " → " + esc(liveFp) + "). Rerun cost-preview.js");
    }
    h += "</section>";
  } else if (SCENES.some(function (s, i) { return costFingerprint([s]) !== "none"; })) {
    // Video slots exist but nobody priced them — the approval screen would show no number
    // for the only part of the episode that spends real money.
    flag("warn", T.where.cost, "there are generated-video slots but no SB_DOC.cost — run cost-preview.js so the approval screen carries the number");
  }

  if (DOC.docNotes && DOC.docNotes.length)
    h += '<details class="docnotes"><summary>' + esc(T.designNotes(DOC.docNotes.length)) + "</summary>" +
      DOC.docNotes.map(function (n) { return '<div class="note">' + mark(n) + "</div>"; }).join("") + "</details>";
  h += "</header>";

  /* ══ Section menu ══ — only the sections this document actually draws */
  var navItems = ["timeline"];
  if (CRAFT_DRAW) navItems.push("promises");
  navItems.push("shots");
  if (COST) navItems.unshift("cost");
  if (CAST.length) navItems.push("cast");
  navItems.push("contract");
  if (DOC.prep && DOC.prep.length) navItems.push("prep");
  if (DOC.sources && DOC.sources.length) navItems.push("sources");
  if (DOC.platforms && DOC.platforms.length) navItems.push("platforms");
  if (DOC.recheck && DOC.recheck.length) navItems.push("recheck");
  h += '<nav class="docnav"><a href="#audit">' + esc(T.nav.audit) + "</a>" +
       navItems.map(function (id) {
         return '<a href="#' + id + '">' + esc(T.nav[id]) + "</a>"; }).join("") +
       '<select class="langsel" id="lang" aria-label="' + esc(T.language) + '">' +
       Object.keys(STRINGS).map(function (code) {
         return '<option value="' + code + '"' + (code === LANG ? " selected" : "") + ">" +
                esc(LANG_LABELS[code] || code) + "</option>"; }).join("") +
       "</select></nav>";

  /* ══ Timeline ══ */
  h += '<h2 class="sec" id="timeline">' + esc(T.timelineHead) +
       '<span class="aside">' + esc(T.timelineAside) + "</span></h2>";
  h += '<div class="timeline">';
  // Drawn in playback order — b-roll sits at the end of the array but actually cuts in after
  // its `after` scene (scenes-schema §broll: putting it mid-array throws off every capture index)
  // order was already computed in the header checks
  var acc = 0, marks = [];
  order.forEach(function (o) {
    var d = Math.max(0.1, o.s.duration || 1);
    marks.push({ at: acc, d: d });
    acc += d;
    h += '<div class="tl-seg ' + esc(o.s.type) + '" style="flex:' + d + '" title="' +
         esc(strip(o.s.title || o.s.type)) + '">#' + (o.i + 1) + "<small>" + esc(T.sec(o.s.duration || "?")) + "</small></div>";
  });
  if (outroSec || outroUnknown)
    h += '<div class="tl-seg outro" style="flex:' + (outroSec || 9) + '" title="' +
         esc((DOC.outro && DOC.outro.note) || T.sharedOutro) + '">' + esc(T.outroLabel) + "<small>" +
         esc(outroSec ? T.sec(outroSec) : T.lengthNotWritten) + "</small></div>";
  h += "</div>";
  h += '<div class="tl-ruler">' + marks.map(function (m) {
    return '<span style="flex:' + m.d + '">' + esc(T.sec(m.at)) + "</span>"; }).join("") +
    (outroSec ? '<span style="flex:' + outroSec + '">' + esc(T.sec(acc)) + "</span>" +
      '<span style="flex:0 0 auto">' + esc(T.sec(acc + outroSec)) + "</span>"
      : '<span style="flex:0 0 auto">' + esc(T.sec(acc)) + "</span>") + "</div>";
  if (outroUnknown) flag("warn", T.where.outro, "there is an outro scene but no SB_DOC.outro length — it does not count toward the total");

  /* ══ Promise ledger ══ — drawn only when SB_DOC.craft has content (the checks ran in the header) */
  if (CRAFT_DRAW) h += promiseSection();

  /* ══ Shot cards ══ */
  h += '<h2 class="sec" id="shots">' + esc(T.shotsHead) +
       '<span class="aside">' + esc(T.shotsAside) + "</span></h2>";
  h += '<div class="toolbar">' +
       '<label><input type="checkbox" id="tg-safe"> ' + esc(T.toggleSafe) + "</label>" +
       '<label><input type="checkbox" id="tg-subs" checked> ' + esc(T.toggleSubs) + "</label>" +
       '<span class="legend">' + esc(T.legend) + "</span>" +
       '<span style="margin-left:auto">' + esc(T.previewNote) + "</span></div>";

  var shotGroups = [];
  SCENES.forEach(function (s, i) {
    var g = grammarOf(s, i);
    var last = shotGroups[shotGroups.length - 1];
    if (hasSceneField && last && last.scene === g.scene) last.items.push({ s: s, i: i, g: g });
    else shotGroups.push({ scene: g.scene, slug: g.slug, sequence: g.sequence, items: [{ s: s, i: i, g: g }] });
  });

  var carryNoted = false, prevSeq = "";
  shotGroups.forEach(function (grp) {
    if (grp.sequence && grp.sequence !== prevSeq) {
      h += '<div class="seq-head">' + esc(T.sequence(grp.sequence)) + "</div>";
      prevSeq = grp.sequence;
    }
    if (hasSceneField)
      h += '<section class="scene-band"><div class="scene-band-head"><span class="sn">S#' +
           esc(String(grp.scene)) + "</span><span>" + esc(grp.slug || T.sceneNamed(grp.scene)) + "</span></div>";
    grp.items.forEach(function (item) {
    var s = item.s, i = item.i, g = item.g, no = i + 1;
    // sceneNotes · audioNotes · privacy are keyed by scene number, not shot number.
    // When one scene holds several shots, they attach to that scene's first shot only.
    var sceneKey = g.scene, firstOfScene = item === grp.items[0];
    var narr = s.narration || [];
    var pic = pictureOf(s), ov = overlayOf(s);
    h += '<article class="scene"><div class="scene-head">';
    h += '<span class="scene-no">' + esc(T.shotCap(no)) + " · " + esc(T.type[s.type] || s.type) + "</span>";
    if (g.size) h += '<span class="shot-size' + (T.size[g.size] ? "" : " unknown") + '">' + esc(T.size[g.size] || (g.size + " ?")) + "</span>";
    if (g.angle && T.angle[g.angle]) h += '<span class="shot-angle angle-' + esc(g.angle) + '">' + esc(T.angle[g.angle]) + "</span>";
    // A shot with no title (screen text only when needed — scenes-schema) builds its header from badges alone
    var headTitle = s.title || (s.type === "quote" ? s.text : "");
    if (headTitle) h += '<span class="scene-title">' + mark(headTitle) + "</span>";
    var beat = beatOf(s);
    if (beat && T.beat[beat])
      h += '<span class="scene-beat beat-' + beat + '">' + esc(T.beat[beat]) + "</span>";
    if (s.transition)
      h += '<span class="scene-beat beat-hooktype">' + esc(T.joinIs(s.transition)) + "</span>";
    // The cover shot also carries the opening-strategy name tag — the title and segment ① have to carry that pull
    if (s.type === "cover") {
      h += '<span class="scene-beat beat-hooktype">' + esc(T.hook[s.hookType] ||
           (s.hookType ? T.outsideFour(s.hookType) : T.strategyNotWritten)) + "</span>";
      h += '<span class="scene-beat beat-hooktype">' + esc(T.formIs(T.hookForm[s.hookForm] ||
           (s.hookForm ? T.outsideSix(s.hookForm) : T.notWritten))) + "</span>";
      h += '<span class="scene-beat beat-hooktype">' + esc(T.arcIs(T.arc[s.arc] ||
           (s.arc ? T.outsideTwo(s.arc) : T.arcDefault))) + "</span>";
    }
    // Promise tags — what this shot opens, pays, plants, collects, holds or bursts (SB_DOC.craft)
    promiseTags[i].forEach(function (t) {
      h += '<span class="scene-beat beat-promise' + (t.cls ? " " + t.cls : "") + '">' + esc(t.text) + "</span>";
    });
    h += '<span class="scene-checks">' + sceneChips[i] + "</span></div>";
    h += '<div class="shot-meta"><span class="craft">' +
         '<span class="vtag' + (pic === "ai-video" ? " gen" : "") + '">' + esc(T.pic[pic] || pic) + "</span>" +
         '<span class="vtag' + (ov === "html" ? " html" : "") + '">' + esc(overlayLabel(s)) + "</span>" +
         charsOf(s).map(function (id) {
           return '<span class="char-tag">' + esc(castName(id)) + "</span>"; }).join("") + "</span>" +
         (s.type === "outro" ? "" :
           '<span class="shot-info shot-feel' + (g.feel ? "" : " miss") + '"><b>' + esc(T.feelLabel) + "</b>" +
           esc(g.feel || T.feelMissing) + "</span>") +
         (g.info ? '<span class="shot-info"><b>' + esc(T.infoLabel) + "</b>" + esc(g.info) + "</span>" : "") +
         (g.infoType ? '<span class="shot-info"><b>' + esc(T.infoTypeLabel) + "</b>" + esc(g.infoType) + "</span>" : "") +
         (spaceTextOf(g.space) ? '<span class="shot-info"><b>' + esc(T.spaceLabel) + "</b>" + esc(spaceTextOf(g.space)) + "</span>"
            : (genStill(s) && !FILL_FRAME[g.size] ? '<span class="shot-info shot-feel miss"><b>' + esc(T.spaceLabel) + "</b>" + esc(T.spaceMissing) + "</span>" : "")) +
         "</div>";

    if (s.type === "broll") {
      var v = s.visual || {};
      h += '<div class="clip">' +
        (v.src ? '<img src="' + esc(v.src) + '" alt="b-roll source" onerror="this.remove()">' : "") +
        '<div class="meta">' +
        "<div><b>" + esc(T.brollPicture) + "</b>AI video — generated with the source photo as the parameter</div>" +
        "<div><b>" + esc(T.brollOverlay) + "</b>no overlay — the audio the video carries</div>" +
        "<div><b>" + esc(T.brollWhere) + "</b>right after shot " + ((s.after || 0) + 1) + " ends · using " + (s.duration || "?") + "s (Veo: the front of the 8s original · Seedance: generated at this length)</div>" +
        (v.src ? "<div><b>" + esc(T.brollSrc) + "</b><code>" + esc(v.src) + "</code> — the same file as the background of shot " + ((s.after || 0) + 1) + "</div>" : "") +
        (camOf(s) ? "<div><b>" + esc(T.brollCamera) + "</b>" + camHtml(camOf(s)) + "</div>"
                  : v.motion ? "<div><b>" + esc(T.brollMotion) + "</b>" + esc(v.motion) + "</div>" : "") +
        (v.audio ? "<div><b>" + esc(T.brollAudio) + "</b>" + esc(v.audio) + "</div>" : "") +
        (v.clip ? "<div><b>" + esc(T.brollOut) + "</b><code>" + esc(v.clip) + "</code></div>" : "") +
        "<div><b>" + esc(T.brollNarration) + "</b>" + (narr.length ? "present — b-roll has to be empty" : "none (the audio the video carries)") + "</div>" +
        "</div></div>";
    } else {
      var vis = s.visual || {};
      var states = revealsOf(s);
      // Segment → cut assignment: sentence j attaches to the last real cut (carry cuts excluded)
      // whose seg ≤ j. With more sentences than cuts, the last cut absorbs the rest (the screen
      // holds still and only the subtitle changes).
      var segRows = states.map(function () { return []; });
      narr.forEach(function (n, j) {
        var at = 0;
        states.forEach(function (st, k) { if (!st.carry && st.seg >= 0 && st.seg <= j) at = k; });
        segRows[at].push(j);
      });

      h += '<div class="conti">' + states.map(function (st, k) {
        var f = fit[i + ":" + k] || {};
        // Cut type — a still image, or a generated video made with an image as the parameter.
        // visual.video in scenes.js (the explicit marker) is the source of truth; without it the
        // structure decides.
        var seg = st.seg >= 0 && narr[st.seg] ? narr[st.seg] : null;
        var vt =
          recOf(s) ? [T.vtRecording, ""] :
          s.type === "outro" ? [T.vtOutro, "gen"] :
          (s.type === "quote" && vis.clip) ? [T.vtSpeechClip(engineOf(s)), "gen"] :
          vis.video ? [T.vtImgToVideo((vis.video && vis.video.engine) || engineOf(s)), "gen"] :
          (seg && /^card:/.test(seg.imgPrompt || "")) ? [T.vtTyping, "gen"] :
          (seg && seg.img) ? [T.vtArt, ""] :
          [T.vtStill, ""];
        var cell = '<div class="cut-head"><span class="no">' + esc(T.revealNo(k + 1)) + "</span>" + esc(st.label) +
          '<span class="vtag' + (vt[1] ? " " + vt[1] : "") + '">' + esc(vt[0]) + "</span></div>";

        // Screen — the text that appears on this cut. Letters inside the frame are tiny, so they are read here.
        var sc = "";
        if (recOf(s)) {
          if (s.kicker) sc += capline(null, null, esc(s.kicker));
          if (s.title) sc += capline(esc(strip(s.title)));
          if (s.type === "cover" && s.stat) sc += capline(esc(s.stat), esc(s.statLabel || ""));
          sc += (s.bullets || []).map(function (b, m) {
            return capline(esc(b.t), b.d ? esc(b.d) : null, null, m + 1); }).join("");
          // The portrait shooting overlay draws only kicker and title (screencast-overlay).
          // In landscape the captions show up in the lower third too, so printing that note
          // there would be a lie.
          if ((s.bullets || []).length && !WIDE)
            sc += capline(null, null, "captions are not rendered on screen — the dialogue and subtitles say them");
          if (s.footnote) sc += capline(null, null, esc(s.footnote));
        } else if (s.type === "cover") {
          if (k === 0) {
            if (s.kicker) sc += capline(null, null, esc(s.kicker));
            if (s.title) sc += capline(esc(strip(s.title)));
          } else if (s.stat) {
            sc += capline(esc(s.stat), esc(s.statLabel || ""));
          }
        } else if (s.type === "points") {
          if (k === 0) {
            if (s.title) sc += capline(esc(strip(s.title)));
            if (s.footnote) sc += capline(null, null, esc(s.footnote));
            if (!s.title && !s.footnote) sc += capline(null, null, esc(T.noScreenText));
          } else {
            var b = (s.bullets || [])[st.cap];
            if (b) sc += capline(esc(b.t), b.d ? esc(b.d) : null, null, st.cap + 1);
          }
        } else if (s.type === "quote") {
          if (k === 0) {
            sc += capline(esc(s.speaker || ""), esc(s.role || ""));
            // On a clip quote the quote itself never appears on screen — it goes out as audio only, so that is what is written
            if (vis.clip && s.text) sc += capline(null, null, "the quote does not appear on screen — audio only: " + esc(strip(s.text)));
          } else if (s.text) {
            sc += capline(null, esc(strip(s.text)));
          }
        } else if (s.type === "outro") {
          if (THEME.brand) sc += capline(esc(THEME.brand));
          if (s.title) sc += capline(esc(strip(s.title)), s.sub ? esc(s.sub) : null);
        }
        if (sc) cell += '<div class="cut-sec">' + esc(T.screenText) + "</div>" + sc;

        // Audio — the lines that go out during this cut
        var lines = "";
        if (st.carry && st.seg >= 0)
          lines += '<div class="cut-carry">line ' + (st.seg + 1) + " carries over — only the screen (the caption) changes</div>";
        segRows[k].forEach(function (j) {
          var n = narr[j], same = strip(n.tts) === strip(n.sub);
          lines += '<div class="cut-line"><span class="k">' + (j + 1) + '</span><div class="b">' + esc(n.tts) +
            '<span class="len"> · ' + esc(T.chars(netLen(n.tts))) + "</span>" +
            (same ? "" : '<div class="sub-diff"><b>' + esc(T.subtitleLabel) + "</b> " + esc(n.sub) + "</div>") +
            "</div></div>";
        });
        if (!lines && s.type === "quote" && vis.clip)
          lines = '<div class="cut-carry">speech clip — the actor speaks, so there is no TTS narration</div>';
        if (lines) cell += '<div class="cut-sec">' + esc(T.audioSec) + "</div>" + lines;

        return '<div class="conti-row"><figure class="panel">' +
          frame(s, st, k, f.tier || 0, f.statScale || 0) + "</figure>" +
          '<div class="cut">' + cell + "</div></div>";
      }).join("") + "</div>";

      // The same note is not repeated on every scene — only the first time.
      if (!recOf(s) && s.type === "points" && narr.length && narr.length !== states.length && !carryNoted) {
        carryNoted = true;
        h += '<div class="note">' + esc(T.carryNote(states.length, narr.length)) + "</div>";
      }

      /* Outside the cut — background, motion, prompts, audio directions */
      var meta = "";
      if (recOf(s)) {
        // The user films a shooting scene from this document — what is visible (shot), what to
        // do (action) and which file to save it as (clip) all have to be here for the shoot to work.
        meta += '<div class="shot">' + mark(vis.shot || "—") + "</div>";
        if (vis.action) meta += '<div class="row"><b>' + esc(T.metaAction) + '</b><div class="v">' + mark(vis.action) + "</div></div>";
        meta += '<div class="row"><b>' + esc(T.metaSaveAs) + '</b><div class="v"><code>' + esc(vis.clip || "— filename undecided") +
                "</code>" + (narr.length ? " · narration over it (TTS)" : " · live voice (uses the clip audio)") + "</div></div>";
      } else {
        var lineImgs = narr.filter(function (n) { return n.img; });
        if (lineImgs.length) {
          meta += '<div class="row"><b>' + esc(T.metaArt) + '</b><div class="v">one per line · ' + lineImgs.length +
               " total <span style='color:var(--faint)'>(light mode · white-background line art)</span></div></div>";
          meta += '<div class="row"><b>' + esc(T.metaKeyArt) + '</b><div class="v"><code>' + esc(vis.bg || "—") + "</code> — the source for the cover still and the thumbnail</div></div>";
          meta += lineImgs.map(function (n, j) {
            return n.imgPrompt ? '<details class="prompt"><summary>illustration ' + (j + 1) + " prompt</summary><p>" +
              esc(n.imgPrompt) + "</p></details>" : ""; }).join("");
        } else if (vis.bg || s.type === "quote") {
          meta += '<div class="row"><b>' + esc(T.metaBg) + '</b><div class="v">' +
               (vis.bg ? "<code>" + esc(vis.bg) + "</code>" : "none — speech clip or quote card") + "</div></div>";
        }
        if (camOf(s))
          meta += '<div class="row"><b>' + esc(T.metaCamera) + '</b><div class="v">' + camHtml(camOf(s)) + "</div></div>";
        else if (vis.motion)
          meta += '<div class="row"><b>' + esc(T.metaMotion) + '</b><div class="v">' + esc(vis.motion) + "</div></div>";
        if (vis.video) {
          // Motion-background scene — this image becomes the parameter for veo img2video (scenes-schema §motion background)
          meta += '<div class="row"><b>' + esc(T.metaVideo) + '</b><div class="v">' +
               T.videoFromStill(esc((vis.video && vis.video.engine) || engineOf(s)), esc(vis.bg || "?")) +
               (vis.video.clip ? " → <code>" + esc(vis.video.clip) + "</code>" : "") + "</div></div>";
          if (vis.video.prompt)
            meta += '<details class="prompt"><summary>' + esc(T.promptMotion) + "</summary><p>" + esc(vis.video.prompt) + "</p></details>";
        }
        if (vis.clip && vis.clip.prompt)
          meta += '<details class="prompt"><summary>' + esc(T.promptSpeechClip) + "</summary><p>" + esc(vis.clip.prompt) + "</p></details>";
        if (vis.bgPrompt)
          meta += '<details class="prompt"><summary>' + esc(T.promptBg) + "</summary><p>" + esc(vis.bgPrompt) + "</p></details>";
        if (vis.slide) {
          meta += '<div class="row"><b>' + esc(T.metaSlide) + '</b><div class="v"><code>' + esc(vis.slide.file || "?") +
               "</code> — authored in produce §3.6" +
               (vis.slide.kind && vis.slide.kind !== "diagram" ? " · " + esc(vis.slide.kind) : "") +
               (vis.slide.acts && vis.slide.acts.length ? " · " + esc(vis.slide.acts.join(" → ")) : "") +
               "</div></div>";
          if (vis.slide.plan)
            meta += '<details class="prompt"><summary>' + esc(T.promptSlidePlan) + "</summary><p>" + esc(vis.slide.plan) +
                 (vis.slide.labels && vis.slide.labels.length ? " · labels: " + esc(vis.slide.labels.join(", ")) : "") +
                 "</p></details>";
          if (vis.slide.subject && Array.isArray(vis.slide.subject.changes)) {
            meta += '<div class="row"><b>Subject states</b><div class="v">' +
              esc(vis.slide.subject.kind || "?") + " · " + esc(vis.slide.quality || "?") +
              vis.slide.subject.changes.map(function (change) {
                return '<p>g' + esc(change && change.group) + ": " + esc(change && change.before) +
                  " → " + esc(change && change.after) + " (" + esc(change && change.driver) + ")</p>";
              }).join("") + "</div></div>";
          }
        }
      }
      if (firstOfScene && DOC.privacy && DOC.privacy[sceneKey])
        meta += '<div class="note pv">' + esc(T.privacyNote) + mark(DOC.privacy[sceneKey]) + "</div>";
      if (firstOfScene && DOC.audioNotes && DOC.audioNotes[sceneKey])
        meta += '<div class="note">' + mark(DOC.audioNotes[sceneKey]) + "</div>";
      if (meta) h += '<div class="cmeta">' + meta + "</div>";
    }

    // Three or more scene notes fold away — what feeds the decision directly is privacy avoidance and the transition
    var sn = (firstOfScene && DOC.sceneNotes && DOC.sceneNotes[sceneKey]) || [];
    if (sn.length) {
      var body = sn.map(function (n) { return '<div class="note">' + mark(n) + "</div>"; }).join("");
      h += sn.length > 2
        ? '<details class="scenenotes"><summary>' + esc(T.designNotes(sn.length)) + "</summary>" + body + "</details>"
        : '<div class="scene-notes">' + body + "</div>";
    }
    if (DOC.transitions && DOC.transitions[i])
      h += '<div class="transition"><b>' + esc(T.transitionLabel) + "</b>" + mark(DOC.transitions[i]) + "</div>";
    h += "</article>";
    });
    if (hasSceneField) h += "</section>";
  });

  /* ══ Cast ══ — the channel characters this episode uses, with the panels that will be
     handed to the generation call. Absent SB_DOC.characters, nothing is drawn. */
  if (CAST.length) {
    h += '<h2 class="sec" id="cast">' + esc(T.castHead) +
         '<span class="aside">' + esc(T.castAside) + "</span></h2>";
    h += '<div class="cast">';
    // face → body → back is the order the reference set goes into a generation call
    // (video-model-selection §6); front and real are the older per-channel names.
    var PANEL_ORDER = ["face", "body", "back", "front", "real"];
    CAST.forEach(function (c) {
      var panels = c.panels || {};
      var shots = [], scopes = [];
      SCENES.forEach(function (s, i) {
        charEntries(s).forEach(function (e) {
          if (e.id !== c.id) return;
          shots.push("#" + (i + 1));
          if (e.scope) scopes.push("#" + (i + 1) + " " + e.scope);
        });
      });
      h += '<div class="cast-card"><div class="cast-panels">';
      var drawn = 0;
      PANEL_ORDER.forEach(function (key) {
        var src = panels[key];
        if (!src) return;
        drawn++;
        h += '<div class="cast-panel"><img src="' + esc(src) + '" alt="' + esc(c.id + " " + key) +
             '" onerror="this.style.visibility=\'hidden\'"><div class="lb">' + esc(T.panel[key] || key) + "</div></div>";
      });
      if (!drawn) h += '<div class="cast-panel"><div class="lb">no panel path written</div></div>';
      h += "</div><div>";
      h += '<div class="cast-name">' + esc(c.name || c.id) + " <code>" + esc(c.id) + "</code>" +
           (c.veo === "banned" ? " " + badge("bad", "veo banned") : "") + "</div>";
      if (c.role) h += '<div class="cast-role">' + mark(c.role) + "</div>";
      if (c.note) h += '<div class="cast-note">' + mark(c.note) + "</div>";
      h += '<div class="cast-shots"><b>' + esc(T.castShots) + "</b>" +
           (shots.length ? shots.join(" · ")
                         : "appears in no shot — check visual.character") + "</div>";
      if (scopes.length)
        h += '<div class="cast-shots"><b>' + esc(T.castScopes) + "</b>" + esc(scopes.join(" · ")) + "</div>";
      h += "</div></div>";
    });
    h += "</div>";
  }

  /* ══ Contract · sources · platforms ══ */
  h += '<h2 class="sec" id="contract">' + esc(T.contractHead) +
       '<span class="aside">' + esc(T.contractAside) + '</span></h2><table class="grid"><tbody>';
  h += "<tr><th>" + esc(T.cFormat) + "</th><td>" + esc(T.fmt[FMT_KEY] || FMT.label) + " <code>" + esc(FMT_KEY) + "</code>" +
       (window.FORMAT ? "" : ' <span class="aside">' + esc(T.cFormatDefault) + "</span>") +
       (FMT_KEY === "youtube-long-16x9"
         ? ' <span class="aside">' + esc(T.cWideNote) + "</span>" : "") +
       "</td></tr>";
  h += "<tr><th>" + esc(T.cMainLen) + "</th><td>" + durTxt(total) + esc(T.cRecommend) +
       durTxt(FMT.totalMin) + "~" + durTxt(FMT.totalMax) + esc(T.cCap) + durTxt(FMT.totalHard) +
       (outroSec ? esc(T.cWithOutro) + durTxt(total + outroSec) : "") + "</td></tr>";
  h += "<tr><th>" + esc(T.cShotCount) + "</th><td>" + esc(T.shotsN(main.length)) + esc(T.cShotsRecommend) +
       esc(T.shotsN(FMT.sceneCountMin + "~" + FMT.sceneCountMax)) + "</td></tr>";
  if (cover) {
    h += "<tr><th>" + esc(T.cCoverTitle) + "</th><td>" + mark(cover.title) + esc(T.onScreenOf(dispLen(cover.title), 16)) + "</td></tr>";
    h += "<tr><th>" + esc(T.cArc) + "</th><td>" + (!WIDE
         ? esc(ORDER_TXT)
         : (T.arc[arc]
         ? withKey(T.arc[arc], arc) + (cover.arc ? "" : " (" + esc(T.arcDefault) + ")") + " — " + esc(ORDER_TXT) +
           esc(storyArc ? T.arcStoryNote : T.arcAnswerNote)
         : "<code>" + esc(arc) + "</code>" + esc(T.cOutsideTwo))) + "</td></tr>";
    h += "<tr><th>" + esc(T.cOpening) + "</th><td>" + (T.hook[cover.hookType]
         ? withKey(T.hook[cover.hookType], cover.hookType) + esc(T.openingNote)
         : (cover.hookType ? "<code>" + esc(cover.hookType) + "</code>" + esc(T.cOutsideFour) : esc(T.cNotWritten)) +
           esc(T.oneOfFour)) + "</td></tr>";
    h += "<tr><th>" + esc(T.cHookForm) + "</th><td>" + (T.hookForm[cover.hookForm]
         ? withKey(T.hookForm[cover.hookForm], cover.hookForm) + esc(T.hookFormNote)
         : (cover.hookForm ? "<code>" + esc(cover.hookForm) + "</code>" + esc(T.cOutsideSix) : esc(T.cNotWritten)) +
           esc(T.oneOfSix)) + "</td></tr>";
    h += "<tr><th>" + esc(T.cPromises) + "</th><td>" + (LOOPS.length
         ? T.promiseSummary(LOOPS.length - plantCount, plantCount, unpaid) + esc(T.promiseSummaryNote)
         : esc(T.promiseSummaryEmpty)) + "</td></tr>";
    h += "<tr><th>" + esc(T.cShotGrammar) + "</th><td>" + esc(feelGaps ? T.feelGapText(feelGaps) : T.feelAllText) +
         (sizeUnknown ? esc(T.sizeUnknownText(sizeUnknown)) : "") +
         esc(T.shotGrammarNote) + "</td></tr>";
    if (cover.statLabel) h += "<tr><th>" + esc(T.cStatLabel) + "</th><td>" + esc(cover.statLabel) + esc(T.onScreenOf(dispLen(cover.statLabel), 18)) + "</td></tr>";
  }
  h += "<tr><th>" + esc(T.cRate) + "</th><td>" +
     esc(allRec ? T.rateAllRec : hasRec ? T.rateMixed : T.rateGen(FMT.sceneMax)) + "</td></tr>";
  h += "<tr><th>" + esc(T.cTheme) + "</th><td>" + ["accent", "accent2", "ink"].map(function (k) {
    return '<span class="swatch" style="background:' + esc(THEME[k]) + '"></span><code>' + esc(THEME[k]) + "</code>"; }).join(" &nbsp; ") +
    " &nbsp; " + esc(T.cChannel) + "<code>" + esc(THEME.brand) + "</code></td></tr>";
  h += "</tbody></table>";

  if (DOC.prep && DOC.prep.length)
    h += '<h2 class="sec" id="prep">' + esc(T.prepHead) + '</h2><ul class="checklist">' +
      DOC.prep.map(function (p) { return "<li>" + mark(p) + "</li>"; }).join("") + "</ul>";

  if (DOC.sources && DOC.sources.length) {
    h += '<h2 class="sec" id="sources">' + esc(T.sourcesHead) +
      '<span class="aside">' + esc(T.sourcesAside) + "</span></h2>" +
      '<table class="grid"><thead><tr>' + T.sourceCols.map(function (c) {
        return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
    DOC.sources.forEach(function (r) {
      // A leading emoji jumps out in saturation — the content stays, only the render moves to the badge color language (review round 2)
      var st = r.status || "", stHtml = mark(st);
      var lead = st.match(/^(✅|⚠️|❌)\s*/);
      if (lead) {
        var sc = lead[1] === "✅" ? ["ok", "✓"] : lead[1] === "⚠️" ? ["warn", "!"] : ["bad", "×"];
        stHtml = '<span class="src-mark ' + sc[0] + '">' + sc[1] + "</span> " + mark(st.slice(lead[0].length));
      }
      h += "<tr><td>" + mark(r.claim) + "</td><td>" +
        (r.links || []).map(function (l) {
          return l.url ? '<a href="' + esc(l.url) + '">' + esc(l.label) + "</a>" : "<span>" + esc(l.label) + "</span>";
        }).join(" · ") + "</td><td>" + esc(r.date || "") + "</td><td>" + stHtml + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.platforms && DOC.platforms.length) {
    h += '<h2 class="sec" id="platforms">' + esc(T.platformsHead) +
      '</h2><table class="grid"><thead><tr>' + T.platformCols.map(function (c) {
        return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
    DOC.platforms.forEach(function (p) {
      h += "<tr><td><b>" + esc(p.name) + "</b></td><td>" + esc(p.form) + "</td><td>" + mark(p.note || "") + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.recheck && DOC.recheck.length)
    h += '<h2 class="sec" id="recheck">' + esc(T.recheckHead) +
      '<span class="aside">' + esc(T.recheckAside) + '</span></h2><ul class="checklist">' +
      DOC.recheck.map(function (r) { return "<li>" + mark(r) + "</li>"; }).join("") + "</ul>";

  h += '<footer class="doc-foot"><b>scenes.js is the original</b> — this document only draws it, so when a shot looks wrong, fix scenes.js. ' +
       "In this file, edit SB_DOC only (notes, audio directions, sources, platform plan).<br>" +
       '<a href="./storyboard.md">storyboard.md</a> · <a href="./script.md">script.md</a> · ' +
       '<a href="./research.md">research.md</a> · <a href="./scenes.js">scenes.js</a></footer>';

  app.innerHTML = h;

  /* Filling the check strip — nothing is missed only once every violation has been registered */
  auditSealed = true;
  // Violations first — a skimming eye has to hit them before anything else (within a level, registration order holds)
  audit = audit.filter(function (a) { return a.level === "bad"; })
    .concat(audit.filter(function (a) { return a.level !== "bad"; }));
  var nBad = audit.filter(function (a) { return a.level === "bad"; }).length;
  var nWarn = audit.length - nBad;
  var box = document.getElementById("audit");
  box.className = "audit" + (nBad ? " has-bad" : nWarn ? " has-warn" : "");
  box.innerHTML = '<div class="audit-head"><span class="dot"></span>' + esc(T.auditHead) +
    '<span class="count">' + esc(audit.length ? T.auditCount(nBad, nWarn) : T.auditClean) + "</span></div>" +
    (audit.length
      ? "<ul>" + audit.map(function (a) {
          return '<li class="' + a.level + '"><span class="where">' + esc(a.where) + "</span>" +
                 '<span class="what">' + esc(a.what) + "</span></li>"; }).join("") + "</ul>"
      : '<div class="clean">' + esc(T.auditCleanNote) + "</div>");

  var langSel = document.getElementById("lang");
  if (langSel) langSel.addEventListener("change", function () {
    try { localStorage.setItem("social-flow.lang", langSel.value); } catch (e) { /* storage blocked */ }
    var u = new URL(location.href);
    u.searchParams.set("lang", langSel.value);
    location.href = u.toString();
  });

  var safe = document.getElementById("tg-safe"), subs = document.getElementById("tg-subs");
  if (safe) safe.addEventListener("change", function () { document.body.classList.toggle("safe", safe.checked); });
  if (subs) subs.addEventListener("change", function () { document.body.classList.toggle("subs", subs.checked); });

  var who = DOC.channelName || DOC.channel || THEME.brand || "";
  document.title = (DOC.displayTitle || DOC.topic || "Storyboard") + (who ? " — Storyboard · " + who : " — Storyboard");
})();
</script>
</body>
</html>
