<!doctype html>
<html lang="ko">
<!--
  ═══════════════════════════════════════════════════════════════════════
  storyboard.html 템플릿 — 사람이 읽는 스토리보드 렌더 (scenes.js 가 SoT)
  ═══════════════════════════════════════════════════════════════════════

  사용법 (storyboard 스킬 §6):
  1. 이 파일을 data/<채널>/<주제>/storyboard/storyboard.html 로 복사한다.
  2. <title> 과 "✎ SB_DOC" 블록만 채운다 — 나머지(스타일·렌더러)는 수정 금지.
  3. 브라우저로 열면 같은 디렉토리의 scenes.js 를 로드해 그린다.

  드리프트 차단 원칙:
  - 씬 데이터(제목·대사·bullets·shot·duration·THEME)는 이 파일에 절대 적지
    않는다 — <script src="./scenes.js"> 가 로드한 window.SCENES 를 렌더러가
    그린다. scenes.js 를 고치면 이 문서는 자동으로 따라온다.
  - SB_DOC 에는 scenes.js 에 없는 편집 메타만 담는다: 핵심 메시지·씬별 주석·
    전환·개인정보 회피·출처 요약·플랫폼 계획·촬영 준비·재확인 목록.
  - 자수·말속도·씬 길이·총길이 검산은 렌더러가 계약(scenes-schema /
    shot-script-template)대로 자동 계산해 배지로 표시한다.

  모드: 촬영(screencast)·생성 모드 둘 다 지원 — visual.source==="recording"
  이면 shot 텍스트를, 아니면 visual.bg 이미지를 그린다.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{주제 표시명}} — 스토리보드 · {{채널명}}</title>
<style>
  :root {
    --accent: #5b8cff; --accent2: #a05bff; --ink: #0b1020;
    --bg: #f7f8fb; --card: #ffffff; --text: #1c2333; --muted: #66708a;
    --line: #e3e7f0; --soft: #eef1f8; --ok: #1a9e5c; --warn: #c77b00; --bad: #d13438;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141f; --card: #1a2030; --text: #e6eaf5; --muted: #93a0bd;
      --line: #2a3450; --soft: #232b40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── 헤더 ─────────────────────────────── */
  .doc-head { padding: 22px 0 6px; }
  .doc-kicker { font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .doc-title { font-size: 27px; font-weight: 800; margin: 6px 0 10px; line-height: 1.3; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .badge {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: var(--soft); color: var(--muted); border: 1px solid var(--line);
  }
  .badge.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .badge.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .badge.mode { color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; }
  .meta-grid { display: grid; grid-template-columns: 110px 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
  .meta-grid dt { color: var(--muted); font-weight: 700; }
  .meta-grid dd { margin: 0; }

  /* ── 섹션 공통 ─────────────────────────── */
  h2.sec {
    font-size: 17px; font-weight: 800; margin: 42px 0 14px; padding-top: 18px;
    border-top: 2px solid var(--line);
  }
  .note {
    background: var(--soft); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; font-size: 13.5px;
  }
  .note + .note { margin-top: 8px; }

  /* ── 타임라인 ─────────────────────────── */
  .timeline { display: flex; gap: 3px; margin: 12px 0 4px; height: 46px; }
  .tl-seg {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; color: #fff; font-size: 11.5px; font-weight: 700; min-width: 34px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ink)));
  }
  .tl-seg.cover { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .tl-seg.outro { background: var(--muted); opacity: .75; }
  .tl-seg small { font-weight: 400; opacity: .85; font-size: 10.5px; }
  .tl-cap { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }

  /* ── 씬 카드 ──────────────────────────── */
  .scene {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; margin: 18px 0; box-shadow: 0 1px 4px rgba(10,20,50,.05);
  }
  .scene-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
  .scene-no { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .04em; }
  .scene-title { font-size: 19px; font-weight: 800; }
  .scene-checks { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  /* 오버레이 미리보기 — 실제 영상 렌더 근사 */
  .overlay {
    background: var(--ink); color: #fff; border-radius: 12px;
    padding: 20px 22px; margin: 8px 0 14px;
  }
  .ov-cap { font-size: 11px; color: var(--muted); margin: -6px 0 10px; }
  .ov-kicker { font-size: 12px; font-weight: 700; opacity: .75; letter-spacing: .08em; margin-bottom: 6px; }
  .ov-title { font-size: 22px; font-weight: 800; line-height: 1.35; }
  .ov-stat { font-size: 34px; font-weight: 800; margin-top: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
  .ov-statlabel { font-size: 13px; opacity: .7; margin-top: 2px; }
  .ov-bullets { margin: 12px 0 0; padding: 0; list-style: none; }
  .ov-bullets li { padding: 5px 0; font-size: 14.5px; }
  .ov-bullets .t { font-weight: 700; }
  .ov-bullets .d { opacity: .7; font-size: 13px; margin-left: 8px; }
  .ov-foot { font-size: 11.5px; opacity: .55; margin-top: 10px; }
  .chip {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; border-radius: 6px; padding: 0 6px; font-weight: 800;
  }
  .ov-title .chip { padding: 1px 7px; }

  /* 씬 내부 블록 */
  .blk { margin: 12px 0; }
  .blk-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .05em; margin-bottom: 5px; }
  table.narr { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.narr th, table.narr td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.narr th { font-size: 12px; color: var(--muted); font-weight: 700; }
  table.narr td.n { color: var(--accent); font-weight: 800; width: 26px; }
  table.narr td.len { color: var(--muted); font-size: 12px; white-space: nowrap; width: 52px; text-align: right; }
  .sub-diff { color: var(--muted); font-size: 12.5px; }
  .shot { background: var(--soft); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
  .privacy { border-left: 3px solid var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--card));
    border-radius: 0 8px 8px 0; padding: 8px 14px; font-size: 13px; }
  .transition { font-size: 13px; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .scene-notes { margin-top: 12px; }
  .scene-notes .note { font-size: 13px; }
  img.scene-img { max-width: 240px; border-radius: 10px; display: block; margin: 8px 0; }

  /* 대사별 삽화 행 — narration[].img 가 있을 때 (왼쪽 그림 · 오른쪽 대사) */
  .narr-row { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .narr-row:last-of-type { border-bottom: none; }
  .narr-row img { width: 132px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px; flex: none; background: #fff; border: 1px solid var(--line); }
  .narr-row .txt { flex: 1; min-width: 0; }
  .narr-row .n { color: var(--accent); font-weight: 800; margin-right: 8px; }
  .narr-row .len { color: var(--muted); font-size: 12px; margin-left: 8px; white-space: nowrap; }
  .narr-row .prompt { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .narr-noimg { width: 132px; aspect-ratio: 9 / 16; border: 1px dashed var(--line); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; flex: none; }

  /* ── 검산·표 ──────────────────────────── */
  table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.grid th { font-size: 12px; color: var(--muted); }
  .swatch { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }
  ul.plain { padding-left: 20px; margin: 8px 0; }
  ul.plain li { margin: 5px 0; }
  ul.checklist { list-style: none; padding: 0; }
  ul.checklist li { padding: 5px 0 5px 26px; position: relative; }
  ul.checklist li::before { content: "☐"; position: absolute; left: 2px; color: var(--muted); }

  .doc-foot { margin-top: 48px; padding-top: 16px; border-top: 2px solid var(--line);
    font-size: 12.5px; color: var(--muted); }
  .error-box { background: color-mix(in srgb, var(--bad) 10%, var(--card)); border: 1px solid var(--bad);
    border-radius: 10px; padding: 16px 20px; margin: 30px 0; font-weight: 700; }
  @media print {
    body { background: #fff; }
    .scene { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap"><div id="app"><noscript>이 문서는 scenes.js 를 로드해 렌더됩니다 — JavaScript 를 켜 주세요.</noscript></div></div>

<script src="./scenes.js"></script>
<script>
/* ✎ SB_DOC BEGIN — 이 블록만 채운다 (scenes.js 에 없는 편집 메타 전용).
   씬 제목·대사·bullets·shot·duration 은 절대 여기 적지 않는다 — scenes.js 가 SoT 다. */
window.SB_DOC = {
  channel: "{{채널 slug}}",
  channelName: "{{채널 표시명}}",
  topic: "{{주제 slug}}",
  displayTitle: "{{주제 표시명 — 예: 소셜 페이지 만들기 1편 · 프로필 이미지}}",
  series: "{{시리즈 표기 또는 빈 문자열 — 예: 소셜 페이지 만들기 (1/3)}}",
  status: "draft",                       // draft | approved | produced | published — storyboard.md frontmatter 와 동기
  created: "{{YYYY-MM-DD}}",
  outro: { seconds: 9, note: "공용 아웃트로 — assets/outro.mp4" },   // 없으면 null
  keyMessage: "{{이 영상이 남기는 한 문장}}",
  hook: "{{커버 훅 요약 — 예: \"제목\" — 히어로 수치 X (statLabel)}}",
  seriesNote: "{{시리즈 위치·단독 소비 설계 등 — 없으면 빈 문자열}}",
  // 문서 수준 주석 — 씬에 속하지 않는 설계 결정 (없으면 [])
  docNotes: [],

  // 씬 번호(1부터) → 주석 배열. storyboard.md 주석의 요지 — 판단 근거·금지 사항.
  sceneNotes: {
    1: ["{{주석 예 — 커버 3요소 배치 근거}}"]
  },
  // 씬 i 종료 후 전환 지시 (씬 수와 동일 길이 — 마지막은 녹화 종료 안내)
  transitions: [
    "{{말 멈추고 1초 → 다음 씬 화면}}"
  ],
  // 씬 번호 → 개인정보 회피 지시 (해당 씬만)
  privacy: {},

  // 출처 요약 — research.md 검증 통과 표의 요약 (연구 원장은 research.md)
  // 내부 실측·자체 계약처럼 URL 이 없는 출처는 url 을 빈 문자열로 둔다(라벨만 표시됨).
  sources: [
    { claim: "{{주장}}", links: [ { label: "{{매체}}", url: "{{URL}}" } ], date: "{{YYYY-MM-DD}}", status: "{{✅ 독립 2개 교차 등}}" }
  ],
  // 플랫폼 계획
  platforms: [
    { name: "youtube", form: "{{쇼츠}}", note: "{{제목 키워드·해시태그·CTA}}" }
  ],
  // 촬영 전 준비 (촬영 모드 한정 — 생성 모드는 [])
  prep: [],
  // 게시 직전 재확인 (시효성 값 — 없으면 [])
  recheck: []
};
/* ✎ SB_DOC END */
</script>
<script>
/* ⚙ RENDERER — 템플릿 공통부. 수정 금지 (스타일·검산 로직 변경은 템플릿에서). */
(function () {
  "use strict";
  var app = document.getElementById("app");
  if (!window.SCENES || !window.THEME) {
    app.innerHTML = '<div class="error-box">scenes.js 를 로드하지 못했습니다 — 이 파일은 storyboard/ 디렉토리 안(scenes.js 옆)에서 열어야 합니다.</div>';
    return;
  }
  var THEME = window.THEME, SCENES = window.SCENES, DOC = window.SB_DOC || {};
  var root = document.documentElement.style;
  root.setProperty("--accent", THEME.accent);
  root.setProperty("--accent2", THEME.accent2);
  root.setProperty("--ink", THEME.ink);

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function chip(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="chip">$1</span>'); }
  function strip(s) { return String(s == null ? "" : s).replace(/\*\*/g, ""); }
  // 자수: 표시 = ** 제거 후 전체 길이 / 실자 = 공백·구두점 제외
  function dispLen(s) { return strip(s).length; }
  function netLen(s) { return strip(s).replace(/[\s.,·:;!?…"'“”‘’()\[\]〔〕\-–—~%]/g, "").length; }
  function badge(cls, text) { return '<span class="badge ' + cls + '">' + esc(text) + "</span>"; }

  var isRec = SCENES.some(function (s) { return s.visual && s.visual.source === "recording"; });
  var total = SCENES.reduce(function (a, s) { return a + (s.duration || 0); }, 0);
  var outroSec = DOC.outro ? DOC.outro.seconds || 0 : 0;
  var cover = SCENES[0] && SCENES[0].type === "cover" ? SCENES[0] : null;

  /* ── 씬별 검산 ── */
  function sceneCheck(s) {
    var syl = (s.narration || []).reduce(function (a, n) { return a + netLen(n.tts); }, 0);
    var rate = s.duration ? syl / s.duration : 0;
    var maxSent = (s.narration || []).reduce(function (a, n) { return Math.max(a, netLen(n.tts)); }, 0);
    var chips = [badge("", "~" + (s.duration || "?") + "s"), badge("", syl + "음절")];
    if (isRec) {
      chips.push(badge(rate >= 4.5 && rate <= 6.5 ? "ok" : "warn", rate.toFixed(2) + "자/초"));
      if (s.duration > 20) chips.push(badge("bad", "20s 초과"));
      else if (s.duration < 8) chips.push(badge("warn", "8s 미만"));
      if (maxSent > 40) chips.push(badge("warn", "문장 " + maxSent + "자"));
    } else {
      var cap = s.type === "cover" ? 40 : 50;
      chips.push(badge(syl <= cap ? "ok" : "bad", "자수 " + syl + "/" + cap));
      if (maxSent > 25 || ((s.narration || []).length && (s.narration || []).some(function (n) { return netLen(n.tts) < 8; })))
        chips.push(badge("warn", "문장 8~25자 확인"));
      if (s.duration > 13) chips.push(badge("warn", "13s 초과"));
    }
    return chips.join("");
  }

  /* ── 헤더 ── */
  var h = "";
  h += '<header class="doc-head">';
  h += '<div class="doc-kicker">' + esc(DOC.channelName || DOC.channel || THEME.brand) +
       (DOC.series ? " · " + esc(DOC.series) : "") + "</div>";
  h += '<h1 class="doc-title">' + esc(DOC.displayTitle || DOC.topic) + " — 스토리보드</h1>";
  h += '<div class="badges">' + badge("mode", isRec ? "촬영 모드 (screencast)" : "생성 모드") +
       badge("", "status: " + (DOC.status || "draft")) + badge("", DOC.created || "") +
       badge(total >= 60 && total <= 75 ? "ok" : total <= 90 ? "warn" : "bad",
             "본편 " + total + "s (목표 60~75 · 상한 90)") +
       (outroSec ? badge("", "+아웃트로 ≈" + (total + outroSec) + "s") : "") + "</div>";
  h += '<dl class="meta-grid">';
  if (DOC.keyMessage) h += "<dt>핵심 메시지</dt><dd>" + chip(DOC.keyMessage) + "</dd>";
  if (DOC.hook) h += "<dt>커버 훅</dt><dd>" + chip(DOC.hook) + "</dd>";
  if (DOC.seriesNote) h += "<dt>시리즈</dt><dd>" + chip(DOC.seriesNote) + "</dd>";
  h += "<dt>SoT</dt><dd><code>scenes.js</code> — 이 문서는 씬 데이터를 복사하지 않고 직접 로드해 그린다</dd>";
  h += "</dl>";
  if (DOC.docNotes && DOC.docNotes.length)
    h += DOC.docNotes.map(function (n) { return '<div class="note">' + chip(n) + "</div>"; }).join("");
  h += "</header>";

  /* ── 타임라인 ── */
  h += '<h2 class="sec">타임라인</h2><div class="tl-cap">칸 너비 = 씬 길이 비례</div><div class="timeline">';
  SCENES.forEach(function (s, i) {
    h += '<div class="tl-seg ' + esc(s.type) + '" style="flex:' + (s.duration || 1) + '" title="' +
         esc(strip(s.title || s.type)) + '">씬' + (i + 1) + "<small>" + (s.duration || "?") + "s</small></div>";
  });
  if (outroSec) h += '<div class="tl-seg outro" style="flex:' + outroSec + '" title="' +
                     esc((DOC.outro && DOC.outro.note) || "아웃트로") + '">아웃트로<small>≈' + outroSec + "s</small></div>";
  h += "</div>";

  /* ── 씬 카드 ── */
  h += '<h2 class="sec">씬 구성</h2>';
  SCENES.forEach(function (s, i) {
    var no = i + 1;
    var hasLineImgs = (s.narration || []).some(function (n) { return n.img; });
    h += '<article class="scene"><div class="scene-head">';
    h += '<span class="scene-no">씬 ' + no + " · " + esc(s.type) + "</span>";
    h += '<span class="scene-title">' + chip(s.title || "") + "</span>";
    h += '<span class="scene-checks">' + sceneCheck(s) + "</span></div>";

    // 오버레이 미리보기 — 촬영 모드는 실제 렌더 필드만
    h += '<div class="overlay">';
    if (s.kicker) h += '<div class="ov-kicker">' + esc(s.kicker) + "</div>";
    h += '<div class="ov-title">' + chip(s.title || "") + "</div>";
    if (s.type === "cover" && s.stat) {
      h += '<div class="ov-stat">' + esc(s.stat) + "</div>";
      if (s.statLabel) h += '<div class="ov-statlabel">' + esc(s.statLabel) +
        " <span style='opacity:.6'>(" + dispLen(s.statLabel) + "/18자)</span></div>";
    }
    if (!isRec && s.bullets) {
      h += '<ul class="ov-bullets">' + s.bullets.map(function (b) {
        return '<li><span class="t">' + esc(b.t) + '</span><span class="d">' + esc(b.d || "") + "</span></li>"; }).join("") + "</ul>";
      if (s.footnote) h += '<div class="ov-foot">' + esc(s.footnote) + "</div>";
    }
    h += "</div>";
    h += '<div class="ov-cap">화면 오버레이 미리보기 — ' +
         (isRec ? "촬영 모드는 kicker·title" + (s.type === "cover" ? "·stat·statLabel" : "") + "만 렌더된다" :
                  "생성 배경 위에 렌더된다") +
         (s.type === "cover" ? " · title 표시 " + dispLen(s.title) + "/16자 · 리빌: rg1=title←세그① / rg2=stat←세그②" : "") +
         (!isRec && s.type === "points" ? " · 실제 화면엔 캡션이 <b>한 번에 하나씩</b> 상단 블록에 스왑된다(여기 나열은 데이터 확인용)" : "") + "</div>";

    // 나레이션 — narration[].img 가 있으면 대사별 삽화 행(왼쪽 그림 · 오른쪽 대사), 없으면 표
    if (s.narration && s.narration.length) {
      h += '<div class="blk"><div class="blk-label">' +
           (isRec ? "대사 (번호 = 세그먼트 = 리빌)" : hasLineImgs ? "대사별 삽화 (번호 = 세그먼트)" : "나레이션 세그먼트") + "</div>";
      if (hasLineImgs) {
        s.narration.forEach(function (n, j) {
          var same = strip(n.tts) === strip(n.sub);
          h += '<div class="narr-row">' +
               (n.img ? '<img src="' + esc(n.img) + '" alt="scene-' + no + "-line-" + (j + 1) + '" loading="lazy">'
                      : '<div class="narr-noimg">삽화 없음</div>') +
               '<div class="txt"><span class="n">' + (j + 1) + "</span>" + esc(n.tts) +
               '<span class="len">' + netLen(n.tts) + "자</span>" +
               (same ? "" : '<div class="sub-diff">자막: ' + esc(n.sub) + "</div>") +
               (n.imgPrompt ? '<div class="prompt">imgPrompt: ' + esc(n.imgPrompt) + "</div>" : "") +
               "</div></div>";
        });
      } else {
        h += '<table class="narr"><tbody>';
        s.narration.forEach(function (n, j) {
          var same = strip(n.tts) === strip(n.sub);
          h += '<tr><td class="n">' + (j + 1) + "</td><td>" + esc(n.tts) +
               (same ? "" : '<div class="sub-diff">자막: ' + esc(n.sub) + "</div>") +
               '</td><td class="len">' + netLen(n.tts) + "자</td></tr>";
        });
        h += "</tbody></table>";
      }
      h += "</div>";
    }

    // bullets — 촬영 모드에서는 화면에 안 나가는 원천 데이터임을 명시
    if (isRec && s.bullets) {
      h += '<div class="blk"><div class="blk-label">bullets — 화면에 렌더되지 않음 · 캡션/대본 원천</div><ul class="plain">' +
        s.bullets.map(function (b) { return "<li><b>" + esc(b.t) + "</b>" + (b.d ? " — " + esc(b.d) : "") + "</li>"; }).join("") + "</ul>" +
        (s.footnote ? '<div class="blk-label" style="margin-top:6px">footnote: ' + esc(s.footnote) + "</div>" : "") + "</div>";
    }

    // 화면 — 촬영 지시 or 생성 이미지
    if (s.visual) {
      h += '<div class="blk"><div class="blk-label">화면' + (isRec ? " (촬영 지시 — visual.shot)" : "") + "</div>";
      if (s.visual.shot) h += '<div class="shot">' + chip(s.visual.shot) + "</div>";
      if (s.visual.bg && !hasLineImgs) h += '<img class="scene-img" src="' + esc(s.visual.bg) + '" alt="scene-' + no + '">';
      if (s.visual.bg && hasLineImgs) h += '<div class="shot">produce 폴백 배경: <code>' + esc(s.visual.bg) +
        "</code> — 대사별 삽화 스왑 지원 전까지 이 한 장을 쓴다</div>";
      if (s.visual.bgPrompt) h += '<div class="shot" style="margin-top:6px">bgPrompt: ' + esc(s.visual.bgPrompt) + "</div>";
      h += "</div>";
    }

    if (DOC.privacy && DOC.privacy[no])
      h += '<div class="privacy">🔒 개인정보 회피 — ' + chip(DOC.privacy[no]) + "</div>";

    if (DOC.sceneNotes && DOC.sceneNotes[no])
      h += '<div class="scene-notes">' + DOC.sceneNotes[no].map(function (n) {
        return '<div class="note">' + chip(n) + "</div>"; }).join("") + "</div>";

    if (DOC.transitions && DOC.transitions[i])
      h += '<div class="transition">⏭ 전환 — ' + chip(DOC.transitions[i]) + "</div>";
    h += "</article>";
  });

  /* ── 계약 검산 요약 ── */
  h += '<h2 class="sec">계약 검산 (렌더 시 자동 계산)</h2><table class="grid"><tbody>';
  h += "<tr><th>본편 총길이</th><td>" + total + "s — 목표 60~75 · 상한 90" +
       (outroSec ? " / 아웃트로 포함 ≈" + (total + outroSec) + "s" : "") + "</td></tr>";
  if (cover) {
    h += "<tr><th>커버 title</th><td>" + chip(cover.title) + " — 표시 " + dispLen(cover.title) + "/16자</td></tr>";
    if (cover.statLabel) h += "<tr><th>statLabel</th><td>" + esc(cover.statLabel) + " — 표시 " + dispLen(cover.statLabel) + "/18자</td></tr>";
  }
  h += "<tr><th>말속도 기준</th><td>" + (isRec ? "촬영 모드 5~6자/초 (4.5~6.5 허용 표시) · 씬 8~20s" : "TTS 4.5자/초 역산 · 씬 13s 상한") + "</td></tr>";
  h += "<tr><th>THEME</th><td>" + ["accent", "accent2", "ink"].map(function (k) {
    return '<span class="swatch" style="background:' + esc(THEME[k]) + '"></span><code>' + esc(THEME[k]) + "</code>"; }).join(" &nbsp; ") +
    " &nbsp; brand: " + esc(THEME.brand) + "</td></tr>";
  h += "</tbody></table>";
  if (DOC.transitions && DOC.transitions.length !== SCENES.length)
    h += '<div class="note" style="border-color:var(--warn)">⚠ SB_DOC.transitions 길이(' + DOC.transitions.length +
         ')가 씬 수(' + SCENES.length + ")와 다르다 — 씬마다 전환 1개(마지막은 녹화 종료).</div>";

  /* ── 촬영 준비·출처·플랫폼·재확인 ── */
  if (DOC.prep && DOC.prep.length) {
    h += '<h2 class="sec">촬영 전 준비</h2><ul class="checklist">' +
      DOC.prep.map(function (p) { return "<li>" + chip(p) + "</li>"; }).join("") + "</ul>";
  }
  if (DOC.sources && DOC.sources.length) {
    h += '<h2 class="sec">출처 요약 (원장: research.md)</h2><table class="grid"><thead><tr><th>주장</th><th>출처</th><th>확인일</th><th>상태</th></tr></thead><tbody>';
    DOC.sources.forEach(function (r) {
      h += "<tr><td>" + chip(r.claim) + "</td><td>" +
        (r.links || []).map(function (l) {
          return l.url ? '<a href="' + esc(l.url) + '">' + esc(l.label) + "</a>" : "<span>" + esc(l.label) + "</span>";
        }).join(" · ") +
        "</td><td>" + esc(r.date || "") + "</td><td>" + chip(r.status || "") + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.platforms && DOC.platforms.length) {
    h += '<h2 class="sec">플랫폼 계획</h2><table class="grid"><thead><tr><th>플랫폼</th><th>형태</th><th>비고</th></tr></thead><tbody>';
    DOC.platforms.forEach(function (p) {
      h += "<tr><td><b>" + esc(p.name) + "</b></td><td>" + esc(p.form) + "</td><td>" + chip(p.note || "") + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.recheck && DOC.recheck.length) {
    h += '<h2 class="sec">게시 직전 재확인 (시효성)</h2><ul class="checklist">' +
      DOC.recheck.map(function (r) { return "<li>" + chip(r) + "</li>"; }).join("") + "</ul>";
  }

  h += '<footer class="doc-foot"><b>scenes.js 가 SoT 다</b> — 이 문서는 렌더라서 씬 데이터가 틀리게 보이면 scenes.js 를 고친다. ' +
       "이 파일에서는 SB_DOC(주석·출처·플랫폼 계획)만 편집한다. 원본 문서: " +
       '<a href="./storyboard.md">storyboard.md</a> · <a href="./script.md">script.md</a> · ' +
       '<a href="./research.md">research.md</a> · <a href="./scenes.js">scenes.js</a></footer>';

  app.innerHTML = h;
  document.title = (DOC.displayTitle || DOC.topic || "스토리보드") + " — 스토리보드 · " + (DOC.channelName || THEME.brand);
})();
</script>
</body>
</html>
