<!doctype html>
<html lang="en">
<!--
  ═══════════════════════════════════════════════════════════════════════
  storyboard.html template — the storyboard people review (scenes.js is the SoT)
  ═══════════════════════════════════════════════════════════════════════

  How to use it (storyboard skill §6):
  1. Run storyboard-html.js with data/<channel>/episodes/<topic>/storyboard.
     It refreshes this shared shell and helpers in either destination; --check detects drift.
  2. Fill in only <title> and the "✎ SB_DOC" block — leave the rest (styles, renderer) alone.
  3. Open it in a browser: it loads scenes.js from the same directory and draws from it.
     The document chrome (labels, headings, the check strip) follows the reader's language —
     the picker sits at the right end of the section menu, and ?lang=en / ?lang=ko forces it.
     The episode's own copy is whatever language scenes.js is written in.

  How drift is blocked:
  - Scene data (title, dialogue, bullets, shot, duration, THEME) is never written in
    this file — the renderer draws the window.SCENES that <script src="./scenes.js">
    loaded. Fix scenes.js and this document follows on its own.
  - SB_DOC holds only editorial metadata that is not in scenes.js: core message,
    per-scene notes, transitions, audio directions, privacy avoidance, source summary,
    platform plan, shooting prep, recheck list, the scenario handoff
    (SB_DOC.scenario — references and editorial intent copied from scenario.md),
    the cast (SB_DOC.characters — the
    channel characters this episode uses, with their panel paths), and the promise
    ledger (SB_DOC.craft — every loop and plant the episode opens with the shot that
    pays it, plus the story-arc holds, burst, signature line and device).
  - Character counts, speech rate, scene length and total length are computed by the
    renderer against the contract (scenes-schema / shot-script-template) and shown as
    badges; violations are collected in the check strip at the top of the document.

  ■ Shot card structure — scene-frame sheet layout (2026-08-17 grammar units)
    · One SCENES[] entry = one shot. Entries sharing a scene number group under a scene
      band, and only a sequence with a different purpose opens a sequence line.
      Identifier names (SCENES, scene-N.png) stay as they are.
    · One reveal (the moment text appears inside the same shot) = one row. The 9:16 frame
      on the left, that reveal's screen text and dialogue on the right. A reveal is not a shot.
    · The shot header carries two production layers — the picture itself (still photo /
      AI video / recording / shared asset) and the staging over it (HTML reveal, caption,
      typing / none). Do not merge them into one badge.
    · The palette is fixed light (no dark media query — a review document is read on the
      same white ground as the print and approval screens). This layout converged over four
      adversarial designer reviews (97 points, zero P0).

  ■ Frame geometry is the produce renderer's ratios carried over as-is (rough preview)
    · Generated mode = video-template.html — text zone x 176/1080 · top 190/1920 ·
      bottom 570/1920, cover anchored bottom · points anchored top · quote/outro centered.
    · Shooting mode = screencast-overlay.html — top block y190~460 + recording band y≥460
      (build-screencast.sh BAND_MIN_Y 460 · BAND_CY 880 · BAND_MAX_H 900).
    · Subtitles = build-reel.sh ASS Style Sub — font 58 · MarginV 380 · MarginL/R 250.
    When the geometry changes in those three produce files, change the constants here too.

  Modes: both shooting (screencast) and generated are supported — visual.source==="recording"
  draws the recording-band frame, anything else draws the generated-background frame.
  With narration[].img it goes to per-line illustration mode (light) and the background
  changes with every line.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{topic display name}} — Storyboard · {{channel name}}</title>
<style>
  /* ── Tokens ──────────────────────────────────────────────
     The channel colors (--accent/--accent2/--ink) are overwritten by the renderer from THEME.
     The document palette is neutral — color carries only the channel accent and the
     verdicts (ok/warn/bad). */
  :root {
    color-scheme: light;   /* fixed light — native checkboxes included (2026-08-14) */
    --accent: #3f6cff; --accent2: #7b4dff; --ink: #0b1020;

    --bg: #fcfcfd; --card: #ffffff; --sunk: #f4f4f5;
    --text: #18181b; --muted: #52525b; --faint: #52525b;
    --line: #e4e4e7; --hair: #ebebee;
    --ok: #0f6d43; --warn: #855400; --bad: #b52f24;
    --shadow: 0 1px 2px rgba(18,20,24,.05), 0 12px 28px -22px rgba(18,20,24,.35);
    /* Links and emphasis push the channel color toward the text color to keep body-text
       legibility — the pure accent goes only where there are no letters: badge dots,
       timeline slots, swatches */
    --accent-ink: #1d4ed8;

    /* Legacy component sizes; shared review typography defines the document scale. */
    --t-micro: 11px; --t-cap: 12px; --t-aux: 13px; --t-body: 15px;
    --t-scene: 17px; --t-lead: 19px; --t-title: 29px;
    /* Spacing rhythm — 4px grid */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 36px; --s7: 56px;
    /* Preview frame width */
    --fw: 164px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: var(--t-body)/1.65 var(--review-font, sans-serif);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: var(--s6) var(--s5) 96px; }
  a { color: var(--accent-ink); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { border-bottom-color: currentColor; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }

  /* ── Header ───────────────────────────────────────────── */
  .doc-kicker {
    /* .16em tracking scatters a short Korean channel name into loose letters — label
       tracking belongs on .sec only (review round 2) */
    font-size: var(--t-cap); letter-spacing: .05em; color: var(--muted); font-weight: 600;
  }
  .doc-title {
    font-size: var(--t-title); font-weight: 700; letter-spacing: -.02em;
    margin: var(--s3) 0 var(--s4); line-height: 1.28; word-break: keep-all;
  }
  .badges { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .badge {
    font-size: var(--t-cap); font-weight: 600; padding: 3px 9px; border-radius: 5px;
    background: var(--sunk); color: var(--muted); border: 1px solid var(--hair);
    white-space: nowrap;
  }
  .badge.ok   { color: var(--ok);   background: color-mix(in srgb, var(--ok) 8%, transparent);   border-color: color-mix(in srgb, var(--ok) 24%, transparent); }
  .badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .badge.bad  { color: var(--bad);  background: color-mix(in srgb, var(--bad) 9%, transparent);  border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
  .badge.mode { color: var(--text); background: transparent; border-color: var(--line); font-weight: 700; }
  .badge.mode::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: 1px;
  }

  /* Episode visual style (visual-style.md) — the HITL choice drawn once, at the top, so the
     reader knows what every generated picture below looks like before opening a shot. The
     card is the pictogram, the preset's plain-language line and, when the choice named a
     picture, that picture; the rendering rules live in the tooltip. */
  .style-card {
    display: flex; align-items: center; gap: var(--s4); margin: var(--s4) 0 0;
    padding: var(--s3) var(--s4); border-radius: 12px; background: var(--sunk); cursor: default;
  }
  .style-card { flex-wrap: wrap; }
  .style-card .size-ico { width: 56px; height: 56px; border-radius: 22.5%; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 2px 5px rgba(0, 0, 0, .18); }
  /* The sample picture (style-samples.js): the same reading-at-a-window scene rendered in every
     preset, so the look is seen, not named. The pictogram sits in its corner as the family mark. */
  .style-card .pic { position: relative; flex: none; width: 128px; height: 128px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
  .style-card .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .style-card .pic .size-ico { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 24%; }
  .style-all { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: var(--s3) var(--s2); margin-top: var(--s2); padding-top: var(--s3); border-top: 1px solid var(--hair); }
  .style-all .kt { flex-basis: 100%; font-size: var(--t-micro); color: var(--faint); font-weight: 700; letter-spacing: .06em; }
  .style-all .k { width: 68px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; line-height: 1.2; color: var(--muted); text-align: center; word-break: keep-all; cursor: default; }
  .style-all .k img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; opacity: .8; }
  .style-all .k.on { color: var(--text); font-weight: 700; }
  .style-all .k.on img { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar .style-chip img { width: 32px; height: 32px; border-radius: 23%; object-fit: cover; flex: none; }
  .style-card .st { min-width: 0; flex: 1; }
  .style-card .st b { display: block; font-size: var(--t-body); font-weight: 700; color: var(--text); word-break: keep-all; }
  .style-card .st b small { font-size: var(--t-micro); font-weight: 600; color: var(--faint); margin-left: 8px; letter-spacing: .06em; }
  .style-card .st span { display: block; font-size: var(--t-aux); color: var(--muted); line-height: 1.5; word-break: keep-all; margin-top: 2px; }
  .style-card .st .kk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; color: var(--faint); }
  .style-card img { width: 56px; height: 56px; object-fit: cover; border-radius: 12px; flex: none; }
  .style-card.unknown .st b { color: var(--warn-ink, var(--accent-ink)); }
  /* View settings — the episode look, the preview switches and the shot legend, one card above the shots */
  .view-setup {
    margin: var(--s5) 0 0; padding: 0; overflow: hidden; border: 1px solid var(--review-glass-border, var(--line));
    border-radius: var(--review-glass-radius, 20px); background: var(--review-reading-surface, var(--card));
    box-shadow: 0 4px 20px rgb(33 54 85 / .045), inset 0 1px 0 #fff;
  }
  .view-setup-head {
    display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 16px 28px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 7%, var(--card)), color-mix(in srgb, var(--accent) 3%, var(--card)));
    list-style: none; cursor: pointer; user-select: none;
  }
  .view-setup[open] > .view-setup-head { border-bottom: 1px solid color-mix(in srgb, var(--accent) 14%, var(--hair)); }
  .view-setup-head::-webkit-details-marker { display: none; }
  .view-setup-head:hover { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .view-setup-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 20px; }
  .view-setup-ico {
    display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 2px 5px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .view-setup-ico svg { width: 19px; height: 19px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linejoin: round; }
  .view-setup-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; min-width: 0; flex: 1; }
  .view-setup-title h2 { margin: 0; font-size: 1.0625rem; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .view-setup-title small { font-size: var(--t-cap); color: var(--muted); }
  .view-setup-head::after {
    content: ""; flex: none; width: 9px; height: 9px; margin-right: 6px; border: solid var(--muted);
    border-width: 0 2px 2px 0; transform: translateY(-3px) rotate(45deg); transition: transform .15s;
  }
  .view-setup:not([open]) .view-setup-head::after { transform: rotate(-45deg); }
  .view-setup-body { padding: 20px 28px 24px; }
  .view-setup .size-key { background: var(--sunk); }
  .view-setup-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--s3); }
  .view-setup-cell { min-width: 0; padding: var(--s4); border-radius: 16px; background: var(--sunk); }
  .view-setup-kt { display: block; margin-bottom: 6px; font-size: var(--t-micro); font-weight: 700; letter-spacing: .06em; color: var(--faint); }
  .view-style { display: flex; align-items: center; gap: var(--s4); cursor: default; }
  .view-style img, .view-style .size-ico { flex: none; width: 76px; height: 76px; border-radius: 14px; object-fit: cover; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
  .view-style b { display: block; font-size: 1.0625rem; font-weight: 700; color: var(--text); word-break: keep-all; }
  .view-style.unknown b { color: var(--warn-ink, var(--accent-ink)); }
  .view-style p { margin: 4px 0 0; font-size: var(--t-aux); line-height: 1.55; color: var(--muted); word-break: keep-all; }
  .view-switches { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .switch {
    display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px 0 10px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font-size: var(--t-aux); color: var(--text); cursor: pointer; user-select: none;
  }
  .switch input {
    -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 34px; height: 20px; margin: 0;
    border-radius: 999px; background: #c4c8d0; cursor: pointer; transition: background .15s;
  }
  .switch input::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(14px); }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view-setup-note { margin: var(--s3) 0 0; font-size: var(--t-cap); color: var(--muted); }
  @media (max-width: 720px) {
    .view-setup { border-radius: 20px; }
    .view-setup-head { padding: 14px 16px; }
    .view-setup-body { padding: 16px; }
    .view-setup-grid { grid-template-columns: 1fr; }
  }

  .meta-grid {
    display: grid; grid-template-columns: 92px 1fr; gap: var(--s2) var(--s4);
    margin: var(--s5) 0 0; font-size: var(--t-body); align-items: baseline;
  }
  .meta-grid dt { color: var(--faint); font-size: var(--t-aux); font-weight: 600; }
  .meta-grid dd { margin: 0; word-break: keep-all; }

  /* Check strip — collects contract violations at the top of the document */
  .audit {
    margin: var(--s5) 0 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); overflow: hidden;
  }
  .audit-head {
    display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4);
    font-size: var(--t-aux); font-weight: 700; border-bottom: 1px solid var(--hair);
  }
  .audit-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .audit.has-warn .audit-head .dot { background: var(--warn); }
  .audit.has-bad  .audit-head .dot { background: var(--bad); }
  .audit-head .count { margin-left: auto; color: var(--text); font-weight: 600; }
  .audit ul { margin: 0; padding: var(--s3) var(--s4) var(--s3) 0; list-style: none; }
  .audit li {
    display: grid; grid-template-columns: 84px 1fr; gap: var(--s3);
    padding: var(--s1) var(--s4); font-size: var(--t-aux);
  }
  .audit li .where { color: var(--text); font-weight: 700; }
  /* Color alone never carries the difference — a violation has to show in grayscale
     print and to a color-blind reader */
  .audit li .where::before { content: "· "; color: var(--faint); font-weight: 400; }
  .audit li.bad .where::before { content: "! "; color: var(--bad); font-weight: 700; }
  .audit li.bad  .what { color: var(--bad); }
  .audit li.warn .what { color: var(--warn); }
  .audit li.warn .where { font-weight: 600; color: var(--muted); }
  .audit .clean { padding: var(--s3) var(--s4); font-size: var(--t-aux); color: var(--muted); }

  /* Cost panel — what has been billed already, and what approving commits.
     Same frame as the check strip: this is a number the approver reads before deciding,
     not a report they go looking for. */
  .cost {
    margin: var(--s5) 0 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); overflow: hidden;
  }
  .cost-head {
    display: flex; align-items: baseline; gap: var(--s2); padding: var(--s3) var(--s4);
    font-size: var(--t-aux); font-weight: 700; border-bottom: 1px solid var(--hair);
  }
  .cost-head .sum { margin-left: auto; font-variant-numeric: tabular-nums; }
  .cost-head .sum b { font-size: var(--t-body); }
  .cost-split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair);
  }
  .cost-split > div { background: var(--card); padding: var(--s3) var(--s4); }
  .cost-split dt { color: var(--faint); font-size: var(--t-aux); font-weight: 600; }
  .cost-split .amt {
    font-size: var(--t-body); font-weight: 700; font-variant-numeric: tabular-nums;
    margin: 2px 0 var(--s2);
  }
  .cost-rows { margin: 0; padding: 0 0 var(--s3); list-style: none; }
  .cost-rows li {
    display: grid; grid-template-columns: 62px 1fr auto; gap: var(--s3); align-items: baseline;
    padding: var(--s1) var(--s4); font-size: var(--t-aux); color: var(--muted);
  }
  .cost-rows li .who { color: var(--text); font-weight: 700; }
  .cost-rows li .amt2 { font-variant-numeric: tabular-nums; color: var(--text); }
  .cost-stale { padding: var(--s2) var(--s4) var(--s3); font-size: var(--t-aux); color: var(--bad); }
  .cost-none { padding: var(--s3) var(--s4); font-size: var(--t-aux); color: var(--muted); }
  @media (max-width: 640px) { .cost-split { grid-template-columns: 1fr; } }

  .note {
    background: var(--sunk); border-radius: 8px; padding: var(--s3) var(--s4);
    margin: var(--s2) 0; font-size: var(--t-aux); line-height: 1.6; color: var(--text);
    border-left: 2px solid var(--line);
  }
  .note.pv { border-left-color: var(--bad); }

  /* ── Sections ─────────────────────────────────────────── */
  .sec {
    font-size: var(--t-cap); font-weight: 700; letter-spacing: .14em; color: var(--faint);
    margin: var(--s7) 0 var(--s4); padding-bottom: var(--s2);
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 56px;   /* the sticky menu must not cover the heading it jumped to */
  }
  .sec .aside { float: right; font-weight: 500; letter-spacing: 0; color: var(--faint); }

  /* ── Section menu ─────────────────────────────────────── */
  .docnav {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; gap: var(--s1);
    padding: var(--s2) 0; margin-top: var(--s4);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .docnav a {
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .1em;
    color: var(--faint); background: var(--card);
    border: 1px solid var(--hair); border-radius: 5px; padding: 4px 10px;
  }
  .docnav a:hover {
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .docnav .langsel {
    margin-left: auto; font: inherit;
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .1em;
    color: var(--faint); background: var(--card);
    border: 1px solid var(--hair); border-radius: 5px; padding: 4px 8px;
  }

  /* ── Cast ─────────────────────────────────────────────── */
  .cast { display: grid; gap: var(--s4); }
  .cast-card {
    display: grid; grid-template-columns: auto 1fr; gap: var(--s4);
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    padding: var(--s4); box-shadow: var(--shadow);
  }
  .cast-panels { display: flex; gap: var(--s2); }
  .cast-panel img {
    width: 96px; height: 144px; object-fit: contain; display: block;
    background: var(--sunk); border: 1px solid var(--hair); border-radius: 6px;
  }
  .cast-panel .lb {
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .08em;
    color: var(--faint); text-align: center; padding-top: var(--s1);
  }
  .cast-name { font-size: var(--t-scene); font-weight: 700; }
  .cast-name code { font-weight: 500; color: var(--muted); font-size: var(--t-aux); }
  .cast-role, .cast-note {
    font-size: var(--t-aux); margin-top: var(--s2); word-break: keep-all; line-height: 1.7;
  }
  .cast-role { color: var(--text); }
  .cast-note { color: var(--muted); }
  .cast-shots { font-size: var(--t-micro); color: var(--faint); margin-top: var(--s3); }
  .cast-shots b { color: var(--faint); letter-spacing: .08em; margin-right: var(--s2); }

  /* ── Camera slots ─────────────────────────────────────── */
  .cam { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s1); }
  .cam span {
    font-size: var(--t-micro); color: var(--text); background: var(--sunk);
    border: 1px solid var(--hair); border-radius: 4px; padding: 2px 7px;
  }
  .cam b { color: var(--faint); font-weight: 700; letter-spacing: .06em; margin-right: 5px; }
  .cam .miss {
    color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, transparent);
    border-color: color-mix(in srgb, var(--bad) 30%, transparent);
  }
  .char-tag {
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .06em;
    color: var(--accent-ink); border-radius: 4px; padding: 2px 7px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  }

  /* ── Timeline ─────────────────────────────────────────── */
  .timeline { display: flex; gap: 2px; height: 40px; }
  .tl-seg {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 4px; font-size: var(--t-micro); font-weight: 700; min-width: 26px;
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
    color: var(--text);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    overflow: hidden; white-space: nowrap;
  }
  /* The cover slot stands out by weight, not saturation — white letters on the channel
     color lose contrast depending on the hue */
  .tl-seg.cover {
    background: color-mix(in srgb, var(--accent) 26%, var(--card));
    color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tl-seg.broll { background: repeating-linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 14%, var(--card)) 0 5px,
      color-mix(in srgb, var(--accent) 5%, var(--card)) 5px 10px); }
  .tl-seg.outro { background: var(--sunk); color: var(--muted); border-color: var(--line); }
  .tl-seg.outro small { opacity: 1; }
  .tl-seg small { font-weight: 500; opacity: .8; font-size: 10px; }
  .tl-ruler { display: flex; margin-top: var(--s1); font-size: 10px; color: var(--faint); }
  .tl-ruler span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 1px solid var(--line); padding-left: 3px; }
  .tl-ruler span:last-child { text-align: right; border-left: none; border-right: 1px solid var(--line); padding: 0 3px 0 0; }
  .tl-cap { font-size: var(--t-cap); color: var(--faint); margin-bottom: var(--s2); }

  /* ── Scenario handoff ─────────────────────────────────── */
  .scenario-summary {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3);
  }
  .scenario-card {
    min-width: 0; padding: var(--s4); border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); box-shadow: var(--shadow);
  }
  .scenario-card.wide { grid-column: 1 / -1; }
  .scenario-card .k {
    display: block; margin-bottom: var(--s1); color: var(--faint); font-size: var(--t-micro);
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .scenario-card .v { color: var(--text); line-height: 1.65; word-break: keep-all; }
  .scenario-arrow { color: var(--accent-ink); font-weight: 700; padding: 0 var(--s1); }
  .scenario-anchor-list { margin: 0; }
  .scenario-anchor-list > div {
    display: grid; grid-template-columns: minmax(104px, .32fr) 1fr; gap: var(--s3);
    padding: var(--s2) 0; border-top: 1px solid var(--hair);
  }
  .scenario-anchor-list > div:first-child { border-top: 0; padding-top: 0; }
  .scenario-anchor-list dt { color: var(--faint); font-size: var(--t-aux); font-weight: 700; }
  .scenario-anchor-list dd { margin: 0; word-break: keep-all; }
  .scenario-curve {
    margin-top: var(--s4); padding: var(--s4); border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); overflow-x: auto;
  }
  .scenario-curve svg { display: block; width: 100%; min-width: 630px; height: auto; }
  .scenario-curve .axis { stroke: var(--line); stroke-width: 1; }
  .scenario-curve .guide { stroke: var(--hair); stroke-width: 1; stroke-dasharray: 3 5; }
  .scenario-curve .feel-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .scenario-curve .feel-bar { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
  .scenario-curve .feel-point { fill: var(--card); stroke: var(--accent); stroke-width: 3; }
  .scenario-curve .feel-point.land { fill: var(--accent); }
  .scenario-items {
    display: grid; grid-template-columns: repeat(7, minmax(88px, 1fr)); gap: var(--s2);
    min-width: 630px; margin-top: var(--s2);
  }
  .scenario-item {
    padding: var(--s2); border: 1px solid var(--hair); border-radius: 8px; background: var(--sunk);
    text-align: center;
  }
  .scenario-item.land { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .scenario-item b { display: block; font-size: var(--t-cap); }
  .scenario-item small { display: block; color: var(--muted); margin-top: 2px; }
  .scenario-item .missing { color: var(--warn); font-weight: 700; }

  /* ── Sequence · scene band · shot card ────────────────── */
  /* The sequence cards title the shot list. The heading stays for screen readers and for the
     scripts that anchor on #shots (review-layout.js, location-review-runtime.js). */
  #shots { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; padding: 0; border: 0; }
  /* Sequence — a collapsible title card; its scene bands sit in the body below */
  .seq { margin: var(--s5) 0 0; }
  .seq-head {
    display: flex; align-items: flex-start; gap: var(--s4); padding: 22px 28px; list-style: none; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius: 24px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 13%, var(--card)), color-mix(in srgb, var(--accent) 4%, var(--card)) 60%);
    box-shadow: 0 4px 20px rgb(33 54 85 / .05), inset 0 1px 0 #fff; transition: box-shadow .15s;
  }
  .seq-head::-webkit-details-marker { display: none; }
  .seq-head:hover { box-shadow: 0 6px 24px rgb(33 54 85 / .09), inset 0 1px 0 #fff; }
  .seq-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .seq-no {
    display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); color: #fff;
    font-size: 1.125rem; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 8px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .seq-main { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .seq-kicker { font-size: var(--t-micro); font-weight: 700; letter-spacing: .12em; color: var(--accent-ink); }
  .seq-title { font-size: 1.375rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.35; color: var(--text); word-break: keep-all; }
  .seq-purpose { margin-top: 2px; font-size: var(--t-aux); line-height: 1.6; color: var(--muted); word-break: keep-all; }
  .seq-question {
    align-self: flex-start; margin-top: 6px; padding: 6px 12px; border-radius: 10px;
    background: rgb(255 255 255 / .7); font-size: var(--t-cap); line-height: 1.5; color: var(--text); word-break: keep-all;
  }
  .seq-question b { color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
  .seq-stats {
    display: flex; align-items: center; gap: var(--s3); flex: none; padding-top: 4px;
    font-size: var(--t-cap); font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .seq-stats::after {
    content: ""; width: 9px; height: 9px; border: solid var(--muted); border-width: 0 2px 2px 0;
    transform: translateY(-3px) rotate(45deg); transition: transform .15s;
  }
  .seq:not([open]) .seq-stats::after { transform: rotate(-45deg); }
  .seq-body { padding: var(--s2) 0 0 var(--s5); margin-left: 23px; border-left: 2px solid color-mix(in srgb, var(--accent) 18%, transparent); }
  @media (max-width: 720px) {
    .seq-head { flex-wrap: wrap; padding: 18px 16px; border-radius: 20px; gap: var(--s3); }
    .seq-no { width: 40px; height: 40px; border-radius: 12px; font-size: 1rem; }
    .seq-main { flex-basis: calc(100% - 56px); }
    .seq-stats { margin-left: 52px; padding-top: 0; }
    .seq-body { padding-left: 0; margin-left: 0; border-left: 0; }
  }
  /* Scene — a subtitle card under its sequence: an outlined number tile (the sequence's is
     filled), a tinted surface with an accent rail, and the story the scene carries (structure scene.summary) */
  .scene-band { margin: var(--s4) 0 0; }
  .scene-band + .scene-band { margin-top: var(--s5); }
  .scene-band-head {
    position: relative; display: flex; align-items: flex-start; gap: var(--s4); padding: 16px 20px 16px 22px;
    border: 1px solid color-mix(in srgb, var(--accent) 14%, var(--line)); border-radius: 16px;
    background: linear-gradient(100deg, color-mix(in srgb, var(--accent) 6%, var(--card)), var(--card) 65%);
    box-shadow: 0 2px 10px rgb(33 54 85 / .04); list-style: none; cursor: pointer; transition: box-shadow .15s;
  }
  .scene-band-head::before {
    content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0;
    background: var(--accent);
  }
  .scene-band-head::-webkit-details-marker { display: none; }
  .scene-band-head:hover { box-shadow: 0 4px 16px rgb(33 54 85 / .08); }
  .scene-band-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .scene-band-head .sn {
    display: grid; place-content: center; flex: none; width: 42px; height: 42px; border-radius: 12px;
    border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--card);
    color: var(--accent-ink); text-align: center; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .scene-band-head .sn small { font-size: 9px; font-weight: 700; letter-spacing: .08em; opacity: .7; }
  .scene-band-head .sn b { margin-top: 2px; font-size: 1.0625rem; font-weight: 750; letter-spacing: -.02em; }
  .scene-band-main { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .scene-band-kicker { display: flex; align-items: center; gap: 5px; font-size: var(--t-micro); font-weight: 600; color: var(--faint); }
  .scene-band-kicker svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }
  .scene-band-title { font-size: var(--t-scene); font-weight: 700; letter-spacing: -.01em; line-height: 1.4; color: var(--text); word-break: keep-all; }
  .scene-band-head .scene-turn { font-size: var(--t-cap); color: var(--muted); word-break: keep-all; }
  .music-lane { font-size: var(--t-cap); font-weight: 600; color: var(--accent-ink); word-break: keep-all; }
  .scene-band-synopsis { max-width: 68ch; margin: 4px 0 0; font-size: var(--t-aux); line-height: 1.65; color: var(--muted); word-break: keep-all; }
  .scene-band-stats {
    display: flex; align-items: center; gap: var(--s3); flex: none; padding-top: 2px;
    font-size: var(--t-cap); font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .scene-band-stats::after {
    content: ""; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0;
    transform: translateY(-2px) rotate(45deg); transition: transform .15s;
  }
  .scene-band:not([open]) .scene-band-stats::after { transform: rotate(-45deg); }
  .scene-band-body { padding-top: var(--s3); }
  @media (max-width: 720px) {
    .scene-band-head { flex-wrap: wrap; gap: var(--s3); padding: 14px 14px 14px 16px; }
    .scene-band-head .sn { width: 36px; height: 36px; border-radius: 10px; }
    .scene-band-main { flex-basis: calc(100% - 52px); }
    .scene-band-stats { margin-left: 48px; }
  }
  .scene-band .scene { margin: var(--s3) 0; }
  .scene-band .scene:first-of-type { margin-top: 0; }
  .scene-band .scene:last-of-type { margin-bottom: 0; }
  .scene {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: var(--s5); margin: var(--s4) 0; box-shadow: var(--shadow);
  }
  /* The scene-frame card is narrowed to the width it actually uses (frame 156 + gap 24 +
     content ≤560) — stretched to 1060px the right quarter shows as empty background
     (design review round 3) */
  .scene:has(.conti) { max-width: 760px; }
  .scene-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2) 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hair, #eceef2); }
  .scene-no {
    display: grid; place-content: center; flex: none; width: 40px; height: 40px; border-radius: 11px;
    background: #1d2330; color: #fff; text-align: center; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .scene-no small { font-size: 8.5px; font-weight: 700; letter-spacing: .08em; color: rgb(255 255 255 / .62); }
  .scene-no b { margin-top: 2px; color: #fff; font-size: 15px; font-weight: 750; letter-spacing: -.01em; }
  .scene-title { font-size: 19px; font-weight: 700; letter-spacing: -.015em; word-break: keep-all; min-width: 0; }
  .scene-dur {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 9px; border-radius: 999px;
    background: var(--sunk); color: var(--muted); font-size: var(--t-cap); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .scene-dur svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .scene-beat { font-size: var(--t-micro); font-weight: 700; letter-spacing: .1em; color: var(--accent-ink); }
  .scene-beat.beat-result { color: var(--ok); }
  .scene-beat.beat-body { color: var(--faint); }
  .scene-beat.beat-turn { color: var(--accent-ink); text-decoration: underline; }
  .scene-beat.beat-hooktype { color: var(--accent-ink); opacity: .8; }
  .scene-beat.beat-music { letter-spacing: .02em; }
  /* Promise tags — a shot that opens or pays a loop, plants or collects, holds or bursts.
     Dashed so they read as editorial (SB_DOC.craft), not as a playback role. */
  .scene-beat.beat-promise {
    color: var(--muted); letter-spacing: .04em; font-weight: 600;
    border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px;
  }
  .scene-beat.beat-promise.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .scene-beat.beat-promise.warn { color: var(--warn); border-style: solid; border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  table.grid.ledger td:last-child { font-size: var(--t-micro); color: var(--muted); }
  .scene-checks { margin-left: auto; display: flex; gap: var(--s1); flex-wrap: wrap; }
  /* Three or more badges bunched together drop to the line below the title, so the badges
     do not push the title into a wrap (review round 3) */

  /* Scene-frame layout — one reveal = one row, the 9:16 frame on the left · that reveal's
     content on the right. Text is centered vertically with a width cap — short content
     used to pile up top-left and make the row look like an empty box (design review round 1). */
  .conti { --fw: 156px; margin-top: var(--s4); }
  .conti-row {
    display: grid; grid-template-columns: var(--fw) minmax(0, 1fr);
    gap: var(--s5); align-items: center; padding: var(--s4) 0;
    border-top: 1px solid var(--hair);
  }
  .conti-row:first-child { border-top: none; padding-top: 0; }
  .conti-row:last-child { padding-bottom: 0; }
  .conti-row.has-frame-pair { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); }
  .frame-inputs { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; align-self: start; }
  .frame-inputs.single { grid-template-columns: 1fr; width: var(--fw); }
  .frame-inputs figure { margin: 0; min-width: 0; }
  .frame-inputs .reference-input img { height: 144px; aspect-ratio: auto; }
  .frame-inputs img { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: var(--sunk); border-radius: 8px; display: block; }
  .frame-inputs.wide img { aspect-ratio: 16 / 9; }
  .frame-inputs video { width: 100%; aspect-ratio: 9 / 16; object-fit: contain; background: var(--sunk); border-radius: 8px; display: block; }
  .frame-inputs.wide video { aspect-ratio: 16 / 9; }
  .frame-inputs figcaption { font-size: var(--t-aux); font-weight: 600; margin-bottom: 8px; }
  .frame-inputs .pending-frame { aspect-ratio: 9 / 16; display:grid; place-items:center; padding:12px; background:var(--sunk); border:1px dashed var(--line); color:var(--muted); }
  .frame-inputs .frame-reason { grid-column:1/-1; font-size:var(--t-aux); color:var(--muted); }
  @media (max-width: 700px) { .conti-row.has-frame-pair { grid-template-columns:1fr; } .frame-inputs { max-width:360px; } }
  .panel { margin: 0; width: var(--fw); }

  .cut { min-width: 0; max-width: 560px; }
  /* Shot body — the video's inputs on the left, the lines on the right */
  .shot-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--s5); margin-top: var(--s4); align-items: start; }
  .shot-media { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
  .shot-frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
  .shot-frame { margin: 0; min-width: 0; }
  .shot-frame figcaption { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: var(--t-cap); font-weight: 700; color: var(--text); }
  .shot-frame-flag { padding: 1px 7px; border-radius: 6px; font-size: var(--t-micro); font-weight: 600; color: var(--muted); background: var(--sunk); cursor: default; }
  .shot-frame img, .shot-frame-empty { display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; object-fit: cover; background: var(--sunk); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
  .shot-frames.wide .shot-frame img, .shot-frames.wide .shot-frame-empty { aspect-ratio: 16 / 9; }
  .shot-frame-empty { display: grid; place-items: center; padding: 12px; box-sizing: border-box; border: 1.5px dashed var(--line); box-shadow: none; background: transparent; color: var(--faint); font-size: var(--t-cap); text-align: center; }
  .shot-refs { padding: var(--s3); border-radius: 14px; background: var(--sunk); }
  .shot-refs-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: var(--s2); font-size: var(--t-cap); color: var(--muted); }
  .shot-refs-head b { color: var(--text); }
  .shot-refs-count { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .shot-refs.msr { padding: var(--s4, 16px); }
  .ref-slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .ref-slot { position: relative; margin: 0; min-width: 0; cursor: default; }
  .ref-slot img, .ref-slot .ref-missing, .ref-slot.empty { display: block; width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; background: var(--card); }
  .ref-slot figcaption { margin-top: 4px; font-size: 10.5px; line-height: 1.3; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref-slot.empty { display: grid; place-items: center; box-sizing: border-box; border: 1.5px dashed var(--line); background: transparent; color: var(--faint); font-size: var(--t-cap); }
  .ref-slot .ref-missing { display: grid; place-items: center; color: var(--faint); }
  .ref-slot.over img { outline: 2px solid var(--warn, #d9480f); outline-offset: -2px; opacity: .75; }
  .ref-off-tile { display: grid; place-items: center; width: 100%; aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed var(--line, #d0d4da);
    background: repeating-linear-gradient(135deg, transparent 0 6px, rgb(0 0 0 / .035) 6px 12px); color: var(--faint, #9aa0a8); }
  .shot-frame .ref-off-tile { border: 1.5px dashed var(--line, #d0d4da); box-shadow: none; }
  .shot-frame .ref-off-tile svg { width: 15%; }
  .ref-off-tile svg { width: 34%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .ref-over { position: absolute; top: 4px; left: 4px; padding: 1px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; color: #fff; background: var(--warn, #d9480f); }
  .shot-refs-none { margin: 0; font-size: var(--t-cap); color: var(--muted); }
  .shot-lines { min-width: 0; }
  /* Production video — a dark stage under the shot body; the cut label is the tooltip */
  .production-cut-review { margin: var(--s5) 0 0; }
  .production-cut-review .production-cut-grid { display: grid; grid-template-columns: 1fr; gap: var(--s3); }
  .production-cut-review.many .production-cut-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .production-cut-review .production-cut {
    margin: 0; overflow: hidden; border-radius: 18px; background: #0b0d12;
    box-shadow: 0 10px 30px rgb(15 23 42 / .18), 0 0 0 1px rgb(15 23 42 / .08);
  }
  .production-cut-review .production-cut video, .production-cut-review .production-cut img {
    display: block; width: 100%; max-height: 72vh; aspect-ratio: 9 / 16; object-fit: contain; background: #0b0d12; border-radius: 0;
  }
  .production-cut-review:not(.wide) .production-cut { max-width: 360px; }
  .production-cut-review.wide .production-cut video, .production-cut-review.wide .production-cut img { aspect-ratio: 16 / 9; }
  .production-cut-review .production-cut-error { margin: 0; padding: 10px 14px; font-size: var(--t-cap); color: #ffb4a8; }
  .production-cut-none {
    display: grid; place-items: center; margin-top: var(--s5); padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: 18px;
    font-size: var(--t-cap); color: var(--faint);
  }
  .shot-tabs > input { position: absolute; opacity: 0; pointer-events: none; }
  .shot-tab-nav { display: flex; gap: 2px; margin-bottom: var(--s3); padding: 3px; border-radius: 10px; background: var(--sunk); width: max-content; }
  .shot-tab-nav label { padding: 5px 14px; border-radius: 8px; font-size: var(--t-cap); font-weight: 600; color: var(--muted); cursor: pointer; }
  .shot-tab-panel { display: none; }
  .shot-tabs > input:nth-of-type(1):checked ~ .shot-tab-nav label:nth-child(1),
  .shot-tabs > input:nth-of-type(2):checked ~ .shot-tab-nav label:nth-child(2),
  .shot-tabs > input:nth-of-type(3):checked ~ .shot-tab-nav label:nth-child(3) { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .shot-tabs > input:nth-of-type(1):checked ~ .shot-tab-panels > :nth-child(1),
  .shot-tabs > input:nth-of-type(2):checked ~ .shot-tab-panels > :nth-child(2),
  .shot-tabs > input:nth-of-type(3):checked ~ .shot-tab-panels > :nth-child(3) { display: block; }
  .shot-tabs > input:focus-visible ~ .shot-tab-nav { outline: 2px solid var(--accent, #3b6cf6); outline-offset: 2px; }
  .shot-story { margin: 0; font-size: 15px; line-height: 1.7; color: var(--text); }
  .shot-prompt + .shot-prompt { margin-top: var(--s3); }
  .shot-prompt b { display: block; margin-bottom: 6px; font-size: var(--t-cap); color: var(--faint); }
  .shot-prompt pre { margin: 0; max-height: 320px; overflow: auto; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font: 12px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .shot-lines-head { margin-bottom: var(--s2); font-size: var(--t-micro); font-weight: 700; letter-spacing: .06em; color: var(--faint); }
  .review-shots { container-type: inline-size; }
  /* location-review-runtime.js mounts its background / cast / composition images here; the shot
     body above already shows what the video takes, so the mount stays (the runtime needs it) but hidden */
  [id^="image-references-"] { display: none; }
  @container (max-width: 760px) { .shot-body { grid-template-columns: 1fr; } }
  /* The reveal label sits one step above body text (15px vs 13px) so it does not read at
     the same level as the bold screen copy */
  .cut-head {
    display: flex; align-items: baseline; gap: var(--s2);
    font-size: var(--t-body); font-weight: 700; color: var(--text);
  }
  /* The reveal number/type badge and the shot header's production-layer badge are the
     same pill part. */
  .vtag, .cut-head .no {
    font-size: var(--t-micro); border-radius: 5px; padding: 2px 8px; line-height: 1.4;
    white-space: nowrap; font-weight: 600;
  }
  .cut-head .no {
    color: var(--faint); letter-spacing: .08em; font-weight: 700;
    border: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .vtag {
    color: var(--muted); background: var(--sunk); border: 1px solid var(--hair);
  }
  .cut-head .vtag { margin-left: auto; }
  .craft { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .shot-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3);
    margin: var(--s2) 0 0;
  }
  .shot-meta .shot-info { margin: 0; }
  .vtag.html {
    color: var(--text); background: transparent; border-color: var(--line);
  }
  .vtag.gen {
    color: var(--accent-ink);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-color: color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .shot-angle {
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .06em;
    color: var(--muted); border: 1px solid var(--hair); border-radius: 4px;
    padding: 2px 7px;
  }
  .shot-angle.angle-dutch, .shot-angle.angle-low, .shot-angle.angle-high, .shot-angle.angle-overhead { color: var(--accent-ink); }
  .shot-why { font-size: 0.8em; color: var(--muted); margin-left: 0.4em; }
  .shot-grammar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin: var(--s2) 0 0; }
  .technique-tiles { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  .technique-tile { flex: 1 1 180px; max-width: 350px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .technique-tile summary { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .technique-tile summary svg { flex: 0 0 40px; }
  .technique-tile p { font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
  .technique-library { margin: 20px 0; padding: 16px; border: 1px solid var(--line); }
  .shot-size { display: inline-flex; align-items: center; gap: 8px; cursor: default; border: 0; padding: 0; letter-spacing: 0; }
  .shot-size .size-ico { width: 32px; height: 32px; border-radius: 23%; }
  .shot-size .sz { display: flex; flex-direction: column; line-height: 1.15; }
  .shot-size .sz b { font-size: var(--t-cap); font-weight: 700; color: var(--text); }
  .shot-size .sz small { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; color: var(--faint); letter-spacing: .04em; }
  .shot-size.unknown .sz b { color: var(--warn-ink, var(--accent-ink)); }
  /* Pictogram tiles — one rule for every icon on the page: a soft gradient squircle per family
     and a white line glyph, 2px, round caps, no faces, no dark accents. A filled shape marks only
     the small solids (the camera dot, a lens, a figure far away). */
  .size-ico {
    width: 22px; height: 22px; flex: none; border-radius: 24%; overflow: hidden; color: #fff;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    background: linear-gradient(150deg, #a8a8ae, #6a6a72);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 1px 2px rgba(0, 0, 0, .16);
  }
  .size-ico .ico-fill { fill: currentColor; stroke: none; }
  .size-ico .ico-dim { opacity: .55; }
  .size-ico.f-wide { background: linear-gradient(150deg, #5eb4ff, #2d6fe6); }
  .size-ico.f-body { background: linear-gradient(150deg, #43d17d, #1a9a55); }
  .size-ico.f-face { background: linear-gradient(150deg, #ff9a62, #ef4a6e); }
  .size-ico.f-thing { background: linear-gradient(150deg, #ffc94d, #f08a12); }
  .size-ico.f-group { background: linear-gradient(150deg, #b48cff, #6f4fe0); }
  .size-ico.f-view { background: linear-gradient(150deg, #4fd6c9, #148fa3); }
  /* Render-route tiles (render-routing.md) — three families the eye must tell apart at a glance:
     generated video, an HTML animation, a photo with a camera move. */
  .size-ico.r-video { background: linear-gradient(150deg, #ff7aa8, #d1286c); }
  .size-ico.r-msr { background: linear-gradient(150deg, #ffb347, #e0661b); }
  .size-ico.r-html { background: linear-gradient(150deg, #3fd1a0, #128a6c); }
  .size-ico.r-photo { background: linear-gradient(150deg, #6d7ea3, #33405e); }
  .size-ico.r-asset { background: linear-gradient(150deg, #b0b0b8, #6e6e78); }
  .size-ico.a-cam { background: linear-gradient(150deg, #8e9dff, #4a50c9); }
  .size-ico.s-look { background: linear-gradient(150deg, #e2ad6b, #9a5a2c); }
  .size-ico.d-depth { background: linear-gradient(150deg, #6fc8ef, #2b6fa3); }
  .size-ico.d-unset { background: linear-gradient(150deg, #c4c4ca, #8a8a92); }
  /* Camera-move families — one move per shot, so each family gets its own hue */
  .size-ico.c-fix { background: linear-gradient(150deg, #a3afc2, #5b6678); }
  .size-ico.c-travel { background: linear-gradient(150deg, #ffb066, #e8692a); }
  .size-ico.c-lens { background: linear-gradient(150deg, #c38bff, #7d45d6); }
  .size-ico.c-turn { background: linear-gradient(150deg, #5fd0e0, #1b8aa8); }
  .size-ico.c-follow { background: linear-gradient(150deg, #6fd88a, #23995a); }
  .size-ico.c-rise { background: linear-gradient(150deg, #ffd25e, #e0901a); }
  .size-ico.c-body { background: linear-gradient(150deg, #ff8a8a, #d63c5a); }
  .size-key {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: var(--s3) var(--s1);
    margin: var(--s3) 0 0; padding: var(--s3) var(--s4); border-radius: 12px; background: var(--sunk);
  }
  .size-key .kt {
    grid-column: 1 / -1; margin: 0; font-size: var(--t-micro); color: var(--faint);
    font-weight: 700; letter-spacing: .06em;
  }
  .size-key .k {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 10.5px; line-height: 1.2; text-align: center; color: var(--muted); cursor: default; word-break: keep-all;
  }
  .size-key .k .kk { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; color: var(--faint); }
  .size-key .size-ico { width: 38px; height: 38px; border-radius: 22.5%; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 2px 4px rgba(0, 0, 0, .18); }
  /* Route keys are long snake_case words — wider cells, and the key may break mid-word */
  .cam-keys { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s3) 0 0; padding: var(--s3) var(--s4); border-radius: 12px; background: var(--sunk); }
  .cam-keys > .kt { flex-basis: 100%; font-size: var(--t-micro); color: var(--faint); font-weight: 700; letter-spacing: .06em; }
  /* The shot's plan row under its head — the legend tiles alone; each name is in the tooltip */
  .shot-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: var(--s3) 0 var(--s2); }
  .shot-chip { display: inline-flex; border-radius: 10px; cursor: default; font-size: var(--t-cap); color: var(--muted); }
  .shot-chip .size-ico, .shot-chip svg { width: 36px; height: 36px; border-radius: 10px; flex: none; }
  .shot-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shot-cast { display: flex; margin-left: auto; padding-left: var(--s3); }
  .shot-cast .shot-cast-face { flex: none; width: 36px; height: 36px; cursor: default; box-shadow: 0 0 0 2px var(--card); }
  .shot-cast .shot-cast-face + .shot-cast-face { margin-left: 6px; }
  .shot-cast .shot-cast-face:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cam-group { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s1); padding: var(--s2) var(--s3); border: 1px solid var(--hair); border-radius: 10px; background: var(--card); }
  .cam-group .kt { flex-basis: 100%; }
  .cam-group .k { width: 62px; }
  .size-key.routes { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .size-key.routes .k .kk { overflow-wrap: anywhere; }
  /* Instant tooltip for the icon tiles (data-tip) — the browser's own title tip waits a second
     and folds the line breaks, so a small box follows the pointer instead. */
  .tipbox {
    position: fixed; z-index: 50; max-width: 320px; padding: 8px 11px; border-radius: 9px;
    background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.5;
    white-space: pre-line; word-break: keep-all; pointer-events: none;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .22); opacity: 0; transition: opacity .08s;
  }
  .tipbox.on { opacity: 1; }
  .tipbox b { display: block; font-weight: 700; margin-bottom: 2px; }
  .shot-meta .shot-feel { margin: 0; flex-basis: 100%; }
  .shot-feel.miss b { color: var(--warn-ink, var(--accent-ink)); }
  .shot-info {
    margin: var(--s2) 0 0; font-size: var(--t-aux); color: var(--text);
    word-break: keep-all;
  }
  .shot-info b { color: var(--faint); font-weight: 600; margin-right: var(--s2); }
  .cut-sec {
    font-size: var(--t-micro); font-weight: 700; letter-spacing: .16em;
    color: var(--faint); margin: var(--s3) 0 var(--s1);
  }
  /* The character count is inline right after the sentence — pinned to the right edge it
     leaves a gaping hole between text and badge on short sentences (design review round 2). */
  .cut-line {
    display: flex; align-items: baseline; gap: var(--s2);
    font-size: var(--t-aux); padding: var(--s1) 0;
  }
  .cut-line .k { flex: none; min-width: 15px; color: var(--faint); font-weight: 700; font-size: var(--t-micro); }
  .cut-line .b { flex: 1 1 auto; min-width: 0; line-height: 1.6; }
  .cut-line .len { color: var(--faint); font-size: var(--t-micro); white-space: nowrap; }
  .cut-carry { font-size: var(--t-aux); color: var(--muted); padding: var(--s1) 0; }

  /* 9:16 frame — a proportional approximation of the produce renderer's geometry */
  .fr {
    position: relative; width: var(--fw); aspect-ratio: 9 / 16; overflow: hidden;
    background: var(--ink); border-radius: calc(var(--fw) * .05);
    border: 1px solid var(--line);
    font-family: var(--review-font, sans-serif);
    color: #fff; text-align: center; line-height: 1.2;
  }
  .fr .fbg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .fr .fscrim { display: none; } /* owner directive 2026-08-25: no top/bottom gradient */
  .fr.t-cover  .fscrim,
  .fr.t-points .fscrim,
  .fr.t-quote  .fscrim { background: none; }
  /* Over a speech clip (alpha) there is no full wash like the still card — only top and
     bottom scrims for the signature and the subtitles */
  .fr.t-quote.fclip .fscrim,
  .fr.light .fscrim,
  .fr.wide.rec .fscrim { background: none; }
  .fr.light { color: var(--ink); }

  /* Text zone — left/right 176/1080, top 190/1920, bottom 570/1920 */
  .fr .fzone {
    position: absolute; left: 16.30%; right: 16.30%; top: 9.90%; bottom: 29.69%;
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  }
  .fr .fzone.top { justify-content: flex-start; }
  .fr .fzone.center { justify-content: center; }

  .fr .f-kicker {
    align-self: center; font-size: calc(var(--fw) * .0315); font-weight: 700;
    letter-spacing: .1em; color: rgba(255,255,255,.92); background: rgba(5,8,20,.38);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    padding: calc(var(--fw) * .011) calc(var(--fw) * .031);
    margin-bottom: calc(var(--fw) * .028);
  }
  .fr.light .f-kicker { color: rgba(255,255,255,.95); background: color-mix(in srgb, var(--ink) 86%, transparent); }
  .fr .f-title {
    font-size: calc(var(--fw) * .0926); line-height: 1.14; font-weight: 800;
    letter-spacing: -.02em; word-break: keep-all; text-shadow: 0 1px 5px rgba(0,0,0,.55);
    margin-bottom: calc(var(--fw) * .041);
  }
  /* inline-block is what makes the width the width of the glyphs — the same value produce's
     640px guard measures */
  .fr .f-stat {
    font-size: calc(var(--fw) * var(--stat-fs, .1898)); line-height: 1; font-weight: 800;
    letter-spacing: -.03em; white-space: nowrap; display: inline-block;
  }
  .fr .f-statlabel {
    font-size: calc(var(--fw) * .037); font-weight: 600; color: rgba(255,255,255,.88);
    margin-top: calc(var(--fw) * .02); word-break: keep-all;
  }
  .fr.light .f-statlabel { color: color-mix(in srgb, var(--ink) 80%, transparent); }
  .fr .f-ptitle {
    font-size: calc(var(--fw) * .0556); line-height: 1.2; font-weight: 800;
    letter-spacing: -.015em; word-break: keep-all; text-shadow: 0 1px 4px rgba(0,0,0,.6);
    margin-bottom: calc(var(--fw) * .031);
  }
  .fr.light .f-ptitle, .fr.light .f-title { text-shadow: 0 0 4px #fff, 0 0 2px #fff; }
  .fr .f-cap::before {
    content: ""; display: block; width: calc(var(--fw) * .0519);
    height: calc(var(--fw) * .00556); border-radius: calc(var(--fw) * .00278);
    margin: 0 auto calc(var(--fw) * .0185);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .fr .f-cap .t { font-size: calc(var(--fw) * .046); line-height: 1.25; font-weight: 700; word-break: keep-all; text-shadow: 0 1px 4px rgba(0,0,0,.65); }
  .fr .f-cap .d { font-size: calc(var(--fw) * .0324); line-height: 1.4; font-weight: 500; color: rgba(255,255,255,.85); margin-top: calc(var(--fw) * .011); word-break: keep-all; }
  .fr.light .f-cap .t { text-shadow: 0 0 4px #fff, 0 0 2px #fff; }
  /* On white the pale accent2 end disappears — produce redefines it toward the darker
     side, measured in practice */
  .fr.light .f-em {
    background: linear-gradient(105deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ink)));
    -webkit-background-clip: text; background-clip: text;
    text-shadow: none;   /* the shadow shows through transparent glyphs and washes them out (measured in produce) */
  }
  .fr.light .f-cap .d, .fr.light .f-foot { text-shadow: 0 0 4px #fff, 0 0 2px #fff; }
  .fr.light .f-cap .d { color: color-mix(in srgb, var(--ink) 72%, transparent); }
  .fr .f-foot { font-size: calc(var(--fw) * .0241); color: rgba(255,255,255,.6); }
  .fr.light .f-foot { color: color-mix(in srgb, var(--ink) 55%, transparent); }
  /* Reveals hide with opacity only — an unchanging layout is the contract of the produce
     capture, so an element that has not appeared yet still holds its space
     (video-template.html .rv.hide). */
  .fr .fhide { opacity: 0; }
  .fr .f-capstack { display: grid; margin-bottom: calc(var(--fw) * .0241); }
  .fr .f-capstack > .f-cap { grid-area: 1 / 1; }
  .fr .f-statwrap { margin-bottom: calc(var(--fw) * .0444); }
  .fr .f-em {
    background: linear-gradient(105deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .fr .f-sign { position: absolute; left: 16.3%; right: 16.3%; top: 11.98%; text-align: center; }
  /* The signature sits over the speech clip, so it is always white — if light (illustration)
     mode passed its ink color down, it would be black on black over the clip scrim (the dark
     top). Reverted on clip frames only. */
  .fr.fclip .f-sign { color: #fff; }
  .fr .f-sign .nm { font-size: calc(var(--fw) * .048); font-weight: 800; }
  .fr .f-sign .rl { font-size: calc(var(--fw) * .0296); font-weight: 600; color: rgba(255,255,255,.85); margin-top: calc(var(--fw) * .0111); }
  .fr .f-sign .rl .ai { color: var(--accent); font-weight: 800; }
  .fr .f-quote { font-size: calc(var(--fw) * .0519); line-height: 1.45; font-weight: 650; word-break: keep-all; }
  .fr .f-quote::before {
    content: "“"; display: block; font-size: calc(var(--fw) * .1389); line-height: .6;
    color: var(--accent); margin-bottom: calc(var(--fw) * .0278);
  }
  .fr .f-obrand { font-size: calc(var(--fw) * .059); font-weight: 800; letter-spacing: .03em; margin-bottom: calc(var(--fw) * .037); }
  .fr .f-otitle { font-size: calc(var(--fw) * .078); line-height: 1.25; font-weight: 800; word-break: keep-all; margin-bottom: calc(var(--fw) * .033); }
  .fr .f-osub { font-size: calc(var(--fw) * .039); line-height: 1.4; color: rgba(255,255,255,.85); word-break: keep-all; }

  /* Subtitles — ASS Style Sub: font 58/1080, MarginV 380/1920, MarginL/R 250/1080 */
  .fr .f-sub {
    position: absolute; left: 23.15%; right: 23.15%; bottom: 19.79%;
    font-size: calc(var(--fw) * .0537); line-height: 1.25; font-weight: 700;
    color: #fff; text-shadow: 0 0 3px #101828, 0 1px 2px #101828, 0 0 5px rgba(0,0,0,.9);
    word-break: keep-all;
  }

  /* Shooting mode — top block (y190~460) + recording band
     Band: a 16:9 recording fitted to width 1080 is 607 tall · center y880 → y576~1184 */
  /* produce's `.top` has no height constraint — it grows with its content, and overflow is
     measured by whether its bottom crosses y=460 (screencast-overlay.html). Pinning bottom
     here would stop it at 460 every time and measure nothing. */
  .fr .f-top { position: absolute; left: 16.3%; right: 16.3%; top: 9.9%; }
  .fr .f-top .f-title { font-size: calc(var(--fw) * .0667); line-height: 1.18; margin-bottom: 0; }
  .fr.t-cover .f-top .f-title { font-size: calc(var(--fw) * .0778); }
  /* In shooting mode the kicker is plain text, not a pill (screencast-overlay.html .kicker) */
  .fr.rec .f-kicker {
    display: block; background: none; border: none; padding: 0;
    font-size: calc(var(--fw) * .0296); letter-spacing: .14em;
    color: rgba(255,255,255,.82); margin-bottom: calc(var(--fw) * .0241);
  }
  .fr.rec.tight2 .f-kicker { margin-bottom: calc(var(--fw) * .0167); }
  .fr .f-statrow { display: flex; align-items: baseline; justify-content: center; gap: calc(var(--fw) * .018); margin-top: calc(var(--fw) * .024); }
  .fr .f-statrow .f-stat { font-size: calc(var(--fw) * .07); }
  .fr .f-statrow .f-statlabel { font-size: calc(var(--fw) * .03); margin-top: 0; }
  .fr .f-band {
    position: absolute; left: 0; right: 0; top: 30%; height: 31.64%;
    background: rgba(255,255,255,.06); border-top: 1px dashed rgba(255,255,255,.24);
    border-bottom: 1px dashed rgba(255,255,255,.24);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--fw) * .03); color: rgba(255,255,255,.55); font-weight: 600;
    letter-spacing: .06em;
  }
  /* Speech-clip slot — produce lays a generated speech clip over this stretch, so there is no picture yet.
     The scrim is lifted in the middle, so the slot carries its own contrast to keep from
     matching the background. At the same specificity as `.f-band` it would lose on source
     order, so both classes are used together. */
  .fr .f-band.f-band-clip {
    top: 26%; height: 34%; background: rgba(5,8,20,.55);
    border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.9);
  }

  /* Overflow guard — the same tight1~3 steps as video-template.html / screencast-overlay.html.

  .fr.tight1 .f-title { font-size: calc(var(--fw) * .0852); }
  .fr.tight1 .f-ptitle { font-size: calc(var(--fw) * .0509); }
  .fr.tight1 .f-cap .t { font-size: calc(var(--fw) * .0426); }
  .fr.tight1 .f-cap .d { font-size: calc(var(--fw) * .0296); }
  .fr.tight2 .f-title { font-size: calc(var(--fw) * .0787); }
  .fr.tight2 .f-ptitle { font-size: calc(var(--fw) * .0472); }
  .fr.tight2 .f-cap .t { font-size: calc(var(--fw) * .0398); }
  .fr.tight2 .f-cap .d { font-size: calc(var(--fw) * .0278); }
  .fr.tight2 .f-stat { --stat-fs: .1667; }
  .fr.tight3 .f-title { font-size: calc(var(--fw) * .0722); }
  .fr.tight3 .f-ptitle { font-size: calc(var(--fw) * .0435); }
  .fr.tight3 .f-cap .t { font-size: calc(var(--fw) * .037); }
  .fr.tight3 .f-cap .d { font-size: calc(var(--fw) * .0259); }
  .fr.tight1 .f-top .f-title { font-size: calc(var(--fw) * .0593); }
  .fr.tight1.t-cover .f-top .f-title { font-size: calc(var(--fw) * .0685); }
  .fr.tight1 .f-statrow .f-stat { font-size: calc(var(--fw) * .0611); }
  .fr.tight2 .f-top .f-title { font-size: calc(var(--fw) * .0519); }
  /* The shooting cover title follows produce's cascade as-is (measured):
     tight1 = 74px, while tight2 and tight3 fall back to the base 84px because
     `.tight2 .title` (56/50px) loses on specificity to `body.scene-cover .title` (84px).
     It looks wrong, but that is what actually renders. */
  .fr.rec.t-cover.tight1 .f-top .f-title { font-size: calc(var(--fw) * .0685); }
  .fr.rec.t-cover.tight2 .f-top .f-title,
  .fr.rec.t-cover.tight3 .f-top .f-title { font-size: calc(var(--fw) * .0778); }
  .fr.tight2 .f-statrow .f-stat { font-size: calc(var(--fw) * .0537); }
  .fr.tight3 .f-top .f-title { font-size: calc(var(--fw) * .0463); }
  .fr.tight3 .f-statrow { margin-top: calc(var(--fw) * .015); }

  /* ══ Landscape long-form 16:9 scene frame ════════════════════════════════
     Every portrait-frame ratio is based on the canvas width (1080), so it means something
     else in landscape (1920). formats.js is the source of truth for these values too, and
     format-lint.js cross-checks them — the font ratios are that file's `fonts` as-is
     (absolute px / 1920). */
  .fr.wide { aspect-ratio: 16 / 9; border-radius: calc(var(--fw) * .012); }
  /* Zone — x 96/1920 · top 96/1080 · bottom 285/1080 (measured in safezone-landscape.md) */
  .fr.wide .fzone { left: 5.00%; right: 5.00%; top: 8.89%; bottom: 26.39%; }
  .fr.wide .fsafe::before { left: 5.00%; right: 5.00%; top: 8.89%; bottom: 26.39%; }
  .fr.wide .fsafe::after { height: 26.39%; }
  .fr.wide .f-kicker { font-size: calc(var(--fw) * .0125);
    padding: calc(var(--fw) * .004) calc(var(--fw) * .012); margin-bottom: calc(var(--fw) * .009); }
  .fr.wide .f-title { font-size: calc(var(--fw) * .0375); margin-bottom: calc(var(--fw) * .014); }
  .fr.wide .f-stat { font-size: calc(var(--fw) * .0771); }
  .fr.wide .f-statlabel { font-size: calc(var(--fw) * .0151); }
  .fr.wide .f-ptitle { font-size: calc(var(--fw) * .0224); margin-bottom: calc(var(--fw) * .010); }
  .fr.wide .f-cap .t { font-size: calc(var(--fw) * .0188); }
  .fr.wide .f-cap .d { font-size: calc(var(--fw) * .0130); }
  .fr.wide .f-foot { font-size: calc(var(--fw) * .0125); }
  /* We do not burn subtitles here (BURN=0) — the YouTube player draws them. They are drawn
     at measured size (48px on the canvas = .025) inside the reserved bottom strip so the
     author can see the space they take. The dashed line marks "not our output"
     【safezone-landscape.md §②】. */
  .fr.wide .f-sub { left: 12%; right: 12%; bottom: 8.5%;
    font-size: calc(var(--fw) * .025); color: rgba(255,255,255,.86);
    outline: 1px dashed rgba(255,255,255,.22); outline-offset: calc(var(--fw) * .004); }

     empty; that is where the user demonstrates */

  .fr.wide .fzone.l3 .f-ptitle { border-left: calc(var(--fw) * .003) solid var(--accent);
    padding-left: calc(var(--fw) * .010); }

     The border is dropped — the produce canvas has none, and it would narrow the text zone by 2px.

     width, so measuring at 1080 inflates landscape text 1.78× and flags overflow that is not there. */

    border: 1px dashed rgba(120,200,255,.55);
  }
  .fr .fsafe::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 29.69%;
    background: repeating-linear-gradient(135deg, rgba(120,200,255,.10) 0 4px, transparent 4px 8px);
    border-top: 1px solid rgba(120,200,255,.35);

  .clip .meta b { color: var(--faint); font-weight: 600; margin-right: var(--s2); }

  .cmeta { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--hair); }
  .cmeta .row { display: grid; grid-template-columns: 62px 1fr; gap: var(--s3); font-size: var(--t-aux); margin-bottom: var(--s2); }

  details.prompt p {

  }

  table.grid { width: 100%; border-collapse: collapse; font-size: var(--t-aux); }

  table.grid th { font-size: var(--t-micro); color: var(--faint); font-weight: 600; letter-spacing: .06em; }

  details.docnotes > summary, details.scenenotes > summary {
    font-size: var(--t-aux); color: var(--muted); cursor: pointer; list-style: none;

  }

  details.scenenotes > summary::-webkit-details-marker { display: none; }
  details.docnotes > summary::before,

  /* Toolbar */
  .toolbar { display: flex; gap: var(--s4); align-items: center; margin: var(--s4) 0 0; font-size: var(--t-cap); color: var(--muted); }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

  @media (max-width: 620px) {

  @media (max-width: 480px) {

  @media screen {
