      // and the prompt cards disappear from the document entirely (measured 2026-08-15 — all
      // four cards were missing and the user pointed it out twice).
      // Consecutive sentences on the same picture are not a new cut — only the subtitle
      // changes, so they attach to the previous cut.
      var lineMode = narr.some(function (n) { return !!n.img; });
      if (lineMode) {
        var prevImg = null;
        narr.forEach(function (n, k) {
          var im = n.img || prevImg;
          if (k === 0 || im !== prevImg) {
            out.push({ label: /^card:/.test(n.imgPrompt || "") ? T.reveal.promptCard
                            : k === 0 ? T.reveal.titleSource : T.reveal.swapArt,
                       seg: k, cap: -1 });
          }
          prevImg = im;
        });
      } else {
        out.push({ label: T.reveal.titleSource, seg: 0, cap: -1 });
        (s.bullets || []).forEach(function (b, k) {
          out.push({ label: T.caption(k + 1), seg: k + 1, cap: k }); });
      }
    } else if (s.type === "quote") {
      // Over a speech clip (alpha) only the signature is laid on, so the screen never changes —
      // one panel. Only the still quote card has two states, signature → quote
      // (video-template `if (!alpha)`).
      if (s.visual && s.visual.clip) {
        out.push({ label: T.reveal.signatureOverlay, seg: 0, cap: -1 });
      } else {
        out.push({ label: T.reveal.signature, seg: 0, cap: -1 });
        out.push({ label: T.reveal.quote, seg: 1, cap: -1 });
      }
    } else {
      out.push({ label: T.reveal.whole, seg: 0, cap: -1 });
    }
    // When one sentence covers two captions the subtitle stays put for the duration — the last
    // line carries over. Which sentence gets split is decided by produce, via sub-reveals (A|B).
    out.forEach(function (st) {
      if (st.seg >= narr.length) { st.seg = narr.length - 1; st.carry = true; }
    });
    return out;
  }

  /* ── 9:16 frame ── */
  function frame(s, st, idx, tier, statScale) {
    var narr = s.narration || [];
    var seg = st.seg >= 0 && narr[st.seg] ? narr[st.seg] : null;
    var lineImg = seg && seg.img ? seg.img : null;
    var bg = lineImg || (s.visual && s.visual.bg) || null;
    var light = !!lineImg;
    var hasClip = s.type === "quote" && !!(s.visual && s.visual.clip);
    var cls = "fr t-" + esc(s.type) + (recOf(s) ? " rec" : "") + (light ? " light" : "") +
              (WIDE ? " wide" : "") +
              (hasClip ? " fclip" : "") + (tier ? " tight" + tier : "");
    var h = '<div lang="' + esc(window.ReviewTypography.contentLanguage(DOC, s, SCENES.indexOf(s))) + '" class="' + cls + '">';
    if (bg) h += '<div class="fbg" style="background-image:url(\'' + esc(bg) + '\')"></div>';
    // Owner directive 2026-08-25: no top/bottom gradient scrim on any cut.
    // overlay none is the picture alone — even an empty text slot lays a film over the preview.

    if (overlayOf(s) === "none") {
      if (seg && seg.sub) h += '<div class="f-sub">' + esc(seg.sub) + "</div>";
      h += '<div class="fsafe"></div></div>';
      return h;
    }

    if (recTall(s)) {
      h += '<div class="f-band">' + esc(T.recordedScreen) + '</div><div class="f-top">';
      if (s.kicker) h += '<div class="f-kicker">' + esc(s.kicker) + "</div>";
      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.type === "cover" && s.stat)
        h += '<div class="f-statrow"><div class="f-stat f-em">' + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "cover") {
      // In illustration (light) mode the cover anchors to the top — the body.light branch in video-template.html
      h += '<div class="fzone' + (light ? " top" : "") + '">';
      if (s.kicker) h += '<div class="f-kicker">' + esc(s.kicker) + "</div>";
      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.stat)
        h += '<div class="f-statwrap' + (idx < 1 ? " fhide" : "") + '"><div class="f-stat f-em"' +
             (statScale ? ' style="--stat-fs:' + statScale.toFixed(5) + '"' : "") +
             ">" + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "points") {
      // A landscape shooting scene uses the lower third (bottom left of the zone) — the same spot as .zone.l3 in video-template.
      h += '<div class="fzone ' + (recOf(s) ? "l3" : "top") + '"><div class="f-ptitle">' + femph(s.title || "") + "</div>";
      var caps = s.bullets || [];
      if (caps.length) {
        // Captions stack on the same spot and only the active one is visible (caption swap)
        h += '<div class="f-capstack">' + caps.map(function (b, k) {
          return '<div class="f-cap' + (k === st.cap ? "" : " fhide") + '"><div class="t">' + femph(b.t) + "</div>" +
                 (b.d ? '<div class="d">' + esc(b.d) + "</div>" : "") + "</div>"; }).join("") + "</div>";
      }
      if (s.footnote) h += '<div class="f-foot">' + esc(s.footnote) + "</div>";
      h += "</div>";
    } else if (s.type === "quote") {
      // When a speech clip is planned, produce captures with alpha — only the signature goes
      // on screen and the narration and subtitles say the quote (the capture table in the
      // produce SKILL · scenes-schema §quote). Without a clip it becomes a still quote card
      // (signature + quote + full wash).
      h += '<div class="f-sign"><div class="nm">' + esc(s.speaker || "") + "</div>" +
           '<div class="rl">' + esc(s.role || "").replace(/AI/g, '<span class="ai">AI</span>') + "</div></div>";
      h += hasClip
        ? '<div class="f-band f-band-clip">speech clip · signature only</div>'
        : '<div class="fzone center"><div class="f-quote' + (idx < 1 ? " fhide" : "") + '">' +
          femph(s.text || "") + "</div></div>";
    } else if (s.type === "outro") {
      h += '<div class="fzone center"><div class="f-obrand f-em">' + esc(THEME.brand || "") + "</div>" +
           '<div class="f-otitle">' + femph(s.title || "") + "</div>" +
           (s.sub ? '<div class="f-osub">' + esc(s.sub) + "</div>" : "") + "</div>";
    }

    if (seg && seg.sub) h += '<div class="f-sub">' + esc(seg.sub) + "</div>";
    h += '<div class="fsafe"></div></div>';
    return h;
  }

  /* ── Measuring frame overflow ──
     Draws on the same 1080px canvas as the produce renderer (video-template.html /
     screencast-overlay.html), measures whether text escapes the zone, and shrinks it through
     the same tight1~3 steps. If three steps still are not enough it warns with the leftover
     px — this is where clipped text gets caught before production. */
  var probe = document.createElement("div");
  probe.id = "fr-probe";
  if (WIDE) probe.style.setProperty("--fw", "1920px");
  document.body.appendChild(probe);
  var fit = {};
  SCENES.forEach(function (s, i) {
    if (s.type === "broll") return;
    revealsOf(s).forEach(function (st, k) {
      probe.innerHTML = frame(s, st, k, 0);
      var fr = probe.firstChild;
      var box = fr.querySelector(recTall(s) ? ".f-top" : ".fzone");
      // How it measures also follows produce — generated mode uses the zone's scrollHeight,
      // shooting mode whether the block's bottom crosses y=460 (BAND_MIN_Y). Using
      // scrollHeight in shooting mode shrinks a step too early because of the glyph box on a
      // line-height:1 stat, and raises a false warning.
      var REC_LIMIT = 460;
      function over() {
        if (!box) return 0;
        return recTall(s)
          ? box.getBoundingClientRect().bottom - fr.getBoundingClientRect().top - REC_LIMIT
          : box.scrollHeight - box.clientHeight;
      }
      // tight steps accumulate — replacing one sends the rules the lower step lacks back to their defaults
      var tier = 0;
      while (over() > 1 && tier < 3) { tier += 1; fr.classList.add("tight" + tier); }

      // The width guard measures on the font left after the step shrink (the execution order in video-template.html)
      var statPx = 0, statOvf = 0;
      var stat = !recOf(s) && s.type === "cover" ? fr.querySelector(".f-stat") : null;
      if (stat) {
        var size = parseFloat(getComputedStyle(stat).fontSize), guard = 0;
        while (stat.getBoundingClientRect().width > 640 && size > 80 && guard < 40) {
          size -= 6; stat.style.fontSize = size + "px"; guard += 1;
        }
        statPx = size;
        statOvf = Math.round(Math.max(0, stat.getBoundingClientRect().width - 640));
      }
      fit[i + ":" + k] = {
        tier: tier, ovf: Math.max(0, Math.round(over())),
        // Font px at 1080 → ratio of the frame width. The panel gets the same shrink.
        statScale: statPx ? statPx / 1080 : 0, statOvf: statOvf
      };
    });
  });
  probe.innerHTML = "";

  /* ── Per-scene check badges ── */
  function sceneCheck(s, no) {
    var narr = s.narration || [];
    var syl = narr.reduce(function (a, n) { return a + netLen(n.tts); }, 0);
    var rate = s.duration ? syl / s.duration : 0;
    var maxSent = narr.reduce(function (a, n) { return Math.max(a, netLen(n.tts)); }, 0);
    var chips = [badge("", T.sec(Number.isFinite(s.duration) ? Math.round(s.duration * 1000) / 1000 : "?"))];
    if (recOf(s)) {
      if (syl) {
        chips.push(badge("", T.chars(syl)));
        var rOk = rate >= 4.5 && rate <= 6.5;
        chips.push(badge(rOk ? "ok" : "warn", T.charsPerSec(rate.toFixed(2))));
        if (!rOk) flag("warn", T.shotCap(no), "speech rate " + rate.toFixed(2) + " chars/s — the shooting standard is 5~6 chars/s (4.5~6.5 allowed)");
      }
      // The long-form shooting lane has no scene cap (recSceneMax: null) — one continuous
      // recording arriving as one scene is the normal path, and a cap would force the user to
      // chop up a natural take.
      if (!STORY_V2 && FMT.recSceneMax !== null && s.duration > FMT.recSceneMax) {
        chips.push(badge("bad", T.overSec(FMT.recSceneMax)));
        flag("bad", T.shotCap(no), "length " + s.duration + "s — the shooting-mode scene cap is " + FMT.recSceneMax + "s");
      } else if (!STORY_V2 && s.duration && s.duration < 8) {
        chips.push(badge("warn", T.underEightSec));
        flag("warn", T.shotCap(no), "length " + s.duration + "s — shooting-mode scenes target 8s or more");
      }
      if (maxSent > 40) { chips.push(badge("warn", T.oneSentenceChars(maxSent))); flag("warn", T.shotCap(no), T.recSentLong(maxSent)); }

      /* Shooting-scene contract (scenes-schema §filmed scenes) — all three fields have to be
         there for the user to know what to film and for produce to find the file. Discovering
         one is empty after approval means starting the shoot over. */
      var vz = s.visual || {};
      if (!vz.clip) {
        chips.push(badge("bad", T.noClip));
        flag("bad", T.shotCap(no), "a shooting scene with no visual.clip (filename) — the user has nowhere to save it");
      } else if (!/^footage\/s\d+-[a-z0-9-]+\.(mp4|mov|m4v)$/.test(vz.clip)) {
        chips.push(badge("warn", T.clipNaming));
        flag("warn", T.shotCap(no), "clip \"" + vz.clip + "\" — the convention is footage/s<scene number>-<slug>.mp4");
      }
      if (!vz.shot) flag("bad", T.shotCap(no), "a shooting scene with no visual.shot (what is on screen)");
      if (!vz.action) flag("bad", T.shotCap(no), "a shooting scene with no visual.action (what the user does)");
      // On an all-live-voice episode (window.VOICE === "user") a filmed scene fills narration too —
      // those segments are lines to speak, not a TTS script (scenes-schema §all-live-voice episodes).
      chips.push(badge("", narr.length ? (window.VOICE === "user" ? T.linesToSpeak : T.narrationOver) : T.speaksLive));
    } else if (s.type !== "broll" && s.type !== "outro") {
      /* Slide-scene contract (scenes-schema §slide scenes) — the filename, the plan and the
         motion:true marker are what get approved; produce §3.6 builds the file after approval.
         Camera slides consume bg as their photograph; other slides draw their own screen. */
      var sl = s.visual && s.visual.slide;
      if (sl) {
        chips.push(badge("", T.slide));
        /* 저작 화면의 갈래 (scenes-schema §the authored-screen lane). 파일이 아직 없는
           승인 시점에 볼 수 있는 것은 scenes.js 쪽 계약뿐이다 — check-slide.js 는 produce §3.6 에서
           파일을 보고 같은 것을 다시 본다. */
        var KINDS = ["diagram", "kinetic", "character", "camera"];
        var ACT_NAMES = ["enter", "point", "nod", "shrug", "think", "wave", "cheer"];
        var kind = sl.kind || "diagram";
        if (sl.motion !== true) {
          chips.push(badge("bad", T.kindMotion));
          flag("bad", T.shotCap(no), "visual.slide has no motion:true — a still slide is not allowed");
        }
        if (KINDS.indexOf(kind) === -1) {
          chips.push(badge("bad", T.kindBad));
          flag("bad", T.shotCap(no), 'slide.kind "' + kind + '" is outside ' + KINDS.join(" · "));
        } else if (kind !== "diagram") {
          chips.push(badge("", kind));
          if (kind === "character") {
            var acts = sl.acts;
            if (!Array.isArray(acts) || !acts.length) {
              chips.push(badge("bad", T.actsBad));
              flag("bad", T.shotCap(no), 'kind:"character" with no visual.slide.acts — one action per narration segment');
            } else {
              var badActs = acts.filter(function (a) { return ACT_NAMES.indexOf(a) === -1; });
              var segs = (s.narration || []).length;
              if (badActs.length) {
                chips.push(badge("bad", T.actsBad));
                flag("bad", T.shotCap(no), 'act "' + badActs.join('", "') + '" is outside ' + ACT_NAMES.join(" · "));
              } else if (segs && acts.length < segs) {
                chips.push(badge("bad", T.actsBad));
                flag("bad", T.shotCap(no), acts.length + " acts against " + segs + " narration segments — one act per segment");
              }
            }
          }
        }
        if (!sl.plan) {
          chips.push(badge("bad", T.noPlan));
          flag("bad", T.shotCap(no), "a slide scene with no slide.plan (what to draw) — approval reads this plan");
        }
        if (!sl.file) {
          chips.push(badge("bad", T.noFile));
          flag("bad", T.shotCap(no), "a slide scene with no slide.file");
        } else if (!new RegExp("^slides/s" + no + "-[a-z0-9-]+\\.html$").test(sl.file)) {
          chips.push(badge("warn", T.fileNaming));
          flag("warn", T.shotCap(no), 'slide.file "' + sl.file + '" — the convention is slides/s' + no + "-<slug>.html (shot number = array position)");
        }
        if (s.visual.bg && kind !== "camera")
          flag("warn", T.shotCap(no), "a slide scene also carrying bg — the screen is the slide alone");
      }
      var cap = s.type === "cover" ? FMT.capCover : FMT.capBody;
      if (narr.length) {
        chips.push(badge(syl <= cap ? "ok" : "bad", T.charsOfCap(syl, cap)));
        if (syl > cap) flag("bad", T.shotCap(no), "narration " + syl + " chars — cap " + cap + " (" + s.type + ")");
      } else if (s.type === "quote" && s.visual && s.visual.clip) {
        // Only a speech-clip quote is exempt — the actor speaks, so having no TTS narration is
        // normal. A still quote card with no clip has no sound at all, so it drops to the
        // violation branch below.
        chips.push(badge("", T.speechClip));
      } else if (s.type === "cover" && s.visual && s.visual.video) {
        // A video cover is exempt too — that stretch uses the audio the clip carries (the same
        // behavior as absolute rule 9). A still-background cover with empty narration drops to
        // the violation branch below.
        chips.push(badge("", T.clipAudio));
      }
      // A shot with no lines is simply silent: narration is a narrator character's off-screen line
      var sentBand = T.charBand(FMT.sentMin, FMT.sentMax);
      var shortSent = narr.some(function (n) { return netLen(n.tts) < FMT.sentMin; });
      if (maxSent > FMT.sentMax || shortSent) {
        chips.push(badge("warn", T.sentence(sentBand)));
        flag("warn", T.shotCap(no), T.sentBandFlag(maxSent > FMT.sentMax, maxSent, FMT.sentMin, sentBand));
      }
      if (!STORY_V2 && s.duration > FMT.sceneMax) {
        chips.push(badge("warn", T.overSec(FMT.sceneMax)));
        flag("warn", T.shotCap(no), "length " + s.duration + "s — the generated-mode scene cap is " + FMT.sceneMax + "s");
      }
      // Motion-background scene contract (scenes-schema §motion background) — the cut badge (vtag) carries the type
      if (s.visual && s.visual.video) {
        // cover is an exception that opens only when the user asks for it on that episode
        // (scenes-schema §motion background). Text still has to be a code-rendered overlay, so
        // this also watches for text handed off to the generated video.
        if (s.type !== "points" && s.type !== "cover")
          flag("bad", T.shotCap(no), "a motion background (visual.video) is points-only — it cannot be used on " + s.type);
        // One scene = one call, so the routed engine's server-validated range caps the scene
        // (scenes-schema §clip prompt). The default route Seedance 2.0 takes 4–15s. The real
        // danger is a clip shorter than its scene: it loops, and the loop shows its seam.
        var mbCap = 15;   // Seedance 2.0 and host image_to_video both stop at 15 s
        if (s.duration > mbCap)
          flag("warn", T.shotCap(no), "motion background " + s.duration + "s — past the " + engineOf(s) +
               " route's one-call cap (" + mbCap + "s; server-validated), so the clip loops and the seam shows. Trim the narration, split the scene, or route to a model that takes it");
        if (narr.some(function (n) { return n.img; }))
          flag("bad", T.shotCap(no), "motion background together with per-line illustrations — swapping the background per segment cannot work (scenes-schema)");
      }
    }
    if (!(s.duration > 0) && s.type !== "outro")
      flag("bad", T.shotCap(no), "duration is " + (s.duration === undefined ? "missing" : s.duration + "s") + " — write it as a positive number of seconds");
    narr.forEach(function (n, j) {
      if (!n.tts) flag("bad", T.shotCap(no), "line " + (j + 1) + " has no tts — the sentence to read out is empty");
    });
    if (s.type === "broll") {
      // b-roll uses the audio the video carries — laying TTS on top makes two sounds fight
      if (narr.length) flag("bad", T.shotCap(no), "b-roll carries narration (" + narr.length + ") — it has to be empty");
      if (s.duration > 8) flag("bad", T.shotCap(no), "b-roll used for " + s.duration + "s — generation is fixed at 8s, so anything past that is unusable");
      var af = s.after || 0;
      if (!SCENES[af] || SCENES[af].type === "broll")
        flag("bad", T.shotCap(no), "after: " + af + " points at no scene — the insert position cannot be resolved");
      // The source is the photo the previous scene showed as a still — that still is what starts moving
      var src = (s.visual || {}).src;
      var base = SCENES[af] && SCENES[af].visual ? SCENES[af].visual.bg : null;
      if (src && base && src !== base)
        flag("warn", T.shotCap(no), "the b-roll src differs from scene " + (af + 1) + "'s background (" + base + ")");
    } else {
      var worst = 0, ovf = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (!f) return;
        if (f.tier > worst) worst = f.tier;
        if (f.ovf > ovf) ovf = f.ovf;
      });
      var swide = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (f && f.statOvf > swide) swide = f.statOvf;
      });
      if (swide > 0) {
        chips.push(badge("bad", T.statTooWide));
        flag("bad", T.shotCap(no), "even at minimum size the hero stat exceeds the safe zone by " + swide + "px — switch to a shorter notation");
      }
      // Whether the screen text overlaps the sound (scenes-schema §screen text only when needed,
      // 2026-08-14). Caption k appears together with segment k+1 — if that line contains the
      // caption wording verbatim, the same words arrive twice, by eye and by ear. The subtitle
      // is already writing that sentence out.
      // To see past differences in particles and endings, only Hangul and alphanumerics are kept
      // for the comparison, and short fragments (under 4 characters) are not counted.
      // Burn-in formats only — long-form (burn:false) doesn't burn subtitles, so for a viewer who
      // never turns them on the caption is the only place that value lands. Over-detection
      // measured 2026-08-18 (captions with zero correlation).
      if (FMT.burn) (function () {
        var norm = function (t) { return String(t || "").replace(LETTERS_RE, ""); };
        var narr = s.narration || [], dup = [];
        (s.bullets || []).forEach(function (b, bi) {
          var seg = narr[bi + 1];                       // caption k ← segment k+1
          if (!seg) return;
          var said = norm(seg.sub || seg.tts);
          [b.t, b.d].forEach(function (cap) {
            var c = norm(cap);
            if (c.length >= 4 && said.indexOf(c) !== -1) dup.push(cap);
          });
        });
        if (dup.length) {
          chips.push(badge("warn", T.overlapsAudio(dup.length)));
          flag("warn", T.shotCap(no), "the caption sits in the line verbatim — " + dup.join(" · ") +
               ". The screen does not rewrite what the audio just said (empty the caption if it is not needed)");
        }
      })();
      if (ovf > 0) {
        chips.push(badge("bad", T.overflows));
        flag("bad", T.shotCap(no), "screen text still overflows by " + ovf + "px after the 3-step shrink — cut the title or the captions");
      } else if (worst) {
        chips.push(badge("warn", T.autoShrink(worst)));
        flag("warn", T.shotCap(no), "screen text escapes the zone, so the renderer shrinks it by " + worst + " step(s)");
      }
    }
    return chips.join("");
  }

  /* ══ Header ══ */
  var h = "";
  /* In the contract table the word is followed by the scenes.js key it came from. In English
     some words are the key, so printing both says it twice. */
  function withKey(word, key) {
    return word === key ? esc(word) : esc(word) + " (<code>" + esc(key) + "</code>)";
  }
  h += "<header>";
  h += '<div class="doc-kicker">' + esc(DOC.channelName || DOC.channel || THEME.brand) +
       (DOC.series ? " · " + esc(DOC.series) : "") + "</div>";
  h += '<h1 class="doc-title">' + esc(DOC.displayTitle || DOC.topic || "") + "</h1>";
  if (THEME.motionGraphicTheme) {
    var commonMotion = THEME.motionGraphicTheme;
    var commonMotionInfo = window.MOTION_GRAPHICS && MOTION_GRAPHICS.THEMES[commonMotion.id];
    h += '<p class="review-video-type">' + esc(LANG === 'ko' ? '공통 모션 테마: ' : 'Common motion theme: ') +
      esc(commonMotionInfo ? commonMotionInfo.label : commonMotion.id) +
      (commonMotion.reason ? ' · ' + esc(commonMotion.reason) : '') + '</p>';
  }
  var videoType = window.PRODUCTION && window.PRODUCTION.videoType;
  if (videoType && videoType.id) {
    var typeNames = (window.REVIEW_VIDEO_TYPES || {})[videoType.id] || {};
    h += '<p class="review-video-type">' + esc(LANG === 'ko' ? '영상 유형: ' : 'Video type: ') +
      esc(typeNames[LANG] || typeNames.en || videoType.id) +

      var ans = compactLetters(COMP.answer);
      if (ans.length >= 8) {
        var hookText = compactLetters([cover.title, cover.stat].concat(
          (cover.narration || []).map(function (seg) { return (seg && (seg.sub || seg.tts)) || ""; })
        ).join(" "));
        if (hookText.indexOf(ans) !== -1)
          flag("bad", T.where.cover, "the hook dumps COMPREHENSION.answer while hookType is not \"spoiler\" — a gap cover opens the question and the last drip completes the answer; declare hookType:\"spoiler\" to reveal on the cover");
      }
    }
  } else if (!storyArc) {
    if (processy && firstBeat.body && !firstBeat.result) {
      flag("warn", T.where.order, "there is body but no result scene — put a shot after the hooking that lays out the finished thing (an informational piece has no result scene: give its first content shot beat:\"result\")");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.body.pos < firstBeat.result.pos) {
      flag("bad", T.where.order, "body comes before result — move shot " +
           (firstBeat.body.i + 1) + " after shot " + (firstBeat.result.i + 1) + " (or set arc:\"story\" on the cover if the answer is meant to wait)");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.turn) {
      flag("warn", T.where.order, firstBeat.turn.s.beat
           ? "shot " + (firstBeat.turn.i + 1) + " carries beat:\"turn\" — the turning point belongs to the story arc; drop the beat or write arc:\"story\" on the cover"
           : T.turnHeadingFlag(firstBeat.turn.i + 1));
      orderOk = false;
    }
  } else {
    if (!firstBeat.result) {
      flag("warn", T.where.order, "story arc with no result (payoff) shot — the loop the cover opened never closes; add the shot where the answer appears for the first time (beat:\"result\"), after the turn");
      orderOk = false;
    }
    if (!firstBeat.turn) {
      flag("warn", T.where.order, "story arc with no turn shot — add the moment someone saw it differently (beat:\"turn\") right before the payoff");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.result.pos < firstBeat.body.pos) {
      flag("bad", T.where.order, "result comes before body on a story arc — the payoff closes the loop before the build; move shot " +
           (firstBeat.result.i + 1) + " after the turn, or set arc:\"answer-first\" on the cover");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && firstBeat.result.pos < firstBeat.turn.pos) {
      flag("bad", T.where.order, "result comes before the turn — the answer is out before the turning point; move shot " +
           (firstBeat.result.i + 1) + " after shot " + (firstBeat.turn.i + 1));
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && !orderBad) {   // the two bads above already name this defect
      var ri = -1;
      mainOrder.forEach(function (o, k) { if (ri < 0 && beatOf(o.s) === "result") ri = k; });
      if (ri > 0 && beatOf(mainOrder[ri - 1].s) !== "turn") {
        flag("warn", T.where.order, "the shot right before the payoff (shot " + (mainOrder[ri - 1].i + 1) + ") is not the turn — the turning point is the last beat before the answer");
        orderOk = false;
      }
    }
  }
  /* Long-form: every episode has a hooking shot. Shorts walk drip instead. An opening b-roll
     (after:0) is skipped: it is not a playback role, just 4 seconds of the cover picture moving. */
  var afterCover = mainOrder.length > 1 && mainOrder[0].s.type === "cover" ? mainOrder[1] : null;
  if (WIDE) {
    if (mainOrder.length > 1 && !firstBeat.hooking) {
      flag("warn", T.where.order, "there is no hooking shot — after the cover, add the shot that hooks why to stay (beat:\"hooking\"" + (storyArc ? ", the setup on a story arc" : "") + "). Informational episodes are no exception");
      orderOk = false;
    } else if (afterCover && beatOf(afterCover.s) !== "hooking") {
      var ab = beatOf(afterCover.s);
      flag("warn", T.where.order, "the shot after the cover is not the hooking — shot " + (afterCover.i + 1) +
           (ab ? "(" + (T.beat[ab] || ab) + ")" : "(no beat)") + " comes before the hooking (shot " +
           (firstBeat.hooking.i + 1) + "). Reorder to " + ORDER_TXT);
      orderOk = false;
    }
  }

  /* Opening strategy — is the cover hookType one of the four (scenes-schema §the four opening
     strategies). Whether none of the four is actually present in the opening is what the
     reviewer's copy mode looks at — this only checks the name tag. */
  var hookWord = cover && cover.hookType ? T.hook[cover.hookType] : "";
  if (cover && !cover.hookType) {
    flag("warn", T.where.opening,
      "the cover has no hookType — write fear|empathy|curiosity|spoiler to say whether this episode opens (title, segment ①" +
      (WIDE ? ", hooking" : "") + ") on fear, empathy, curiosity, or showing the ending first");
  } else if (cover && !hookWord) {
    flag("warn", T.where.opening,
      "hookType \"" + cover.hookType + "\" is outside the four — change it to one of fear|empathy|curiosity|spoiler");
  }
  /* Hook form — the shape of the first line (scenes-schema §the six hook forms). A name tag, like
     hookType: the check asks for it, the reviewer's copy mode judges whether the title and
     segment ① actually take that shape and whether the result pays it. */
  if (cover && !cover.hookForm) {
    flag("warn", T.where.hookForm,
      "the cover has no hookForm — write paradox|gap|payoff|identify|number|secret to say how the title and segment ① are shaped (scenes-schema §the six hook forms)");
  } else if (cover && !T.hookForm[cover.hookForm]) {
    flag("warn", T.where.hookForm,
      "hookForm \"" + cover.hookForm + "\" is outside the six — change it to one of paradox|gap|payoff|identify|number|secret");
  }

  /* Camera slots — every shot that becomes generated video leaves the storyboard with all four
     filled (scenes-schema §camera). produce assembles the prompt out of them, so an empty slot
     means produce would have to invent an instruction nobody reviewed. A legacy one-string
     visual.motion still passes. */
  var camGaps = 0;
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var cam = camOf(s);
    if (!cam) {
      if (!(s.visual && s.visual.motion)) {
        camGaps++;
        flag("warn", T.shotCap(i + 1), "generated video with no visual.camera — fill movement · speed · framing · end before the call (scenes-schema §camera)");
      }
      return;
    }
    // A static camera has no speed (full-video.md §Camera dynamics: speed belongs to a move),
    // so the slot is empty by contract on that shot and is not a gap.
    var isStatic = /^\s*static\b/i.test(String(cam.movement || ""));
    var missing = CAM_SLOTS.filter(function (slot) { return !cam[slot] && !(slot === "speed" && isStatic); });
    if (missing.length) {
      camGaps++;
      flag("warn", T.shotCap(i + 1), "visual.camera is missing " + missing.join(", ") +
           (missing.indexOf("end") >= 0 ? " — with no end the model is not told where to stop, and the last second drifts" : ""));
    }
  });

  /* Negative directives in a generated clip's prompt (video-model-selection §positive locks).
     Write "no ~" in the body and the model tends to draw that noun — Seedance has no exclusion
     argument and wants the scene re-described plus a positive-locks tail. Scanned: visual.video.prompt, visual.clip.prompt, the four camera
     slots. NOT scanned — bgPrompt (the image tools have no exclusion argument, so
     assemble-bg-prompt.js --exclude ships the noun list in the body by design) and visual.audio
     (a sound absence is a description: "no music, no speech"). Edit directives about cutting are
     allowed whichever negation word carries them — the cut line §positive locks prescribes reads
     "Sequence of cuts, no timecodes — … the camera does not cut on its own." */
  var NEG_OK = /^(cut|cuts|camera cuts|timecode|timecodes|timecode splits|reference its visual|reference the visual|change the shot|add new shots|alter the subject)\b/;
  var NEG_RE = /\b(no|not|avoid|avoids|never|don't|dont|doesn't|won't)\b[ \t]*([a-z' \t-]{0,24})/gi;
  /* On a seedance route the vendor's 2.0 guide templates directive negatives for the artifact
     classes only (subtitles·text·logo·watermark, 2.5 adds bgm) — those pass there. Same
     pattern as assemble-bg-prompt.js ARTIFACT_OK (its --selftest checks the copies). */
  var ARTIFACT_OK = /(subtitle|caption|text|logo|watermark|bgm)/;
  function negHits(text, eng) {
    var out = [], m;
    NEG_RE.lastIndex = 0;
    while ((m = NEG_RE.exec(text)) !== null) {
      var tail = (m[2] || "").trim().toLowerCase();
      if (NEG_OK.test(tail.replace(/[^a-z ].*$/, "").trim())) continue;
      if (eng && eng.indexOf("seedance") === 0 && ARTIFACT_OK.test(tail)) continue;
      out.push((m[1] + " " + tail).trim());
      if (out.length >= 3) break;
    }
    return out;
  }
  SCENES.forEach(function (s, i) {
    var v = s.visual || {}, cam = camOf(s) || {}, fields = [];
    // Prompts from both sources — the scene's own and the footage lane's per-group shots
    // (clipPrompts, below). This strip warns on a negative directive on every route;
    // check-scenes.js blocks only the seedance route.
    clipPrompts(s, i).forEach(function (f) {
      if (f.prompt) fields.push([f.where, f.prompt, f.eng]);
    });
    if (genVideo(s)) CAM_SLOTS.forEach(function (slot) {
      if (typeof cam[slot] === "string" && cam[slot]) fields.push(["visual.camera." + slot, cam[slot], engineOf(s)]);
    });
    var shots = (v.slide && Array.isArray(v.slide.shots)) ? v.slide.shots : [];
    shots.forEach(function (sh, j) {
      var sc = sh.camera || {}, eng = "seedance";
      CAM_SLOTS.forEach(function (slot) {
        if (typeof sc[slot] === "string" && sc[slot]) fields.push(["shots[" + j + "]'s camera." + slot, sc[slot], eng]);
      });
    });
    fields.forEach(function (f) {
      // The Audio: sentence is exempt — "no music, no speech" is a state description.
      var audioAt = f[1].search(/Audio\s*:/i);
      var hits = negHits(audioAt >= 0 ? f[1].slice(0, audioAt) : f[1], f[2]);
      if (!hits.length) return;
      flag("warn", T.shotCap(i + 1), f[0] + ' carries a negative directive ("' + hits.join('", "') +
           '") — re-describe the scene and close with positive locks; only the artifact classes (subtitles·text·logo·watermark·bgm) may stay negative there (video-model-selection §positive locks)');
    });
  });

  /* The stored clip prompt — one scene, one call, the prompt written here (scenes-schema
     §clip prompt). A generated shot that leaves the storyboard without its final prompt makes
     produce invent one at call time, which is exactly the sentence nobody reviewed. The timing
     regexes mirror assemble-bg-prompt.js (TIMESTAMP_RE · DIGIT_SECONDS_RE — its --selftest
     fails if the copies drift): a Seedance-routed prompt takes no timecodes (2.0 self-reports
     unstable precision timing), and digit seconds belong in `duration` on either route. */
  var TIME_RE = /\[\d{1,2}:\d{2}(?:\s*[-–~]\s*\d{1,2}:\d{2})?\]|\b0\d?:\d{2}\b/;
  var SECS_RE = /\b(\d{1,3})(?:\.\d+)?\s*(s|secs?|seconds?)\b/gi;
  var QUOTED_RE = /"[^"]*"|“[^”]*”|「[^」]*」/g;
  var HANGUL_RE = /[가-힣]+(?:[ \t]+[가-힣]+)*/;
  var LOCK_RE = /\b(stays?|remains?|keeps?|holds?|unchanged|identical|consistent)\b/i;
  /* Every prompt that becomes a paid call — the scene's own, plus the footage lane's per-group
     shots, which are the bulk of a footage episode and were invisible to this strip until
     2026-09-04. check-scenes.js walks the same two sources; a count that disagrees with the CLI
     means one of the two grew a case the other didn't. */
  function clipPrompts(s, i) {
    var out = [], v = s.visual || {};
    if (genVideo(s)) out.push({ cap: T.shotCap(i + 1), prompt: clipPromptOf(s), eng: engineOf(s), where: "the stored clip prompt" });
    var shots = (v.slide && Array.isArray(v.slide.shots)) ? v.slide.shots : [];
    shots.forEach(function (sh, j) {
      out.push({ cap: T.shotCap(i + 1), prompt: String(sh.prompt || ""),
                 eng: (sh.engine || v.engine) === "host" ? "host" : "seedance",
                 where: "shots[" + j + "]'s prompt" });
    });
    return out;
  }
  SCENES.forEach(function (s, i) {
    clipPrompts(s, i).forEach(function (f) {
      var p = f.prompt, eng = f.eng;
      if (!p) {
        flag("warn", f.cap, "generated video with no stored clip prompt — assemble it (assemble-bg-prompt.js --clip --engine " + eng +
             ") and store it before approval; produce sends it verbatim (scenes-schema §clip prompt)");
        return;
      }
      if (eng === "seedance" && TIME_RE.test(p))
        flag("warn", f.cap, f.where + " carries a timecode on a seedance route — 2.0 self-reports unstable precision timing; cut in the edit");
      var m; SECS_RE.lastIndex = 0;
      while ((m = SECS_RE.exec(p)) !== null) {
        if (m[2].toLowerCase() === "s" && Number(m[1]) > 19) continue;   // "80s film look" is a decade
        flag("warn", f.cap, f.where + ' carries digit seconds ("' + m[0] + '") — length lives in duration; write an in-clip state change in words ("in under half a second")');
        break;
      }
      if (eng !== "seedance") return;
      /* The seedance lane's own two rules (assemble-bg-prompt.js hangulHits · lockMissing — its
         --selftest fails if these copies drift). The body reads Chinese or English, with Korean
         only inside the quotes of a dialogue line; and the image lane closes with a consistency
         lock, which on this engine is also the only place an exclusion can go. */
      var outside = p.replace(QUOTED_RE, " ").match(HANGUL_RE);
      if (outside)
        flag("warn", f.cap, f.where + ' carries Korean ("' + outside[0] + '") — a seedance body reads Chinese or English; Korean goes inside the quotes of a dialogue line');
      if (!LOCK_RE.test(p))
        flag("warn", f.cap, f.where + " has no consistency lock — a seedance clip closes with the sentence that says what holds in every frame (“the subject stays exactly consistent with the input frame”), and that is where an exclusion goes on an engine with no negativePrompt argument (video-model-selection §positive locks)");
    });
  });

  /* Reference jurisdiction — a generated clip that hands over two or more references and scopes
     none of them is the leak case: the character brings the studio backdrop along, or the only
     face in the set gets lent to another figure. One scope clause per reference is the fix
     (video-model-selection §positive locks). One reference alone has nothing to leak into. */
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var ents = charEntries(s);
    if (ents.length < 2) return;
    if (ents.some(function (e) { return e.scope; })) return;
    flag("warn", T.shotCap(i + 1), ents.length + " references on one generated clip and no scope on any of them — give each a jurisdiction clause in visual.character ({ id, scope }) so one reference does not paint the rest of the frame");
  });

  /* Shot grammar — feel first, then the dials (directing-grammar §5–§6). A shot with no
     shot.feel was framed before anyone said what the audience should feel there; the
     rationing rules catch the close-up spent twice and the dutch used twice. Warnings — the
     reviewer's camera mode and the person at the approval step weigh them. */
  var feelGaps = 0, sizeUnknown = 0;
  SCENES.forEach(function (s, i) {
    if (s.type === "outro") return;
    var g = grammarOf(s, i);
    if (!g.feel) {
      feelGaps++;
      flag("warn", T.shotCap(i + 1), "shot.feel not written — say what the audience should feel here before choosing the size, the angle and the camera (directing-grammar §5)");
    }
    if (!g.size) {
      flag("warn", T.shotCap(i + 1), "shot.size not written — where does the frame cut the subject? Pick it from what shot.info has to show (directing-grammar §2.1)");
    }
    if (g.size && !T.size[g.size]) {
      sizeUnknown++;
      flag("warn", T.shotCap(i + 1), 'shot.size "' + g.size + '" is outside the vocabulary — els · ls · fs · mfs · ms · mcu · cu · choker · ecu · insert, or a composition two · three · ots · pov · back · cutaway · reaction (directing-grammar §2)');
    }
    if (g.angle && !T.angle[g.angle]) {
      flag("warn", T.shotCap(i + 1), 'shot.angle "' + g.angle + '" is outside the vocabulary — eye · high · low · overhead · dutch (directing-grammar §3)');
    }
    window.FILM_TECHNIQUES.findings(s).forEach(function (message) {
      flag("warn", T.shotCap(i + 1), message);
    });
  });

  /* Frame space — the floor plan of a generated still (directing-grammar §3.5). Older files
     without shot.space still render; the strip warns so the reviewer weighs the gap. */
  SCENES.forEach(function (s, i) {
    var sp = (s.shot && s.shot.space) || {};
    var size = (s.shot && s.shot.size) || "";
    var still = genStill(s);
    var written = !!(sp.layout || sp.facing || sp.line || sp.light);
    // The 180° line is owed on a filmed two-shot as well — it is the sentence the shooting script prints.
    if ((still || recOf(s) || written) && (charsOf(s).length >= 2 || size === "two" || size === "three" || size === "ots") && !sp.line)
      flag("warn", T.shotCap(i + 1), "two people (or a person and what they look at) with no shot.space.line — lock \"A left, B right\" so the still agrees with the 180° sentence");
    // Wherever a space block is written — still, quote clip, filmed shot — its frame and its words are checked.
    if (written && !sp.frame)
      flag("warn", T.shotCap(i + 1), 'shot.space is written with no frame — add frame: "camera" (left means left of the picture)');
    if (sp.frame && sp.frame !== "camera")
      flag("warn", T.shotCap(i + 1), 'shot.space.frame is "' + sp.frame + '" — the only allowed value is camera (left means left of the picture)');
    var hits = bannedSpaceHits(spaceTextOf(sp) + " " + ((s.visual && s.visual.bgPrompt) || ""));
    if (hits.length)
      flag("warn", T.shotCap(i + 1), "spatial language the model cannot follow — " + hits.join(", ") + " (directing-grammar §3.5 · assemble-bg-prompt.js --check)");
    if (!still) return;
    if (!FILL_FRAME[size] && !sp.layout)
      flag("warn", T.shotCap(i + 1), "generated still with no shot.space.layout — name sides from the camera before the call (directing-grammar §3.5)");
    var personOn = personOnScreen(s, spaceTextOf(sp));
    if (personOn && size !== "pov" && !sp.facing)   // a POV omits the viewpoint character face
      flag("warn", T.shotCap(i + 1), "a person is on screen with no shot.space.facing — write the visible result (\"faces camera-right\"), not \"left view of\"");
  });

  /* Cast — an id used in a shot but absent from SB_DOC.characters draws no panels, so the
     reviewer cannot see what reference set the call will get. */
  var castIds = {};
  CAST.forEach(function (c) { castIds[c.id] = 1; });
  var unknownCast = {};
  SCENES.forEach(function (s, i) {
    charsOf(s).forEach(function (id) {
      if (!castIds[id] && !unknownCast[id]) {
        unknownCast[id] = 1;
        flag("warn", T.shotCap(i + 1), 'character "' + id + '" is not in SB_DOC.characters — add it so the panels going into generation are visible here');
      }
    });
  });

  /* Music cues — a sound.cue naming nothing leaves the bed where it was, so the change the
     storyboard planned never reaches the mix. No window.MUSIC at all is a one-bed episode,
     which is a normal design and draws nothing. */
  var cueCount = 0, dropCount = 0;
  SCENES.forEach(function (s, i) {
    var sd = s.sound; if (!sd) return;
    if (sd.drop) dropCount++;
    if (sd.cue) {
      cueCount++;
      if (!MUSIC || !MUSIC[sd.cue]) {
        flag("warn", T.shotCap(i + 1), 'sound.cue "' + sd.cue + '" is not in window.MUSIC — produce has no file to fetch, so the bed stays where it was');
      }
      if (sd.drop) {
        flag("warn", T.shotCap(i + 1), "sound.cue and sound.drop on the same shot — the cue fades in muted, so the change lands on the next shot instead");
      }
    }
    if (sd.effects !== undefined) {
      if (!Array.isArray(sd.effects)) flag("warn", T.shotCap(i + 1), "sound.effects must be an array");
      else sd.effects.forEach(function (effect, j) {
        if (!effect || !effect.sfx) flag("warn", T.shotCap(i + 1), "sound.effects[" + j + "] has no existing SFX id");
        var at = Number(effect && effect.atSeconds == null ? 0 : effect.atSeconds);
        if (!isFinite(at) || at < 0 || (Number(s.duration) && at >= Number(s.duration)))
          flag("warn", T.shotCap(i + 1), "sound.effects[" + j + "].atSeconds is outside this shot — timing starts at the shot's first frame");
      });
    }
    if (sd.silence !== undefined) {
      if (!Array.isArray(sd.silence)) flag("warn", T.shotCap(i + 1), "sound.silence must be an array");
      else sd.silence.forEach(function (window, j) {
        var start = Number(window && window.startSeconds), end = Number(window && window.endSeconds);
        if (!window || (window.scope || "music") !== "music" || !isFinite(start) || !isFinite(end) || start < 0 || end <= start || (Number(s.duration) && end > Number(s.duration)))
          flag("warn", T.shotCap(i + 1), "sound.silence[" + j + "] must be a music-only window inside this shot");
      });
    }
  });
  if (dropCount > 1 && FMT_KEY === "shorts-9x16") {
    flag("warn", T.where.sound, dropCount + " music drops in a short — spend one on the line the episode is about; past that neither reads");
  }
  /* The music goes out at the peak, and on a story arc the turn is the peak (scenario-craft
     §7). A drop that sits on the result instead swells where the answer lands and leaves the
     turn under music. Only when the episode drops at all — a one-bed episode is a design. */
  if (storyArc && firstBeat.turn && dropCount && !(firstBeat.turn.s.sound && firstBeat.turn.s.sound.drop)) {
    var dropAt = [];
    SCENES.forEach(function (s, i) { if (s.sound && s.sound.drop) dropAt.push(i + 1); });
    flag("warn", T.where.sound, "the music drop sits on shot " + dropAt.join(", ") + ", not on the turn (shot " + (firstBeat.turn.i + 1) +
         ") — the bed goes out at the peak, and on a story arc the turn is the peak; the result is where it comes back (scenario-craft §7)");
  }

  /* ── Promise ledger — SB_DOC.craft (scenario-craft §3 · §5 · §7 · §8 · §10) ──
     The loops the episode opens and the shot that pays each one, the plant → payoff pairs, and
     the story-arc devices. scenes.js has no field for any of this — a promise is editorial, not
     a shot property — so it lives in SB_DOC, and the strip checks what a machine can: every
     loop has a payer that plays after it, the cover's promise is paid where the answer first
     appears, a plant is paid in the frame it was planted in, the holds rise and the burst comes
     after them, a device carries its rule and the shots that verify it. Whether the promise is
     kept in the copy is the reviewer's and the approver's call. Warnings only. */
  var CRAFT = DOC.craft && typeof DOC.craft === "object" ? DOC.craft : null;
  var LOOPS = (CRAFT && Array.isArray(CRAFT.loops) ? CRAFT.loops : []).filter(function (l) { return l && typeof l === "object"; });
  var HOLDS = (CRAFT && Array.isArray(CRAFT.holds) ? CRAFT.holds : []).map(Number);
  var BURST = CRAFT && CRAFT.burst ? Number(CRAFT.burst) : 0;
  var SIGNATURE = CRAFT && CRAFT.signature ? Number(CRAFT.signature) : 0;
  var DEVICE = CRAFT && CRAFT.device && typeof CRAFT.device === "object" ? CRAFT.device : null;
  var DEVICE_SHOWN = DEVICE && Array.isArray(DEVICE.shown) ? DEVICE.shown.map(Number) : [];
  var CRAFT_DRAW = !!(LOOPS.length || HOLDS.length || BURST || SIGNATURE || DEVICE);
  var promiseTags = SCENES.map(function () { return []; });   // per-shot name tags for the card header
  var unpaid = 0, plantCount = 0, subLoops = 0, coverLoops = 0;
  // Playback position of shot n (numbered from 1); -1 for b-roll, the outro, or a number outside the file
  function playPos(n) {
    var k = -1;
    order.forEach(function (o, p) { if (o.i === n - 1 && o.s.type !== "broll") k = p; });
    return k;
  }
  function shotOk(n) { return Number.isInteger(n) && playPos(n) >= 0; }
  function beatWord(n) { var b = beatOf(SCENES[n - 1]); return b ? (T.beat[b] || b) : ""; }
  function frameText(n) {
    var g = grammarOf(SCENES[n - 1], n - 1);

  auditSealed = true;
  // Violations first — a skimming eye has to hit them before anything else (within a level, registration order holds)
  audit = audit.filter(function (a) { return a.level === "bad"; })
    .concat(audit.filter(function (a) { return a.level !== "bad"; }));
  var nBad = audit.filter(function (a) { return a.level === "bad"; }).length;
  var nWarn = audit.length - nBad;
  var box = document.getElementById("audit");
  box.className = "audit" + (nBad ? " has-bad" : nWarn ? " has-warn" : "");
  box.innerHTML = '<div class="audit-head"><span class="dot"></span>' + esc(T.auditHead) +
    '<span class="count">' + esc(audit.length ? T.auditCount(nBad, nWarn) : T.auditClean) + "</span></div>" +
    (audit.length
      ? "<ul>" + audit.map(function (a) {
          return '<li class="' + a.level + '"><span class="where">' + esc(a.where) + "</span>" +
                 '<span class="what">' + esc(a.what) + "</span></li>"; }).join("") + "</ul>"
      : '<div class="clean">' + esc(T.auditCleanNote) + "</div>");

  var langSel = document.getElementById("lang");
  if (langSel) langSel.addEventListener("change", function () {
    try { localStorage.setItem("social-flow.lang", langSel.value); } catch (e) { /* storage blocked */ }
    var u = new URL(location.href);
    u.searchParams.set("lang", langSel.value);
    location.href = u.toString();
  });

  var safe = document.getElementById("tg-safe"), subs = document.getElementById("tg-subs");
  if (safe) safe.addEventListener("change", function () { document.body.classList.toggle("safe", safe.checked); });
  if (subs) subs.addEventListener("change", function () { document.body.classList.toggle("subs", subs.checked); });

  window.ReviewTypography.apply(DOC, SCENES);
  if (fontFailures.length) {
    var notice = document.createElement('p');
    notice.className = 'review-font-warning'; notice.setAttribute('role', 'status');
    notice.textContent = (LANG === 'ko' ? '일부 글꼴을 불러오지 못했습니다: ' : 'Some fonts could not load: ') + fontFailures.join(', ');
    app.prepend(notice);
  }
  var who = DOC.channelName || DOC.channel || THEME.brand || "";
  document.title = (DOC.displayTitle || DOC.topic || "Storyboard") + (who ? " — Storyboard · " + who : " — Storyboard");
})();
</script>
<link rel="stylesheet" href="./location-review.css">
<script src="./location-review-data.js"></script>
<script>
// Mount dependent views only after font metrics and storyboard rendering settle.
window.STORYBOARD_READY = window.STORYBOARD_READY.then(async function () {
  for (const src of ['./review-layout.js', './prop-sheet.js', './location-review-runtime.js']) {
    await new Promise(function (resolve, reject) {
      const script = document.createElement('script');
      script.src = src; script.onload = function () {
        if (src === './review-layout.js') {
          document.querySelector('.review-jump')?.remove();
          const setup = document.querySelector('.view-setup'), shots = document.querySelector('.review-shots');
          if (setup && shots) {
            shots.before(setup);
            // Show the shot legend open: unwrap the disclosure review-layout.js put around it.
            // review-layout.js also moves the shot-list aside into it; drop that copy.
            const guide = setup.querySelector('.review-detail');
            if (guide) guide.replaceWith(...Array.from(guide.children).filter(c => c.tagName !== 'SUMMARY' && !c.matches('.review-guide-copy')));
          }
        }
        resolve();
      }; script.onerror = reject;
      document.body.appendChild(script);
    });
  }
  document.documentElement.dataset.reviewReady = 'true';
  if (/^#shot-\d+$/.test(location.hash)) {
    const target = document.getElementById(location.hash.slice(1));
    for (let d = target?.closest('details'); d; d = d.parentElement?.closest('details')) d.open = true;
    if (target && typeof target.scrollIntoView === 'function') target.scrollIntoView({block:'start'});
  }
}).catch(function (error) {
  const notice = document.createElement('p');
  notice.className = 'error-box'; notice.setAttribute('role', 'alert');
  notice.textContent = 'Review could not finish loading. Refresh the storyboard with storyboard-html.js.';
  document.getElementById('app').prepend(notice);
  console.error(error);
});
</script>
