      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.type === "cover" && s.stat)
        h += '<div class="f-statrow"><div class="f-stat f-em">' + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "cover") {
      // In illustration (light) mode the cover anchors to the top — the body.light branch in video-template.html
      h += '<div class="fzone' + (light ? " top" : "") + '">';
      if (s.kicker) h += '<div class="f-kicker">' + esc(s.kicker) + "</div>";
      h += '<div class="f-title">' + femph(s.title || "") + "</div>";
      if (s.stat)
        h += '<div class="f-statwrap' + (idx < 1 ? " fhide" : "") + '"><div class="f-stat f-em"' +
             (statScale ? ' style="--stat-fs:' + statScale.toFixed(5) + '"' : "") +
             ">" + esc(s.stat) + "</div>" +
             (s.statLabel ? '<div class="f-statlabel">' + esc(s.statLabel) + "</div>" : "") + "</div>";
      h += "</div>";
    } else if (s.type === "points") {
      // A landscape shooting scene uses the lower third (bottom left of the zone) — the same spot as .zone.l3 in video-template.
      h += '<div class="fzone ' + (recOf(s) ? "l3" : "top") + '"><div class="f-ptitle">' + femph(s.title || "") + "</div>";
      var caps = s.bullets || [];
      if (caps.length) {
        // Captions stack on the same spot and only the active one is visible (caption swap)
        h += '<div class="f-capstack">' + caps.map(function (b, k) {
          return '<div class="f-cap' + (k === st.cap ? "" : " fhide") + '"><div class="t">' + femph(b.t) + "</div>" +
                 (b.d ? '<div class="d">' + esc(b.d) + "</div>" : "") + "</div>"; }).join("") + "</div>";
      }
      if (s.footnote) h += '<div class="f-foot">' + esc(s.footnote) + "</div>";
      h += "</div>";
    } else if (s.type === "quote") {
      // When a speech clip is planned, produce captures with alpha — only the signature goes
      // on screen and the narration and subtitles say the quote (the capture table in the
      // produce SKILL · scenes-schema §quote). Without a clip it becomes a still quote card
      // (signature + quote + full wash).
      h += '<div class="f-sign"><div class="nm">' + esc(s.speaker || "") + "</div>" +
           '<div class="rl">' + esc(s.role || "").replace(/AI/g, '<span class="ai">AI</span>') + "</div></div>";
      h += hasClip
        ? '<div class="f-band f-band-clip">speech clip · signature only</div>'
        : '<div class="fzone center"><div class="f-quote' + (idx < 1 ? " fhide" : "") + '">' +
          femph(s.text || "") + "</div></div>";
    } else if (s.type === "outro") {
      h += '<div class="fzone center"><div class="f-obrand f-em">' + esc(THEME.brand || "") + "</div>" +
           '<div class="f-otitle">' + femph(s.title || "") + "</div>" +
           (s.sub ? '<div class="f-osub">' + esc(s.sub) + "</div>" : "") + "</div>";
    }

    if (seg && seg.sub) h += '<div class="f-sub">' + esc(seg.sub) + "</div>";
    h += '<div class="fsafe"></div></div>';
    return h;
  }

  /* ── Measuring frame overflow ──
     Draws on the same 1080px canvas as the produce renderer (video-template.html /
     screencast-overlay.html), measures whether text escapes the zone, and shrinks it through
     the same tight1~3 steps. If three steps still are not enough it warns with the leftover
     px — this is where clipped text gets caught before production. */
  var probe = document.createElement("div");
  probe.id = "fr-probe";
  if (WIDE) probe.style.setProperty("--fw", "1920px");
  document.body.appendChild(probe);
  var fit = {};
  SCENES.forEach(function (s, i) {
    if (s.type === "broll") return;
    revealsOf(s).forEach(function (st, k) {
      probe.innerHTML = frame(s, st, k, 0);
      var fr = probe.firstChild;
      var box = fr.querySelector(recTall(s) ? ".f-top" : ".fzone");
      // How it measures also follows produce — generated mode uses the zone's scrollHeight,
      // shooting mode whether the block's bottom crosses y=460 (BAND_MIN_Y). Using
      // scrollHeight in shooting mode shrinks a step too early because of the glyph box on a
      // line-height:1 stat, and raises a false warning.
      var REC_LIMIT = 460;
      function over() {
        if (!box) return 0;
        return recTall(s)
          ? box.getBoundingClientRect().bottom - fr.getBoundingClientRect().top - REC_LIMIT
          : box.scrollHeight - box.clientHeight;
      }
      // tight steps accumulate — replacing one sends the rules the lower step lacks back to their defaults
      var tier = 0;
      while (over() > 1 && tier < 3) { tier += 1; fr.classList.add("tight" + tier); }

      // The width guard measures on the font left after the step shrink (the execution order in video-template.html)
      var statPx = 0, statOvf = 0;
      var stat = !recOf(s) && s.type === "cover" ? fr.querySelector(".f-stat") : null;
      if (stat) {
        var size = parseFloat(getComputedStyle(stat).fontSize), guard = 0;
        while (stat.getBoundingClientRect().width > 640 && size > 80 && guard < 40) {
          size -= 6; stat.style.fontSize = size + "px"; guard += 1;
        }
        statPx = size;
        statOvf = Math.round(Math.max(0, stat.getBoundingClientRect().width - 640));
      }
      fit[i + ":" + k] = {
        tier: tier, ovf: Math.max(0, Math.round(over())),
        // Font px at 1080 → ratio of the frame width. The panel gets the same shrink.
        statScale: statPx ? statPx / 1080 : 0, statOvf: statOvf
      };
    });
  });
  probe.innerHTML = "";

  /* ── Per-scene check badges ── */
  function sceneCheck(s, no) {
    var narr = s.narration || [];
    var syl = narr.reduce(function (a, n) { return a + netLen(n.tts); }, 0);
    var rate = s.duration ? syl / s.duration : 0;
    var maxSent = narr.reduce(function (a, n) { return Math.max(a, netLen(n.tts)); }, 0);
    var chips = [badge("", (s.duration || "?") + "s")];
    if (recOf(s)) {
      if (syl) {
        chips.push(badge("", syl + " chars"));
        var rOk = rate >= 4.5 && rate <= 6.5;
        chips.push(badge(rOk ? "ok" : "warn", rate.toFixed(2) + " chars/s"));
        if (!rOk) flag("warn", "Shot " + no, "speech rate " + rate.toFixed(2) + " chars/s — the shooting standard is 5~6 chars/s (4.5~6.5 allowed)");
      }
      // The long-form shooting lane has no scene cap (recSceneMax: null) — one continuous
      // recording arriving as one scene is the normal path, and a cap would force the user to
      // chop up a natural take.
      if (FMT.recSceneMax !== null && s.duration > FMT.recSceneMax) {
        chips.push(badge("bad", "over " + FMT.recSceneMax + "s"));
        flag("bad", "Shot " + no, "length " + s.duration + "s — the shooting-mode scene cap is " + FMT.recSceneMax + "s");
      } else if (s.duration && s.duration < 8) {
        chips.push(badge("warn", "under 8s"));
        flag("warn", "Shot " + no, "length " + s.duration + "s — shooting-mode scenes target 8s or more");
      }
      if (maxSent > 40) { chips.push(badge("warn", "sentence " + maxSent + " chars")); flag("warn", "Shot " + no, "longest sentence " + maxSent + " chars — the shooting script recommends 40"); }

      /* Shooting-scene contract (scenes-schema §filmed scenes) — all three fields have to be
         there for the user to know what to film and for produce to find the file. Discovering
         one is empty after approval means starting the shoot over. */
      var vz = s.visual || {};
      if (!vz.clip) {
        chips.push(badge("bad", "no clip"));
        flag("bad", "Shot " + no, "a shooting scene with no visual.clip (filename) — the user has nowhere to save it");
      } else if (!/^footage\/s\d+-[a-z0-9-]+\.(mp4|mov|m4v)$/.test(vz.clip)) {
        chips.push(badge("warn", "clip naming"));
        flag("warn", "Shot " + no, "clip \"" + vz.clip + "\" — the convention is footage/s<scene number>-<slug>.mp4");
      }
      if (!vz.shot) flag("bad", "Shot " + no, "a shooting scene with no visual.shot (what is on screen)");
      if (!vz.action) flag("bad", "Shot " + no, "a shooting scene with no visual.action (what the user does)");
      // On an all-live-voice episode (window.VOICE === "user") a filmed scene fills narration too —
      // those segments are lines to speak, not a TTS script (scenes-schema §all-live-voice episodes).
      chips.push(badge("", narr.length ? (window.VOICE === "user" ? "live-voice script" : "narration over it") : "live voice"));
    } else if (s.type !== "broll" && s.type !== "outro") {
      /* Slide-scene contract (scenes-schema §slide scenes) — the filename and the plan are what
         gets approved; the file itself arrives after approval. Coexisting with bg is a
         contradiction (there is only one screen). */
      var sl = s.visual && s.visual.slide;
      if (sl) {
        chips.push(badge("", "slide"));
        if (!sl.plan) {
          chips.push(badge("bad", "no plan"));
          flag("bad", "Shot " + no, "a slide scene with no slide.plan (what to draw) — approval reads this plan");
        }
        if (!sl.file) {
          chips.push(badge("bad", "no file"));
          flag("bad", "Shot " + no, "a slide scene with no slide.file");
        } else if (!new RegExp("^slides/s" + no + "-[a-z0-9-]+\\.html$").test(sl.file)) {
          chips.push(badge("warn", "file naming"));
          flag("warn", "Shot " + no, 'slide.file "' + sl.file + '" — the convention is slides/s' + no + "-<slug>.html (shot number = array position)");
        }
        if (s.visual.bg)
          flag("warn", "Shot " + no, "a slide scene also carrying bg — the screen is the slide alone");
      }
      var cap = s.type === "cover" ? FMT.capCover : FMT.capBody;
      if (narr.length) {
        chips.push(badge(syl <= cap ? "ok" : "bad", "chars " + syl + "/" + cap));
        if (syl > cap) flag("bad", "Shot " + no, "narration " + syl + " chars — cap " + cap + " (" + s.type + ")");
      } else if (s.type === "quote" && s.visual && s.visual.clip) {
        // Only a speech-clip quote is exempt — the actor speaks, so having no TTS narration is
        // normal. A still quote card with no clip has no sound at all, so it drops to the
        // violation branch below.
        chips.push(badge("", "speech clip"));
      } else if (s.type === "cover" && s.visual && s.visual.video) {
        // A video cover is exempt too — that stretch uses the audio the clip carries (the same
        // behavior as absolute rule 9). A still-background cover with empty narration drops to
        // the violation branch below.
        chips.push(badge("", "clip audio"));
      } else {
        chips.push(badge("bad", "no narration"));
        flag("bad", "Shot " + no, "narration is empty — it holds " + (s.duration || "?") + " seconds with no sound");
      }
      var sentBand = FMT.sentMin + "~" + FMT.sentMax + " chars";
      var shortSent = narr.some(function (n) { return netLen(n.tts) < FMT.sentMin; });
      if (maxSent > FMT.sentMax || shortSent) {
        chips.push(badge("warn", "sentence " + sentBand));
        flag("warn", "Shot " + no, (maxSent > FMT.sentMax ? "longest sentence " + maxSent + " chars"
             : "a sentence under " + FMT.sentMin + " chars") + " — per sentence " + sentBand);
      }
      if (s.duration > FMT.sceneMax) {
        chips.push(badge("warn", "over " + FMT.sceneMax + "s"));
        flag("warn", "Shot " + no, "length " + s.duration + "s — the generated-mode scene cap is " + FMT.sceneMax + "s");
      }
      // Motion-background scene contract (scenes-schema §motion background) — the cut badge (vtag) carries the type
      if (s.visual && s.visual.video) {
        // cover is an exception that opens only when the user asks for it on that episode
        // (scenes-schema §motion background). Text still has to be a code-rendered overlay, so
        // this also watches for text handed off to the generated video.
        if (s.type !== "points" && s.type !== "cover")
          flag("bad", "Shot " + no, "a motion background (visual.video) is points-only — it cannot be used on " + s.type);
        // The engine sets the cap — veo is fixed at 8s and loops beyond that, while Seedance
        // makes as many seconds as asked, up to 15. The real danger is not the second count but
        // a clip shorter than its scene.
        if (s.duration > 15)
          flag("warn", "Shot " + no, "motion background " + s.duration + "s — past the generation cap (Seedance 15s), so the clip loops and the seam shows");
        if (narr.some(function (n) { return n.img; }))
          flag("bad", "Shot " + no, "motion background together with per-line illustrations — swapping the background per segment cannot work (scenes-schema)");
      }
    }
    if (!(s.duration > 0) && s.type !== "outro")
      flag("bad", "Shot " + no, "duration is " + (s.duration === undefined ? "missing" : s.duration + "s") + " — write it as a positive number of seconds");
    narr.forEach(function (n, j) {
      if (!n.tts) flag("bad", "Shot " + no, "line " + (j + 1) + " has no tts — the sentence to read out is empty");
    });
    if (s.type === "broll") {
      // b-roll uses the audio the video carries — laying TTS on top makes two sounds fight
      if (narr.length) flag("bad", "Shot " + no, "b-roll carries narration (" + narr.length + ") — it has to be empty");
      if (s.duration > 8) flag("bad", "Shot " + no, "b-roll used for " + s.duration + "s — generation is fixed at 8s, so anything past that is unusable");
      var af = s.after || 0;
      if (!SCENES[af] || SCENES[af].type === "broll")
        flag("bad", "Shot " + no, "after: " + af + " points at no scene — the insert position cannot be resolved");
      // The source is the photo the previous scene showed as a still — that still is what starts moving
      var src = (s.visual || {}).src;
      var base = SCENES[af] && SCENES[af].visual ? SCENES[af].visual.bg : null;
      if (src && base && src !== base)
        flag("warn", "Shot " + no, "the b-roll src differs from scene " + (af + 1) + "'s background (" + base + ")");
    } else {
      var worst = 0, ovf = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (!f) return;
        if (f.tier > worst) worst = f.tier;
        if (f.ovf > ovf) ovf = f.ovf;
      });
      var swide = 0;
      revealsOf(s).forEach(function (st, k) {
        var f = fit[(no - 1) + ":" + k];
        if (f && f.statOvf > swide) swide = f.statOvf;
      });
      if (swide > 0) {
        chips.push(badge("bad", "stat too wide"));
        flag("bad", "Shot " + no, "even at minimum size the hero stat exceeds the safe zone by " + swide + "px — switch to a shorter notation");
      }
      // Whether the screen text overlaps the sound (scenes-schema §screen text only when needed,
      // 2026-08-14). Caption k appears together with segment k+1 — if that line contains the
      // caption wording verbatim, the same words arrive twice, by eye and by ear. The subtitle
      // is already writing that sentence out.
      // To see past differences in particles and endings, only Hangul and alphanumerics are kept
      // for the comparison, and short fragments (under 4 characters) are not counted.
      // Burn-in formats only — long-form (burn:false) doesn't burn subtitles, so for a viewer who
      // never turns them on the caption is the only place that value lands. Over-detection
      // measured 2026-08-18 (captions with zero correlation).
      if (FMT.burn) (function () {
        var norm = function (t) { return String(t || "").replace(/[^가-힣A-Za-z0-9]/g, ""); };
        var narr = s.narration || [], dup = [];
        (s.bullets || []).forEach(function (b, bi) {
          var seg = narr[bi + 1];                       // caption k ← segment k+1
          if (!seg) return;
          var said = norm(seg.sub || seg.tts);
          [b.t, b.d].forEach(function (cap) {
            var c = norm(cap);
            if (c.length >= 4 && said.indexOf(c) !== -1) dup.push(cap);
          });
        });
        if (dup.length) {
          chips.push(badge("warn", "overlaps the audio " + dup.length));
          flag("warn", "Shot " + no, "the caption sits in the line verbatim — " + dup.join(" · ") +
               ". The screen does not rewrite what the audio just said (empty the caption if it is not needed)");
        }
      })();
      if (ovf > 0) {
        chips.push(badge("bad", "frame overflow"));
        flag("bad", "Shot " + no, "screen text still overflows by " + ovf + "px after the 3-step shrink — cut the title or the captions");
      } else if (worst) {
        chips.push(badge("warn", "auto-shrunk " + worst + " step(s)"));
        flag("warn", "Shot " + no, "screen text escapes the zone, so the renderer shrinks it by " + worst + " step(s)");
      }
    }
    return chips.join("");
  }

  /* ══ Header ══ */
  var h = "";
  h += "<header>";
  h += '<div class="doc-kicker">' + esc(DOC.channelName || DOC.channel || THEME.brand) +
       (DOC.series ? " · " + esc(DOC.series) : "") + "</div>";
  h += '<h1 class="doc-title">' + esc(DOC.displayTitle || DOC.topic || "") + "</h1>";

  var lenCls = total >= FMT.totalMin && total <= FMT.totalMax ? "ok"
             : total <= FMT.totalHard ? "warn" : "bad";
  var lenBand = durTxt(FMT.totalMin) + "~" + durTxt(FMT.totalMax);
  if (lenCls === "bad")
    flag("bad", "Total length", "main body " + durTxt(total) + " — past the cap of " + durTxt(FMT.totalHard));
  else if (lenCls === "warn")
    flag("warn", "Total length", "main body " + durTxt(total) + " — outside the default " + lenBand +
         " (going over needs a design reason; cap " + durTxt(FMT.totalHard) + ")");

  // Shot count has a format band too — a long-form built on short-form shot counts stretches
  // single scenes out to minutes.
  if (main.length < FMT.sceneCountMin || main.length > FMT.sceneCountMax)
    flag("warn", "Shot count", "main body " + main.length + " shots — the " + FMT.label + " band is " +
         FMT.sceneCountMin + "~" + FMT.sceneCountMax + " shots");

  // Combined cap on generated video — b-roll slots + motion-background scenes
  // (scenes-schema §motion background is the source of truth)
  var genVid = SCENES.filter(function (s) {
    return s.type === "broll" || (s.visual && s.visual.video); }).length;
  if (genVid > FMT.videoMax)
    flag("bad", "Generated video", "b-roll and motion backgrounds together " + genVid + " shots — cap " +
         FMT.videoMax + " (scenes-schema §motion background)");

  // Long-form chapter requirement (scenes-schema §chapter) — short-form has no notion of chapters
  if (FMT.chapterMin) {
    var chaps = SCENES.filter(function (s) { return s.chapter; });
    if (chaps.length < FMT.chapterMin)
      flag("bad", "Chapters", chaps.length + " — YouTube requires at least " + FMT.chapterMin +
           ". Write a chapter string on the scene (§chapter)");
    else if (chaps.length > FMT.chapterMax)
      flag("warn", "Chapters", chaps.length + " — the authoring target is " + FMT.chapterMin + "~" +
           FMT.chapterMax);
    if (chaps.length && SCENES.indexOf(chaps[0]) !== 0)
      flag("bad", "Chapters", "the first chapter is not at 0:00 — put a chapter on the cover shot (YouTube requirement)");
  }

  /* Production-layer mismatch · coverage — only shots that filled the fields are checked. Older files pass quietly. */
  SCENES.forEach(function (s, i) {
    var no = i + 1, vis = s.visual || {};
    if (vis.picture && vis.picture !== inferredPicture(s))
      flag("warn", "Shot " + no, "picture:\"" + vis.picture + "\" but the structure says " + inferredPicture(s) +
           " — for AI video there has to be a video, clip or broll");
    if (vis.overlay && vis.overlay !== inferredOverlay(s))
      flag("warn", "Shot " + no, "overlay:\"" + vis.overlay + "\" but the default for this type is " + inferredOverlay(s));
  });
  if (hasSceneField) {
    var byScene = {};
    SCENES.forEach(function (s, i) {
      if (s.type === "outro") return;
      var g = grammarOf(s, i);
      (byScene[g.scene] || (byScene[g.scene] = [])).push({ s: s, i: i, g: g });
    });
    Object.keys(byScene).forEach(function (sc) {
      var rows = byScene[sc], seenInfo = {};
      rows.forEach(function (row) {
        var info = String(row.g.info || "").replace(/\s+/g, "");
        if (info.length < 2) return;
        if (seenInfo[info] != null)
          flag("warn", "S#" + sc, "shot " + (seenInfo[info] + 1) + " and shot " + (row.i + 1) +
               " carry the same new information — one of them is enough");
        else seenInfo[info] = row.i;
      });
      // Establish, then close (directing-grammar §6) — a close-up opening (cu · choker · ecu) pays
      // its debt with any non-close size on the next shot: ls/ws, fs, mfs, ms, mcu, two, ots …
      var first = rows[0];
      if (first && CLOSE_SIZES[first.g.size] && rows[1] && rows[1].g.size && CLOSE_SIZES[rows[1].g.size])
        flag("warn", "S#" + sc, "opening on a close-up owes the viewer a wider next shot that says where this is (directing-grammar §6)");
    });
  }
  // b-roll slots — two slots in the same position leave the insert order undecided (scenes-schema §broll)
  var seenAfter = {};
  SCENES.filter(function (s) { return s.type === "broll"; }).forEach(function (s) {
    var af = s.after || 0;
    if (seenAfter[af]) flag("bad", "b-roll", "two slots collide on after: " + af + " — the insert order is undecided");
    seenAfter[af] = 1;
  });

  /* Playback order — the cover's arc picks which (scenes-schema §playback order):
     answer-first: cover → hooking → result → body — drop-off falls when the how comes after the result;
     story:        cover → hooking → body → turn → result — the answer waits for the payoff after the turn.
     The last main shot is not stamped PAYOFF. */
  var firstBeat = {};
  order.forEach(function (o, pos) {
    if (o.s.type === "broll") return;
    var b = beatOf(o.s);
    if (b && firstBeat[b] == null) firstBeat[b] = { pos: pos, i: o.i, s: o.s };
  });
  var mainOrder = order.filter(function (o) { return o.s.type !== "broll"; });
  var arc = cover && cover.arc ? String(cover.arc) : "answer-first";
  var storyArc = arc === "story";
  var ORDER_TXT = storyArc ? "cover → hooking → body → turn → result" : "cover → hooking → result → body";
  var processy = !!(firstBeat.result || firstBeat.body || hasRec);
  var orderOk = true, orderBad = false;
  if (cover && cover.arc && !ARC_KO[arc]) {
    flag("warn", "Playback order", "arc \"" + cover.arc + "\" is outside the two — write answer-first or story on the cover (scenes-schema §playback order); read as answer-first below");
    orderOk = false;
  }
  if (order.length && order[0].s.type !== "cover") {
    flag("warn", "Playback order", "the first shot is not the cover — " + (storyArc ? "the moment and the hook come first" : "the result at a glance and the hook come first"));
    orderOk = false;
  }
  if (!storyArc) {
    if (processy && firstBeat.body && !firstBeat.result) {
      flag("warn", "Playback order", "there is body but no result scene — put a shot after the hooking that lays out the finished thing (an informational piece has no result scene: give its first content shot beat:\"result\")");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.body.pos < firstBeat.result.pos) {
      flag("bad", "Playback order", "body comes before result — move shot " +
           (firstBeat.body.i + 1) + " after shot " + (firstBeat.result.i + 1) + " (or set arc:\"story\" on the cover if the answer is meant to wait)");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.turn) {
      flag("warn", "Playback order", firstBeat.turn.s.beat
           ? "shot " + (firstBeat.turn.i + 1) + " carries beat:\"turn\" — the turning point belongs to the story arc; drop the beat or write arc:\"story\" on the cover"
           : "shot " + (firstBeat.turn.i + 1) + "'s sequence heading reads as a turn (전환/반전) — the turning point belongs to the story arc; write arc:\"story\" on the cover or rename the heading");
      orderOk = false;
    }
  } else {
    if (!firstBeat.result) {
      flag("warn", "Playback order", "story arc with no result (payoff) shot — the loop the cover opened never closes; add the shot where the answer appears for the first time (beat:\"result\"), after the turn");
      orderOk = false;
    }
    if (!firstBeat.turn) {
      flag("warn", "Playback order", "story arc with no turn shot — add the moment someone saw it differently (beat:\"turn\") right before the payoff");
      orderOk = false;
    }
    if (firstBeat.result && firstBeat.body && firstBeat.result.pos < firstBeat.body.pos) {
      flag("bad", "Playback order", "result comes before body on a story arc — the payoff closes the loop before the build; move shot " +
           (firstBeat.result.i + 1) + " after the turn, or set arc:\"answer-first\" on the cover");
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && firstBeat.result.pos < firstBeat.turn.pos) {
      flag("bad", "Playback order", "result comes before the turn — the answer is out before the turning point; move shot " +
           (firstBeat.result.i + 1) + " after shot " + (firstBeat.turn.i + 1));
      orderOk = false; orderBad = true;
    }
    if (firstBeat.result && firstBeat.turn && !orderBad) {   // the two bads above already name this defect
      var ri = -1;
      mainOrder.forEach(function (o, k) { if (ri < 0 && beatOf(o.s) === "result") ri = k; });
      if (ri > 0 && beatOf(mainOrder[ri - 1].s) !== "turn") {
        flag("warn", "Playback order", "the shot right before the payoff (shot " + (mainOrder[ri - 1].i + 1) + ") is not the turn — the turning point is the last beat before the answer");
        orderOk = false;
      }
    }
  }
  /* Every episode has a hooking shot — informational ones too (scenes-schema §hooking). It has
     to be the shot right after the cover (on a story arc it is the setup). An opening b-roll
     (after:0) is skipped: it is not a playback role, just 4 seconds of the cover picture moving.
     An older file with no beat gets a warning here — not a deduction, a request for a name tag. */
  var afterCover = mainOrder.length > 1 && mainOrder[0].s.type === "cover" ? mainOrder[1] : null;
  if (mainOrder.length > 1 && !firstBeat.hooking) {
    flag("warn", "Playback order", "there is no hooking shot — after the cover, add the shot that hooks why to stay (beat:\"hooking\"" + (storyArc ? ", the setup on a story arc" : "") + "). Informational episodes are no exception");
    orderOk = false;
  } else if (afterCover && beatOf(afterCover.s) !== "hooking") {
    var ab = beatOf(afterCover.s);
    flag("warn", "Playback order", "the shot after the cover is not the hooking — shot " + (afterCover.i + 1) +
         (ab ? "(" + (BEAT_KO[ab] || ab) + ")" : "(no beat)") + " comes before the hooking (shot " +
         (firstBeat.hooking.i + 1) + "). Reorder to " + ORDER_TXT);
    orderOk = false;
  }

  /* Opening strategy — is the cover hookType one of the four (scenes-schema §the four opening
     strategies). Whether none of the four is actually present in the opening is what the
     reviewer's copy mode looks at — this only checks the name tag. */
  var hookKo = cover && cover.hookType ? HOOK_KO[cover.hookType] : "";
  if (cover && !cover.hookType) {
    flag("warn", "Opening strategy", "the cover has no hookType — write fear|empathy|curiosity|spoiler to say whether this episode opens (title, segment ①, hooking) on fear, empathy, curiosity, or showing the ending first");
  } else if (cover && !hookKo) {
    flag("warn", "Opening strategy", "hookType \"" + cover.hookType + "\" is outside the four — change it to one of fear|empathy|curiosity|spoiler");
  }
  /* Hook form — the shape of the first line (scenes-schema §the six hook forms). A name tag, like
     hookType: the check asks for it, the reviewer's copy mode judges whether the title and
     segment ① actually take that shape and whether the result pays it. */
  if (cover && !cover.hookForm) {
    flag("warn", "Hook form", "the cover has no hookForm — write paradox|gap|payoff|identify|number|secret to say how the title and segment ① are shaped (scenes-schema §the six hook forms)");
  } else if (cover && !HOOK_FORM_KO[cover.hookForm]) {
    flag("warn", "Hook form", "hookForm \"" + cover.hookForm + "\" is outside the six — change it to one of paradox|gap|payoff|identify|number|secret");
  }

  /* Camera slots — every shot that becomes generated video leaves the storyboard with all four
     filled (scenes-schema §camera). produce assembles the prompt out of them, so an empty slot
     means produce would have to invent an instruction nobody reviewed. A legacy one-string
     visual.motion still passes. */
  var camGaps = 0;
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var cam = camOf(s);
    if (!cam) {
      if (!(s.visual && s.visual.motion)) {
        camGaps++;
        flag("warn", "Shot " + (i + 1), "generated video with no visual.camera — fill movement · speed · framing · end before the call (scenes-schema §camera)");
      }
      return;
    }
    var missing = CAM_SLOTS.filter(function (pr) { return !cam[pr[0]]; }).map(function (pr) { return pr[0]; });
    if (missing.length) {
      camGaps++;
      flag("warn", "Shot " + (i + 1), "visual.camera is missing " + missing.join(", ") +
           (missing.indexOf("end") >= 0 ? " — with no end the model is not told where to stop, and the last second drifts" : ""));
    }
  });

  /* Negative directives in a generated clip's prompt (video-model-selection §positive locks).
     Write "no ~" in the body and the model tends to draw that noun — Veo takes exclusions in the
     negativePrompt argument, Seedance has no such argument and wants the scene re-described plus
     a positive-locks tail. Scanned: visual.video.prompt, visual.clip.prompt, the four camera
     slots. NOT scanned — bgPrompt (the image tools have no exclusion argument, so
     assemble-bg-prompt.js --exclude ships the noun list in the body by design) and visual.audio
     (a sound absence is a description: "no music, no speech"). Edit directives about cutting are
     allowed whichever negation word carries them — the cut line §positive locks prescribes reads
     "Sequence of cuts, no timecodes — … the camera does not cut on its own." */
  var NEG_OK = /^(cut|cuts|camera cuts|timecode|timecodes|timecode splits)\b/;
  var NEG_RE = /\b(no|not|avoid|avoids|never|don't|dont|doesn't|won't)\b[ \t]*([a-z' \t-]{0,24})/gi;
  function negHits(text) {
    var out = [], m;
    NEG_RE.lastIndex = 0;
    while ((m = NEG_RE.exec(text)) !== null) {
      var tail = (m[2] || "").trim().toLowerCase();
      if (NEG_OK.test(tail.replace(/[^a-z ].*$/, "").trim())) continue;
      out.push((m[1] + " " + tail).trim());
      if (out.length >= 3) break;
    }
    return out;
  }
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var v = s.visual || {}, cam = camOf(s) || {}, fields = [];
    if (v.video && v.video.prompt) fields.push(["visual.video.prompt", v.video.prompt]);
    if (v.clip && v.clip.prompt) fields.push(["visual.clip.prompt", v.clip.prompt]);
    CAM_SLOTS.forEach(function (pr) {
      if (typeof cam[pr[0]] === "string" && cam[pr[0]]) fields.push(["visual.camera." + pr[0], cam[pr[0]]]);
    });
    fields.forEach(function (f) {
      var hits = negHits(f[1]);
      if (!hits.length) return;
      flag("warn", "Shot " + (i + 1), f[0] + ' carries a negative directive ("' + hits.join('", "') +
           '") — on Veo exclusions belong in the negativePrompt argument, on Seedance re-describe the scene and close with positive locks (video-model-selection §positive locks)');
    });
  });

  /* Reference jurisdiction — a generated clip that hands over two or more references and scopes
     none of them is the leak case: the character brings the studio backdrop along, or the only
     face in the set gets lent to another figure. One scope clause per reference is the fix
     (video-model-selection §positive locks). One reference alone has nothing to leak into. */
  SCENES.forEach(function (s, i) {
    if (!genVideo(s)) return;
    var ents = charEntries(s);
    if (ents.length < 2) return;
    if (ents.some(function (e) { return e.scope; })) return;
    flag("warn", "Shot " + (i + 1), ents.length + " references on one generated clip and no scope on any of them — give each a jurisdiction clause in visual.character ({ id, scope }) so one reference does not paint the rest of the frame");
  });

  /* Shot grammar — feel first, then the dials (directing-grammar §5–§6). A shot with no
     shot.feel was framed before anyone said what the audience should feel there; the
     rationing rules catch the close-up spent twice and the dutch used twice. Warnings — the
     reviewer's camera mode and the person at the approval step weigh them. */
  var feelGaps = 0, sizeUnknown = 0, chokerEcu = 0, dutchCount = 0, cuPerScene = {};
  SCENES.forEach(function (s, i) {
    if (s.type === "outro") return;
    var g = grammarOf(s, i);
    if (!g.feel) {
      feelGaps++;
      flag("warn", "Shot " + (i + 1), "shot.feel not written — say what the audience should feel here before choosing the size, the angle and the camera (directing-grammar §5)");
    }
    if (g.size && !SIZE_KO[g.size]) {
      sizeUnknown++;
      flag("warn", "Shot " + (i + 1), 'shot.size "' + g.size + '" is outside the vocabulary — els · ls · fs · mfs · ms · mcu · cu · choker · ecu · insert, or a composition two · three · ots · pov · back · cutaway · reaction (directing-grammar §2)');
    }
    if (g.angle && !ANGLE_KO[g.angle]) {
      flag("warn", "Shot " + (i + 1), 'shot.angle "' + g.angle + '" is outside the vocabulary — eye · high · low · overhead · dutch (directing-grammar §3)');
    }
    if (CLOSE_SIZES[g.size]) {
      var key = String(g.scene);
      cuPerScene[key] = (cuPerScene[key] || 0) + 1;
      if (cuPerScene[key] === 2)
        flag("warn", "Scene S#" + key, "a second close-up in the same scene — the close-up is a command, and a command repeated stops being heard. One cu per scene, on the line that matters (directing-grammar §6)");
    }
    if (g.size === "choker" || g.size === "ecu") {
      chokerEcu++;
      if (chokerEcu === 3)
        flag("warn", "Shot " + (i + 1), "a third choker / extreme close-up in the episode — once or twice is the ration (directing-grammar §6)");
    }
    if (g.angle === "dutch") {
      dutchCount++;
      if (dutchCount === 2)
        flag("warn", "Shot " + (i + 1), "a second dutch angle — the tilt lands once and then reads as the new horizon; one per episode, with its reason written on the shot (directing-grammar §3)");
    }
  });

  /* Frame space — the floor plan of a generated still (directing-grammar §3.5). Older files
     without shot.space still render; the strip warns so the reviewer weighs the gap. */
  SCENES.forEach(function (s, i) {
    var sp = (s.shot && s.shot.space) || {};
    var size = (s.shot && s.shot.size) || "";
    var still = genStill(s);
    var written = !!(sp.layout || sp.facing || sp.line || sp.light);
    // The 180° line is owed on a filmed two-shot as well — it is the sentence the shooting script prints.
    if ((still || recOf(s) || written) && (charsOf(s).length >= 2 || size === "two" || size === "three" || size === "ots") && !sp.line)
      flag("warn", "Shot " + (i + 1), "two people (or a person and what they look at) with no shot.space.line — lock \"A left, B right\" so the still agrees with the 180° sentence");
    // Wherever a space block is written — still, quote clip, filmed shot — its frame and its words are checked.
    if (written && !sp.frame)
      flag("warn", "Shot " + (i + 1), 'shot.space is written with no frame — add frame: "camera" (left means left of the picture)');
    if (sp.frame && sp.frame !== "camera")
      flag("warn", "Shot " + (i + 1), 'shot.space.frame is "' + sp.frame + '" — the only allowed value is camera (left means left of the picture)');
    var hits = bannedSpaceHits(spaceTextOf(sp) + " " + ((s.visual && s.visual.bgPrompt) || ""));
    if (hits.length)
      flag("warn", "Shot " + (i + 1), "spatial language the model cannot follow — " + hits.join(", ") + " (directing-grammar §3.5 · assemble-bg-prompt.js --check)");
    if (!still) return;
    if (!FILL_FRAME[size] && !sp.layout)
      flag("warn", "Shot " + (i + 1), "generated still with no shot.space.layout — name sides from the camera before the call (directing-grammar §3.5)");
    var personOn = personOnScreen(s, spaceTextOf(sp));
    if (personOn && size !== "pov" && !sp.facing)   // a pov shows hands, not a face to turn
      flag("warn", "Shot " + (i + 1), "a person is on screen with no shot.space.facing — write the visible result (\"faces camera-right\"), not \"left view of\"");
  });

  /* Cast — an id used in a shot but absent from SB_DOC.characters draws no panels, so the
     reviewer cannot see what reference set the call will get. */
  var castIds = {};
  CAST.forEach(function (c) { castIds[c.id] = 1; });
  var unknownCast = {};
  SCENES.forEach(function (s, i) {
    charsOf(s).forEach(function (id) {
      if (!castIds[id] && !unknownCast[id]) {
        unknownCast[id] = 1;
        flag("warn", "Shot " + (i + 1), 'character "' + id + '" is not in SB_DOC.characters — add it so the panels going into generation are visible here');
      }
    });
  });

  /* Music cues — a sound.cue naming nothing leaves the bed where it was, so the change the
     storyboard planned never reaches the mix. No window.MUSIC at all is a one-bed episode,
     which is a normal design and draws nothing. */
  var cueCount = 0, dropCount = 0;
  SCENES.forEach(function (s, i) {
    var sd = s.sound; if (!sd) return;
    if (sd.drop) dropCount++;
    if (sd.cue) {
      cueCount++;
      if (!MUSIC || !MUSIC[sd.cue]) {
        flag("warn", "Shot " + (i + 1), 'sound.cue "' + sd.cue + '" is not in window.MUSIC — produce has no file to fetch, so the bed stays where it was');
      }
      if (sd.drop) {
        flag("warn", "Shot " + (i + 1), "sound.cue and sound.drop on the same shot — the cue fades in muted, so the change lands on the next shot instead");
      }
    }
  });
  if (dropCount > 1 && FMT_KEY === "shorts-9x16") {
    flag("warn", "Sound", dropCount + " music drops in a short — spend one on the line the episode is about; past that neither reads");
  }

  h += '<div class="badges">' +
       (CAST.length ? badge("", "cast " + CAST.length) : "") +
       (camGaps ? badge("warn", "camera · " + camGaps + " shot" + (camGaps > 1 ? "s" : "") + " incomplete") : "") +
       (feelGaps ? badge("warn", "feel · " + feelGaps + " shot" + (feelGaps > 1 ? "s" : "") + " unwritten") : badge("ok", "feel · every shot")) +
       (sizeUnknown ? badge("warn", "size · " + sizeUnknown + " outside vocabulary") : "") +
       (MUSIC || cueCount || dropCount
          ? badge("", "music · " + (MUSIC ? Object.keys(MUSIC).length + " cue" + (Object.keys(MUSIC).length > 1 ? "s" : "") : "one bed")
                  + (dropCount ? " · " + dropCount + " drop" + (dropCount > 1 ? "s" : "") : ""))
          : "") +
       badge("mode", allRec ? "shooting mode" : hasRec ? "mixed lanes · " + recCount + " filmed scenes"
             : isLine ? "generated mode · per-line illustrations" : "generated mode") +
       (cover ? badge(hookKo ? "ok" : "warn", "opening · " + (hookKo || (cover.hookType ? cover.hookType + " (outside the four)" : "strategy not written"))) : "") +
       badge((DOC.status || "draft") === "draft" ? "" : "ok", DOC.status || "draft") +
       (DOC.created ? badge("", DOC.created) : "") +
       badge(lenCls, "main body " + total + "s") +
       (outroSec ? badge("", "with outro ≈" + (total + outroSec) + "s") : "") +
       badge("", main.length + " shots") +
       (hasSceneField ? badge("", (function () {
         var seen = {};
         SCENES.forEach(function (s, i) { seen[grammarOf(s, i).scene] = 1; });
         return Object.keys(seen).length + " scenes";
       })()) : "") +
       badge(orderOk ? "ok" : (orderBad ? "bad" : "warn"), ORDER_TXT) + "</div>";

  h += '<dl class="meta-grid">';
  if (DOC.keyMessage) h += "<dt>Key message</dt><dd>" + mark(DOC.keyMessage) + "</dd>";
  if (DOC.hook) h += "<dt>Cover hook</dt><dd>" + mark(DOC.hook) + "</dd>";
  if (DOC.seriesNote) h += "<dt>Series</dt><dd>" + mark(DOC.seriesNote) + "</dd>";
  h += "<dt>Source</dt><dd><code>scenes.js</code> — this document reads it and draws from it, so the two cannot diverge</dd>";
  h += "</dl>";

  /* Cover contract — as a check item, not a badge */
  if (cover) {
    if (dispLen(cover.title) > 16) flag("bad", "Cover", "title displays " + dispLen(cover.title) + " chars — cap 16");
    // statLabel plays two roles — under a hero stat it is a short tag qualifying that number, so
    // 18 characters; used alone with no stat it is the cover subtext and has to hold a sentence,
    // so 28. One 40px line fits 28 characters across 1080 (measured: 23 chars = 728px).
    var labCap = cover.stat ? 18 : 28;
    if (cover.statLabel && dispLen(cover.statLabel) > labCap)
      flag("warn", "Cover", "statLabel displays " + dispLen(cover.statLabel) + " chars — cap " + labCap + (cover.stat ? "" : " (subtext)"));
  }
  if (DOC.transitions && DOC.transitions.length && DOC.transitions.length !== SCENES.length)
    flag("warn", "Transitions", "SB_DOC.transitions: " + DOC.transitions.length + " — the shot count is " + SCENES.length);

  // Stops an unfilled template placeholder from reaching the approval gate
  var blanks = (JSON.stringify(DOC).match(/\{\{/g) || []).length;
  if (blanks) flag("bad", "SB_DOC", "unfilled placeholders: " + blanks + " — clear the {{…}} and reopen the document");

  /* All-live-voice episodes — narration IS the recording script, so an empty one means that
     shot has no sound */
  if (window.VOICE === "user") {
    SCENES.forEach(function (s, i) {
      if (s.type === "broll" || s.type === "outro") return;
      if (!(s.narration || []).length)
        flag("warn", "Shot " + (i + 1), "an all-live-voice episode (window.VOICE) with empty narration — the lines to speak never reach the script");
    });
  }

  /* Scene checks are collected during the card render, so they run first */
  var sceneChips = SCENES.map(function (s, i) { return sceneCheck(s, i + 1); });

  // Reserve the slot only — the content goes in after the render (see the flag comment above)
  h += '<section class="audit" id="audit"></section>';

  if (DOC.docNotes && DOC.docNotes.length)
    h += '<details class="docnotes"><summary>Design rationale · ' + DOC.docNotes.length + "</summary>" +
      DOC.docNotes.map(function (n) { return '<div class="note">' + mark(n) + "</div>"; }).join("") + "</details>";
  h += "</header>";

  /* ══ Section menu ══ — only the sections this document actually draws */
  var navItems = [["timeline", "Timeline"], ["shots", "Shots"]];
  if (CAST.length) navItems.push(["cast", "Cast"]);
  navItems.push(["contract", "Contract"]);
  if (DOC.prep && DOC.prep.length) navItems.push(["prep", "Shoot prep"]);
  if (DOC.sources && DOC.sources.length) navItems.push(["sources", "Sources"]);
  if (DOC.platforms && DOC.platforms.length) navItems.push(["platforms", "Platforms"]);
  if (DOC.recheck && DOC.recheck.length) navItems.push(["recheck", "Recheck"]);
  h += '<nav class="docnav"><a href="#audit">Checks</a>' +
       navItems.map(function (it) { return '<a href="#' + it[0] + '">' + it[1] + "</a>"; }).join("") +
       "</nav>";

  /* ══ Timeline ══ */
  h += '<h2 class="sec" id="timeline">Timeline<span class="aside">one slot = one shot · width proportional to length</span></h2>';
  h += '<div class="timeline">';
  // Drawn in playback order — b-roll sits at the end of the array but actually cuts in after
  // its `after` scene (scenes-schema §broll: putting it mid-array throws off every capture index)
  // order was already computed in the header checks
  var acc = 0, marks = [];
  order.forEach(function (o) {
    var d = Math.max(0.1, o.s.duration || 1);
    marks.push({ at: acc, d: d });
    acc += d;
    h += '<div class="tl-seg ' + esc(o.s.type) + '" style="flex:' + d + '" title="' +
         esc(strip(o.s.title || o.s.type)) + '">#' + (o.i + 1) + "<small>" + (o.s.duration || "?") + "s</small></div>";
  });
  if (outroSec || outroUnknown)
    h += '<div class="tl-seg outro" style="flex:' + (outroSec || 9) + '" title="' +
         esc((DOC.outro && DOC.outro.note) || "shared outro") + '">outro<small>' +
         (outroSec ? outroSec + "s" : "length not written") + "</small></div>";
  h += "</div>";
  h += '<div class="tl-ruler">' + marks.map(function (m) {
    return '<span style="flex:' + m.d + '">' + m.at + "s</span>"; }).join("") +
    (outroSec ? '<span style="flex:' + outroSec + '">' + acc + "s</span>" +
      '<span style="flex:0 0 auto">' + (acc + outroSec) + "s</span>"
      : '<span style="flex:0 0 auto">' + acc + "s</span>") + "</div>";
  if (outroUnknown) flag("warn", "Outro", "there is an outro scene but no SB_DOC.outro length — it does not count toward the total");

  /* ══ Shot cards ══ */
  h += '<h2 class="sec" id="shots">Shot composition<span class="aside">one entry = one shot · a reveal is a screen state within that shot</span></h2>';
  h += '<div class="toolbar">' +
       '<label><input type="checkbox" id="tg-safe"> Show text area</label>' +
       '<label><input type="checkbox" id="tg-subs" checked> Subtitles</label>' +
       '<span class="legend">dashed = where the text goes · hatched = the bottom covered by subtitles and app buttons · channel color = AI video · outline only = HTML staging</span>' +
       '<span style="margin-left:auto">a preview drawn at reduced scale from the real screen</span></div>';

  var shotGroups = [];
  SCENES.forEach(function (s, i) {
    var g = grammarOf(s, i);
    var last = shotGroups[shotGroups.length - 1];
    if (hasSceneField && last && last.scene === g.scene) last.items.push({ s: s, i: i, g: g });
    else shotGroups.push({ scene: g.scene, slug: g.slug, sequence: g.sequence, items: [{ s: s, i: i, g: g }] });
  });

  var carryNoted = false, prevSeq = "";
  shotGroups.forEach(function (grp) {
    if (grp.sequence && grp.sequence !== prevSeq) {
      h += '<div class="seq-head">Sequence · ' + esc(grp.sequence) + "</div>";
      prevSeq = grp.sequence;
    }
    if (hasSceneField)
      h += '<section class="scene-band"><div class="scene-band-head"><span class="sn">S#' +
           esc(String(grp.scene)) + "</span><span>" + esc(grp.slug || ("Scene " + grp.scene)) + "</span></div>";
    grp.items.forEach(function (item) {
    var s = item.s, i = item.i, g = item.g, no = i + 1;
    var narr = s.narration || [];
    var pic = pictureOf(s), ov = overlayOf(s);
    h += '<article class="scene"><div class="scene-head">';
    h += '<span class="scene-no">Shot ' + no + " · " + esc(s.type).toUpperCase() + "</span>";
    if (g.size) h += '<span class="shot-size' + (SIZE_KO[g.size] ? "" : " unknown") + '">' + esc(SIZE_KO[g.size] || (g.size + " ?")) + "</span>";
    if (g.angle && ANGLE_KO[g.angle]) h += '<span class="shot-angle angle-' + esc(g.angle) + '">' + ANGLE_KO[g.angle] + "</span>";
    // A shot with no title (screen text only when needed — scenes-schema) builds its header from badges alone
    var headTitle = s.title || (s.type === "quote" ? s.text : "");
    if (headTitle) h += '<span class="scene-title">' + mark(headTitle) + "</span>";
    var beat = beatOf(s);
    if (beat && BEAT_KO[beat])
      h += '<span class="scene-beat beat-' + beat + '">' + BEAT_KO[beat] + "</span>";
    // The cover shot also carries the opening-strategy name tag — the title and segment ① have to carry that pull
    if (s.type === "cover") {
      h += '<span class="scene-beat beat-hooktype">' + esc(HOOK_KO[s.hookType] || (s.hookType ? s.hookType + " (outside the four)" : "strategy not written")) + "</span>";
      h += '<span class="scene-beat beat-hooktype">form · ' + esc(HOOK_FORM_KO[s.hookForm] || (s.hookForm ? s.hookForm + " (outside the six)" : "not written")) + "</span>";
      h += '<span class="scene-beat beat-hooktype">arc · ' + esc(ARC_KO[s.arc] || (s.arc ? s.arc + " (outside the two)" : "answer first (default)")) + "</span>";
    }
    h += '<span class="scene-checks">' + sceneChips[i] + "</span></div>";
    h += '<div class="shot-meta"><span class="craft">' +
         '<span class="vtag' + (pic === "ai-video" ? " gen" : "") + '">' + esc(PIC_KO[pic] || pic) + "</span>" +
         '<span class="vtag' + (ov === "html" ? " html" : "") + '">' + esc(overlayLabel(s)) + "</span>" +
         charsOf(s).map(function (id) {
           return '<span class="char-tag">' + esc(castName(id)) + "</span>"; }).join("") + "</span>" +
         (s.type === "outro" ? "" :
           (g.feel ? '<span class="shot-info shot-feel"><b>What the audience feels</b>' + esc(g.feel) + "</span>"
                   : '<span class="shot-info shot-feel miss"><b>What the audience feels</b>not written — write shot.feel before the size, angle and camera (directing-grammar §5)</span>')) +
         (g.info ? '<span class="shot-info"><b>What this shot adds</b>' + esc(g.info) + "</span>" : "") +
         (spaceTextOf(g.space) ? '<span class="shot-info"><b>From the camera</b>' + esc(spaceTextOf(g.space)) + "</span>"
            : (genStill(s) && !FILL_FRAME[g.size] ? '<span class="shot-info shot-feel miss"><b>From the camera</b>not written — fill shot.space before generating the still (directing-grammar §3.5)</span>' : "")) +
         "</div>";

    if (s.type === "broll") {
      var v = s.visual || {};
      h += '<div class="clip">' +
        (v.src ? '<img src="' + esc(v.src) + '" alt="b-roll source" onerror="this.remove()">' : "") +
        '<div class="meta">' +
        "<div><b>Picture</b>AI video — generated with the source photo as the parameter</div>" +
        "<div><b>Staging</b>no overlay — the audio the video carries</div>" +
        "<div><b>Insert</b>right after shot " + ((s.after || 0) + 1) + " ends · using " + (s.duration || "?") + "s (Veo: the front of the 8s original · Seedance: generated at this length)</div>" +
        (v.src ? "<div><b>Source</b><code>" + esc(v.src) + "</code> — the same file as the background of shot " + ((s.after || 0) + 1) + "</div>" : "") +
        (camOf(s) ? "<div><b>Camera</b>" + camHtml(camOf(s)) + "</div>"
                  : v.motion ? "<div><b>Motion</b>" + esc(v.motion) + "</div>" : "") +
        (v.audio ? "<div><b>Audio</b>" + esc(v.audio) + "</div>" : "") +
        (v.clip ? "<div><b>Output</b><code>" + esc(v.clip) + "</code></div>" : "") +
        "<div><b>Narration</b>" + (narr.length ? "present — b-roll has to be empty" : "none (the audio the video carries)") + "</div>" +
        "</div></div>";
    } else {
      var vis = s.visual || {};
      var states = revealsOf(s);
      // Segment → cut assignment: sentence j attaches to the last real cut (carry cuts excluded)
      // whose seg ≤ j. With more sentences than cuts, the last cut absorbs the rest (the screen
      // holds still and only the subtitle changes).
      var segRows = states.map(function () { return []; });
      narr.forEach(function (n, j) {
        var at = 0;
        states.forEach(function (st, k) { if (!st.carry && st.seg >= 0 && st.seg <= j) at = k; });
        segRows[at].push(j);
      });

      h += '<div class="conti">' + states.map(function (st, k) {
        var f = fit[i + ":" + k] || {};
        // Cut type — a still image, or a generated video made with an image as the parameter.
        // visual.video in scenes.js (the explicit marker) is the source of truth; without it the
        // structure decides.
        var seg = st.seg >= 0 && narr[st.seg] ? narr[st.seg] : null;
        var vt =
          recOf(s) ? ["recorded screen", ""] :
          s.type === "outro" ? ["shared outro mp4", "gen"] :
          (s.type === "quote" && vis.clip) ? ["speech clip video · veo", "gen"] :
          vis.video ? ["image→video · veo", "gen"] :
          (seg && /^card:/.test(seg.imgPrompt || "")) ? ["typing video · code render", "gen"] :
          (seg && seg.img) ? ["still illustration", ""] :
          ["still background", ""];
        var cell = '<div class="cut-head"><span class="no">reveal ' + (k + 1) + "</span>" + esc(st.label) +
          '<span class="vtag' + (vt[1] ? " " + vt[1] : "") + '">' + vt[0] + "</span></div>";

        // Screen — the text that appears on this cut. Letters inside the frame are tiny, so they are read here.
        var sc = "";
        if (recOf(s)) {
          if (s.kicker) sc += capline(null, null, esc(s.kicker));
          if (s.title) sc += capline(esc(strip(s.title)));
          if (s.type === "cover" && s.stat) sc += capline(esc(s.stat), esc(s.statLabel || ""));
          sc += (s.bullets || []).map(function (b, m) {
            return capline(esc(b.t), b.d ? esc(b.d) : null, null, m + 1); }).join("");
          // The portrait shooting overlay draws only kicker and title (screencast-overlay).
          // In landscape the captions show up in the lower third too, so printing that note
          // there would be a lie.
          if ((s.bullets || []).length && !WIDE)
            sc += capline(null, null, "captions are not rendered on screen — the dialogue and subtitles say them");
          if (s.footnote) sc += capline(null, null, esc(s.footnote));
        } else if (s.type === "cover") {
          if (k === 0) {
            if (s.kicker) sc += capline(null, null, esc(s.kicker));
            if (s.title) sc += capline(esc(strip(s.title)));
          } else if (s.stat) {
            sc += capline(esc(s.stat), esc(s.statLabel || ""));
          }
        } else if (s.type === "points") {
          if (k === 0) {
            if (s.title) sc += capline(esc(strip(s.title)));
            if (s.footnote) sc += capline(null, null, esc(s.footnote));
            if (!s.title && !s.footnote) sc += capline(null, null, "no screen text — picture only");
          } else {
            var b = (s.bullets || [])[st.cap];
            if (b) sc += capline(esc(b.t), b.d ? esc(b.d) : null, null, st.cap + 1);
          }
        } else if (s.type === "quote") {
          if (k === 0) {
            sc += capline(esc(s.speaker || ""), esc(s.role || ""));
            // On a clip quote the quote itself never appears on screen — it goes out as audio only, so that is what is written
            if (vis.clip && s.text) sc += capline(null, null, "the quote does not appear on screen — audio only: " + esc(strip(s.text)));
          } else if (s.text) {
            sc += capline(null, esc(strip(s.text)));
          }
        } else if (s.type === "outro") {
          if (THEME.brand) sc += capline(esc(THEME.brand));
          if (s.title) sc += capline(esc(strip(s.title)), s.sub ? esc(s.sub) : null);
        }
        if (sc) cell += '<div class="cut-sec">SCREEN</div>' + sc;

        // Audio — the lines that go out during this cut
        var lines = "";
        if (st.carry && st.seg >= 0)
          lines += '<div class="cut-carry">line ' + (st.seg + 1) + " carries over — only the screen (the caption) changes</div>";
        segRows[k].forEach(function (j) {
          var n = narr[j], same = strip(n.tts) === strip(n.sub);
          lines += '<div class="cut-line"><span class="k">' + (j + 1) + '</span><div class="b">' + esc(n.tts) +
            '<span class="len"> · ' + netLen(n.tts) + " chars</span>" +
            (same ? "" : '<div class="sub-diff"><b>Subtitle</b> ' + esc(n.sub) + "</div>") +
            "</div></div>";
        });
        if (!lines && s.type === "quote" && vis.clip)
          lines = '<div class="cut-carry">speech clip — the actor speaks, so there is no TTS narration</div>';
        if (lines) cell += '<div class="cut-sec">AUDIO</div>' + lines;

        return '<div class="conti-row"><figure class="panel">' +
          frame(s, st, k, f.tier || 0, f.statScale || 0) + "</figure>" +
          '<div class="cut">' + cell + "</div></div>";
      }).join("") + "</div>";

      // The same note is not repeated on every scene — only the first time.
      if (!recOf(s) && s.type === "points" && narr.length && narr.length !== states.length && !carryNoted) {
        carryNoted = true;
        h += '<div class="note">The screen changes ' + states.length + " times but there are " + narr.length +
             " sentences — one sentence ends up holding two captions, and which one is decided at production.</div>";
      }

      /* Outside the cut — background, motion, prompts, audio directions */
      var meta = "";
      if (recOf(s)) {
        // The user films a shooting scene from this document — what is visible (shot), what to
        // do (action) and which file to save it as (clip) all have to be here for the shoot to work.
        meta += '<div class="shot">' + mark(vis.shot || "—") + "</div>";
        if (vis.action) meta += '<div class="row"><b>Action</b><div class="v">' + mark(vis.action) + "</div></div>";
        meta += '<div class="row"><b>Save as</b><div class="v"><code>' + esc(vis.clip || "— filename undecided") +
                "</code>" + (narr.length ? " · narration over it (TTS)" : " · live voice (uses the clip audio)") + "</div></div>";
      } else {
        var lineImgs = narr.filter(function (n) { return n.img; });
        if (lineImgs.length) {
          meta += '<div class="row"><b>Art</b><div class="v">one per line · ' + lineImgs.length +
               " total <span style='color:var(--faint)'>(light mode · white-background line art)</span></div></div>";
          meta += '<div class="row"><b>Key art</b><div class="v"><code>' + esc(vis.bg || "—") + "</code> — the source for the cover still and the thumbnail</div></div>";
          meta += lineImgs.map(function (n, j) {
            return n.imgPrompt ? '<details class="prompt"><summary>illustration ' + (j + 1) + " prompt</summary><p>" +
              esc(n.imgPrompt) + "</p></details>" : ""; }).join("");
        } else if (vis.bg || s.type === "quote") {
          meta += '<div class="row"><b>Background</b><div class="v">' +
               (vis.bg ? "<code>" + esc(vis.bg) + "</code>" : "none — speech clip or quote card") + "</div></div>";
        }
        if (camOf(s))
          meta += '<div class="row"><b>Camera</b><div class="v">' + camHtml(camOf(s)) + "</div></div>";
        else if (vis.motion)
          meta += '<div class="row"><b>Motion</b><div class="v">' + esc(vis.motion) + "</div></div>";
        if (vis.video) {
          // Motion-background scene — this image becomes the parameter for veo img2video (scenes-schema §motion background)
          meta += '<div class="row"><b>Video</b><div class="v">image→video generation — veo img2video with <code>' + esc(vis.bg || "?") +
               "</code> as the parameter" +
               (vis.video.clip ? " → <code>" + esc(vis.video.clip) + "</code>" : "") + "</div></div>";
          if (vis.video.prompt)
            meta += '<details class="prompt"><summary>motion prompt</summary><p>' + esc(vis.video.prompt) + "</p></details>";
        }
        if (vis.clip && vis.clip.prompt)
          meta += '<details class="prompt"><summary>speech clip prompt</summary><p>' + esc(vis.clip.prompt) + "</p></details>";
        if (vis.bgPrompt)
          meta += '<details class="prompt"><summary>background prompt</summary><p>' + esc(vis.bgPrompt) + "</p></details>";
        if (vis.slide) {
          meta += '<div class="row"><b>slide</b><div class="v"><code>' + esc(vis.slide.file || "?") +
               "</code> — authored in §8 after approval</div></div>";
          if (vis.slide.plan)
            meta += '<details class="prompt"><summary>slide plan</summary><p>' + esc(vis.slide.plan) +
                 (vis.slide.labels && vis.slide.labels.length ? " · labels: " + esc(vis.slide.labels.join(", ")) : "") +
                 "</p></details>";
        }
      }
      if (DOC.privacy && DOC.privacy[no])
        meta += '<div class="note pv">Privacy avoidance — ' + mark(DOC.privacy[no]) + "</div>";
      if (DOC.audioNotes && DOC.audioNotes[no])
        meta += '<div class="note">' + mark(DOC.audioNotes[no]) + "</div>";
      if (meta) h += '<div class="cmeta">' + meta + "</div>";
    }

    // Three or more scene notes fold away — what feeds the decision directly is privacy avoidance and the transition
    var sn = (DOC.sceneNotes && DOC.sceneNotes[no]) || [];
    if (sn.length) {
      var body = sn.map(function (n) { return '<div class="note">' + mark(n) + "</div>"; }).join("");
      h += sn.length > 2
        ? '<details class="scenenotes"><summary>Design rationale · ' + sn.length + "</summary>" + body + "</details>"
        : '<div class="scene-notes">' + body + "</div>";
    }
    if (DOC.transitions && DOC.transitions[i])
      h += '<div class="transition"><b>TRANSITION</b>' + mark(DOC.transitions[i]) + "</div>";
    h += "</article>";
    });
    if (hasSceneField) h += "</section>";
  });

  /* ══ Cast ══ — the channel characters this episode uses, with the panels that will be
     handed to the generation call. Absent SB_DOC.characters, nothing is drawn. */
  if (CAST.length) {
    h += '<h2 class="sec" id="cast">Cast<span class="aside">reference set — face first, then body (array order is weight)</span></h2>';
    h += '<div class="cast">';
    var PANEL_LABELS = [["face", "FACE"], ["body", "BODY · no head"], ["back", "BACK"],
                        ["front", "FRONT · legacy"], ["real", "LIVE ACTION"]];
    CAST.forEach(function (c) {
      var panels = c.panels || {};
      var shots = [], scopes = [];
      SCENES.forEach(function (s, i) {
        charEntries(s).forEach(function (e) {
          if (e.id !== c.id) return;
          shots.push("#" + (i + 1));
          if (e.scope) scopes.push("#" + (i + 1) + " " + e.scope);
        });
      });
      h += '<div class="cast-card"><div class="cast-panels">';
      var drawn = 0;
      PANEL_LABELS.forEach(function (pr) {
        var src = panels[pr[0]];
        if (!src) return;
        drawn++;
        h += '<div class="cast-panel"><img src="' + esc(src) + '" alt="' + esc(c.id + " " + pr[0]) +
             '" onerror="this.style.visibility=\'hidden\'"><div class="lb">' + esc(pr[1]) + "</div></div>";
      });
      if (!drawn) h += '<div class="cast-panel"><div class="lb">no panel path written</div></div>';
      h += "</div><div>";
      h += '<div class="cast-name">' + esc(c.name || c.id) + " <code>" + esc(c.id) + "</code>" +
           (c.veo === "banned" ? " " + badge("bad", "veo banned") : "") + "</div>";
      if (c.role) h += '<div class="cast-role">' + mark(c.role) + "</div>";
      if (c.note) h += '<div class="cast-note">' + mark(c.note) + "</div>";
      h += '<div class="cast-shots"><b>SHOTS</b>' +
           (shots.length ? shots.join(" · ")
                         : "appears in no shot — check visual.character") + "</div>";
      if (scopes.length)
        h += '<div class="cast-shots"><b>SCOPE</b>' + esc(scopes.join(" · ")) + "</div>";
      h += "</div></div>";
    });
    h += "</div>";
  }

  /* ══ Contract · sources · platforms ══ */
  h += '<h2 class="sec" id="contract">Contract limits<span class="aside">computed at render time</span></h2><table class="grid"><tbody>';
  h += "<tr><th>Format</th><td>" + esc(FMT.label) + " <code>" + esc(FMT_KEY) + "</code>" +
       (window.FORMAT ? "" : " <span class=\"aside\">no window.FORMAT — default</span>") +
       (FMT_KEY === "youtube-long-16x9"
         ? " <span class=\"aside\">safe-zone values provisional (mobile web landscape and the top title bar are unmeasured)</span>" : "") +
       "</td></tr>";
  h += "<tr><th>Main-body length</th><td>" + durTxt(total) + " — default " +
       durTxt(FMT.totalMin) + "~" + durTxt(FMT.totalMax) + " · cap " + durTxt(FMT.totalHard) +
       (outroSec ? " · with outro ≈" + durTxt(total + outroSec) : "") + "</td></tr>";
  h += "<tr><th>Shot count</th><td>" + main.length + " shots — band " +
       FMT.sceneCountMin + "~" + FMT.sceneCountMax + "</td></tr>";
  if (cover) {
    h += "<tr><th>Cover title</th><td>" + mark(cover.title) + " — displays " + dispLen(cover.title) + "/16 chars</td></tr>";
    h += "<tr><th>Arc</th><td>" + (ARC_KO[arc]
         ? esc(ARC_KO[arc]) + " (<code>" + esc(arc) + "</code>" + (cover.arc ? "" : ", default") + ") — " + ORDER_TXT +
           (storyArc ? "; the answer appears for the first time in the result, after the turn" : "; the finished thing before the how")
         : "<code>" + esc(arc) + "</code> is outside the two — answer-first or story (scenes-schema §playback order)") + "</td></tr>";
    h += "<tr><th>Opening strategy</th><td>" + (HOOK_KO[cover.hookType]
         ? esc(HOOK_KO[cover.hookType]) + " (<code>" + esc(cover.hookType) + "</code>) — the title, segment ① and the hooking ride this pull"
         : (cover.hookType ? "<code>" + esc(cover.hookType) + "</code> is outside the four — " : "not written — ") +
           "one of fear|empathy|curiosity|spoiler (scenes-schema §the four opening strategies)") + "</td></tr>";
    h += "<tr><th>Hook form</th><td>" + (HOOK_FORM_KO[cover.hookForm]
         ? esc(HOOK_FORM_KO[cover.hookForm]) + " (<code>" + esc(cover.hookForm) + "</code>) — the title and segment ① take this shape, and the result pays it"
         : (cover.hookForm ? "<code>" + esc(cover.hookForm) + "</code> is outside the six — " : "not written — ") +
           "one of paradox|gap|payoff|identify|number|secret (scenes-schema §the six hook forms)") + "</td></tr>";
    h += "<tr><th>Shot grammar</th><td>" + (feelGaps ? feelGaps + " shot" + (feelGaps > 1 ? "s" : "") + " with no shot.feel" : "every shot says what the audience should feel") +
         (sizeUnknown ? " · " + sizeUnknown + " size value" + (sizeUnknown > 1 ? "s" : "") + " outside the vocabulary" : "") +
         " — feel first, then size · angle · camera (directing-grammar §5)</td></tr>";
    if (cover.statLabel) h += "<tr><th>statLabel</th><td>" + esc(cover.statLabel) + " — displays " + dispLen(cover.statLabel) + "/18 chars</td></tr>";
  }
  h += "<tr><th>Speech rate</th><td>" +
     (allRec ? "shooting 5~6 chars/s (4.5~6.5 allowed) · scenes 8~20s"
      : hasRec ? "shooting scenes 5~6 chars/s · generated scenes derived from TTS at 4.5 chars/s (measured scene by scene)"
      : "derived from TTS at 4.5 chars/s · scene cap " + FMT.sceneMax + "s") + "</td></tr>";
  h += "<tr><th>THEME</th><td>" + ["accent", "accent2", "ink"].map(function (k) {
    return '<span class="swatch" style="background:' + esc(THEME[k]) + '"></span><code>' + esc(THEME[k]) + "</code>"; }).join(" &nbsp; ") +
    " &nbsp; brand <code>" + esc(THEME.brand) + "</code></td></tr>";
  h += "</tbody></table>";

  if (DOC.prep && DOC.prep.length)
    h += '<h2 class="sec" id="prep">Before the shoot</h2><ul class="checklist">' +
      DOC.prep.map(function (p) { return "<li>" + mark(p) + "</li>"; }).join("") + "</ul>";

  if (DOC.sources && DOC.sources.length) {
    h += '<h2 class="sec" id="sources">Sources<span class="aside">ledger: research.md</span></h2>' +
      '<table class="grid"><thead><tr><th>Claim</th><th>Source</th><th>Checked</th><th>Status</th></tr></thead><tbody>';
    DOC.sources.forEach(function (r) {
      // A leading emoji jumps out in saturation — the content stays, only the render moves to the badge color language (review round 2)
      var st = r.status || "", stHtml = mark(st);
      var lead = st.match(/^(✅|⚠️|❌)\s*/);
      if (lead) {
        var sc = lead[1] === "✅" ? ["ok", "✓"] : lead[1] === "⚠️" ? ["warn", "!"] : ["bad", "×"];
        stHtml = '<span class="src-mark ' + sc[0] + '">' + sc[1] + "</span> " + mark(st.slice(lead[0].length));
      }
      h += "<tr><td>" + mark(r.claim) + "</td><td>" +
        (r.links || []).map(function (l) {
          return l.url ? '<a href="' + esc(l.url) + '">' + esc(l.label) + "</a>" : "<span>" + esc(l.label) + "</span>";
        }).join(" · ") + "</td><td>" + esc(r.date || "") + "</td><td>" + stHtml + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.platforms && DOC.platforms.length) {
    h += '<h2 class="sec" id="platforms">Platform plan</h2><table class="grid"><thead><tr><th>Platform</th><th>Form</th><th>Notes</th></tr></thead><tbody>';
    DOC.platforms.forEach(function (p) {
      h += "<tr><td><b>" + esc(p.name) + "</b></td><td>" + esc(p.form) + "</td><td>" + mark(p.note || "") + "</td></tr>";
    });
    h += "</tbody></table>";
  }
  if (DOC.recheck && DOC.recheck.length)
    h += '<h2 class="sec" id="recheck">Recheck before publishing<span class="aside">time-sensitive</span></h2><ul class="checklist">' +
      DOC.recheck.map(function (r) { return "<li>" + mark(r) + "</li>"; }).join("") + "</ul>";

  h += '<footer class="doc-foot"><b>scenes.js is the original</b> — this document only draws it, so when a shot looks wrong, fix scenes.js. ' +
       "In this file, edit SB_DOC only (notes, audio directions, sources, platform plan).<br>" +
       '<a href="./storyboard.md">storyboard.md</a> · <a href="./script.md">script.md</a> · ' +
       '<a href="./research.md">research.md</a> · <a href="./scenes.js">scenes.js</a></footer>';

  app.innerHTML = h;

  /* Filling the check strip — nothing is missed only once every violation has been registered */
  auditSealed = true;
  // Violations first — a skimming eye has to hit them before anything else (within a level, registration order holds)
  audit = audit.filter(function (a) { return a.level === "bad"; })
    .concat(audit.filter(function (a) { return a.level !== "bad"; }));
  var nBad = audit.filter(function (a) { return a.level === "bad"; }).length;
  var nWarn = audit.length - nBad;
  var box = document.getElementById("audit");
  box.className = "audit" + (nBad ? " has-bad" : nWarn ? " has-warn" : "");
  box.innerHTML = '<div class="audit-head"><span class="dot"></span>Contract check' +
    '<span class="count">' + (audit.length ? "violations " + nBad + " · to check " + nWarn : "no violations") + "</span></div>" +
    (audit.length
      ? "<ul>" + audit.map(function (a) {
          return '<li class="' + a.level + '"><span class="where">' + esc(a.where) + "</span>" +
                 '<span class="what">' + esc(a.what) + "</span></li>"; }).join("") + "</ul>"
      : '<div class="clean">Character counts, speech rate, shot length, frame overflow, total length, cover title, playback order (arc), opening strategy, hook form, shot grammar (feel · size · angle · space) — every contract item passes.</div>');

  var safe = document.getElementById("tg-safe"), subs = document.getElementById("tg-subs");
  if (safe) safe.addEventListener("change", function () { document.body.classList.toggle("safe", safe.checked); });
  if (subs) subs.addEventListener("change", function () { document.body.classList.toggle("subs", subs.checked); });

  var who = DOC.channelName || DOC.channel || THEME.brand || "";
  document.title = (DOC.displayTitle || DOC.topic || "Storyboard") + (who ? " — Storyboard · " + who : " — Storyboard");
})();
</script>
</body>
</html>
