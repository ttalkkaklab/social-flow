<!doctype html>
<html class="studio"><meta charset="utf-8">
<style>
:root{--grow:1000ms;--plate:400ms;--ease-mask:cubic-bezier(.4,0,.2,1);--ease:cubic-bezier(.05,.7,.1,1)}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.studio-plate{position:absolute;inset:0;background:var(--paper)}
#stage{position:absolute;left:var(--x);top:var(--top);width:var(--width);height:var(--height);color:var(--ink)}
#eyebrow{font-size:34px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
#title{font-size:62px;line-height:1.18;letter-spacing:-.025em;font-weight:750;word-break:keep-all;text-wrap:balance;margin:28px 0 20px;max-height:150px}
#insight{font-size:44px;line-height:1.4;word-break:keep-all;text-wrap:balance;min-height:104px;color:var(--muted)}
#plot{margin-top:30px}#source{position:absolute;bottom:0;font-size:28px;line-height:1.4;color:var(--muted);max-width:100%;overflow-wrap:anywhere;border-top:3px solid var(--line);padding-top:20px}
.wide #eyebrow{font-size:26px}.wide #source{border-top-width:2px}.wide #title{font-size:52px;max-height:125px}.wide #insight{font-size:32px}.wide #stage{display:grid;grid-template-columns:520px 1fr;gap:50px}.wide #intro{padding-top:18px}.wide #plot{margin-top:0}.wide #source{max-width:480px;font-size:24px}
.wide.staged-share #stage{display:block}.wide.staged-share #title{font-size:72px;margin-top:16px}.wide.staged-share #insight{min-height:0;font-size:32px}.wide.staged-share #plot{margin-top:24px}.wide.staged-share #source{max-width:100%}
.liquid-glass .studio-plate{background:radial-gradient(ellipse at 72% 35%,#fff 0%,#F4F6FA 65%,#E9EEF6 100%)}
.liquid-glass #title{letter-spacing:-.04em;font-weight:650}
.liquid-glass #eyebrow{display:none}
.liquid-glass #insight{display:none}
.liquid-glass #source{border:0;padding-top:0;color:#5E6B80}
.wide.staged-share.liquid-glass #title{font-size:80px;margin:0 0 18px}
.wide.staged-share.liquid-glass #insight{font-size:34px;line-height:1.4}
.wide.staged-share.liquid-glass #plot{margin-top:72px}
.liquid-glass:not(.wide) #title{font-size:72px;margin:0 0 30px}
.liquid-glass:not(.wide) #insight{font-size:40px;min-height:112px}
.liquid-glass:not(.wide) #plot{margin-top:54px}
</style>
<div class="studio-plate" data-ground></div>
<main id="stage"><section id="intro"><div id="eyebrow"></div><div id="title"></div><div id="insight"></div></section><div id="plot"></div><div id="source"></div></main>
<script src="../scenes.js"></script>
<script src="assets/render-routing.js"></script>
<script src="assets/chart-runtime.js"></script>
<script>
// Only change this index. Chart design and motion are shared; content stays in scenes.js.
const SLIDE_SHOT = 1;
const S=window.SCENES[SLIDE_SHOT-1],D=S.shot.render.data,wide=window.FORMAT==='youtube-long-16x9';
const W=wide?1920:1080,H=wide?1080:1920,x=wide?96:176,zoneTop=wide?96:190,zoneBottom=wide?285:570;
const staged=!!D.reveal;
const cw=W-2*x,ch=H-zoneTop-(wide&&staged?96:zoneBottom),pw=wide&&!staged?cw-570:cw,ph=wide&&staged?(D.material==='liquid-glass'?540:440):wide?ch:650;
const C=D.material==='liquid-glass'?{paper:'#F4F6FA',ink:'#172237',muted:'#536077',line:'#D9E1EE'}:CHART_RUNTIME.colors(D.surface,window.THEME?.chartAccent);
for(const [key,value] of Object.entries({...C,x:x+'px',top:zoneTop+'px',width:cw+'px',height:ch+'px',w:W+'px',h:H+'px','zone-x':x+'px','zone-top':zoneTop+'px','zone-bottom':zoneBottom+'px'}))document.documentElement.style.setProperty('--'+key,value);
document.body.style.width=W+'px';document.body.style.height=H+'px';document.body.classList.toggle('wide',wide);
document.body.classList.toggle('staged-share',staged);
document.body.classList.toggle('liquid-glass',D.material==='liquid-glass');
const plot=document.getElementById('plot'),insight=document.getElementById('insight');
document.getElementById('title').textContent=(D.title||S.title||'').replace(/\*\*/g,'');
document.getElementById('eyebrow').textContent=D.kicker||D.unit;
document.getElementById('source').textContent=D.source+(D.chart==='map'?' · '+D.map.source:'');
let segments=(S.narration||[]).map(()=>S.duration*1000/Math.max(1,S.narration.length));
function renderSlide(ms,group){
  const motion={primitive:'chart-reveal'};plot.dataset.primitive=motion.primitive;plot.dataset.rg=group;
  const i=Math.max(0,Math.min(segments.length-1,group-1)),p=Math.max(0,Math.min(1,ms/segments[i]));
  // The graph and its focus continue across narration boundaries. No group restarts the bars.
  plot.innerHTML=CHART_RUNTIME.render(D,{width:pw,height:ph,group:i+1,progress:p,wide,elapsedMs:ms,growMs:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grow')),plateMs:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--plate')),accent:window.THEME?.chartAccent});
  insight.textContent=D.beats[ms<parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--plate'))/2&&i>0?i-1:i].insight;
}
// SEEK-RUNTIME-BEGIN
window.__seek=(ms,group=1)=>renderSlide(ms,group);
function checkRevealTiming(){if(D.reveal&&Math.max(D.reveal.total.endMs,...D.reveal.parts.map(p=>p.endMs))>segments[0])throw new Error('staged reveal exceeds the first measured narration segment')}
window.__validateTiming=checkRevealTiming;
window.__setSegs=map=>{segments=segments.map((d,i)=>map[i+1]>0?map[i+1]:d);checkRevealTiming()};
window.__groups=()=>[{rg:0,dur:0},...segments.map((dur,i)=>({rg:i+1,dur}))];
window.__size=()=>({w:W,h:H});
window.__meta=()=>({hold:0,stray:document.getAnimations().length,infinite:0,broken:[],chart_motion:{grow_ms:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grow')),plate_ms:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--plate'))}});
window.__ready=()=>window._chartReady||(window._chartReady=(async()=>{
  const errors=RENDER_ROUTING.checkScene(S);if(errors.length)throw new Error(errors.join('\n'));
  await document.fonts.ready;
  for(const beat of D.beats){const marker=document.createElement('span');marker.hidden=true;marker.dataset.rg=beat.group;marker.dataset.primitive='chart-reveal';plot.parentElement.appendChild(marker)}
  const q=new URLSearchParams(location.search);window.__seek(Number(q.get('t')||1e9),Number(q.get('g')||segments.length));
})());
window.__ready();
</script></html>
