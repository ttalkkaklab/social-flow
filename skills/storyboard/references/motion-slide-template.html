<!doctype html>

<meta charset="utf-8">
<title>모션 슬라이드 씬</title>
<!--
  social-flow 모션 슬라이드 렌더러 — 숏폼 1080×1920 · 롱폼 1920×1080 (window.FORMAT 이 고른다).
  scenes-schema §모션 슬라이드 · storyboard SKILL §5.6 · slide-design.md 가 이 파일의 사용 계약이다.

  ■ 사용법 (storyboard §5.6 — 승인 전에):
      1. 이 파일을 storyboard/slides/s<샷번호>-<slug>.html 로 복사한다
         (샷번호 = SCENES 배열 순번 1부터 — visual.slide.file 과 같은 이름).
      2. 아래 SLIDE_SHOT 을 그 샷번호로 바꾼다.
      3. renderSlide() 하나만 그 씬의 도해로 다시 쓴다 — 다른 부분은 건드리지 않는다.
         원리(mechanism)는 일러스트 배우(h.fig · slide.arts)와 관계선
         (h.stem · h.bus · h.chamber · h.ring · h.press)으로 그린다. 글자 나열은 아니다.
         공간에 세울 물체는 구운 시트(h.object · slide.object · bake-object.py)다 — 아래 ■ 스튜디오 판.
      4. 글자는 전부 scenes.js 에서 온다(S.title·S.bullets·S.visual.slide.labels).
         여기 새 한국어 문자열 리터럴을 쓰지 않는다 — 문체 게이트(screen 표면)를
         통과한 적 없는 글자가 화면에 나가는 길이고 check-slide.js 가 기계로 잡는다.
         숫자는 리터럴로 써도 되지만 labels·research.md 의 값과 같아야 한다(시트 읽기가 대조한다).

  ■ 상태 규칙 (scenes-schema §모션 슬라이드 — 템플릿·렌더러·리뷰어가 전부 이 한 줄을 따른다):
      리빌 그룹 k 의 클립 = 그룹 0..k-1 은 쉬는 상태(끝 프레임), 그룹 k 가 t=0 부터 움직이고
      끝나면 그룹 k 의 쉬는 상태에서 얼어붙는다. 그룹 0 은 바탕(출처·스크림·축)이라 따로
      움직이지 않고 클립 1 의 첫 프레임이다. 그룹은 나레이션 세그먼트와 1:1 이 기본(세그 1 = 그룹 1).
      여는 사슬: 키커 → 제목 → 첫 값은 그룹 1 안에서 --lead 간격으로 잇따라 들어온다. 방송
      그래픽의 "플레이트 먼저, 글자 다음" 오프셋이고 리뷰어는 이 사슬을 한 이벤트로 본다.

  ■ 페이지가 노출하는 계약 (render-motion-slide.mjs 가 부른다):
      window.__ready()        폰트·이미지 디코드·비디오 첫 프레임을 기다리는 프라미스. 렌더러가
                              첫 seek 전에 한 번 부른다.
      window.__seek(tMs, g)   그룹 g 의 로컬 시각 tMs 로 화면을 세운다 (위 상태 규칙). 모든
                              애니메이션의 ready 와 비디오의 seeked 가 끝난 뒤 resolve 한다.
      window.__groups()       [{rg, dur}] — 그룹별 움직임 길이(ms, 홀드 포함). dur 은 애니메이션·
                              카운터·페인터·비디오 타이밍에서 계산되므로 손으로 적지 않는다.
      window.__size()         {w, h}
      window.__setSegs(map)   {그룹번호: ms} — 나레이션 세그먼트 길이. 렌더러가 --segs 로 넘기면
                              .sv 요소의 의미 운동(바 채움·긋기·도트·카운트업)이 그 길이까지
                              늘어나 동결 꼬리가 사라진다(지속 층, slide-design.md §5).
      window.__meta()         {hold, stray, infinite, broken} — 렌더러의 계약 검사용. 그룹 밖
                              애니메이션·비디오(stray), 무한 반복, 못 읽은 소재(broken) 가 하나라도
                              있으면 렌더러가 멈춘다. broken 은 파일 이름의 배열이다.
      저작 쪽이 부르는 것:
      window.__paint(rg, durMs, fn)   페인터 등록 (아래 결정성 계약 ③)
      window.__boot()                 URL 이 가리키는 첫 화면을 다시 세운다 — 페인터를 등록한 뒤
                                      한 번 부른다.
      window.__interp(x, [in0,in1], [out0,out1], ease)
                              구간을 구간으로 옮긴다. 범위 밖은 끝값으로 잘린다.
      window.__ease(name, x)  linear · out(기본) · in · inOut. CSS --ease 와 같은 성질의 곡선이다.
      URL: ?reveal=k  정지 상태 k (그룹 ≤k 쉬는 상태) — 검사 띠·capture-reveals 호환
           ?g=k&t=ms  그룹 k 의 t ms 프레임 하나
           없음        전부 쉬는 상태(마지막 프레임)

  ■ 결정성 계약 (같은 (g, t) 는 언제 찍어도 같은 그림이어야 한다 — 벽시계를 타는 길을 다 막는다.
      바이트까지 같은 것은 보장하지 않는다: Animation.ready 를 기다려도 컴포지터가 서브픽셀
      안티에일리어싱 차이를 남기는 렌더가 있다(실측 PSNR 55~72dB, 양끝 다 눈에 안 보인다).
      네 번 연속 같다가 다섯 번째에 갈리는 것이 실측이라 두 번 비교하는 검증은 거짓 통과와
      거짓 실패를 둘 다 낸다 — 여섯에서 여덟 번 돌려 부류가 몇으로 갈리는지 본다):
      - 움직임을 만드는 길은 네 가지다. 넷 다 (g, t) 만의 함수여야 한다.
        ① CSS @keyframes (animation)  ② data-count 카운트업
        ③ 페인터 __paint(rg, durMs, fn) — fn(tMs) 이 그 시각의 그림을 그린다. 캔버스·SVG 처럼
          키프레임으로 못 세우는 회전·궤적이 이 길로 온다. 등록은 SEEK-RUNTIME 뒤에 하고
          마치면 __boot() 을 한 번 더 부른다. 캔버스 2D 는 기계가 달라도 같은 픽셀이고,
          WebGL 은 렌더러가 켜 두는 SwiftShader 안에서만 같다 — 같은 기계의 재렌더는 동일하다.
          페인터가 DOM 을 붙인다면 그 노드는 자기 그룹의 [data-rg] 안에 둔다. 밖에 두면 CSS
          애니메이션이 벽시계로 돌고, __seek 이 t=0 에 못 박은 뒤 세어서 렌더러가 exit 1 한다.
        ④ <video data-rg data-vfrom data-vdur> — currentTime 을 그룹의 로컬 시각으로 세운다.
          data-vfrom·data-vdur 은 둘 다 밀리초다. H.264 나 VP9 만 쓴다(HEVC 는 --disable-gpu
          아래서 재생되지 않는다). autoplay·loop·재생 중인 영상은 벽시계로 도는 길이라 __meta 가
          stray 로 잡는다.
        ⑤ [data-sheet data-sheet-cell data-sheet-cols data-sheet-ranges] — 구운 시트의 프레임 번호를
          (g, t) 로 세운다(h.object 가 만든다). 구간 길이는 --count 가 기본이고 --segs 가 세그먼트로
          늘린다. 시트는 png 한 장이고 프레임 사이를 옮기는 비용은 0 이다(실측 7.40 대 7.41 fps).
      - transition 금지 — 속성이 바뀐 뒤에만 객체가 생겨 seek 가 안 된다.
      - Date·Math.random·performance.now·requestAnimationFrame·setTimeout 읽기 금지. 페인터
        안에서도 같다 — 프레임을 정하는 것은 인자 t 하나다.
      - 웹폰트 URL 로드 금지 — 로컬 폰트 스택만. 이미지·영상도 슬라이드 옆 로컬 파일만 쓴다
        (원격 URL 은 check-slide.js 가 막는다). 첫 프레임 전에 렌더러가 __ready() 로 폰트·
        이미지 디코드·비디오 첫 프레임을 기다린다.
      - 스스로 도는 그림 금지 — gif·apng·애니메이션 webp 와 SVG SMIL(<animate 류)은 Animation
        객체를 안 만들어서 __seek 이 못 세우고 __meta 로도 안 잡힌다. 그림은 png·jpg 만 쓰고,
        움직여야 하면 ③ 페인터나 ④ 비디오로 옮긴다.
      - 등장 운동은 2.6초 안에 끝낸다(slide-design.md §모션) — 세그먼트가 그보다 짧으면
        다음 클립의 쉬는 프레임으로 잘려 튄다. 렌더러가 넘으면 경고한다. 지속 층(.sv)은
        예외다 — 렌더러가 --segs 로 넘긴 세그먼트 길이까지 늘어나는 것이 정상이다.

  ■ 디자인 계약은 slide-design.md 가 정본이다. 요지 (2026-09-02 방송 그래픽 조사 반영):
      - 바탕은 단색이 아니라 층이다 — 잉크 위에 키 라이트(좌상 라디얼)·가장자리 비네트·
        그레인(body::before / ::after — #stage 밖이라 존 채움 측정에 안 잡힌다). 사진 컷은
        .photo + .scrim 이 그 층을 대신한다.
      - 종이색 글자 + 액센트 하나. 액센트는 키커 플레이트·단위·막대 채움·밑줄 같은 한 점에만.
        그라데이션 글자·둥근 카드·그림자·글래스·이모지·파티클 금지. 플레이트는 각진 단색
        띠다(둥근 모서리·테두리·그림자 없음) — 그게 방송 플레이트와 생성형 카드의 경계다.
      - 선은 폰에서 보이는 굵기 — 괘선 --hair 3px, 축·연결선·레일 --rule 6px, 강조 띠 --band 10px,
        막대 트랙 --bar-h 44px. 1.5px 헤어라인은 폰에서 시력 한계 아래라 쓰지 않는다.
      - 글자 크기는 방송 위계 — 히어로 260px(.max 340px, 세 자리까지) · 제목 76 · 라벨 54 ·
        본문 44 · 출처 28. 본문 44px 이 바닥이다(모바일 자막 최소치).
      - 움직임: 글자는 마스크 라이즈(fx-mask — 줄 상자 밑에서 올라온다), 플레이트는 와이프
        (fx-plate) 뒤에 글자가 --lead(170ms · 5f) 늦게 따라온다, 키커·태그는 팝(fx-pop, 3% 오버슈트).
        값(카운트업·막대)에는 오버슈트가 없다. 곡선은 감속 하나(--ease)·마스크 하나(--ease-mask).
      - 조판 아키타입(§4): .stage.spread(스탯 포스터) · .split(좌우 비교) · .hero.max(빅 넘버)
        · .timeline(연표 레일) · .band(평결 띠). 헬퍼 옵션 sv:true(의미 운동을 세그먼트
        길이로) · sv:"settle"(느린 정착) · dim:true(다음 그룹이 들어올 때 이전 그룹이 내려앉음)
        · lead:n(--lead 의 n 배만큼 늦게 시작 — 여는 사슬).
      timeline · statistic · principle 장면은 scenes.js motionBeats의 프리미티브를 같은 그룹의
      data-primitive로 내보낸다. check-slide.js와 render-motion-slide.mjs가 두 선언을 맞춰 본다.
      principle 은 배우가 앉고(h.fig · h.disk · h.chamber) 관계가 그어진다(h.stem · h.bus · h.ring).

  ■ 실사 컷 (treatment:"footage" — slide-design.md §6.2 · scenes-schema §footage 처리):
      생성 클립이 문장마다 바탕이 되고(h.footage(rg, clip)), 그 위에 글자 없는 표식을 write-on 으로
      그린다(h.mark.route · x · ring · hatch · box · dot · path). 클립·표식·매트는 흐름 밖 고정층이라
      스테이지 gap 을 만들지 않고 DOM 순서로 겹친다 — 그룹 k+1 클립의 첫 프레임은 그룹 k 의 끝
      프레임이고 1프레임 뒤에 컷이 떨어진다(상태 규칙 그대로). 표식 선은 pathLength 1 로 정규화한
      stroke-dashoffset 1→0 이라 CSS 애니메이션이고 seek 로 재현된다. 글자는 h.mark.label 만, labels
      에서. 매트(h.matte(rg, webm))는 인물만 남긴 VP9 알파 webm 을 표식 위에 얹어 선이 인물 뒤로
      간다. 클립 길이(data-vdur)는 저작 때 나레이션 글자 수/4.5 초로 추정하고 렌더러가 --segs 로
      세그먼트 길이에 맞춘다(클립보다 길면 끝 프레임에 얼고 렌더러가 경고한다).

  ■ 스튜디오 판 · 구운 물체 (2026-09-04 — rendered-object.md · slide-design.md §1·§9):
      editorial 도해의 바탕은 스튜디오 판이다 — 벽과 바닥이 존 아래에서 만나는 사이클로라마 한 칸
      (알파 PNG, 머리 CSS .studio-plate). 그 위의 판(.kicker · .band · .plate)은 키 라이트 하나에 맞춘
      재질을 얻는다: 모서리 하이라이트·두께·닿은 그림자·퍼진 그늘(box-shadow 한 줄). 글자에는 두께가
      없고 드리운 그림자(.lift)만 있다. 무대는 그룹마다 1% 아래로 밀리고(.studio-cam, 시차) 판과
      글자는 존에 고정이다. h.stage("flat") 이 옛 플레이트로 되돌린다.
      물체는 그리지 않고 렌더한다 — bake-object.py 가 SDF 레이마처로 프레임 N 장을 시트 한 장(png)에
      굽고 사이드카(assets/s<n>-obj.js → window.SLIDE_OBJECTS)에 기하를 적는다. 슬라이드는 scenes.js
      다음에 그 사이드카를 <script src> 로 읽고 h.object(rg, id, {x, y, slot, out}) 로 앉힌다.
      프레임 번호는 SEEK-RUNTIME 이 [data-sheet] 를 보고 (그룹, 시각)으로 세운다(결정성 계약 ⑤) —
      그룹마다 제 구간을 돌고 경계 프레임을 이웃과 나눠 갖는다. 물체의 변화는 문장이 말하는 값이다
      (자국이 45 개, 241 개 찍힌다). 돌리려고 돌리는 회전은 여기서도 장식이다.
      표식은 h.mark.route(rg, pts, {pen:true}) 로 굵기가 변하는 펜 획을 쓴다 — 스튜디오 판 위에서는
      획에 드리운 그림자가 붙고(머리 CSS), 실사 바닥(§6.2)에서는 안 붙는다.

  ■ 존: 글자는 존 안에 앉힌다 — 숏폼 x 176 · top 190 · bottom 570, 롱폼 x 96 · top 96 · bottom 285
      (formats.js zone 의 인라인 미러). 하단 밴드는 자막 자리라 배경 채색만 풀블리드.
-->
<style>
  :root{
    --accent:#5b8cff; --ink:#0b1020;
    --paper:#ECEAE2;                                  /* 글자색 — 찬 잉크 위에 살짝 따뜻한 종이색 */
    --muted:color-mix(in srgb,var(--paper) 62%,transparent);
    --line:color-mix(in srgb,var(--paper) 30%,transparent);   /* 괘선·트랙 — 폰에서 보이는 밝기 */
    --panel:color-mix(in srgb,var(--ink) 84%,var(--paper));   /* 잉크보다 한 단 밝은 플레이트 면 */
    --w:1080px; --h:1920px; --zone-x:176px; --zone-top:190px; --zone-bottom:570px;
    /* 글자 크기 — 방송 위계(2026-09-02 조사: 모바일 본문 최소 44px, 제목:본문 ≥ 2.5:1).
       --fs-hero-max 는 숫자 하나가 화면인 스탯 포스터용 — 세 자리까지(존 폭 728px). */
    --fs-kicker:34px; --fs-title:76px; --fs-hero:260px; --fs-label:54px; --fs-desc:44px; --fs-foot:28px;
    --fs-hero-max:340px;
    /* 선 굵기 — 폰에서 1.5px 은 시력 한계 아래다. 괘선 3 · 축/연결선/레일 6 · 강조 띠 10 · 막대 44 */
    --hair:3px; --rule:6px; --band:10px; --bar-h:44px;
    /* 모션 토큰 — slide-design.md §모션. 감속 곡선 하나(Material emphasized-decelerate)로
       정착하고, 드러냄·긋기·와이프는 마스크 곡선. 값(카운트업·막대)엔 오버슈트가 없다.
       travel 48px 은 1080 폭에서 이동이 실제로 보이는 진폭이다 — 28px 은 UI 규모였다. */
    --ease:cubic-bezier(.05,.7,.1,1);
    --ease-mask:cubic-bezier(.4,0,.2,1);

  @keyframes studio-push{to{transform:scale(var(--k,1)) translate(var(--dx,0px),var(--dy,0px))}}

  /* ── 재질 — 키 라이트 하나(왼쪽 위)에 맞춘다. 판은 box-shadow 한 줄로 네 가지를 얻는다: ① 위·왼쪽
     안쪽 하이라이트 = 빛 받는 모서리 ② 아래·오른쪽 딱딱한 오프셋 = 두께 ③ 짧고 진한 그림자 = 닿은
     자리 ④ 넓고 옅은 그림자 = 퍼진 그늘. ③ 없이 ④만 쓰면 그게 UI 카드다(slide-design.md §4). 글자에는
     두께를 안 준다 — 압출한 글자는 워드아트다. 드리운 그림자만 줘서 무대에서 떠오르게 한다.
     check-slide.js 는 저작 영역의 box-shadow·text-shadow·drop-shadow 를 막고 이 머리 규칙만 허용한다 —
     재질은 여기 클래스로만 온다. 판 재질은 부품 셀렉터 위에 걸리므로 h.tag·h.band·h.plate 는 그대로다. */
  html.studio{--lit:rgba(255,244,228,.15); --dip:rgba(4,9,17,.50); --edge:color-mix(in srgb,var(--ink) 62%,#000);
              --tx:9px; --ty:12px; --sh:4,9,17}
  html.wide.studio{--tx:7px; --ty:9px}
  html.studio .kicker:not(.plain), html.studio .band, html.studio .plate{
    box-shadow:inset 2px 2px 0 0 var(--lit), inset -1px -2px 0 0 var(--dip),
      var(--tx) var(--ty) 0 0 var(--edge),
      calc(var(--tx) * 1.5) calc(var(--ty) * 1.6) 15px -4px rgba(var(--sh),.66),
      calc(var(--tx) * 3.2) calc(var(--ty) * 3.4) 44px -14px rgba(var(--sh),.80)}
  html.studio .kicker:not(.plain), html.studio .band.accent, html.studio .plate.accent{
    --lit:rgba(255,255,255,.32); --dip:color-mix(in srgb,color-mix(in srgb,var(--accent) 40%,#000) 40%,transparent);
    --edge:color-mix(in srgb,var(--accent) 55%,#000)}
  html.studio .band.paper, html.studio .plate.paper{
    --lit:rgba(255,255,255,.5); --dip:rgba(60,55,45,.35); --edge:color-mix(in srgb,var(--paper) 58%,#000)}
  html.studio .stage{text-shadow:0 5px 10px rgba(var(--sh),.58), 0 18px 34px rgba(var(--sh),.62)}
  html.studio .foot, html.studio .hero-sub, html.studio .bar .lbl, html.studio .shape-cap, html.studio .fig-lab,
  html.studio .step .d, html.studio .date .what, html.studio .mark-label, html.studio .kicker.plain{text-shadow:none}
  html.studio .marks .mk{filter:drop-shadow(0 5px 9px rgba(4,9,17,.72)) drop-shadow(0 1px 1px rgba(4,9,17,.6))}

  .stage{
    position:absolute; left:var(--zone-x); right:var(--zone-x);
    top:var(--zone-top); bottom:var(--zone-bottom); z-index:1;
    display:flex; flex-direction:column; gap:40px;
    justify-content:center;                         /* 존 안에서 세로 중앙 */
    padding-bottom:4%;                              /* 광학 중심 — 산술 중심보다 살짝 위 */
  }
  html.wide .stage{gap:28px; padding-bottom:2%}
  .stage.top{justify-content:flex-start; padding-bottom:0}   /* 위 붙임이 맞는 도해(긴 단계 목록)만 */
  .stage.spread{justify-content:space-between; padding-bottom:0}   /* 스탯 포스터 — 제목·증거·출처가 존을 위·가운데·아래로 나눠 채운다 */
  /* 스파인 — 존 왼쪽에 서는 액센트 세로 띠. 방송 그래픽의 에지 바다. h.stage("spine") 으로 켠다. */
  .stage.spine::before{content:""; position:absolute; left:calc(var(--rule) * -8); top:0; bottom:0;
    width:var(--rule); background:var(--accent)}

  /* ── 리빌 그룹 — data-rg 를 가진 요소만 움직인다. 다른 그룹을 안에 넣지 않는다(같은 그룹의
        중첩은 된다 — bar() 의 채움이 그 예. 예외는 h.object 의 out 래퍼 하나뿐이다 — owner() 가
        가장 가까운 조상을 잡는다). --lead-in 은 여는 사슬의 시차(h 옵션 lead:n). */
  .rv{animation:appear 1ms linear both paused;
      animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms))}
  .rv.fx-fade{animation-name:fade; animation-duration:var(--fade); animation-timing-function:linear}
  .rv.fx-rise{animation-name:fade, lift; animation-duration:var(--fade), var(--rise);
              animation-timing-function:linear, var(--ease)}
  /* 글자·날짜·단계는 마스크만 — 가려진 상태가 곧 안 보임이라 페이드를 안 겹친다. */
  .rv.fx-in{animation-name:reveal; animation-duration:var(--rise); animation-timing-function:var(--ease-mask)}
  .rv.fx-grow{animation-name:grow; animation-duration:var(--grow); animation-timing-function:var(--ease-mask); transform-origin:left center}
  .rv.fx-draw{animation-name:draw; animation-duration:var(--draw); animation-timing-function:var(--ease-mask)}
  .rv.fx-draw.down{animation-name:draw-down}   /* 세로 줄기 — LTR draw 는 가는 폭에서 팝한다 */
  /* 도형 이동 — 원리가 글자가 아니라 자리·접촉으로 읽히게. from-left 는 반대쪽. */
  .rv.fx-travel{animation-name:fade, travel; animation-duration:var(--fade), var(--rise);
                animation-timing-function:linear, var(--ease)}
  .rv.fx-press{animation-name:appear, press; animation-duration:1ms, var(--rise); animation-timing-function:linear, var(--ease-mask)}   /* 페이드 없이(appear 1ms 는 그룹 전 숨김) — 페이드 밑에서 끝나는 하강은 눈에 페이드인이다(리뷰 실측) */
  .rv.from-left{--ox:calc(var(--travel-x) * -1)}
  /* 마스크 라이즈 — 글자가 자기 줄 상자 밑에서 올라온다. 방송 타이틀의 기본 등장이고 페이드를
     안 겹친다(마스크가 곧 가림). 클립은 rv 에, 이동은 안쪽 .mk 에 — 같은 그룹의 두 애니메이션이다. */
  .rv.fx-mask{clip-path:inset(-.06em 0 -.1em 0)}
  .rv.fx-mask > .mk, .rv.fx-mask > .dw > .mk, .rv.fx-mask > .dw > .svw > .mk, .rv.fx-mask > .svw > .mk{
    animation:mask-rise var(--rise) var(--ease) both paused;
    animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms))}
  /* 플레이트 — 띠·패널이 왼쪽에서 와이프로 열리고, 안의 글자가 --lead 늦게 마스크 라이즈한다.
     "플레이트 먼저, 글자 다음"(Vox·BBC 로워서드) — 리뷰어는 이 둘을 한 이벤트로 본다. */
  .rv.fx-plate{animation-name:reveal; animation-duration:var(--plate); animation-timing-function:var(--ease-mask)}
  .rv.fx-plate .mk{display:block; clip-path:inset(-.06em 0 -.1em 0)}
  .rv.fx-plate .mk > span{display:block; animation:mask-rise var(--rise) var(--ease) both paused;
    animation-delay:calc(var(--i,0) * var(--stagger) + var(--lead-in,0ms) + var(--lead))}
  /* 팝 — 키커·태그의 등장. 3% 오버슈트 뒤 정착(글자·플레이트에만, 값에는 안 쓴다). */
  .rv.fx-pop{animation-name:pop; animation-duration:var(--pop); animation-timing-function:var(--ease)}
  /* 낱말 스태거 — h.words 가 낱말마다 .w 를 만들고 --j 로 순번을 준다. 마스크 라이즈의 낱말판. */
  .w{display:inline-block; clip-path:inset(-.06em 0 -.1em 0); margin-right:.22em}
  .w:last-child{margin-right:0}
  .w > .mk{display:block; animation:mask-rise var(--rise) var(--ease) both paused;
    animation-delay:calc(var(--j,0) * var(--wstagger) + var(--lead-in,0ms))}
  /* Heer staging — 라벨이 먼저 뜨고, 채움은 그 다음에 자란다. 흐름은 노드가 앉은 뒤 선이 그어진다. */
  .bar .fill.rv.fx-grow{animation-delay:calc(var(--fade) + var(--lead-in,0ms))}
  .flow .flow-line.rv.fx-draw{animation-delay:calc(var(--rise) + var(--lead-in,0ms))}
  /* ── 지속 층 (slide-design.md §5) — 렌더러가 --seg-d(세그먼트 길이)를 넣으면 .sv 의
        의미 운동이 문장 끝까지 늘어나 동결 꼬리가 사라진다. 늘리는 것은 단조 운동
        하나뿐이다 — 바 채움·긋기·도트 채움·카운트업. 글자 리빌·페이드는 늘리지 않는다. */
  .rv.sv.fx-grow{animation-duration:var(--seg-d,var(--grow))}
  .rv.sv.fx-draw{animation-duration:var(--seg-d,var(--draw))}
  .rv.sv.fx-in{animation-duration:var(--seg-d,var(--rise))}
  /* 느린 정착 — 들어온 것이 문장 내내 조금씩 내려앉는다. 등장 애니메이션과 변형이
        겹치도록 래퍼(.svw)가 따로 든다 — 캐릭터 템플릿 .ly 겹과 같은 중첩 변형이다. */
  .svw{display:block; transform-origin:center;
       animation:svsettle var(--seg-d,4000ms) var(--ease) both paused}
  @keyframes svsettle{from{transform:scale(1.045)}to{transform:scale(1)}}
  .dw{display:block}                                /* 포커스 시프트 래퍼 — opacity 는 런타임이 적는다 */
  .mk{display:block}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes lift{from{transform:translateY(var(--travel))}to{transform:none}}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes draw-down{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes travel{from{transform:translateX(var(--ox, var(--travel-x)))}to{transform:none}}
  @keyframes press{from{transform:translateY(calc(var(--press) * -1))}to{transform:none}}
  @keyframes mask-rise{from{transform:translateY(112%)}to{transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.94)}55%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}

  /* ── 부품 — renderSlide 가 조합한다. 필요한 것만 쓰고 새 부품은 아래에 더한다. */
  /* 키커 = 태그 플레이트. 액센트 면 위 잉크 글자, 각진 모서리. 방송 로워서드의 브랜드 색 한 점. */
  .kicker{display:inline-flex; align-self:flex-start; align-items:center;
          font-size:var(--fs-kicker); font-weight:700; letter-spacing:.03em; line-height:1;
          color:var(--ink); background:var(--accent); padding:.42em .7em .38em}
  .kicker.plain{background:none; color:var(--muted); font-weight:500; padding:0; gap:16px}
  .kicker.plain::before{content:""; width:40px; height:var(--hair); background:var(--accent)}
  .slide-title{font-size:var(--fs-title); font-weight:800; letter-spacing:-.03em; line-height:1.18;
               text-wrap:balance; word-break:keep-all}
  strong{font-weight:800; color:var(--accent)}
  mark{background:var(--accent); color:var(--ink); padding:0 .12em; box-decoration-break:clone}   /* ==강조== — 낱말 뒤 하이라이트 띠 */

  .hero{display:flex; align-items:baseline; gap:.1em; line-height:.96}
  .hero .num{font-size:var(--fs-hero); font-weight:900; letter-spacing:-.03em}
  /* 자릿수 고정폭 셀 — 폴백 서체(Apple SD Gothic Neo 등)엔 tnum 이 없어 카운트업 중 단위가
     좌우로 흔들린다(1라운드 실측 43px). 숫자를 셀에 한 자씩 앉히고 최종 자릿수만큼 빈 셀로
     왼쪽을 채워 상자 크기를 첫 프레임부터 고정한다. */
  .hero .num i{display:inline-block; width:.6em; text-align:center; font-style:normal}
  .hero .num i.s{width:.28em}
  .hero .num{margin-left:-.03em}                    /* 셀 가운데 정렬이 남기는 왼쪽 여백을 광학 보정 — .06em 은 「4」가 존 왼쪽 176px 을 2px 넘었다(실측) */
  .bar .val i{display:inline-block; width:.6em; text-align:center; font-style:normal}   /* 막대 값도 셀 — 두 줄의 자릿수가 세로로 맞는다 */
  .bar .val i.s{width:.28em}
  .hero .unit{font-size:max(calc(var(--fs-hero) * .3), var(--fs-desc)); font-weight:700; color:var(--accent); margin-left:.06em}   /* .mid 히어로의 30% 는 본문 바닥(--fs-desc) 아래라 바닥에서 받친다 */
  .hero.max{--fs-hero:var(--fs-hero-max)}           /* 스탯 포스터 — 숫자 하나가 화면일 때. 세 자리까지 */
  .hero.mid{--fs-hero:calc(var(--fs-title) * 1.6)}   /* 둘째 값 — 히어로 아래 나란히 서는 보조 숫자 */
  .hero-label{font-size:var(--fs-label); font-weight:700; margin-top:-4px; word-break:keep-all}
  .hero-sub{font-size:var(--fs-desc); color:var(--muted); word-break:keep-all}
  .stat{display:flex; flex-direction:column; gap:12px}
  /* 밑줄 띠 — 히어로 아래 액센트 강조 띠(h.stat 의 underline 옵션). 값이 아니라 글자에 붙는 장식이라 grow 로 연다 */
  .stat .ul{height:var(--band); width:38%; background:var(--accent)}

  /* 밴드 — 존 폭을 가로지르는 단색 띠 위 큰 글자. 평결·전환·이름표. 액센트 면엔 잉크 글자,
     종이 면엔 잉크 글자, 패널 면엔 종이 글자. 둥근 모서리·테두리·그림자는 없다. */
  .band{display:block; padding:.34em .6em .3em; font-size:var(--fs-label); font-weight:800;
        letter-spacing:-.02em; line-height:1.18; word-break:keep-all}
  .band.accent{background:var(--accent); color:var(--ink)}
  .band.paper{background:var(--paper); color:var(--ink)}
  .band.panel{background:var(--panel); color:var(--paper)}
  .band.big{font-size:var(--fs-title)}
  .band strong{color:inherit; text-decoration:underline; text-decoration-thickness:var(--hair); text-underline-offset:.14em}
  /* 패널 — 증거·인용·문서 조각이 앉는 면. 띠와 같은 규칙, 안에는 무엇이든. */
  .plate{display:block; padding:34px 38px; background:var(--panel); color:var(--paper)}
  .plate.paper{background:var(--paper); color:var(--ink)}
  .plate.accent{background:var(--accent); color:var(--ink)}
  .plate.paper .foot, .plate.paper .hero-sub{color:color-mix(in srgb,var(--ink) 62%,transparent)}
  .plate.edge{border-left:var(--rule) solid var(--accent)}   /* 왼쪽 액센트 에지 — 인용·증거 */

  /* 스플릿 비교 — 좌우 대구 하나가 화면의 논증일 때. 가운데 괘선이 vs 다. */
  .split{display:grid; grid-template-columns:1fr auto 1fr; column-gap:48px; align-items:start}
  .split:not(:has(.vdiv)){grid-template-columns:1fr 1fr}
  .split .cell{display:flex; flex-direction:column; gap:18px; min-width:0}
  /* 가운데 괘선은 h.vdiv(rg) 로 둘째 칸의 그룹에 넣는다 — 정적 의사요소로 두면 문장 전에 빈 레일이 뜬다 */
  .split > .rv:has(> .vdiv){align-self:stretch; display:flex}   /* 괘선의 .rv 래퍼가 그리드 아이템이다 — 래퍼를 행 높이로 늘려야 선이 행을 가른다 */
  .split .vdiv{display:block; width:var(--hair); background:var(--line); min-height:1.6em}   /* <i> 는 인라인이라 display 없이는 폭이 0 이다 */

  /* 막대 — 라벨·값 줄 위에 굵은 트랙. 값은 액센트 굵은 글자(강조 하나), .hot 은 종이색. */
  .bars{display:flex; flex-direction:column; gap:34px}
  .bar{display:grid; grid-template-columns:1fr auto; gap:12px 20px; align-items:end}
  .bar .lbl{font-size:var(--fs-desc); font-weight:600; color:var(--paper); word-break:keep-all}
  .bar .val{font-size:var(--fs-label); font-weight:800; color:var(--accent); text-align:right; line-height:1}
  .bar .track{grid-column:1 / -1; height:var(--bar-h); background:var(--line); position:relative; overflow:hidden}
  .bar .fill{position:absolute; left:0; top:0; bottom:0; background:var(--accent)}
  .bar.hot .fill{background:var(--paper)}
  .bar.hot .val{color:var(--paper)}
  .bar.dimmed .val{color:var(--muted)}
  .bar.dimmed .fill{background:var(--muted)}

  .callout{display:flex; align-items:center; gap:18px; font-size:var(--fs-desc); font-weight:600}
  .callout .dot{width:16px; height:16px; border-radius:50%; background:var(--accent); flex:none}
  .callout .lead{height:var(--hair); background:var(--line); width:64px; flex:none}

  /* 단계 — 번호 칸 + 글. 연결선은 --rule 굵기의 액센트 짧은 선. */
  .steps{display:flex; flex-direction:column; gap:30px}
  .step{display:grid; grid-template-columns:56px 1fr; gap:0 20px; font-size:var(--fs-label); font-weight:700; word-break:keep-all}
  .step::before{content:""; height:var(--rule); background:var(--accent); align-self:center}
  .step .d{grid-column:2; font-size:var(--fs-desc); font-weight:400; color:var(--muted); margin-top:8px}

  /* 의미 프리미티브 — timeline · statistic · principle 장면은 scenes.js motionBeats가
     이 이름을 고르고, 렌더러가 실제 DOM의 data-primitive와 그룹을 맞춰 본다. */
  .timeline{display:flex; flex-direction:column; gap:36px; position:relative; padding-left:52px}
  .timeline::before{content:""; position:absolute; left:8px; top:8px; bottom:8px;
    width:var(--hair); background:var(--line)}
  .date{display:grid; grid-template-columns:minmax(170px,.36fr) 1fr; gap:28px; align-items:baseline; position:relative}
  .date::before{content:""; position:absolute; left:-52px; top:.28em; width:20px; height:20px;
    border-radius:50%; background:var(--accent); border:4px solid var(--ink)}
  .date .when{font-size:var(--fs-label); font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .date .what{font-size:var(--fs-desc); color:var(--paper); word-break:keep-all}
  .range,.axis,.link,.flow-line{height:var(--rule); background:var(--accent)}
  .link{background:var(--line)}
  .dots{display:flex; flex-wrap:wrap; gap:14px; max-width:100%}
  .dots b{display:block; width:22px; height:22px; border-radius:50%; background:var(--accent)}
  .flow{display:grid; grid-template-columns:1fr 84px 1fr; gap:24px; align-items:center}
  .flow .flow-line{position:relative}
  .flow .flow-line::after{content:""; position:absolute; right:0; top:calc(var(--rule) / 2 - 10px); width:20px; height:20px;
    border-right:var(--rule) solid var(--accent); border-top:var(--rule) solid var(--accent); transform:rotate(45deg)}
  .node{font-size:var(--fs-label); font-weight:700; padding:20px 0; border-top:var(--hair) solid var(--line); border-bottom:var(--hair) solid var(--line); word-break:keep-all}
  .state{display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; font-size:var(--fs-label); font-weight:700; word-break:keep-all}
  .state .arrow{color:var(--accent); font-weight:400}

  .brackets{position:relative; padding:30px 34px}
  .brackets::before,.brackets::after,.brackets>i::before,.brackets>i::after{
    content:""; position:absolute; width:36px; height:36px; border:0 solid var(--paper)}
  .brackets::before{left:0; top:0; border-left-width:var(--hair); border-top-width:var(--hair)}
  .brackets::after{right:0; top:0; border-right-width:var(--hair); border-top-width:var(--hair)}
  .brackets>i::before{left:0; bottom:0; border-left-width:var(--hair); border-bottom-width:var(--hair)}
  .brackets>i::after{right:0; bottom:0; border-right-width:var(--hair); border-bottom-width:var(--hair)}

  .rule{height:var(--hair); background:var(--line)}
  /* 출처 — 짧은 액센트 선 뒤 작은 흐린 글자. 증거 옆 아래에 앉는다(바탕 그룹 0). */
  .foot{display:flex; align-items:center; gap:16px; font-size:var(--fs-foot); color:var(--muted); word-break:keep-all}
  .foot::before{content:""; width:36px; height:var(--hair); background:var(--line); flex:none}   /* 출처 줄은 액센트 자리가 아니다 — 값의 사슬(태그·단위·밑줄·스파인)에만 */
  /* 세로 예산이 찼을 때 출처는 존 오른쪽 위에 앉는다(h.foot 의 corner:true) — 흐름에서 빠져 33px + gap 40px 을
     돌려준다. 물체 판(셀 600px)에서 이게 없으면 출처가 존 아래로 58px 나갔다(2026-09-04 실측). 여전히 그룹 0 이다. */
  .foot.corner{position:absolute; right:0; top:12px}

  /* ── 구운 물체(rendered-object.md) — 레이마처가 뽑은 프레임 N 장이 시트 한 장(png)에 들어 있고
     [data-sheet] 요소의 background-position 을 런타임이 (그룹, 시각)으로 세운다(결정성 계약 ⑤).
     셀을 원본 크기 그대로 쓰므로 리샘플이 안 낀다. .objslot 이 흐름 안에 자리를 잡고(셀 높이 또는
     slot:px) 그 안에서 물체는 절대 배치다 — 존 채움 측정에는 배경 이미지로 잡힌다. .aside 는 자리
     왼쪽 위에 얹는 곁 판(값 카드)이다. 들어올 때 42px 아래에서 떠오르고(objin), 물러날 때 12px
     위로 작아진다(objout — 값이 아니라 퇴장이라 appear 를 안 겹친다: 앞 그룹에서 보여야 한다). */
  .objslot{position:relative; width:100%; flex:none}
  .objslot > .aside{position:absolute; left:0; top:var(--aside-top,0px); width:var(--aside-w,auto)}
  .objwrap{position:absolute; pointer-events:none}
  .objwrap > .rv, .objwrap .rv > .rv, .obj{position:absolute; inset:0}
  .obj{background-repeat:no-repeat}
  .rv.fx-objin{animation-name:objin; animation-duration:720ms; animation-timing-function:var(--ease)}
  .rv.fx-objout{animation-name:objout; animation-duration:var(--seg-d,var(--count)); animation-timing-function:var(--ease-cam)}
  @keyframes objin{0%{opacity:0;transform:translateY(42px) scale(.945)} 30%{opacity:1} 100%{opacity:1;transform:none}}
  @keyframes objout{to{transform:translateY(-12px) scale(.945)}}

  /* 사진 컷(photo-action) — 사진이 풀블리드로 깔리고 스크림이 글자 자리를 어둡게 한다. */
  /* 사진·스크림은 rv 래퍼까지 흐름에서 뺀다 — 스테이지가 flex 라 빈 래퍼도 gap 40px 을 만든다 */
  .rv:has(> .photo), .rv:has(> .scrim){position:fixed; inset:0; z-index:-2; pointer-events:none}
  .photo{position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2}
  .scrim{position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      linear-gradient(to top, var(--ink) 0%, color-mix(in srgb,var(--ink) 72%,transparent) 30%, transparent 62%),
      linear-gradient(to bottom, color-mix(in srgb,var(--ink) 55%,transparent) 0%, transparent 34%)}

  /* 실사 컷(footage) — 클립·표식·매트 층. 전부 고정층이라 스테이지 flex 의 gap 을 만들지 않고
     렌더러의 존 채움 측정에서 ground 로 빠진다. z-index 는 헬퍼가 그룹 번호로 적는다
     (그룹 k: 클립 -300+3k · 표식 +1 · 매트 +2) — 뒤 그룹이 위라 컷이 DOM 순서로 떨어진다.
     플레이트(키 라이트·비네트)는 실사 위에 안 얹는다 — 클립의 빛을 그대로 쓴다. */
  html.footage body::before{display:none}
  .rv.fz{position:fixed; inset:0; pointer-events:none}
  .footage, .matte{position:fixed; inset:0; width:100%; height:100%; object-fit:cover}
  .marks{position:fixed; inset:0; width:100%; height:100%; overflow:visible}
  .marks path, .marks circle{fill:none; stroke:var(--accent); stroke-width:var(--mark-w);
    stroke-linecap:round; stroke-linejoin:round; opacity:.94}
  /* write-on — pathLength=1 로 정규화한 선이 dashoffset 1→0 으로 그려진다. --k 는 같은 그룹 안의
     획 순번(--mark-lead 만큼 늦게: 선 → 화살촉, X 의 두 획). 마스크 안의 획은 종이색으로 뽑아 점선을 연다. */
  /* 안 온 획이 유령을 남기는 자리 둘 — 둘 다 dasharray 를 1 하나로 두면 생긴다. ① offset=1 이면 둥근
     캡이 경로 첫 좌표에 반원을 찍는다(액센트 점 하나). ② offset 을 1 보다 밀면 주기가 2 라 다음 대시가
     경로 끝에서 먼저 튀어나온다(짧은 화살촉의 아래 갈래가 미리 그려졌다 — 2026-09-04 실측). 대시보다
     긴 간격(1.2)을 명시하고 1.1 에서 출발하면 둘 다 사라진다 — 첫 9% 는 아무것도 안 그린다. */
  .marks .draw{stroke-dasharray:1 1.2; stroke-dashoffset:1.1;
    animation:mark-draw var(--mark-draw) var(--ease-mask) both paused;
    animation-delay:calc(var(--k,0) * var(--mark-lead) + var(--lead-in,0ms))}
  .marks mask .draw{stroke:#fff; stroke-width:calc(var(--mark-w) * 2); opacity:1}
  .marks .dash{stroke-dasharray:26 20}
  .marks.hatch .draw{animation-delay:calc(var(--k,0) * var(--mark-stagger) + var(--lead-in,0ms))}
  .marks .pop{fill:var(--accent); stroke:none; opacity:.94; transform-box:fill-box; transform-origin:center;
    animation:mark-pop var(--pop) var(--ease) both paused;
    animation-delay:calc(var(--k,0) * var(--mark-lead) + var(--lead-in,0ms))}
  .mark-label{display:inline-block; font-size:var(--fs-desc); font-weight:700; line-height:1.15; color:var(--paper);
    word-break:keep-all; white-space:nowrap; padding-bottom:10px;
    border-bottom:var(--hair) solid var(--accent)}
  .marks .fl{fill:var(--accent); stroke:none; opacity:.94}   /* 펜 획의 채움 다각형 — 마스크(.draw)로 벗긴다 */
  @keyframes mark-draw{from{stroke-dashoffset:1.1}to{stroke-dashoffset:0}}
  @keyframes mark-pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* 원리 도형 — 괘선·원·면 하나. 카드·그림자·아이콘 줄은 쓰지 않는다. */
  .shape-stage{position:relative; width:100%; height:440px; display:flex; flex-direction:column;
               align-items:center; justify-content:center; gap:28px; flex:none}
  html.wide .shape-stage{height:280px; gap:20px}
  .shape-item{display:flex; flex-direction:column; align-items:center; gap:16px}
  .shape-cap{font-size:var(--fs-desc); color:var(--muted); text-align:center; word-break:keep-all}
  .shape-disk,.shape-ring{display:block; flex:none; box-sizing:border-box; width:var(--d,120px); height:var(--d,120px)}
  .shape-disk{border-radius:50%; background:var(--accent)}
  .shape-ring{border-radius:50%; border:var(--rule) solid var(--paper); background:transparent}
  .shape-bed{display:block; width:var(--bed,220px); height:var(--rule); background:var(--line); flex:none}   /* <i> — rv 블록 안에서는 display 없이 폭이 0 이다 */
  .shape-press{display:flex; flex-direction:column; align-items:center; gap:0; width:max-content}   /* 원반이 베드에 닿아 쉰다 · 블록은 스택의 왼쪽에 앉는다 */
  .shape-press .shape-cap{display:block; margin-top:16px; text-align:left}   /* 캡션은 베드 왼쪽 끝에 맞춘다 — 화면의 다른 글자와 같은 축(§4) */
  .shape-layers{position:relative; width:min(100%,300px); height:150px}
  .shape-layer{position:absolute; left:0; right:0; height:30px;
               border-top:var(--hair) solid var(--paper); border-bottom:var(--hair) solid var(--paper);
               background:var(--panel)}
  .art{display:block; width:100%; max-height:42%; object-fit:contain; flex:none; pointer-events:none}
  html.wide .art{max-height:48%}

  /* 원리 배우+관계 — 일러스트가 배우, 굵은 선이 관계. 카드·그림자·아이콘 줄은 쓰지 않는다. */
  .cast{display:grid; grid-template-columns:repeat(var(--cols, 3), minmax(0,1fr));
        column-gap:24px; row-gap:0; width:100%; align-items:end; flex:none}
  .cast > .rv{display:flex; flex-direction:column; align-items:center; min-width:0}
  .cast > .rv.span{grid-column:1 / -1; width:100%}   /* h.bus 는 rv 안에 있어서 래퍼가 칸을 가로지른다 */
  .fig{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%}
  .fig .art{width:auto; height:220px; max-height:220px; max-width:100%}
  html.wide .fig .art{height:240px; max-height:240px}
  .fig-lab{font-size:var(--fs-desc); font-weight:700; letter-spacing:.04em; color:var(--accent); text-align:center; word-break:keep-all}
  .stem{display:block; width:var(--rule); height:36px; background:var(--accent); flex:none}
  .bus{display:block; width:100%; height:var(--rule); background:var(--accent); flex:none; align-self:center}
  .chamber{position:relative; padding:22px 20px; width:100%}
  .chamber::before,.chamber::after,.chamber>i::before,.chamber>i::after{
    content:""; position:absolute; width:24px; height:24px; border:0 solid var(--paper)}
  .chamber::before{left:0; top:0; border-left-width:var(--hair); border-top-width:var(--hair)}
  .chamber::after{right:0; top:0; border-right-width:var(--hair); border-top-width:var(--hair)}
  .chamber>i::before{left:0; bottom:0; border-left-width:var(--hair); border-bottom-width:var(--hair)}
  .chamber>i::after{right:0; bottom:0; border-right-width:var(--hair); border-bottom-width:var(--hair)}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../scenes.js"></script>
<script>
// ✎ 이 슬라이드의 샷 번호 — SCENES 배열 순번(1부터). 파일명 s<번호> 와 같다.
const SLIDE_SHOT = 0;

(function () {
  const FORMAT = window.FORMAT || "shorts-9x16";
  const root = document.documentElement;
  if (FORMAT === "youtube-long-16x9") root.classList.add("wide");
  const THEME = window.THEME || {};
  if (THEME.accent) root.style.setProperty("--accent", THEME.accent);
  if (THEME.ink)    root.style.setProperty("--ink",    THEME.ink);

  const S = (window.SCENES || [])[SLIDE_SHOT - 1];
  const stage = document.getElementById("stage");
  if (!S) { stage.textContent = "check scenes.js / SLIDE_SHOT: " + SLIDE_SHOT; return; }

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  /* **강조** → <strong>(액센트 글자), ==강조== → <mark>(액센트 띠 위 잉크 글자). 그라데이션 글자는 없다. */
  const em = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/==(.+?)==/g, "<mark>$1</mark>");
  const labels = (S.visual && S.visual.slide && S.visual.slide.labels) || [];
  /* 리빌 래퍼 — rg 그룹, fx = mask|plate|pop|rise|in|grow|draw|fade|travel|press|none,
     i = 그룹 안 스태거 순번, lead = --lead 의 배수(여는 사슬의 시차).
     sv:true 는 이 요소의 의미 운동을 세그먼트 길이로 늘리고(지속 층), sv:"settle" 은
     느린 정착 래퍼(.svw)를 씌운다. dim:true 는 다음 그룹이 들어올 때 muted 급으로
     내려앉는다(포커스 시프트 — 런타임이 .dw 래퍼의 opacity 를 계산한다). */
  const rv = (rg, html, o = {}) => {
    let inner = html;
    if (o.fx === "mask") inner = '<div class="mk">' + inner + "</div>";
    if (o.sv === "settle") inner = '<div class="svw">' + inner + "</div>";
    if (o.dim) inner = '<div class="dw">' + inner + "</div>";
    const style = (o.i ? "--i:" + o.i + ";" : "") + (o.lead ? "--lead-in:calc(" + o.lead + " * var(--lead));" : "");
    return '<div class="rv' + (o.fx && o.fx !== "none" ? " fx-" + o.fx : "") +
      (o.dir === "left" ? " from-left" : "") + (o.dir === "down" ? " down" : "") +
      (o.sv === true ? " sv" : "") + (o.dim ? " dim" : "") +
      (o.cls ? " " + o.cls : "") +
      '" data-rg="' + rg + '"' +
      (style ? ' style="' + style + '"' : "") +
      (o.primitive ? ' data-primitive="' + o.primitive + '"' : "") + ">" + inner + "</div>";
  };
  /* 무대 클래스 — spread(스탯 포스터) · top(위 붙임) · spine(왼쪽 액센트 에지 바) · studio(스튜디오 판,
     editorial 의 기본) · flat(옛 플레이트로). */
  const stageCls = (...cls) => {
    for (const c of cls) {
      if (!c) continue;
      if (c === "studio") root.classList.add("studio");
      else if (c === "flat") root.classList.remove("studio");
      else stage.classList.add(c);
    }
    return "";
  };
  /* 키커 = 태그 플레이트(팝). plain:true 면 액센트 선 + 흐린 글자의 옛 모양. */
  const tag = (rg, text, o = {}) =>
    rv(rg, '<span class="kicker' + (o.plain ? " plain" : "") + '">' + em(text) + "</span>",
       { fx: o.plain ? "in" : "pop", i: o.i || 0, lead: o.lead, dim: o.dim });
  /* 제목 — 마스크 라이즈. 여는 사슬에서는 키커 뒤 lead:1 로 잇는다. */
  const title = (rg, text, o = {}) =>
    rv(rg, '<div class="slide-title' + (o.cls ? " " + o.cls : "") + '">' + em(text) + "</div>",
       { fx: o.fx || "mask", i: o.i || 0, lead: o.lead, sv: o.sv, dim: o.dim });
  /* 낱말 스태거 — 한 마디를 낱말마다 --wstagger 간격으로 올린다. 제목·키네틱 마디에 쓴다. */
  const words = (rg, text, o = {}) => {
    const parts = String(text || "").split(/\s+/).filter(Boolean);
    const html = parts.map((w, j) => '<span class="w" style="--j:' + j + '"><span class="mk">' + em(w) + "</span></span>").join("");
    return rv(rg, '<div class="' + (o.cls || "slide-title") + '">' + html + "</div>", { fx: "none", i: o.i || 0, lead: o.lead, sv: o.sv, dim: o.dim });
  };
  /* 카운트업 숫자 — 그룹 rg 에서 from→value, dur ms (기본 --count). 단위는 액센트 굵은 글자.
     sv:true 는 카운트를 세그먼트 길이로 늘린다 — 문장이 숫자를 말하는 내내 오른다.
     cls:"max" 는 스탯 포스터 크기다. */
  const count = (rg, value, o = {}) =>
    '<div class="rv hero' + (o.sv ? " sv" : "") + (o.cls ? " " + o.cls : "") +
    '" data-rg="' + rg + '"' + (o.lead ? ' style="--lead-in:calc(' + o.lead + ' * var(--lead))" data-lead="' + o.lead + '"' : "") +
    ' data-primitive="count-up"><span class="num" data-count="' + value +
    '" data-from="' + (o.from || 0) + '" data-dec="' + (o.dec || 0) + '" data-dur="' + (o.dur || "") +
    '">' + (o.from || 0) + "</span>" + (o.unit ? '<span class="unit">' + esc(o.unit) + "</span>" : "") + "</div>";
  /* 스탯 — 카운트업 + 라벨(굵게) + 보조 줄 + 밑줄 띠를 한 덩어리로. 라벨은 값보다 --lead 늦게. */
  const stat = (rg, value, o = {}) =>
    '<div class="stat">' + count(rg, value, o) +
    (o.underline ? rv(rg, '<div class="ul"></div>', { fx: "grow", lead: (o.lead || 0) + 1 }) : "") +
    (o.label ? rv(rg, '<div class="hero-label">' + em(o.label) + "</div>", { fx: "mask", lead: (o.lead || 0) + 1 }) : "") +
    (o.sub ? rv(rg, '<div class="hero-sub">' + em(o.sub) + "</div>", { fx: "mask", lead: (o.lead || 0) + 2 }) : "") +
    "</div>";
  /* 밴드 — 띠가 와이프로 열리고 글자가 --lead 늦게 올라온다(한 이벤트). tone = accent|paper|panel. */
  const band = (rg, text, o = {}) =>
    rv(rg, '<div class="band ' + (o.tone || "accent") + (o.big ? " big" : "") + '"><span class="mk"><span>' + em(text) + "</span></span></div>",
       { fx: "plate", i: o.i || 0, lead: o.lead, dim: o.dim, cls: o.cls });
  /* 패널 — 증거·인용이 앉는 면. html 은 안쪽 마디들(h.rv 로 감싼 것도 된다). tone = panel|paper, edge:true 로 왼쪽 에지. */
  const plate = (rg, html, o = {}) =>
    rv(rg, '<div class="plate ' + (o.tone || "panel") + (o.edge ? " edge" : "") + '"><span class="mk"><span>' + html + "</span></span></div>",
       { fx: "plate", i: o.i || 0, lead: o.lead, dim: o.dim, cls: o.cls });
  /* 막대 — 바깥은 한 이벤트, 안에서는 라벨이 먼저 fade 하고 채움이 grow 한다
     (Heer staging). 채움은 같은 그룹의 중첩 rv 다. */
  /* 값의 숫자 부분을 고정폭 셀로 — "30개" → <i>3</i><i>0</i>개 */
  const digits = s => esc(s).replace(/[0-9,.]+/g, m => [...m].map(ch => /[0-9]/.test(ch) ? "<i>" + ch + "</i>" : '<i class="s">' + ch + "</i>").join(""));
  const bar = (rg, pct, label, value, o = {}) =>
    rv(rg, '<div class="bar' + (o.hot ? " hot" : "") + (o.dimmed ? " dimmed" : "") + '">' +
      '<span class="lbl rv fx-fade" data-rg="' + rg + '">' + em(label) + '</span>' +
      '<span class="val rv fx-fade" data-rg="' + rg + '">' + digits(value == null ? "" : String(value)) + "</span>" +
      '<div class="track"><div class="fill rv fx-grow' + (o.sv ? " sv" : "") + '" data-rg="' + rg + '" style="width:' + pct + '%"></div></div>' +
    "</div>", { fx: "none", primitive: "bar-grow", dim: o.dim, lead: o.lead, i: o.i });
  const callout = (rg, label, o = {}) =>
    rv(rg, '<div class="callout"><span class="dot"></span><span class="lead"></span><span>' + em(label) + "</span></div>", { fx: "in", i: o.i || 0, dim: o.dim, lead: o.lead });
  const step = (rg, t, d, o = {}) =>
    rv(rg, '<div class="step"><span>' + em(t) + "</span>" + (d ? '<span class="d">' + em(d) + "</span>" : "") + "</div>", { fx: "in", i: o.i || 0, dim: o.dim, lead: o.lead });
  const date = (rg, when, what, o = {}) =>
    rv(rg, '<div class="date"><span class="when">' + em(when) + '</span><span class="what">' + em(what || "") + "</span></div>",
      { fx: "mask", i: o.i || 0, dim: o.dim, lead: o.lead, primitive: "date-enter" });
  const range = (rg, o = {}) => rv(rg, '<div class="range"></div>', { fx: "grow", i: o.i || 0, sv: o.sv, lead: o.lead, primitive: "range-grow" });
  const link = (rg, o = {}) => rv(rg, '<div class="link"></div>', { fx: "draw", i: o.i || 0, sv: o.sv, lead: o.lead, primitive: "event-link" });
  const dots = (rg, count, o = {}) => rv(rg, '<div class="dots">' + Array.from({length:Math.max(1, Math.min(100, count))}, () => "<b></b>").join("") + "</div>",
    { fx: "in", i: o.i || 0, sv: o.sv, lead: o.lead, primitive: "dot-fill" });
  const axis = (rg, o = {}) => rv(rg, '<div class="axis"></div>', { fx: "draw", i: o.i || 0, sv: o.sv, lead: o.lead, primitive: "axis-draw" });
  const flow = (rg, from, to, o = {}) => rv(rg,
    '<div class="flow"><span class="node rv fx-in" data-rg="' + rg + '">' + em(from) + '</span><span class="flow-line rv fx-draw" data-rg="' + rg + '"></span><span class="node rv fx-in" data-rg="' + rg + '" style="--i:1">' + em(to) + "</span></div>",
    { fx: "none", i: o.i || 0, dim: o.dim, lead: o.lead, primitive: "flow-trace" });
  const node = (rg, label, o = {}) => rv(rg, '<div class="node">' + em(label) + "</div>",
    { fx: "in", i: o.i || 0, dim: o.dim, lead: o.lead, primitive: "node-enter" });
  const state = (rg, from, to, o = {}) => rv(rg,
    '<div class="state"><span>' + em(from) + '</span><span class="arrow">→</span><span>' + em(to) + "</span></div>",
    { fx: "in", i: o.i || 0, dim: o.dim, lead: o.lead, primitive: "state-transform" });
  const cap = t => t ? '<span class="shape-cap">' + em(t) + "</span>" : "";

  const disk = (rg, o = {}) => rv(rg,
    '<span class="shape-item"><i class="shape-disk" style="--d:' + (o.d || 120) + 'px"></i>' + cap(o.label) + "</span>",
    { fx: o.fx || "rise", i: o.i || 0, lead: o.lead, primitive: o.primitive || "shape-enter" });
  const ring = (rg, o = {}) => rv(rg,
    '<span class="shape-item"><i class="shape-ring" style="--d:' + (o.d || 180) + 'px"></i>' + cap(o.label) + "</span>",
    { fx: o.fx || "draw", i: o.i || 0, lead: o.lead, primitive: o.primitive || "shape-draw" });
  /* 프레스 — 베드와 캡션이 먼저 서고 원반만 --press 만큼 떨어져 베드에 닿는다(한 이벤트, --lead 시차). */
  const press = (rg, o = {}) =>
    '<div class="shape-press">' +
      rv(rg, '<i class="shape-disk" style="--d:' + (o.d || 88) + 'px"></i>', { fx: "press", i: o.i || 0, lead: (o.lead || 0) + 1, sv: o.sv, primitive: o.primitive || "shape-travel" }) +
      rv(rg, '<i class="shape-bed" style="--bed:' + (o.bed || 220) + 'px"></i>' + cap(o.label), { fx: "fade", i: o.i || 0, lead: o.lead }) +
    "</div>";
  const shift = (rg, html, o = {}) =>
    rv(rg, html, { fx: "travel", i: o.i || 0, dir: o.dir || "right", lead: o.lead, primitive: o.primitive || "shape-travel" });
  const arts = (S.visual && S.visual.slide && S.visual.slide.arts) || [];
  const artSrc = i => {
    const a = arts[i];
    if (!a || !a.file) return "";
    return String(a.file).replace(/^slides\//, "");
  };
  const art = (rg, i, o = {}) => {
    const a = arts[i];
    if (!a) return "";
    const fx = o.fx || a.move || "travel";
    return rv(rg, '<img class="art" src="' + esc(artSrc(i)) + '" alt="">', {
      fx: fx === "none" ? "none" : fx, i: o.i || 0,
      dir: o.dir || a.dir || "right", primitive: o.primitive || ""
    });
  };
  /* 원리 배우 — 일러스트가 앉고 라벨이 이름을 붙인다. slide.arts[i] 를 쓴다. */
  const fig = (rg, i, o = {}) => {
    const a = arts[i];
    if (!a) return "";
    const fx = o.fx || a.move || "rise";
    const lab = o.label != null ? o.label : "";
    return rv(rg, '<div class="fig"><img class="art" src="' + esc(artSrc(i)) + '" alt="">' +
      (lab ? '<span class="fig-lab">' + em(lab) + "</span>" : "") + "</div>", {
      fx: fx === "none" ? "none" : fx, i: o.i || 0, lead: o.lead,
      dir: o.dir || a.dir || "", primitive: o.primitive || "shape-enter"

  };
  const stem = (rg, o = {}) =>
    rv(rg, '<i class="stem"></i>', { fx: "draw", i: o.i || 0, dir: "down", sv: o.sv, lead: o.lead, primitive: o.primitive || "shape-draw" });
  const bus = (rg, o = {}) =>
    rv(rg, '<i class="bus"></i>', { fx: "draw", i: o.i || 0, cls: "span", sv: o.sv, lead: o.lead, primitive: o.primitive || "shape-draw" });
  const chamber = (rg, html, o = {}) =>
    rv(rg, '<div class="chamber"><i></i>' + html + "</div>",
      { fx: o.fx || "rise", i: o.i || 0, lead: o.lead, primitive: o.primitive || "shape-enter" });
  /* 출처 줄 — 바탕(그룹 0)에 둔다. 숫자가 뜨는 모든 클립에 출처가 같이 있어야 한다. */
  const vdiv = (rg, o = {}) => rv(rg, '<i class="vdiv"></i>', { fx: "draw", dir: "down", i: o.i || 0, lead: o.lead });
  const foot = (rg, text, o = {}) => rv(rg, '<div class="foot' + (o.corner ? " corner" : "") + '">' + em(text) + "</div>", { fx: "fade", i: o.i || 0, lead: o.lead });
  /* 사진 컷 — 풀블리드 사진과 스크림. 둘 다 바탕(그룹 0)에 두고, 대상의 변화는 그룹별 요소가 맡는다. */
  const photo = (rg, src, o = {}) => rv(rg, '<img class="photo" src="' + esc(String(src).replace(/^slides\//, "")) + '" alt="">', { fx: "none" });
  const scrim = (rg) => rv(rg, '<div class="scrim"></div>', { fx: "none" });
  /* ── 실사 컷(treatment:"footage") — slide-design.md §6.2. 클립 하나 = 그룹 하나(문장 하나 = 클립
     하나·둘, 둘이면 A|B 서브리빌). 표식은 클립을 본 뒤 좌표를 잡는다(footage-frames.sh 의 중간
     프레임). 좌표는 1080×1920(롱폼 1920×1080) 캔버스 픽셀이다. */
  const CW = parseInt(getComputedStyle(root).getPropertyValue("--w"), 10);
  const CH = parseInt(getComputedStyle(root).getPropertyValue("--h"), 10);
  const FZ = rg => -300 + rg * 3;
  /* 클립 길이 기본값 — 세그먼트 글자 수 / 4.5 초(스키마 속도). 렌더러가 --segs 로 덮는다. */
  const segMs = rg => {
    const n = (S.narration || [])[rg - 1];
    const c = String((n && (n.tts || n.sub)) || "").trim().length;
    return Math.max(1500, Math.round(c / 4.5 * 1000));
  };
  const vsrc = f => esc(String(f).replace(/^slides\//, ""));
  /* 스튜디오 판에서는 표식이 무대(-5)·스테이지(1) 위에 서야 한다 — 실사 컷의 음수 층에 400 을 더한다 */
  /* studio 판정은 호출 시점의 root 클래스다 — h.stage("flat") 은 renderSlide 맨 앞에서 부른다(표식 뒤에
     부르면 그 표식만 +400 층에 올라간다). */
  const fz = (rg, z, inner) => '<div class="rv fz" data-rg="' + rg + '" style="z-index:' + (root.classList.contains("studio") ? z + 400 : z) + '">' + inner + "</div>";
  /* 바탕 클립. from·dur 은 ms. 여러 그룹이 각자 부르면 뒤 그룹이 위에 쌓여 그 그룹의 첫 프레임 뒤에 컷이 난다. */
  const footage = (rg, clip, o = {}) => {
    root.classList.add("footage");
    const vid = (g, dur) => '<video class="footage" data-rg="' + g + '" data-vfrom="' + (o.from || 0) +
      '" data-vdur="' + dur + '" src="' + vsrc(clip) + '" muted playsinline preload="auto"></video>';
    /* 그룹 1 의 클립은 바탕(그룹 0)에도 첫 프레임으로 깔린다 — 그룹 요소는 t=0 에 opacity 0 이라 안 깔면
       카드 첫 프레임과 r0.png 가 잉크 단색이다(리뷰 M1 실측). vdur 0 이라 언제나 첫 프레임에 서 있다. */
    return (rg === 1 ? fz(0, FZ(0), vid(0, 0)) : "") + fz(rg, FZ(rg), vid(rg, o.dur || segMs(rg)));
  };
  /* 매트 — 인물만 남긴 VP9 알파 webm(make-matte.py). 표식 위에 얹혀 선이 인물 뒤로 간다. 같은 그룹의 클립과 같은 from·dur. */
  const matte = (rg, webm, o = {}) =>
    fz(rg, FZ(rg) + 2, '<video class="matte" data-rg="' + rg + '" data-vfrom="' + (o.from || 0) +
      '" data-vdur="' + (o.dur || segMs(rg)) + '" src="' + vsrc(webm) + '" muted playsinline preload="auto"></video>');
  const P = n => Math.round(n * 10) / 10;
  const pt = p => P(p[0]) + " " + P(p[1]);
  const polyPath = pts => "M" + pts.map(pt).join(" L");
  /* Catmull-Rom → 3차 베지어. 손으로 그은 경로처럼 점 사이가 둥글게 이어진다. */
  const smoothPath = pts => {
    if (pts.length < 3) return polyPath(pts);
    let d = "M" + pt(pts[0]);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += " C" + pt(c1) + " " + pt(c2) + " " + pt(p2);
    }
    return d;
  };
  const strokeEl = (d, o = {}) => {
    /* delay 는 CSS 시간 식(펜 화살촉의 "선이 끝날 때") — lead 와 함께 --lead-in 으로 합친다 */
    const leadIn = [o.lead ? o.lead + " * var(--lead)" : "", o.delay || ""].filter(Boolean).join(" + ");
    return '<path class="draw' + (o.cls ? " " + o.cls : "") + '" d="' + d + '" pathLength="1" style="--k:' +
      (o.k || 0) + (o.w ? ";stroke-width:" + o.w + "px" : "") + (leadIn ? ";--lead-in:calc(" + leadIn + ")" : "") + '"/>';
  };
  /* 화살촉 — 마지막 두 점의 방향으로 V 자. 선 다음 획(k+1)으로 그려진다. */
  const headPath = (a, b, len) => {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), s = 0.5;
    const l = [b[0] - len * Math.cos(ang - s), b[1] - len * Math.sin(ang - s)];
    const r = [b[0] - len * Math.cos(ang + s), b[1] - len * Math.sin(ang + s)];
    return "M" + pt(l) + " L" + pt(b) + " L" + pt(r);
  };
  const svgWrap = (rg, inner, o = {}) =>
    fz(rg, FZ(rg) + 1, '<svg class="marks' + (o.cls ? " " + o.cls : "") + '" viewBox="0 0 ' + CW + " " + CH +
      '" xmlns="http://www.w3.org/2000/svg">' + inner + "</svg>");
  let maskSeq = 0;
  const markHead = () => parseFloat(getComputedStyle(root).getPropertyValue("--mark-head")) || 52;
  const markW = () => parseFloat(getComputedStyle(root).getPropertyValue("--mark-w")) || 14;

     마커 자국으로 읽히고, 양끝 8.5% 에서만 여위는 획은 펜촉으로 읽힌다. 경로를 훑으며 법선으로 벌려
     다각형을 만들고, dashoffset 으로는 못 벗기므로 같은 경로의 굵은 마스크 획(.draw)이 벗긴다. 마스크는
     자식에, 그림자 필터(.mk)는 부모 g 에 — 순서가 뒤집히면 그어지는 앞끝이 뭉툭하게 잘린다. 경로 길이는
     문서에 잠깐 붙인 프로브 path 로 잰다(헬퍼가 문자열을 돌려주는 동안에도 DOM 은 있다). */
  const NS = "http://www.w3.org/2000/svg";

    if (!probeSvg) {
      probeSvg = document.createElementNS(NS, "svg");
      probeSvg.setAttribute("style", "position:absolute;width:0;height:0;overflow:hidden");
      document.body.appendChild(probeSvg);
    }
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); probeSvg.appendChild(p); return p;
  };
  const sm = u => { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); };
  const PROF = { ink: t => .58 + .42 * sm(Math.min(t, 1 - t) / .085),
                 ramp: t => .38 + .62 * sm(t / .55),
                 barb: t => .34 + .66 * sm((1 - Math.abs(2 * t - 1)) / .42) };
  const taper = (d, wMax, prof) => {
    const probe = probePath(d), L = probe.getTotalLength();
    const N = Math.max(28, Math.min(420, Math.round(L / 4))), A = [], B = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, at = u * L, q = probe.getPointAtLength(at);
      const a = probe.getPointAtLength(Math.max(0, at - .7)), b = probe.getPointAtLength(Math.min(L, at + .7));
      let dx = b.x - a.x, dy = b.y - a.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      const w = prof(u) * wMax * .5;
      A.push([q.x - dy * w, q.y + dx * w]); B.push([q.x + dy * w, q.y - dx * w]);
    }
    probe.remove();
    return "M" + A.map(pt).join("L") + "L" + B.reverse().map(pt).join("L") + "Z";
  };
  const penStroke = (rg, d, o = {}) => {
    const w = o.w || markW(), id = "pen" + rg + "-" + (++maskSeq);
    /* 마스크 획은 채움보다 7px 넓다 — 다각형의 벌어진 가장자리가 마스크 안에 다 든다 */
    return '<g class="mk"><mask id="' + id + '" maskUnits="userSpaceOnUse" x="0" y="0" width="' + CW + '" height="' + CH + '">' +
      strokeEl(d, { k: o.k || 0, w: w + 7, lead: o.lead, delay: o.delay }) + "</mask>" +
      '<path class="fl" d="' + taper(d, w, PROF[o.prof || "ink"]) + '" mask="url(#' + id + ')"/></g>';
  };
  /* 화살촉 — 채워진 삼각형이 아니라 갈래 둘짜리 열린 꺾쇠. 꼭짓점이 가장 굵고 선이 끝날 때 그어진다. */
  const penHead = (rg, d, o = {}) => {
    const probe = probePath(d), L = probe.getTotalLength();
    const tip = probe.getPointAtLength(L), prev = probe.getPointAtLength(Math.max(0, L - 8)); probe.remove();
    let dx = tip.x - prev.x, dy = tip.y - prev.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const A = o.head || markHead(), TH = ((o.deg || 24) * Math.PI) / 180;
    const rot = (vx, vy, a) => [vx * Math.cos(a) - vy * Math.sin(a), vx * Math.sin(a) + vy * Math.cos(a)];
    const b1 = rot(-dx, -dy, TH), b2 = rot(-dx, -dy, -TH);

      { k: o.k || 0, w: (o.w || markW()) + .4, prof: "barb", lead: o.lead, delay: "var(--mark-draw) - 40ms" });
  };
  const mark = {
    /* 경로 — 이동·행군·항로. pts=[[x,y],…]. arrow(기본 true)·dash(점선)·curve(기본 true)·w·k·lead */
    route(rg, pts, o = {}) {
      const d = o.curve === false ? polyPath(pts) : smoothPath(pts);
      if (o.pen) return mark.pen(rg, d, Object.assign({ arrow: o.arrow !== false, prof: o.arrow !== false ? "ramp" : "ink" }, o));
      let inner;
      if (o.dash) {
        const id = "mk" + rg + "-" + (++maskSeq);
        inner = '<mask id="' + id + '" maskUnits="userSpaceOnUse" x="0" y="0" width="' + CW + '" height="' + CH + '">' +
          strokeEl(d, { k: o.k || 0, lead: o.lead }) + "</mask>" +
          '<path class="dash" d="' + d + '" mask="url(#' + id + ')"' + (o.w ? ' style="stroke-width:' + o.w + 'px"' : "") + "/>";
      } else inner = strokeEl(d, { k: o.k || 0, w: o.w, lead: o.lead });
      if (o.arrow !== false && pts.length >= 2)
        inner += strokeEl(headPath(pts[pts.length - 2], pts[pts.length - 1], o.head || markHead()), { k: (o.k || 0) + 1, w: o.w, lead: o.lead });
      return svgWrap(rg, inner, o);
    },
    /* X — 패배·정지·차단. 두 획이 --mark-lead 시차로 그어진다. */
    x(rg, cx, cy, o = {}) {
      const s = o.size || 70, k = o.k || 0;

        strokeEl("M" + pt([cx - s, cy - s]) + " L" + pt([cx + s, cy + s]), { k, w: o.w, lead: o.lead }) +
        strokeEl("M" + pt([cx + s, cy - s]) + " L" + pt([cx - s, cy + s]), { k: k + 1, w: o.w, lead: o.lead }), o);
    },
    /* 원 — 표적·주목. 위에서 시작해 한 바퀴. */
    ring(rg, cx, cy, r, o = {}) {
      const d = "M" + pt([cx, cy - r]) + " A" + P(r) + " " + P(r) + " 0 1 1 " + pt([cx, cy + r]) +
        " A" + P(r) + " " + P(r) + " 0 1 1 " + pt([cx, cy - r]);
      return svgWrap(rg, strokeEl(d, { k: o.k || 0, w: o.w, lead: o.lead }), o);
    },
    /* 해칭 — 병력이 펼쳐진 땅·범위·영역. poly 안을 평행선으로 채우고 한 줄씩 그어진다.
       gap(줄 간격, 기본 34) · angle(도, 기본 0) · wave(줄을 살짝 굽힘). */
    hatch(rg, poly, o = {}) {
      const gap = o.gap || 34, ang = ((o.angle || 0) * Math.PI) / 180, id = "hc" + rg + "-" + (++maskSeq);
      const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const R = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 + gap;
      const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
      let lines = "", k = 0;
      for (let off = -R; off <= R; off += gap, k++) {
        const pts = [];
        for (let t = -R; t <= R; t += R / 6) {
          const w = o.wave ? Math.sin(t / R * Math.PI * 2 + k) * gap * 0.35 : 0;
          pts.push([cx + nx * off + ux * t + nx * w, cy + ny * off + uy * t + ny * w]);
        }
        lines += strokeEl(o.wave ? smoothPath(pts) : polyPath([pts[0], pts[pts.length - 1]]), { k, w: o.w, lead: o.lead });
      }
      return svgWrap(rg, '<clipPath id="' + id + '"><polygon points="' + poly.map(p => P(p[0]) + "," + P(p[1])).join(" ") +
        '"/></clipPath><g clip-path="url(#' + id + ')">' + lines + "</g>", Object.assign({}, o, { cls: "hatch" + (o.cls ? " " + o.cls : "") }));
    },
    /* 괄호 — 자리·건물·물건을 네 모서리로 감싼다. */
    box(rg, x, y, w, h, o = {}) {
      const c = o.corner || 48, k = o.k || 0;

        "M" + pt([x, y + c]) + " L" + pt([x, y]) + " L" + pt([x + c, y]),
        "M" + pt([x + w - c, y]) + " L" + pt([x + w, y]) + " L" + pt([x + w, y + c]),
        "M" + pt([x + w, y + h - c]) + " L" + pt([x + w, y + h]) + " L" + pt([x + w - c, y + h]),
        "M" + pt([x + c, y + h]) + " L" + pt([x, y + h]) + " L" + pt([x, y + h - c]),
      ];
      return svgWrap(rg, corners.map(d => strokeEl(d, { k, w: o.w, lead: o.lead })).join(""), o);

    /* 점 — 위치 하나. 팝으로 앉는다. */
    dot(rg, cx, cy, o = {}) {
      return svgWrap(rg, '<circle class="pop" cx="' + P(cx) + '" cy="' + P(cy) + '" r="' + (o.r || 14) +
        '" style="--k:' + (o.k || 0) + (o.lead ? ";--lead-in:calc(" + o.lead + " * var(--lead))" : "") + '"/>', o);
    },
    /* 임의 도형 — SVG path d 를 그대로 write-on 으로. 방패·깃발 같은 아이콘은 여기로. */
    path(rg, d, o = {}) { return svgWrap(rg, strokeEl(d, { k: o.k || 0, w: o.w, lead: o.lead }), o); },
    /* 펜 획 — 굵기가 변하는 채움 획. arrow:true 면 열린 꺾쇠 화살촉이 선 끝에서 이어 그어진다.
       prof = ink(양끝 여윔) · ramp(가늘게 시작해 굵어짐 — 화살표) · barb(꼭짓점이 굵음). w 는 --mark-w. */

    label(rg, x, y, text, o = {}) {

      const style = "position:absolute;left:" + P(x) + "px;top:" + P(y) + "px" +
        (o.i ? ";--i:" + o.i : "") + (o.lead ? ";--lead-in:calc(" + o.lead + " * var(--lead))" : "");
      return fz(rg, FZ(rg) + 1, '<div class="rv fx-mask" data-rg="' + rg + '" style="' + style + '"><div class="mk"><div class="mark-label">' +
        em(text) + "</div></div></div>");
    },
  };
  /* ── 구운 물체(rendered-object.md) — bake-object.py 가 슬라이드 옆에 쓴 사이드카(assets/s<n>-obj.js,
     window.SLIDE_OBJECTS[id])의 시트 기하를 읽어 [data-sheet] 요소를 앉힌다. 프레임 번호는 SEEK-RUNTIME
     이 (그룹, 시각)으로 세운다(결정성 계약 ⑤). 그룹 rg 에 들어오고(objin) out 그룹에 물러난다(선택).
     slot:true 면 흐름 안에 셀 높이(slot:px 면 그 높이)의 자리를 잡고 x·y 는 그 안의 오프셋, 아니면
     x·y 는 존 왼쪽 위 기준 픽셀이다. html 은 자리 왼쪽 위에 얹는 곁 판(.aside — 값 카드)이고 aside 는
     그 판의 인라인 스타일("top:200px;width:224px")이다. */
  const objects = window.SLIDE_OBJECTS || {};
  const object = (rg, id, o = {}) => {
    const ob = objects[id];
    if (!ob) return "";
    const cw = ob.cell[0], ch = ob.cell[1], rows = Math.ceil(ob.n / ob.cols);
    const file = esc(String(ob.file).replace(/^slides\//, ""));
    const ranges = Object.keys(ob.ranges || {}).map(g => g + ":" + ob.ranges[g][0] + "-" + ob.ranges[g][1]).join(" ");
    const sheet = '<div class="obj" data-sheet="' + file + '" data-sheet-cell="' + cw + " " + ch + '" data-sheet-cols="' + ob.cols +
      '" data-sheet-ranges="' + ranges + '" style="background-image:url(' + file + ");background-size:" + (ob.cols * cw) + "px " + (rows * ch) + 'px"></div>';
    /* 들어오는 그룹과 물러나는 그룹이 object-move 프리미티브다 — motionBeats 가 그 그룹에 그렇게 적는다 */
    const inner = rv(rg, o.out ? rv(o.out, sheet, { fx: "objout", primitive: "object-move" }) : sheet, { fx: "objin", lead: o.lead, primitive: "object-move" });
    const wrap = '<div class="objwrap" style="left:' + (o.x || 0) + "px;top:" + (o.y || 0) + "px;width:" + cw + "px;height:" + ch + 'px">' + inner + "</div>";
    if (!o.slot) return wrap;
    return '<div class="objslot" style="height:' + (o.slot === true ? ch : o.slot) + 'px">' + wrap +
      (o.html ? '<div class="aside"' + (o.aside ? ' style="' + o.aside + '"' : "") + ">" + o.html + "</div>" : "") + "</div>";
  };
  const h = { esc, em, rv, stage: stageCls, tag, title, words, count, stat, band, plate, bar, callout, step, date, range, link, dots, axis, flow, node, state,
    disk, ring, press, shift, art, fig, stem, bus, chamber, vdiv, foot, photo, scrim, footage, matte, mark, object, arts, labels, L: i => esc(labels[i] || "") };

  /* ✎ 이 함수만 씬의 도해로 다시 쓴다 ──────────────────────────────
     기본형(저작 전 셀프테스트용): 바탕(그룹 0) = 출처. 여는 사슬(그룹 1) = 키커 → 제목 →
     첫 불릿의 막대. 그룹 k = k번째 불릿이 막대로 자란다. 원리 컷은 배우가 앉는다.
     글자 소스는 S(title·bullets)와 h.labels 만 쓴다. */
  function renderSlide(S, h) {
    let out = (h.labels.length ? h.tag(1, h.L(0)) : "") + h.title(1, S.title || "", { lead: 1 });
    if (S.shot && S.shot.infoType === "principle") {
      const n = h.arts.length;
      const cols = Math.max(1, Math.min(n || (S.bullets || []).length || 1, 3));
      out += '<div class="cast" style="--cols:' + cols + '">';
      if (n) out += h.arts.map((_, i) => h.fig(i + 1, i, { label: h.L(i + 1), lead: i === 0 ? 2 : 0 })).join("");
      else out += (S.bullets || []).map((b, i) => h.disk(i + 1, { label: b.t || "" })).join("");
      out += "</div>";
    } else {
      const items = S.bullets || [];
      out += '<div class="bars">' + items.map((b, i) =>
        h.bar(i + 1, Math.round(100 - i * 100 / Math.max(items.length, 2)), b.t || "", b.d || "", { hot: i === 0, lead: i === 0 ? 2 : 0 })
      ).join("") + "</div>";
    }
    if (h.labels.length > 1) out += h.foot(0, h.L(h.labels.length - 1));
    return out;
  }

  /* 바탕 기본값 — editorial 도해(treatment 없음 포함)는 스튜디오 판이다(2026-09-04). 사진 컷과 실사 컷은
     제 바탕을 깐다. renderSlide 안의 h.stage("flat") 이 옛 플레이트로 되돌린다. */
  const slideSpec = (S.visual && S.visual.slide) || {};
  if (!slideSpec.treatment || slideSpec.treatment === "editorial") root.classList.add("studio");
  stage.innerHTML = renderSlide(S, h);
  /* 스튜디오 무대 — 그룹 수만큼 겹친 래퍼가 무대만 1% 아래로 민다(시차). 판·글자는 존에 고정 —
     존 폭 728px 을 꽉 쓰는 화면에서 3.3% 만 밀어도 왼쪽 끝이 x176 → x159 로 나간다(실측). */
  if (root.classList.contains("studio")) {
    const CAM = [[1.009, -3, -2], [1.008, 3, 1], [1.007, -2, 2], [1.006, 1, -1]];
    const n = Math.max(1, (S.narration || []).length);
    let html = '<div class="studio-plate"></div>';
    for (let g = n; g >= 1; g--) {
      const [k, dx, dy] = CAM[(g - 1) % CAM.length];
      html = '<div class="studio-cam" data-rg="' + g + '" data-ground style="--k:' + k + ";--dx:" + dx + "px;--dy:" + dy + 'px">' + html + "</div>";
    }
    const el = document.createElement("div"); el.className = "studio"; el.innerHTML = html;
    document.body.insertBefore(el, stage);
  }

  /* SEEK-RUNTIME-BEGIN — 아래는 건드리지 않는다. 저작 화면 템플릿 세 벌(모션 슬라이드·
     키네틱 타이포·캐릭터 연기)이 같은 블록을 갖고, format-lint.js 가 세 벌을 대조한다.
     한 벌만 고치면 린트가 잡는다 — 고칠 일이 있으면 세 벌을 같이 고친다. */
  /* 이징 — CSS 의 --ease(cubic-bezier(.05,.7,.1,1), Material emphasized-decelerate)와 같은 곡선.
     out 은 Newton–Raphson 으로 그 베지어를 샘플한다. 카운트업과 페인터가 CSS 와 같은 성질로 앉는다. */
  const bezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sampleX = t => ((ax * t + bx) * t + cx) * t;
    const sampleY = t => ((ay * t + by) * t + cy) * t;
    const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      let t = x;
      for (let i = 0; i < 8; i++) {
        const d = sampleX(t) - x;
        const dx = sampleDX(t);
        if (Math.abs(d) < 1e-6 || Math.abs(dx) < 1e-6) break;
        t = Math.min(1, Math.max(0, t - d / dx));
      }
      return sampleY(t);
    };
  };

    linear: x => x,
    out: bezier(0.05, 0.7, 0.1, 1),
    in: x => x * x * x,
    inOut: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  };
  const clamp01 = x => Math.min(Math.max(x, 0), 1);
  const easeOut = EASES.out;
  /* 카운터 전용 곡선 — 등장 곡선(0.05,0.7,0.1,1)은 앞이 너무 가팔라 마지막 정수 단이 시간의
     43% 에서 앉는다(45 는 3.1초 문장의 1.33초에 멈춰 나머지가 정지 화면이었다 — 실측).
     2차 감속은 45 를 89%, 241 을 95% 에 앉혀 문장이 끝날 때까지 숫자가 돈다. */
  const easeCount = x => 1 - (1 - x) * (1 - x);
  window.__ease = (name, x) => (EASES[name] || EASES.out)(clamp01(x));
  /* __interp(x, [in0,in1], [out0,out1], ease) — 구간을 구간으로 옮긴다. 범위 밖은 끝값으로 잘린다. */
  window.__interp = function (x, inR, outR, ease) {
    const p = inR[1] === inR[0] ? 0 : (x - inR[0]) / (inR[1] - inR[0]);
    return outR[0] + (outR[1] - outR[0]) * window.__ease(ease || "out", p);
  };
  const cssMs = name => parseFloat(getComputedStyle(root).getPropertyValue(name)) || 0;
  const HOLD = cssMs("--hold"), COUNT = cssMs("--count");
  const fmt = (v, dec) => (dec > 0 ? v.toFixed(dec) : Math.round(v).toString()).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const owner = a => a.effect && a.effect.target && a.effect.target.closest("[data-rg]");
  /* 애니메이션의 끝 시각 — iteration-count·delay 를 다 넣은 계산값 (무한이면 Infinity) */
  const endOf = a => a.effect.getComputedTiming().endTime;
  /* 카운터의 시작 시차 — 여는 사슬이면 그룹 요소의 data-lead(--lead 의 배수)만큼 뒤에 세기 시작한다.
     CSS 애니메이션의 --lead-in 과 같은 값이라 사슬의 다른 요소와 어긋나지 않는다. computed style 로
     읽지 않는 이유: var() 가 치환된 뒤라 배수를 되짚을 수 없다. */
  const LEAD = cssMs("--lead");
  const counters = [...document.querySelectorAll("[data-count]")].map(el => {
    const g = el.closest("[data-rg]");
    const c = { el, rg: +g.dataset.rg, to: +el.dataset.count, from: +el.dataset.from || 0,
      dec: +el.dataset.dec || 0, dur: +el.dataset.dur || COUNT, lead: (+g.dataset.lead || 0) * LEAD };
    /* 상자의 본은 더 긴 쪽의 최종 문자열이다 — 쉼표 자리까지 그대로 본떠야 999 → 1,000 을 넘는
       순간에도 상자 폭이 안 변한다(정폭 셀 .6em 과 쉼표 셀 .28em 이 다르기 때문) */
    const a = fmt(c.to, c.dec), b = fmt(c.from, c.dec);
    c.tpl = a.length >= b.length ? a : b;
    return c;
  });
  /* ── 시트 물체 — [data-sheet] 요소(h.object · rendered-object.md)의 프레임 번호를 (g, t) 로 세운다.
     data-sheet-ranges="1:0-11 2:11-38" 는 그룹마다 도는 프레임 구간이고 경계 프레임을 이웃과 나눠
     갖는다. 구간이 없는 그룹에서는 직전 구간의 끝 프레임에 선다. 길이는 카운터처럼 --count 가
     기본이고 __setSegs 가 세그먼트 길이로 늘린다 — 물체의 변화는 정의상 문장이 말하는 값이라
     지속 층이다. 페인터가 아니라 런타임이 모는 이유: 한 배경을 그룹 넷이 쓰므로 그룹별 페인터는
     마지막에 도는 것이 앞 그룹의 번호를 덮어쓴다 — (g, t) 를 함께 받아야 한다. */
  const sprites = [...document.querySelectorAll("[data-sheet]")].map(el => {
    const cell = (el.dataset.sheetCell || "0 0").split(/\s+/).map(Number);
    const ranges = {};
    for (const m of (el.dataset.sheetRanges || "").matchAll(/(\d+):(\d+)-(\d+)/g)) ranges[+m[1]] = [+m[2], +m[3]];
    const dur = {}; for (const k in ranges) dur[k] = COUNT;
    return { el, cw: cell[0], ch: cell[1], cols: +el.dataset.sheetCols || 1, ranges, dur };
  });
  const spriteFrame = (s, g, tMs) => {
    const keys = Object.keys(s.ranges).map(Number).sort((a, b) => a - b);
    if (!keys.length) return 0;
    let frame = s.ranges[keys[0]][0];
    for (const k of keys) {
      const [a, b] = s.ranges[k];
      if (k < g) frame = b;
      else if (k === g) frame = a + Math.round((b - a) * clamp01(tMs / s.dur[k]));
      else break;
    }
    return frame;
  };
  /* 숫자 → 고정폭 셀. 본(tpl)의 앞자리를 빈 셀로 따라 그려 상자가 첫 프레임부터 같은 크기다 */
  const cellOf = ch => /[0-9]/.test(ch) ? "<i>" + ch + "</i>" : '<i class="s">' + ch + "</i>";
  const cells = (s, tpl) => {
    const pad = Math.max(0, tpl.length - s.length);
    let out = "";
    for (let i = 0; i < pad; i++) out += /[0-9]/.test(tpl[i]) ? "<i></i>" : '<i class="s"></i>';
    for (const ch of s) out += cellOf(ch);
    return out;
  };

  /* ── 지속 층 — 렌더러가 __setSegs 로 나레이션 세그먼트 길이(ms)를 넘긴다. 그룹 요소의
     --seg-d 에 들어가 CSS 의 animation-duration:var(--seg-d,…) 가 읽고, .sv 안의 카운트업은
     dur 자체가 늘어난다(시차만큼 뺀다). 값이 (g, t) 밖에서 오지만 렌더 시작 때 한 번 정해지는
     상수라 같은 (g, t) 는 여전히 같은 그림이다. */
  window.__setSegs = function (map) {
    for (const el of document.querySelectorAll("[data-rg]")) {
      const ms = map[+el.dataset.rg];
      if (ms > 0) el.style.setProperty("--seg-d", Math.round(ms) + "ms");
    }
    for (const c of counters) {
      const ms = map[c.rg];
      if (ms > 0 && c.el.closest(".sv")) c.dur = Math.max(400, Math.round(ms) - c.lead);
    }
    for (const s of sprites) for (const k in s.dur) if (map[k] > 0) s.dur[k] = Math.round(map[k]);
    syncGround();
  };

  /* ── 포커스 시프트 — .dim 그룹은 다음 그룹이 들어오는 동안 muted 급으로 내려앉는다.
     애니메이션이 아니라 __seek 이 (g, t) 만으로 계산해 인라인 opacity 로 적는다 — 대상이
     .dw 래퍼(rv 헬퍼가 만든다)라 rv 자신의 fade 애니메이션과 부딪히지 않는다. 파라미터
     없이 연 미리보기(전체 쉬는 상태)는 마지막 그룹까지 내려앉아 보이는데, 실제 영상의
     끝 프레임(클립 N)에는 없는 상태다 — 버그가 아니다. */
  const DIM_TO = 0.55, DIM_MS = 480;
  const dimTargets = [...document.querySelectorAll(".rv.dim")].map(el => ({
    el: el.querySelector(":scope > .dw") || el, rg: +el.dataset.rg }));

  /* ── 페인터 — 캔버스·SVG 처럼 CSS 키프레임으로 그릴 수 없는 그림을 시각 t 의 함수로 그린다.
     카운트업이 이미 이 모양이고(counters 는 t 를 받아 숫자를 다시 쓴다) 페인터는 그 일반형이다.
     등록  __paint(rg, durMs, fn) — fn(tMs) 는 그룹 rg 의 로컬 시각을 받아 그 시각의 그림을 그린다.
     계약  fn 은 t 말고 아무것도 읽지 않는다. 시계·난수·이전 호출의 상태를 읽으면 같은 (g, t) 가
           다른 픽셀을 내고 결정성이 깨진다. 렌더러는 프레임을 순서대로 찍지 않는다(--sheet 는
           중간과 끝만 찍는다) — fn(500) 이 fn(0) 뒤에 온다고 가정하면 안 된다.
     쓰는 자리  회전·궤적·입자처럼 키프레임으로 못 세우는 도해. 글자·막대·카운트업은 CSS 로 둔다. */
  const painters = [];
  /* __seek 이 캡처 중에 만난 '그룹 밖 애니메이션'의 누적 수. 페인터가 [data-rg] 바깥에 노드를
     붙이거나 중간 t 에만 존재하는 노드를 만들면 __meta() 의 한 번짜리 표본에는 안 잡힌다 —
     렌더러가 캡처를 마친 뒤 __meta().stray 를 다시 읽어 이 값으로 exit 1 한다. */
  let strayHits = 0;
  window.__paint = function (rg, durMs, fn) {

  };

  /* ── 비디오 — 그룹의 로컬 시각으로 currentTime 을 세우고 seeked 를 기다린다. data-rg 는 요소가
     직접 들고(조상 상속이 아니다), data-vfrom(ms, 기본 0)이 클립 안 시작점, data-vdur(ms)이 그룹
     안에서 재생할 길이다. 둘 다 밀리초다. autoplay·loop·재생 중인 영상은 벽시계로 도는 길이라
     __meta 가 stray 로 잡는다. */
  const videos = () => [...document.querySelectorAll("video")];
  const seekVideo = (v, tMs) => new Promise(res => {

       clips under 30fps capture: 4 of every 30 frames wrong, a 3-hold and a skip). 20ms is inside
       one frame at 24·25·30fps, so every capture samples mid-frame. */
    const want = ((+v.dataset.vfrom || 0) + tMs + 20) / 1000;
    if (v.readyState >= 2 && Math.abs(v.currentTime - want) < 1e-4) return res(true);
    const done = () => { v.removeEventListener("seeked", done); res(true); };
    v.addEventListener("seeked", done);
    v.currentTime = want;
  });

  /* CSS 배경 이미지 — document.images 에 안 잡히므로 따로 훑는다. 경로가 틀리면 그 자리만 빈 채로
     렌더가 끝까지 돌던 구멍이다(리뷰 medium 8). data: URL 은 파일이 아니라 건너뛴다. */
  const bgBroken = [];
  const bgUrls = () => {
    const out = new Set();
    for (const el of document.querySelectorAll("*"))
      for (const pseudo of [null, "::before", "::after"]) {
        const bg = getComputedStyle(el, pseudo).backgroundImage;
        if (!bg || bg === "none") continue;
        /* data: URL 은 파일이 아니라 통째로 걷어낸다 — 그레인 타일 SVG 안의 url(%23g) 는 문서 안 참조다 */
        const files = bg.replace(/url\(\s*(["'])data:(?:\\.|(?!\1)[^\\])*\1\s*\)/gi, "");
        for (const m of files.matchAll(/url\(\s*["']?([^"')]+)/g)) out.add(m[1]);
      }
    return [...out];
  };

  /* 첫 프레임을 찍기 전에 렌더러가 한 번 부른다 — 폰트·이미지 디코드·비디오 첫 프레임이 다 서야
     같은 (g, t) 가 같은 픽셀이다. 이미지는 로드만으로는 부족하고 decode() 까지 끝나야 한다.
     못 읽는 소재는 여기서 기다리지 않고 통과시킨다 — 오타 난 src 하나가 렌더러를 30초 매달아
     놓는 대신, __meta().broken 이 그 파일을 이름과 함께 렌더러에 넘겨 exit 1 로 세운다. */
  window.__ready = function () {
    const imgs = [...document.images].map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()));
    const vids = videos().map(v => {
      if (v.readyState >= 2 || v.error) return Promise.resolve();
      if (!v.getAttribute("src") && !v.currentSrc) return Promise.resolve();
      return new Promise(res => {
        v.addEventListener("loadeddata", res, { once: true });
        v.addEventListener("error", res, { once: true });
      });
    });
    /* decode() 까지 기다린다 — 큰 시트(6840×4800)는 로드 뒤 디코드가 늦어 폰트만 기다리면 첫
       캡처가 물체 없는 무대를 찍었다(2026-09-04 실측). decode 의 거절이 곧 못 읽은 파일이다. */
    const bgs = bgUrls().map(u => new Promise(res => {
      const im = new Image();
      im.src = u;
      (im.decode ? im.decode() : Promise.resolve()).then(() => res(), () => { bgBroken.push(u); res(); });
    }));
    return Promise.all([document.fonts.ready, ...imgs, ...vids, ...bgs]).then(() => true);
  };

  window.__seek = function (tMs, g) {
    /* 카운터와 페인터가 먼저다 — 둘 다 innerHTML 로 DOM 을 다시 만들고, 새로 붙은 노드에 CSS
       애니메이션이 걸려 있으면 그 순간 벽시계로 돌기 시작한다. 애니메이션 스냅샷을 이 뒤로
       미뤄야 그것까지 pause 된다. 순서를 되돌리면 짧은 애니메이션에서 재렌더가 갈라진다
       (실측: 90ms 슬라이드인에서 81프레임 중 13프레임이 두 렌더 사이에 달랐다). */
    if (!groundSynced) syncGround();
    for (const c of counters) {
      const p = c.rg < g ? 1 : c.rg === g ? easeCount(clamp01((tMs - c.lead) / c.dur)) : 0;
      c.el.innerHTML = cells(fmt(c.from + (c.to - c.from) * p, c.dec), c.tpl);
    }
    for (const s of sprites) {
      const i = spriteFrame(s, g, tMs);
      s.el.style.backgroundPosition = (-(i % s.cols) * s.cw) + "px " + (-Math.floor(i / s.cols) * s.ch) + "px";
    }
    for (const p of painters) p.fn(p.rg < g ? p.dur : p.rg === g ? Math.min(Math.max(tMs, 0), p.dur) : 0);
    for (const d of dimTargets) {
      const v = d.rg >= g ? 1 : d.rg === g - 1 ? 1 - (1 - DIM_TO) * easeOut(clamp01(tMs / DIM_MS)) : DIM_TO;
      d.el.style.opacity = v >= 1 ? "" : v.toFixed(4);
    }
    const anims = document.getAnimations();
    for (const a of anims) {
      const o = owner(a);
      /* 그룹 밖 애니메이션도 일단 세운다 — 벽시계로 두면 캡처 지연이 그대로 프레임에 새어
         같은 (g, t) 가 다른 픽셀을 낸다(실측 PSNR 22.3dB). 세워 둔 뒤 세어서 렌더러가 알린다. */
      if (!o) { strayHits++; a.pause(); a.currentTime = 0; continue; }
      const r = +o.dataset.rg, end = endOf(a);
      a.pause();
      a.currentTime = r < g ? end : r === g ? Math.min(Math.max(tMs, 0), end) : 0;
    }
    const media = videos().filter(v => v.dataset.rg !== undefined).map(v => {
      const r = +v.dataset.rg, d = +v.dataset.vdur || 0;
      return seekVideo(v, r < g ? d : r === g ? Math.min(Math.max(tMs, 0), d) : 0);
    });
    /* transform·opacity 애니메이션은 컴포지터 스레드에서 돌아 pause()·currentTime 이 비동기로
       반영된다 — ready 를 기다리지 않고 찍으면 같은 (g, t) 가 서브픽셀만큼 다른 프레임을 낸다
       (실측 PSNR 79dB 차이). 렌더러는 이 프라미스를 기다린 뒤 캡처한다. */
    return Promise.all([...anims.map(a => a.ready), ...media]).then(() => true);
  };
  /* 그룹마다 콘텐츠가 움직이는 길이. data-ground(스튜디오 무대의 드리프트)는 세지 않는다 — 바탕만
     밀리는 그룹은 "아무것도 안 움직이는 그룹" 이라 렌더러가 잡아야 한다. __seek 은 그래도 세운다(owner 가 있다). */
  const groupDurs = function () {
    const dur = {};
    for (const a of document.getAnimations()) { const o = owner(a); if (!o || o.dataset.ground !== undefined) continue;
      const r = +o.dataset.rg; dur[r] = Math.max(dur[r] || 0, endOf(a)); }
    for (const c of counters) dur[c.rg] = Math.max(dur[c.rg] || 0, c.dur + c.lead);
    for (const p of painters) dur[p.rg] = Math.max(dur[p.rg] || 0, p.dur);
    for (const s of sprites) for (const k in s.dur) dur[k] = Math.max(dur[k] || 0, s.dur[k]);
    for (const v of videos()) { if (v.dataset.rg === undefined) continue;
      const r = +v.dataset.rg; dur[r] = Math.max(dur[r] || 0, +v.dataset.vdur || 0); }
    return dur;
  };
  /* 무대 드리프트의 길이는 그 그룹의 클립 길이다(--ground-d). 세그먼트 길이로 두면 콘텐츠가 짧은
     그룹에서 클립이 드리프트 중간에 끝나고 다음 컷 첫 프레임이 끝 자세라 무대가 튄다(리뷰 실측) —
     클립을 넘어가는 운동은 없다. __setSegs 뒤와 첫 __seek·__groups 에서 맞춘다. */
  let groundSynced = false;
  const syncGround = function () {
    const dur = groupDurs();
    for (const el of document.querySelectorAll("[data-ground][data-rg]")) {
      const ms = dur[+el.dataset.rg];
      if (ms > 0) el.style.setProperty("--ground-d", Math.round(ms) + "ms");
    }
    groundSynced = true;
  };
  window.__groups = function () {
    if (!groundSynced) syncGround();
    const dur = groupDurs();
    const n = Math.max(0, ...Object.keys(dur).map(Number));
    const out = [];
    for (let r = 0; r <= n; r++) out.push({ rg: r, dur: r === 0 ? 0 : Math.round((dur[r] || 0) + HOLD) });
    return out;
  };
  /* 렌더러가 계약을 검사하는 데 쓴다 — 그룹 밖에서 도는 것(stray)은 벽시계를 타고 결정성을 깨고
     무한 반복(infinite)은 클립이 끝나지 않는다. 둘 다 렌더러가 exit 1 로 막는다. 비디오는 data-rg
     가 없거나 autoplay·loop 가 붙어 있으면 stray 다 — seek 가 아니라 재생으로 움직인다는 뜻이다. */
  window.__meta = function () {
    const all = document.getAnimations();
    const strayVideo = videos().filter(v => v.dataset.rg === undefined || v.autoplay || v.loop || !v.paused).length;
    /* 못 읽은 소재 — 오타 난 경로, 디코더가 없는 코덱(HEVC), 빈 파일. __ready() 뒤에 읽어야
       뜻이 있다. 이름을 그대로 넘겨 렌더러가 어느 파일인지 말할 수 있게 한다. */
    const broken = videos().filter(v => v.error || (v.dataset.rg !== undefined && !v.getAttribute("src") && !v.currentSrc))
      .map(v => v.getAttribute("src") || "(video[data-rg] with no src)")
      .concat([...document.images].filter(i => !i.naturalWidth).map(i => i.getAttribute("src") || "(no src)"))
      .concat(bgBroken);
    return { hold: HOLD, broken: broken,
             stray: all.filter(a => !owner(a)).length + strayVideo + strayHits,
             infinite: all.filter(a => owner(a) && !isFinite(endOf(a))).length
                     + painters.filter(p => !isFinite(p.dur)).length };
  };
  window.__size = () => ({ w: parseInt(getComputedStyle(root).getPropertyValue("--w"), 10),
                           h: parseInt(getComputedStyle(root).getPropertyValue("--h"), 10) });

  /* URL 이 가리키는 상태로 세운다. 렌더러는 이걸 거치지 않고 __seek 을 직접 부르지만, 사람이
     브라우저로 슬라이드를 열어 볼 때는 이 한 줄이 첫 화면을 정한다. 페인터를 뒤에서 등록한
     저작 코드는 등록을 마치고 __boot() 을 한 번 더 불러 첫 화면을 다시 세운다. */
  window.__boot = function () {
    const qs = new URLSearchParams(location.search);
    const N = window.__groups().length - 1;
    if (qs.has("g"))           return window.__seek(parseFloat(qs.get("t") || "0"), parseInt(qs.get("g"), 10));
    if (qs.has("reveal"))      return window.__seek(0, parseInt(qs.get("reveal"), 10) + 1);
    return window.__seek(1e9, N + 1);
  };
  window.__boot();
  /* SEEK-RUNTIME-END */
})();
</script>
</body>
</html>
